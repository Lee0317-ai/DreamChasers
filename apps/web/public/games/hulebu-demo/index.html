<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>胡了卜玩家试玩</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f1e5;
        --ink: #221912;
        --muted: #755f4d;
        --panel: #fffaf0;
        --line: #d8b98b;
        --jade: #1f8a70;
        --jade-dark: #12624f;
        --vermilion: #c83d2f;
        --gold: #d59a2f;
        --tile: #fff8e7;
        --tile-edge: #b88245;
        --slot: #4a2d1f;
        --shadow: 0 18px 42px rgba(87, 55, 29, 0.18);
        --tile-w: 12.5806451613%;
        --overlay-z: 1000000;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background:
          radial-gradient(circle at 20% 0%, rgba(31, 138, 112, 0.16), transparent 28rem),
          linear-gradient(135deg, #f7f1e5 0%, #f0ddbf 54%, #ebc887 100%);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      select,
      input {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 500px) 320px;
        justify-content: center;
        gap: 18px;
        padding: 18px;
      }

      body.play-view .app {
        grid-template-columns: minmax(0, 480px) 72px;
        align-items: start;
        gap: 8px;
        padding: 3px;
      }

      .play {
        display: grid;
        grid-template-rows: auto minmax(260px, 1fr) auto;
        gap: 14px;
        min-width: 0;
      }

      body.play-view .play {
        grid-template-rows: auto auto auto auto auto;
        grid-auto-rows: auto;
        align-content: start;
        gap: 3px;
      }

      .topbar,
      .play-hud,
      .side,
      .board-wrap,
      .counter-section,
      .meld-river-panel,
      .slot-area {
        border: 1px solid rgba(90, 54, 22, 0.2);
        background: rgba(255, 250, 240, 0.9);
        box-shadow: var(--shadow);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 16px;
      }

      body.play-view .topbar {
        display: none;
      }

      .brand {
        display: grid;
        gap: 2px;
      }

      .brand strong {
        font-size: clamp(22px, 3vw, 34px);
        line-height: 1;
        letter-spacing: 0;
      }

      body.play-view .brand strong {
        font-size: clamp(16px, 1.9vw, 20px);
      }

      body.play-view .brand span {
        display: none;
      }

      body.play-view .brand span {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .brand span {
        color: var(--muted);
        font-size: 13px;
      }

      body.play-view .brand span {
        font-size: 10px;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .top-controls {
        min-width: 0;
        width: min(680px, 62vw);
        display: grid;
        gap: 8px;
      }

      body.play-view .top-controls,
      body.play-view .tuning-panel,
      body.tuner-view .topbar-actions {
        display: none !important;
      }

      [hidden] {
        display: none !important;
      }

      .mode-switch {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
        padding: 4px;
        border: 1px solid rgba(90, 54, 22, 0.2);
        background: #f7e2b8;
      }

      .mode-button {
        min-height: 34px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
      }

      .mode-button.active {
        background: var(--jade-dark);
        color: white;
      }

      .level-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 0;
        scrollbar-width: thin;
      }

      .level-tab {
        width: 46px;
        height: 38px;
        flex: 0 0 auto;
        border: 1px solid rgba(90, 54, 22, 0.2);
        background: #f7e2b8;
        color: var(--ink);
        font-weight: 800;
      }

      .level-tab.active {
        background: var(--jade);
        color: white;
      }

      .board-wrap {
        min-height: 0;
        padding: 14px;
      }

      body.play-view .board-wrap {
        padding: 4px;
      }

      .board {
        position: relative;
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        aspect-ratio: 620 / 360;
        overflow: hidden;
        border: 1px solid rgba(67, 42, 23, 0.25);
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px),
          linear-gradient(0deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px),
          linear-gradient(145deg, #2f6f5c, #163d35 62%, #402818);
        background-size: 31px 31px, 31px 31px, auto;
      }

      .board::before {
        content: "";
        position: absolute;
        inset: 7% 9% 12%;
        border: 2px solid rgba(255, 255, 255, 0.15);
        background: rgba(0, 0, 0, 0.08);
        transform: skewX(-8deg);
        pointer-events: none;
      }

      .board[data-mode="mountain"] {
        width: min(100%, 560px, 68vh);
        max-width: 560px;
        aspect-ratio: 560 / 640;
        background-size: 18px 18px, 18px 18px, auto;
      }

      body.play-view .board[data-mode="mountain"] {
        width: min(100%, 330px);
        max-width: 330px;
      }

      .play-hud {
        display: none;
      }

      body.play-view .play-hud {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 2px;
        padding: 2px;
      }

      body.play-view .hud-chip {
        min-height: 24px;
        padding: 2px 3px;
      }

      body.play-view .hud-chip span {
        font-size: 8px;
      }

      body.play-view .hud-chip strong {
        font-size: 11px;
      }

      .hud-chip {
        min-width: 0;
        min-height: 42px;
        display: grid;
        align-content: center;
        gap: 2px;
        border: 1px solid rgba(90, 54, 22, 0.18);
        background: rgba(255, 245, 223, 0.86);
        padding: 5px 7px;
      }

      .hud-chip span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        line-height: 1;
      }

      .hud-chip strong {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 15px;
        line-height: 1.2;
      }

      .board.boss {
        border-color: rgba(200, 61, 47, 0.72);
        box-shadow:
          inset 0 0 0 3px rgba(200, 61, 47, 0.28),
          0 0 28px rgba(200, 61, 47, 0.28);
      }

      .board[data-mode="mountain"] .tile {
        width: 11.4285714286%;
        aspect-ratio: 52 / 70;
        border-width: 1px;
        border-bottom-width: 3px;
        font-size: clamp(11px, 1.65vw, 18px);
        box-shadow:
          0 5px 0 rgba(107, 72, 38, 0.34),
          0 9px 12px rgba(23, 15, 9, 0.22);
      }

      .tile {
        position: absolute;
        width: var(--tile-w);
        aspect-ratio: 64 / 86;
        display: grid;
        place-items: center;
        border: 2px solid var(--tile-edge);
        border-bottom-width: 6px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(255, 248, 231, 0.88)),
          var(--tile);
        color: var(--ink);
        font-weight: 900;
        font-size: clamp(14px, 2.7vw, 28px);
        line-height: 1;
        text-shadow: 0 1px 0 white;
        box-shadow:
          0 12px 0 rgba(107, 72, 38, 0.38),
          0 18px 20px rgba(23, 15, 9, 0.3);
        transition: transform 150ms ease, opacity 150ms ease, filter 150ms ease;
      }

      .tile::before {
        content: "";
        position: absolute;
        inset: 7px;
        border: 1px solid rgba(184, 130, 69, 0.45);
        pointer-events: none;
      }

      .board[data-mode="mountain"] .tile::before {
        inset: 4px;
      }

      .tile.stack-top::after {
        content: "";
        position: absolute;
        top: -8px;
        left: 10%;
        right: 10%;
        height: 5px;
        border: 1px solid rgba(67, 42, 23, 0.42);
        border-bottom: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(64, 42, 24, 0.34) 0 1px,
          rgba(255, 248, 231, 0.96) 1px 2px
        );
        box-shadow: 0 2px 0 rgba(107, 72, 38, 0.2);
        pointer-events: none;
      }

      .board[data-mode="mountain"] .tile.stack-top::after {
        content: "";
        top: -4px;
        left: auto;
        right: -3px;
        width: 9px;
        height: 9px;
        border: 1px solid rgba(67, 42, 23, 0.42);
        border-radius: 999px;
        background: rgba(255, 212, 108, 0.84);
        color: #3b210f;
        display: grid;
        place-items: center;
        font-size: 0;
        line-height: 1;
        text-shadow: none;
        box-shadow: 0 1px 3px rgba(23, 15, 9, 0.2);
      }

      body.tuner-view .board[data-mode="mountain"] .tile.stack-top::after {
        content: attr(data-stack-depth);
        top: -6px;
        right: -5px;
        width: 16px;
        height: 16px;
        border-radius: 5px;
        font-size: 9px;
        background: #ffd46c;
      }

      .tile.available:hover {
        transform: translate(var(--lift-x), calc(var(--lift-y) - 5px));
        filter: brightness(1.08);
      }

      .tile.blocked {
        opacity: 0.44;
        filter: grayscale(0.55);
      }

      .board[data-mode="mountain"] .tile.stack-preview.blocked {
        opacity: 0.64;
        filter: grayscale(0.36) saturate(0.74) brightness(0.86);
      }

      .board[data-mode="mountain"] .tile.stack-preview::after {
        content: "";
        position: absolute;
        inset: 5px 5px auto;
        height: 2px;
        background: rgba(67, 42, 23, 0.18);
        pointer-events: none;
      }

      .board[data-mode="mountain"] .tile.stack-bridge {
        border-color: #d59a2f;
        background:
          linear-gradient(180deg, rgba(255, 249, 220, 0.94), rgba(250, 221, 147, 0.9)),
          var(--tile);
        box-shadow:
          0 7px 0 rgba(120, 72, 29, 0.34),
          0 12px 18px rgba(23, 15, 9, 0.25);
      }

      .board[data-mode="mountain"] .tile.stack-bridge::after {
        content: attr(data-bridge-unlocks);
        position: absolute;
        top: -7px;
        right: -6px;
        width: 16px;
        height: 16px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(67, 42, 23, 0.42);
        border-radius: 999px;
        background: #ffd46c;
        color: #3b210f;
        font-size: 9px;
        line-height: 1;
        text-shadow: none;
        pointer-events: none;
      }

      .board[data-mode="mountain"] .tile.loose-mountain {
        border-color: rgba(213, 154, 47, 0.86);
        background:
          linear-gradient(180deg, rgba(255, 252, 230, 0.96), rgba(255, 235, 177, 0.94)),
          var(--tile);
        box-shadow:
          0 5px 0 rgba(120, 72, 29, 0.32),
          0 10px 20px rgba(213, 154, 47, 0.24);
      }

      .board.vision-on .tile.blocked {
        opacity: 0.72;
        filter: none;
        outline: 2px solid rgba(255, 212, 108, 0.8);
        outline-offset: 2px;
      }

      .board[data-mode="mountain"].vision-on .tile.stack-preview.blocked {
        opacity: 0.9;
      }

      .tile.removed {
        display: none;
      }

      .tile .suit {
        position: absolute;
        right: 8px;
        bottom: 7px;
        font-size: 0.56em;
        color: var(--vermilion);
      }

      .board[data-mode="mountain"] .tile .suit {
        right: 4px;
        bottom: 4px;
        font-size: 0.52em;
      }

      .slot-area {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      body.play-view .slot-area {
        gap: 3px;
        padding: 4px;
      }

      .slot-line {
        display: grid;
        min-width: 0;
      }

      .action-strip {
        min-width: 0;
        display: flex;
        justify-content: center;
      }

      .slot-grid {
        display: grid;
        grid-template-columns: repeat(var(--slot-count), minmax(34px, 1fr));
        gap: 6px;
        min-width: 0;
      }

      body.play-view .slot-grid {
        grid-template-columns: repeat(var(--slot-count), minmax(26px, 1fr));
        gap: 4px;
      }

      .slot-cell {
        min-height: 60px;
        display: grid;
        place-items: center;
        border: 1px dashed rgba(255, 250, 240, 0.5);
        background: linear-gradient(180deg, #68412c, var(--slot));
        color: #fff7e4;
      }

      body.play-view .slot-cell {
        min-height: 44px;
      }

      .slot-cell.filled {
        border-style: solid;
        background: #fff8e7;
        color: var(--ink);
        border-color: var(--tile-edge);
        font-weight: 900;
      }

      .slot-cell.selectable {
        border-color: var(--vermilion);
        background: #fff1df;
        color: #7c241b;
        box-shadow: inset 0 0 0 2px rgba(200, 61, 47, 0.2);
      }

      .combo-actions {
        width: min(100%, 360px);
        display: grid;
        grid-template-columns: repeat(5, minmax(48px, 64px));
        gap: 6px;
        justify-content: center;
      }

      .combo-button,
      .candidate,
      .primary-button,
      .ghost-button,
      .tool-button,
      .reward-button {
        min-height: 36px;
        border: 1px solid rgba(90, 54, 22, 0.24);
        padding: 0 12px;
        background: #efe0c5;
        color: var(--muted);
        font-weight: 800;
      }

      .combo-button.active {
        background: linear-gradient(180deg, #ffd46c, #d86e2f);
        color: #2a1409;
        box-shadow: 0 8px 18px rgba(200, 61, 47, 0.3);
      }

      .candidates {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .candidate {
        background: white;
        color: var(--ink);
      }

      .candidate[data-type="gang"] {
        border-color: var(--vermilion);
      }

      .candidate[data-type="peng"] {
        border-color: var(--gold);
      }

      .candidate[data-type="chi"] {
        border-color: var(--jade);
      }

      .candidate[data-type="hu"] {
        border-color: rgba(213, 154, 47, 0.78);
        background: #f7e2b8;
        color: var(--ink);
      }

      .candidate[data-type="bugang"] {
        border-color: rgba(200, 61, 47, 0.58);
        background: #fff1df;
        color: #7c241b;
      }

      .hu-hint {
        display: none;
        min-height: 28px;
        align-items: center;
        border: 1px solid rgba(213, 154, 47, 0.36);
        background: #fff5d8;
        color: #5a3616;
        padding: 4px 8px;
        font-size: 13px;
        font-weight: 900;
        line-height: 1.25;
      }

      .hu-hint.show {
        display: flex;
      }

      .rank-dot.hu-wait {
        border-color: rgba(213, 154, 47, 0.82);
        background: #ffd46c;
        color: #3b210f;
        box-shadow: 0 0 0 2px rgba(213, 154, 47, 0.16);
      }

      .side {
        min-width: 0;
        display: grid;
        align-content: start;
        gap: 14px;
        padding: 16px;
        overflow: auto;
      }

      body.play-view .side {
        align-self: start;
        position: sticky;
        top: 12px;
        gap: 8px;
        max-height: calc(100vh - 24px);
        padding: 0;
        overflow: visible;
        border: 0;
        background: transparent;
        box-shadow: none;
      }

      body.play-view .side > :not(.tools-section) {
        display: none;
      }

      .level-title {
        display: grid;
        gap: 4px;
      }

      .level-title h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.12;
        letter-spacing: 0;
      }

      .level-title span {
        color: var(--muted);
        font-size: 14px;
      }

      .boss-goal {
        display: none;
        border: 1px solid rgba(200, 61, 47, 0.35);
        background: #fff1df;
        color: #7c241b;
        padding: 10px;
        font-weight: 900;
      }

      .boss-goal.show {
        display: block;
      }

      .boss-goal-title {
        display: block;
        margin-bottom: 8px;
      }

      .boss-goal-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .boss-goal-chip {
        min-height: 30px;
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(124, 36, 27, 0.28);
        background: rgba(255, 250, 240, 0.78);
        padding: 4px 8px;
        color: #7c241b;
        font-size: 12px;
        line-height: 1.25;
      }

      .boss-goal-chip.done {
        border-color: rgba(31, 138, 112, 0.42);
        background: #e3f4de;
        color: #12624f;
      }

      .boss-goal-chip.pulse {
        border-color: rgba(213, 154, 47, 0.7);
        background: #ffe1a8;
        box-shadow: 0 0 0 3px rgba(213, 154, 47, 0.18);
      }

      .featured-combos {
        display: none;
        border: 1px solid rgba(31, 143, 118, 0.3);
        background: #edf9f2;
        color: #125f50;
        padding: 10px;
        font-weight: 900;
      }

      .featured-combos.show {
        display: block;
      }

      .tuning-panel {
        border: 1px solid rgba(31, 138, 112, 0.24);
        background: rgba(237, 249, 242, 0.72);
        padding: 10px;
      }

      .tuning-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .tuning-field {
        display: grid;
        gap: 4px;
      }

      .tuning-field span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .tuning-field input,
      .tuning-field select {
        min-width: 0;
        height: 36px;
        border: 1px solid rgba(90, 54, 22, 0.22);
        background: #fffaf0;
        color: var(--ink);
        padding: 0 8px;
        font-weight: 800;
      }

      .tuning-action {
        width: 100%;
        margin-top: 8px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .metric {
        border: 1px solid rgba(90, 54, 22, 0.18);
        background: #fff5df;
        padding: 10px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .metric strong {
        display: block;
        margin-top: 3px;
        font-size: 20px;
      }

      .section {
        display: grid;
        gap: 8px;
      }

      .meld-river-panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 6px;
        padding: 6px;
      }

      .meld-river-panel .section {
        min-width: 0;
        padding: 6px;
        border: 1px solid rgba(90, 54, 22, 0.16);
        background: rgba(255, 245, 223, 0.76);
      }

      .meld-list,
      .river-list {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
      }

      .meld-chip,
      .river-cell {
        min-height: 30px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(90, 54, 22, 0.2);
        background: #fff8e7;
        color: var(--ink);
        font-size: 12px;
        font-weight: 900;
        text-align: center;
      }

      .meld-chip.gang {
        border-color: rgba(200, 61, 47, 0.45);
        background: #fff1df;
        color: #7c241b;
      }

      .river-cell.empty {
        border-style: dashed;
        background: #f3ddaf;
        color: var(--muted);
      }

      .river-capacity {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }

      .counter-section {
        padding: 10px 12px;
      }

      body.play-view .meld-river-panel {
        gap: 2px;
        padding: 3px;
      }

      body.play-view .meld-river-panel .section {
        gap: 2px;
        padding: 2px;
      }

      body.play-view .counter-section {
        gap: 2px;
        padding: 4px 5px;
      }

      .section h2 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0;
      }

      body.play-view .counter-section h2,
      body.play-view .meld-river-panel h2 {
        font-size: 10px;
      }

      body.play-view .counter-section h2 {
        display: none;
      }

      body.play-view .meld-chip,
      body.play-view .river-cell {
        min-height: 18px;
        font-size: 9px;
      }

      .counts {
        display: grid;
        gap: 8px;
      }

      body.play-view .counts {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 3px;
      }

      .count-row {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
      }

      body.play-view .count-row {
        grid-template-columns: 22px minmax(0, 1fr);
        gap: 2px;
      }

      body.play-view .count-row strong {
        font-size: 10px;
      }

      .rank-dots {
        display: grid;

        levelSubtitle: document.querySelector("#levelSubtitle"),
        featuredCombos: document.querySelector("#featuredCombos"),
        bossGoal: document.querySelector("#bossGoal"),
        mountainTuningPanel: document.querySelector("#mountainTuningPanel"),
        mountainSeed: document.querySelector("#mountainSeed"),
        mountainTemplate: document.querySelector("#mountainTemplate"),
        mountainTileCount: document.querySelector("#mountainTileCount"),
        mountainStackDepth: document.querySelector("#mountainStackDepth"),
        mountainHuPacks: document.querySelector("#mountainHuPacks"),
        mountainHonorWeight: document.querySelector("#mountainHonorWeight"),
        mountainRegenerateButton: document.querySelector("#mountainRegenerateButton"),
        slotGrid: document.querySelector("#slotGrid"),
        comboActions: document.querySelector("#comboActions"),
        candidateList: document.querySelector("#candidateList"),
        huHint: document.querySelector("#huHint"),
        status: document.querySelector("#status"),
        score: document.querySelector("#score"),
        coins: document.querySelector("#coins"),
        shields: document.querySelector("#shields"),
        reserve: document.querySelector("#reserve"),
        counts: document.querySelector("#counts"),
        openMelds: document.querySelector("#openMelds"),
        river: document.querySelector("#river"),
        riverCapacity: document.querySelector("#riverCapacity"),
        pickedRewards: document.querySelector("#pickedRewards"),
        shuffleButton: document.querySelector("#shuffleButton"),
        undoButton: document.querySelector("#undoButton"),
        discardButton: document.querySelector("#discardButton"),
        shuffleCount: document.querySelector("#shuffleCount"),
        undoCount: document.querySelector("#undoCount"),
        discardCount: document.querySelector("#discardCount"),
        slotLimit: document.querySelector("#slotLimit"),
        restartButton: document.querySelector("#restartButton"),
        nextButton: document.querySelector("#nextButton"),
        rewardOverlay: document.querySelector("#rewardOverlay"),
        rewardTitle: document.querySelector("#rewardTitle"),
        rewardGrid: document.querySelector("#rewardGrid"),
        runComplete: document.querySelector("#runComplete"),
      };

      const model = {
        levelsConfig: null,
        rewardsConfig: null,
        levelIndex: 0,
        mode: "mountain",
        prototypeView: "play",
        mountainTuning: { ...DEFAULT_MOUNTAIN_TUNING },
        activeMountainTemplate: getMountainTemplateDefinition("center-tower"),
        autoMountainTemplateSeed: "",
        state: null,
        run: {
          slotDelta: 0,
          reserveDelta: 0,
          shieldsDelta: 0,
          coins: 0,
          tools: { shuffle: 0, undo: 0, discard: 0, vision: 0 },
          bonuses: { chi: 0, peng: 0, gang: 0, hu: 0 },
          pickedRewards: [],
        },
        visionTimer: null,
        bossProgressTimer: null,
      };

      init().catch((error) => {
        document.body.innerHTML = `<div class="error">配置加载失败：${escapeHtml(error.message)}</div>`;
      });

      async function init() {
        const [levelsConfig, rewardsConfig] = await Promise.all([
          fetch("/games/hulebu-demo/config/levels.json").then((response) => response.json()),
          fetch("/games/hulebu-demo/config/rewards.json").then((response) => response.json()),
        ]);

        model.levelsConfig = levelsConfig;
        model.rewardsConfig = rewardsConfig;
        applyInitialRouteState();
        syncPrototypeViewShell();
        for (const button of view.modeSwitch.querySelectorAll("[data-mode]")) {
          button.addEventListener("click", () => {
            model.mode = button.dataset.mode;
            loadLevel(model.levelIndex);
          });
        }
        view.restartButton.addEventListener("click", () => {
          view.rewardOverlay.classList.remove("show");
          loadLevel(model.levelIndex);
        });
        view.nextButton.addEventListener("click", () => {
          view.rewardOverlay.classList.remove("show");
          advanceAfterClear();
        });
        view.shuffleButton.addEventListener("click", useShuffleTool);
        view.undoButton.addEventListener("click", useUndoTool);
        view.discardButton.addEventListener("click", useDiscardTool);
        view.mountainRegenerateButton.addEventListener("click", () => {
          model.mountainTuning = readMountainTuningForm();
          loadLevel(model.levelIndex);
        });
        renderLevelTabs();
        loadLevel(model.levelIndex);
      }

      function applyInitialRouteState() {
        const params = new URLSearchParams(window.location.search);
        const requestedView = params.get("view");
        const requestedMode = params.get("mode");
        const requestedLevel = Number.parseInt(params.get("level") ?? "", 10);

        if (PROTOTYPE_VIEW_MODES.has(requestedView)) {
          model.prototypeView = requestedView;
        }

        if (requestedMode === "mountain" || requestedMode === "config") {
          model.mode = requestedMode;
        }

        model.mountainTuning = readMountainTuningFromParams(params, model.mountainTuning);

        if (!Number.isNaN(requestedLevel)) {
          const levelIndex = model.levelsConfig.levels.findIndex((level) => level.order === requestedLevel);
          if (levelIndex >= 0) model.levelIndex = levelIndex;
        }
      }

      function syncPrototypeViewShell() {
        const isTunerView = model.prototypeView === "tuner";
        document.body.dataset.prototypeView = model.prototypeView;
        document.body.classList.toggle("play-view", !isTunerView);
        document.body.classList.toggle("tuner-view", isTunerView);
        document.title = isTunerView ? "胡了卜调牌器" : "胡了卜玩家试玩";
        view.topControls.hidden = !isTunerView;
        view.tunerLink.hidden = isTunerView;

        if (!isTunerView) {
          const tunerParams = new URLSearchParams();
          tunerParams.set("level", String(currentLevel().order));
          tunerParams.set("mode", model.mode);
          tunerParams.set("template", model.mountainTuning.templateId);
          view.tunerLink.href = `./tuner.html?${tunerParams.toString()}`;
        }
      }

      function readMountainTuningFromParams(params, fallback) {
        return normalizeMountainTuning({
          seed: params.get("seed") ?? fallback.seed,
          templateId: params.has("template") ? params.get("template") : fallback.templateId,
          tileCount: params.has("tiles") ? params.get("tiles") : fallback.tileCount,
          stackDepth: params.has("stack") ? params.get("stack") : fallback.stackDepth,
          huPacks: params.has("hu") ? params.get("hu") : fallback.huPacks,
          honorWeight: params.has("honor") ? params.get("honor") : fallback.honorWeight,
        });
      }

      function readMountainTuningForm() {
        return normalizeMountainTuning({
          seed: view.mountainSeed.value,
          templateId: view.mountainTemplate.value,
          tileCount: view.mountainTileCount.value,
          stackDepth: view.mountainStackDepth.value,
          huPacks: view.mountainHuPacks.value,
          honorWeight: view.mountainHonorWeight.value,
        });
      }

      function normalizeMountainTuning(raw) {
        return {
          seed: String(raw.seed ?? "").trim(),
          templateId: normalizeMountainTemplateId(raw.templateId ?? DEFAULT_MOUNTAIN_TUNING.templateId),
          tileCount: normalizeOptionalInteger(raw.tileCount, MOUNTAIN_TILE_COUNT_RANGE.min, MOUNTAIN_TILE_COUNT_RANGE.max),
          stackDepth: normalizeInteger(raw.stackDepth, 2, 10, DEFAULT_MOUNTAIN_TUNING.stackDepth),
          huPacks: normalizeOptionalInteger(raw.huPacks, 0, 4),
          honorWeight: normalizeInteger(raw.honorWeight, 0, 100, DEFAULT_MOUNTAIN_TUNING.honorWeight),
        };
      }

      function normalizeMountainTemplateId(value) {
        const templateId = String(value ?? DEFAULT_MOUNTAIN_TUNING.templateId).trim();
        if (templateId === "auto" || MOUNTAIN_TEMPLATE_IDS.includes(templateId)) return templateId;
        return DEFAULT_MOUNTAIN_TUNING.templateId;
      }

      function normalizeOptionalInteger(value, min, max) {
        if (value === null || value === undefined || value === "") return null;
        const parsed = Number.parseInt(value, 10);
        if (Number.isNaN(parsed)) return null;
        return clampNumber(parsed, min, max);
      }

      function normalizeInteger(value, min, max, fallback) {
        const parsed = Number.parseInt(value, 10);
        if (Number.isNaN(parsed)) return fallback;
        return clampNumber(parsed, min, max);
      }

      function clampNumber(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function resetMountainTemplateForLevelTransition(index, options = {}) {
        const shouldReset = options.resetFixedMountainTemplate && (options.forceResetMountainTemplate || index !== model.levelIndex);
        if (!shouldReset || model.mode !== "mountain" || model.mountainTuning.templateId === DEFAULT_MOUNTAIN_TUNING.templateId) return;
        model.mountainTuning = {
          ...model.mountainTuning,
          templateId: DEFAULT_MOUNTAIN_TUNING.templateId,
        };
      }

      function refreshAutoMountainTemplateSeedForLoad(options = {}) {
        if (!shouldUseVolatileAutoMountainTemplateSeed()) return;
        refreshAutoMountainTemplateSeed(`${currentLevel().id}:${options.reason ?? "load"}`);
      }

      function shouldUseVolatileAutoMountainTemplateSeed() {
        return (
          model.mode === "mountain"
          && model.prototypeView === "play"
          && model.mountainTuning.templateId === "auto"
          && !model.mountainTuning.seed
        );
      }

      function refreshAutoMountainTemplateSeed(reason = "") {
        model.autoMountainTemplateSeed = `${reason}:${Date.now()}:${Math.random()}`;
      }

      function isFriendDemoMode() {
        return model.prototypeView === "play";
      }

      function getPlayableLevelCount() {
        return isFriendDemoMode()
          ? Math.min(FRIEND_DEMO_LEVEL_COUNT, model.levelsConfig.levels.length)
          : model.levelsConfig.levels.length;
      }

      function getPlayableLevels() {
        return model.levelsConfig.levels.slice(0, getPlayableLevelCount());
      }

      function getFriendDemoSlotLimit(levelIndex) {
        return levelIndex < 3 ? FRIEND_DEMO_TUTORIAL_SLOT_LIMIT : FRIEND_DEMO_FULL_SLOT_LIMIT;
      }

      function getFriendDemoLevelMode(levelIndex) {
        return levelIndex < FRIEND_DEMO_TUTORIAL_COMBOS.length ? "tutorial" : "mountain";
      }

      function getFriendDemoDifficultyProfile(levelIndex = model.levelIndex) {
        if (!isFriendDemoMode()) return null;
        if (getFriendDemoLevelMode(levelIndex) !== "mountain") return null;
        return FRIEND_DEMO_DIFFICULTY_PROFILES.find((profile) => profile.levelIndex === levelIndex) ?? null;
      }

      function getEffectiveMountainTuningForLevel(level, levelIndex = model.levelIndex) {
        const profile = getFriendDemoDifficultyProfile(levelIndex);
        if (!profile) return model.mountainTuning;
        return {
          ...model.mountainTuning,
          tileCount: profile.tileCount,
          stackDepth: profile.stackDepth,
          huPacks: profile.huPacks,
          gangPacks: profile.gangPacks,
          numberSuits: profile.numberSuits,
          honorRanks: profile.honorRanks,
          honorWeight: profile.honorWeight,
        };
      }

      function getFriendDemoTutorialRequiredCombo(levelIndex = model.levelIndex) {
        return isFriendDemoTutorialLevel(levelIndex)
          ? FRIEND_DEMO_TUTORIAL_COMBOS[levelIndex] ?? null
          : null;
      }

      function hasCompletedFriendDemoTutorialCombo(levelIndex = model.levelIndex) {
        const requiredCombo = getFriendDemoTutorialRequiredCombo(levelIndex);
        if (!requiredCombo) return true;
        return (model.state?.comboCounts?.[requiredCombo] ?? 0) > 0;
      }

      function getFriendDemoFeaturedCombos(levelIndex) {
        const tutorialCombo = FRIEND_DEMO_TUTORIAL_COMBOS[levelIndex];
        if (tutorialCombo) return [tutorialCombo];
        return model.levelsConfig.levels[levelIndex]?.featuredCombos ?? [];
      }

      function getFriendDemoRewardPool(levelIndex) {
        if (levelIndex === 2) return [FRIEND_DEMO_FIRST_REWARD_ID];
        const rewardPool = model.levelsConfig.levels[levelIndex]?.rewardPool ?? [];
        return rewardPool.map((rewardId) => rewardId === "vision_plus_1" ? FRIEND_DEMO_DISCARD_REWARD_ID : rewardId);
      }

      function createFriendDemoFixedReward() {
        return {
          id: FRIEND_DEMO_FIRST_REWARD_ID,
          name: "卡槽 +2",
          description: "主卡槽从 6 格扩到 8 格，后续关卡进入完整容量。",
          effects: [{ type: "slot_limit_delta", value: 2 }],
        };
      }

      function createFriendDemoDiscardReward() {
        return {
          id: FRIEND_DEMO_DISCARD_REWARD_ID,
          name: "丢弃 +1",
          description: "获得 1 次丢弃卡槽末尾牌的机会。",
          effects: [{ type: "tool_delta", tool: "discard", value: 1 }],
        };
      }

      function createFriendDemoTutorialTiles(level) {
        const layouts = {
          peng: [
            { suit: "tong", rank: 6, x: 176, y: 130 },
            { suit: "tong", rank: 6, x: 232, y: 130 },
            { suit: "tong", rank: 6, x: 288, y: 130 },
          ],
          chi: [
            { suit: "tiao", rank: 2, x: 176, y: 130 },
            { suit: "tiao", rank: 3, x: 232, y: 130 },
            { suit: "tiao", rank: 4, x: 288, y: 130 },
          ],
          gang: [
            { suit: "tong", rank: 9, x: 150, y: 124 },
            { suit: "tong", rank: 9, x: 206, y: 124 },
            { suit: "tong", rank: 9, x: 262, y: 124 },
            { suit: "tong", rank: 9, x: 318, y: 124 },
          ],
          hu: [
            { suit: "wan", rank: 1, x: 132, y: 130 },
            { suit: "wan", rank: 2, x: 188, y: 130 },
            { suit: "wan", rank: 3, x: 244, y: 130 },
            { suit: "tong", rank: 5, x: 300, y: 130 },
            { suit: "tong", rank: 5, x: 356, y: 130 },
            { suit: "tong", rank: 5, x: 412, y: 130 },
            { suit: "honor", rank: 6, x: 216, y: 270 },
            { suit: "honor", rank: 6, x: 272, y: 270 },
          ],
        };
        const combo = FRIEND_DEMO_TUTORIAL_COMBOS[(level?.order ?? 1) - 1] ?? "peng";
        return layouts[combo].map((tile, index) => ({
          id: `friend-demo-${combo}-${index + 1}`,
          suit: tile.suit,
          rank: tile.rank,
          x: tile.x,
          y: tile.y,
          layer: 0,
          stackOrder: index,
          blockedBy: [],
          location: "board",
          sourcePackage: `friend-demo-${combo}`,
          solutionGroup: `friend-demo-${combo}`,
          solutionStep: Math.floor(index / 3) + 1,
        }));
      }

      function getPlayableTilesForLevel(level, index) {
        if (isFriendDemoMode() && getFriendDemoLevelMode(index) === "tutorial") {
          return createFriendDemoTutorialTiles(level);
        }

        return model.mode === "mountain" ? generateMountainTiles(level) : level.tiles;
      }

      function getInitialSlotOrderForLevel(level, index) {
        if (isFriendDemoMode() && getFriendDemoLevelMode(index) === "tutorial") return [];
        return model.mode === "mountain" ? [] : level.initialSlotOrder;
      }

      function getInitialReserveOrderForLevel(level, index) {
        if (isFriendDemoMode() && getFriendDemoLevelMode(index) === "tutorial") return [];
        return model.mode === "mountain" ? [] : level.initialReserveOrder;
      }

      function getToolsForLevel(defaults) {
        const baseTools = isFriendDemoMode() ? FRIEND_DEMO_DEFAULT_TOOLS : defaults.tools;
        return {
          shuffle: (baseTools.shuffle ?? 0) + (model.run.tools.shuffle ?? 0),
          undo: (baseTools.undo ?? 0) + (model.run.tools.undo ?? 0),
          discard: (baseTools.discard ?? 0) + (model.run.tools.discard ?? 0),
          vision: (baseTools.vision ?? 0) + (model.run.tools.vision ?? 0),
        };
      }

      function loadLevel(index, options = {}) {
        resetMountainTemplateForLevelTransition(index, options);
        model.levelIndex = Math.min(index, getPlayableLevelCount() - 1);
        refreshAutoMountainTemplateSeedForLoad(options);
        const level = currentLevel();
        const defaults = model.levelsConfig.defaults;
        const playableTiles = getPlayableTilesForLevel(level, model.levelIndex);
        const initialSlotOrder = getInitialSlotOrderForLevel(level, model.levelIndex);
        const initialReserveOrder = getInitialReserveOrderForLevel(level, model.levelIndex);
        model.state = {
          tiles: playableTiles.map((tile) => ({ ...tile, blockedBy: [...tile.blockedBy] })),
          slot: [...initialSlotOrder],
          reserve: [...initialReserveOrder],
          river: [],
          riverLimit: DEFAULT_RIVER_LIMIT,
          discardSelecting: false,
          openMelds: [],
          slotLimit: isFriendDemoMode() ? getFriendDemoSlotLimit(model.levelIndex) : clampSlotLimit(defaults.slotLimit + model.run.slotDelta),
          reserveLimit: isFriendDemoMode() ? 0 : defaults.reserveLimit + model.run.reserveDelta,
          shields: defaults.shields + model.run.shieldsDelta,
          firstProtect: defaults.firstProtect,
          score: 0,
          coins: model.run.coins,
          comboCounts: { chi: 0, peng: 0, gang: 0, hu: 0, bugang: 0 },
          suitComboCounts: createEmptySuitTotals(),
          bossGoals: getActiveBossGoals(model.levelIndex),
          tools: getToolsForLevel(defaults),
          bonuses: { ...model.run.bonuses },
          history: [],
          looseMountainDropIndex: 0,
          visionActive: false,
          recentBossProgress: [],
          phase: "playing",
        };
        syncTileLocations();
        renderAll(`第 ${level.order} 关`);
      }

      function renderAll(message) {
        syncPrototypeViewShell();
        renderModeSwitch();
        renderLevelTabs();
        renderHeader();
        renderPlayHud();
        renderMountainTuning();
        renderBoard();
        renderSlot();
        renderCombos();
        renderHuHint();
        renderCounts();
        renderOpenMelds();
        renderRiver();
        renderStats();
        renderPickedRewards();
        view.status.textContent = message ?? "";
      }

      function renderModeSwitch() {
        for (const button of view.modeSwitch.querySelectorAll("[data-mode]")) {
          const active = button.dataset.mode === model.mode;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", active ? "true" : "false");
        }
      }

      function renderLevelTabs() {
        view.levelTabs.innerHTML = "";
        getPlayableLevels().forEach((level, index) => {
          const button = document.createElement("button");
          button.className = `level-tab${index === model.levelIndex ? " active" : ""}`;
          button.type = "button";
          button.textContent = String(level.order).padStart(2, "0");
          button.setAttribute("aria-label", `第 ${level.order} 关 ${level.name}`);
          button.addEventListener("click", () => loadLevel(index, { resetFixedMountainTemplate: true }));
          view.levelTabs.append(button);
        });
      }

      function renderHeader() {
        const level = currentLevel();
        const modeLabel = model.mode === "mountain" ? "密集牌山" : "配置关卡";
        const viewLabel = model.prototypeView === "tuner" ? "调牌器" : "玩家试玩";
        const bossGoals = getActiveBossGoals(model.levelIndex);
        const bossLabel = bossGoals.length > 0 ? " / Boss" : "";
        const templateLabel = model.mode === "mountain" ? ` · ${model.activeMountainTemplate.label}` : "";
        const difficultyLabel = getFriendDemoDifficultyProfile(model.levelIndex)?.label;
        const difficultyText = difficultyLabel ? `${difficultyLabel} · ` : "";
        view.levelMeta.textContent = `${model.levelsConfig.displayName} / ${viewLabel} / ${modeLabel}${bossLabel} / ${getPlayableLevelCount()} 关`;
        view.levelName.textContent = difficultyLabel ?? (bossGoals.length > 0 ? `${level.name} · Boss` : level.name);
        view.levelSubtitle.textContent = model.mode === "mountain" ? `${difficultyText}${level.subtitle}${templateLabel} · 生成 ${model.state.tiles.length} 张牌` : level.subtitle;
        renderFeaturedCombos();
        renderBossGoal();
      }

      function renderPlayHud() {
        const level = currentLevel();
        view.hudLevel.textContent = `第 ${level.order} 关`;
        view.hudGoal.textContent = getHudGoalText();
        view.hudRemaining.textContent = String(getBoardTiles().length);
        view.hudScore.textContent = model.state.score;
        view.hudCoins.textContent = model.state.coins;
      }

      function getHudGoalText() {
        const bossGoals = model.state.bossGoals ?? [];
        if (bossGoals.length > 0) {
          const completed = bossGoals.filter(isBossGoalItemComplete).length;
          return `Boss ${completed}/${bossGoals.length}`;
        }

        const featuredCombos = isFriendDemoMode()
          ? getFriendDemoFeaturedCombos(model.levelIndex)
          : currentLevel().featuredCombos ?? [];
        if (featuredCombos.length > 0) {
          return `重点 ${featuredCombos.map((combo) => TYPE_LABELS[combo]).join("/")}`;
        }

        return model.mode === "mountain" ? "清空密集牌山" : "清空配置关卡";
      }

      function renderMountainTuning() {
        const shouldShowTuning = model.prototypeView === "tuner" && model.mode === "mountain";
        view.mountainTuningPanel.hidden = !shouldShowTuning;
        view.mountainTuningPanel.style.display = shouldShowTuning ? "grid" : "none";
        renderMountainTemplateOptions();
        view.mountainSeed.value = model.mountainTuning.seed;
        view.mountainTemplate.value = model.mountainTuning.templateId;
        view.mountainTileCount.value = model.mountainTuning.tileCount ?? "";
        view.mountainStackDepth.value = model.mountainTuning.stackDepth;
        view.mountainHuPacks.value = model.mountainTuning.huPacks ?? "";
        view.mountainHonorWeight.value = model.mountainTuning.honorWeight;
      }

      function renderMountainTemplateOptions() {
        if (view.mountainTemplate.dataset.ready === "true") return;

        const options = [
          { id: "auto", label: "自动模板" },
          ...MOUNTAIN_TEMPLATE_IDS.map(getMountainTemplateDefinition),
        ];
        view.mountainTemplate.innerHTML = "";

        for (const optionConfig of options) {
          const option = document.createElement("option");
          option.value = optionConfig.id;
          option.textContent = optionConfig.label;
          view.mountainTemplate.append(option);
        }

        view.mountainTemplate.dataset.ready = "true";
      }

      function renderFeaturedCombos() {
        const combos = isFriendDemoMode()
          ? getFriendDemoFeaturedCombos(model.levelIndex)
          : currentLevel().featuredCombos ?? [];
        if (combos.length === 0) {
          view.featuredCombos.classList.remove("show");
          view.featuredCombos.innerHTML = "";
          return;
        }

        view.featuredCombos.classList.add("show");
        view.featuredCombos.innerHTML = "";

        const title = document.createElement("strong");
        title.className = "boss-goal-title";
        title.textContent = "本关重点";
        const list = document.createElement("div");
        list.className = "boss-goal-list";

        for (const combo of combos) {
          const chip = document.createElement("span");
          chip.className = "boss-goal-chip";
          chip.textContent = TYPE_LABELS[combo] ?? combo;
          list.append(chip);
        }

        view.featuredCombos.append(title, list);
      }

      function renderBossGoal() {
        const goals = model.state.bossGoals;
        if (!goals || goals.length === 0) {
          view.bossGoal.classList.remove("show");
          view.bossGoal.innerHTML = "";
          return;
        }

        view.bossGoal.classList.add("show");
        view.bossGoal.innerHTML = "";

        const title = document.createElement("strong");
        title.className = "boss-goal-title";
        title.textContent = "Boss 目标";
        const list = document.createElement("div");
        list.className = "boss-goal-list";

        goals.forEach((goal, index) => {
          const chip = document.createElement("span");
          const progressKeys = getBossGoalProgressKeys(goal);
          const done = isBossGoalItemComplete(goal);
          const pulsing = progressKeys.some((key) => model.state.recentBossProgress.includes(key));
          chip.className = `boss-goal-chip${done ? " done" : ""}${pulsing ? " pulse" : ""}`;
          chip.textContent = `${done ? "完成 " : ""}${formatBossGoalProgress(goal)}`;
          chip.dataset.goalIndex = String(index);
          list.append(chip);
        });

        view.bossGoal.append(title, list);
      }

      function renderBoard() {
        const coordinateSystem = getActiveCoordinateSystem();
        view.board.innerHTML = "";
        view.board.dataset.mode = model.mode;
        view.board.classList.toggle("vision-on", Boolean(model.state.visionActive));
        view.board.classList.toggle("boss", getActiveBossGoals(model.levelIndex).length > 0);

        for (const tile of model.state.tiles) {
          if (tile.location !== "board") continue;
          if (tile.stackColumn && !isVisibleStackDisplayTile(tile)) continue;

          const button = document.createElement("button");
          const blocked = isTileBlocked(tile.id);
          const stackPreviewDepth = getStackPreviewDepth(tile);
          const hiddenStackDepth = getHiddenStackDepth(tile);
          const hasHiddenStack = hiddenStackDepth > 0;
          const isPreviewTile = tile.stackColumn && stackPreviewDepth > 0;
          const isBridgeTile = Boolean(tile.stackBridge);
          const isLooseTile = Boolean(tile.looseMountainTile);
          const bridgeUnlockCount = getBridgeUnlockCount(tile);
          button.className = `tile ${blocked ? "blocked" : "available"}${hasHiddenStack ? " stack-top" : ""}${isPreviewTile ? " stack-preview" : ""}${isBridgeTile ? " stack-bridge" : ""}${isLooseTile ? " loose-mountain" : ""}`;
          button.type = "button";
          const visual = getVisualPosition(tile, coordinateSystem, model.state.tiles);
          button.style.left = `${visual.left}%`;
          button.style.top = `${visual.top}%`;
          button.style.zIndex = String(TILE_Z_INDEX_BASE + visual.order);
          button.style.setProperty("--lift-x", `${visual.liftX}%`);
          button.style.setProperty("--lift-y", `${visual.liftY}%`);
          button.disabled = blocked || model.state.phase !== "playing";
          button.dataset.tileId = tile.id;
          if (tile.sourcePackage) button.dataset.sourcePackage = tile.sourcePackage;
          if (tile.solutionGroup) button.dataset.solutionGroup = tile.solutionGroup;
          if (tile.solutionStep) button.dataset.solutionStep = String(tile.solutionStep);
          if (tile.mixedWindowRole) button.dataset.mixedWindowRole = tile.mixedWindowRole;
          if (hasHiddenStack) button.dataset.stackDepth = String(hiddenStackDepth);
          if (tile.stackColumn) button.dataset.stackPreviewDepth = String(stackPreviewDepth);
          if (tile.stackCoverMode) button.dataset.stackCoverMode = tile.stackCoverMode;
          if (tile.stackOverlapRatio) button.dataset.stackOverlapRatio = tile.stackOverlapRatio.toFixed(2);
          if (isBridgeTile) button.dataset.bridgeUnlocks = String(bridgeUnlockCount);
          if (isLooseTile) button.dataset.looseMountainTile = "true";
          const stackHint = hasHiddenStack
            ? `，下方 ${hiddenStackDepth} 张`
            : (isPreviewTile ? `，上方 ${stackPreviewDepth} 张` : (isBridgeTile ? `，压住 ${bridgeUnlockCount} 个入口` : ""));
          button.setAttribute("aria-label", `${tileLabel(tile)} ${blocked ? "被压住" : "可点击"}${stackHint}`);
          button.innerHTML = getTileFaceHtml(tile);
          button.addEventListener("click", () => moveTileToSlot(tile.id));
          view.board.append(button);
        }
      }

      function getVisualPosition(tile, coordinateSystem, tiles = model.state.tiles) {
        const left = (tile.x / coordinateSystem.baseWidth) * 100;
        const top = (tile.y / coordinateSystem.baseHeight) * 100;
        const tileIndex = tiles.findIndex((item) => item.id === tile.id);
        const layerLiftX = tile.stackBridge ? 0 : tile.layer * (model.mode === "mountain" ? -0.58 : -0.85);
        const layerLiftY = tile.stackBridge ? 0 : tile.layer * (model.mode === "mountain" ? -1.28 : -1.85);
        const stackPreviewOffset = getStackPreviewVisualOffset(tile, tiles);
        const weaveX = tile.stackBridge ? 0 : tile.stackColumn ? stackPreviewOffset.x : ((tileIndex % 3) - 1) * (model.mode === "mountain" ? 0.24 : 0.42);
        const weaveY = tile.stackBridge ? 0 : tile.stackColumn ? stackPreviewOffset.y : ((tileIndex % 4) - 1.5) * (model.mode === "mountain" ? 0.18 : 0.28);

        return {
          left: left + layerLiftX + weaveX,
          top: top + layerLiftY + weaveY,
          liftX: layerLiftX + weaveX,
          liftY: layerLiftY + weaveY,
          order: getTileStackOrder(tile, tileIndex),
        };
      }

      function getStackPreviewVisualOffset(tile, tiles = model.state.tiles) {
        const previewDepth = Math.min(getStackPreviewDepthForTiles(tile, tiles), getStackVisiblePreviewDepth(tile));
        if (!tile.stackColumn || previewDepth <= 0) return { x: 0, y: 0 };

        const direction = getStackColumnVisualDirection(tile);
        const lane = previewDepth % 2 === 0 ? -direction : direction;
        const order = getTileStackOrder(tile);
        const overlapRatio = clampNumber(tile.stackOverlapRatio ?? 0.5, MOUNTAIN_STACK_OVERLAP_RANGE.min, MOUNTAIN_STACK_OVERLAP_RANGE.max);
        const spread = tile.stackPreviewSpread ?? 1;
        const revealScale = 1.18 - overlapRatio;
        return {
          x: lane * (0.16 + previewDepth * 0.42 * revealScale * spread) + Math.sin(order * 0.017) * 0.28,
          y: previewDepth * (0.22 + 1.3 * revealScale * spread) + Math.cos(order * 0.019) * 0.16,
        };
      }

      function getStackColumnVisualDirection(tile) {
        const source = String(tile.stackColumnId ?? tile.id);
        let hash = 0;
        for (let index = 0; index < source.length; index += 1) {
          hash = (hash * 31 + source.charCodeAt(index)) >>> 0;
        }
        return hash % 2 === 0 ? 1 : -1;
      }

      function getMountainVisualTileRect(tile, tiles) {
        const coordinateSystem = getActiveCoordinateSystem();
        const visual = getVisualPosition(tile, coordinateSystem, tiles);
        const { width, height } = getMountainRuleTileSize();
        return {
          x: (visual.left / 100) * coordinateSystem.baseWidth,
          y: (visual.top / 100) * coordinateSystem.baseHeight,
          width,
          height,
        };
      }

      function getMountainVisualIntersectionRect(tile, other, tiles) {
        const rect = getMountainVisualTileRect(tile, tiles);
        const otherRect = getMountainVisualTileRect(other, tiles);
        const left = Math.max(rect.x, otherRect.x);
        const top = Math.max(rect.y, otherRect.y);
        const right = Math.min(rect.x + rect.width, otherRect.x + otherRect.width);
        const bottom = Math.min(rect.y + rect.height, otherRect.y + otherRect.height);
        if (right <= left || bottom <= top) return null;
        return { left, top, right, bottom };
      }

      function getMountainVisualOverlapRatio(tile, other, tiles) {
        const rect = getMountainVisualIntersectionRect(tile, other, tiles);
        const { width, height } = getMountainRuleTileSize();
        return rect ? getUnionArea([rect]) / (width * height) : 0;
      }

      function getActiveCoordinateSystem() {
        return model.mode === "mountain" ? MOUNTAIN_COORDINATE_SYSTEM : model.levelsConfig.coordinateSystem;
      }

      function generateMountainTiles(level) {
        const tuning = getEffectiveMountainTuningForLevel(level, model.levelIndex);
        const seedText = getMountainGenerationSeedText(level, tuning);
        let lastError = null;

        for (const mountainTemplate of getMountainTemplateGenerationCandidates(level, tuning)) {
          const random = createSeededRandom(hashText(`${seedText}:${mountainTemplate.id}`));
          try {
            const generatedTiles = generateMountainTilesForTemplate(level, tuning, mountainTemplate, random);
            if (shouldRetryAutoMountainTemplate(level, tuning, generatedTiles)) {
              lastError = new Error(`密集牌山生成重试：${mountainTemplate.label} 起手开放过多。`);
              continue;
            }
            model.activeMountainTemplate = mountainTemplate;
            return generatedTiles;
          } catch (error) {
            lastError = error;
          }
        }

        throw lastError ?? new Error("密集牌山生成失败：没有可用模板。");
      }

      function generateMountainTilesForTemplate(level, tuning, mountainTemplate, random) {
        const targetTileCount = tuning.tileCount ?? getDefaultMountainTileCount(level);
        const positions = createMountainPositions(random, targetTileCount, tuning, mountainTemplate);
        const selectedPositions = positions.slice(0, targetTileCount).map((position, index) => ({
          ...position,
          id: `m-${level.order}-${String(index + 1).padStart(2, "0")}`,
        }));
        const bossGoals = getActiveBossGoals(model.levelIndex);
        const tileSpecByPositionId = buildSolvableTileSpecs(level, selectedPositions, random, bossGoals, tuning);

        const tiles = selectedPositions.map((position) => {
          const spec = tileSpecByPositionId.get(position.id);
          return {
            id: position.id,
            suit: spec.suit,
            rank: spec.rank,
            x: position.x,
            y: position.y,
            layer: position.layer,
            stackOrder: position.stackOrder,
            stackColumn: position.stackColumn,
            stackColumnId: position.stackColumnId,
            stackCoverMode: position.stackCoverMode,
            stackOverlapRatio: position.stackOverlapRatio,
            stackPreviewLimit: position.stackPreviewLimit,
            stackPreviewSpread: position.stackPreviewSpread,
            stackBridge: position.stackBridge,
            stackBridgeId: position.stackBridgeId,
            stackBridgeColumnIds: position.stackBridgeColumnIds,
            blockedBy: [],
            location: "board",
            templateRegion: position.templateRegion,
            sourcePackage: spec.sourcePackage,
            solutionStep: spec.solutionStep,
            solutionGroup: spec.solutionGroup,
            mixedWindowRole: spec.mixedWindowRole,
          };
        });

        let generatedTiles = attachMountainBlockers(tiles);
        if (shouldRebalanceRuntimeInitialMixedWindow(level, mountainTemplate)) {
          generatedTiles = rebalanceRuntimeInitialMixedWindow(generatedTiles, random);
        }
        validateSolutionPath(generatedTiles);
        validateBossGoalsFromSolution(generatedTiles, bossGoals);
        assertFriendDemoOrphanRiskBudget(generatedTiles, model.levelIndex);
        return generatedTiles;
      }

      function getDefaultMountainTileCount(level) {
        return MOUNTAIN_DEFAULT_TILE_COUNT;
      }

      function shouldRebalanceRuntimeInitialMixedWindow(level, mountainTemplate = null) {
        if (mountainTemplate?.id === "suspended-waist") return true;
        const profile = getFriendDemoDifficultyProfile(model.levelIndex);
        if (profile && (profile.huPacks ?? 0) === 0 && getActiveBossGoals(model.levelIndex).length === 0) return true;
        return !hasFeaturedOrBossMountainGoals(level, getActiveBossGoals(model.levelIndex));
      }

      function getMountainTemplateDefinition(templateId) {
        return {
          id: templateId,
          label: MOUNTAIN_TEMPLATE_LABELS[templateId] ?? templateId,
        };
      }

      function selectMountainTemplate(level, tuning) {
        const configuredTemplateId = normalizeMountainTemplateId(tuning.templateId);
        if (configuredTemplateId !== "auto") return getMountainTemplateDefinition(configuredTemplateId);

        const templateIds = getAutoMountainTemplateIds();
        const templateIndex = model.prototypeView === "tuner"
          ? (level.order - 1) % templateIds.length
          : hashText(getAutoMountainTemplateSeedText(level, tuning)) % templateIds.length;
        return getMountainTemplateDefinition(templateIds[templateIndex]);
      }

      function getAutoMountainTemplateIds() {
        return MOUNTAIN_AUTO_TEMPLATE_IDS;
      }

      function getMountainTemplateGenerationCandidates(level, tuning) {
        const selectedTemplate = selectMountainTemplate(level, tuning);
        if (normalizeMountainTemplateId(tuning.templateId) !== "auto") return [selectedTemplate];

        return [
          selectedTemplate,
          ...getAutoMountainTemplateIds()
            .filter((templateId) => templateId !== selectedTemplate.id)
            .map(getMountainTemplateDefinition),
        ];
      }

      function shouldRetryAutoMountainTemplate(level, tuning, generatedTiles) {
        if (normalizeMountainTemplateId(tuning.templateId) !== "auto") return false;
        if (model.prototypeView !== "play") return false;
        return getGeneratedInitialAvailableCount(generatedTiles) > MOUNTAIN_INITIAL_AVAILABLE_TARGET;
      }

      function getGeneratedInitialAvailableCount(tiles) {
        const originalState = model.state;
        model.state = {
          tiles,
          slot: [],
          reserve: [],
          slotLimit: MAX_SLOT_LIMIT,
          reserveLimit: 0,
          shields: 0,
          firstProtect: false,
          score: 0,
          coins: 0,
          comboCounts: { chi: 0, peng: 0, gang: 0, hu: 0 },
          suitComboCounts: createEmptySuitTotals(),
          bossGoals: [],
          tools: { shuffle: 0, undo: 0, discard: 0, vision: 0 },
          bonuses: {},
          history: [],
          visionActive: false,
          phase: "playing",
          recentBossProgress: [],
        };
        const availableCount = tiles.filter((tile) => !isTileBlocked(tile.id)).length;
        model.state = originalState;
        return availableCount;
      }

      function getAutoMountainTemplateSeedText(level, tuning) {
        if (tuning.seed) return `${level.id}:${level.order}:${tuning.seed}`;
        if (model.prototypeView === "play") {
          return `${level.id}:${level.order}:${model.autoMountainTemplateSeed || "auto"}`;
        }
        return `${level.id}:${level.order}`;
      }

      function getMountainGenerationSeedText(level, tuning) {
        if (tuning.seed) return tuning.seed;
        if (model.prototypeView === "play" && model.autoMountainTemplateSeed) {
          return `${level.id}:${level.order}:${model.autoMountainTemplateSeed}`;
        }
        return `${level.id}:${level.order}`;
      }

      function createMountainPositions(random, targetTileCount, tuning, mountainTemplate = getMountainTemplateDefinition("center-tower")) {
        const positions = [];
        const anchors = getMountainActiveTemplateAnchors(getMountainTemplateAnchors(mountainTemplate.id));
        const stackCounts = getMountainStackCounts(targetTileCount - MOUNTAIN_MERGED_STACK_COUNT, anchors);

        anchors.forEach((anchor, index) => {
          const overlapProfile = createMountainStackOverlapProfile(index, random);
          addTemplateStackPositions(positions, random, {
            ...anchor,
            count: stackCounts[index],
            templateId: mountainTemplate.id,
            overlapProfile,
          }, tuning);
        });

        const bridgeGroups = createMountainBridgeGroups(random, positions, mountainTemplate.id);
        addMountainBridgePositions(positions, random, bridgeGroups, mountainTemplate.id);
        ensureMountainPositionCapacity(positions, random, targetTileCount);
        return shuffleTailPositions(positions, random, 0);
      }

      function createMountainBridgeGroups(random, positions, templateId) {
        const stackTops = getGeneratedStackTopPositions(positions)
          .filter((position) => !hasGeneratedHigherNonBridgeVisualOverlap(position, positions));
        const candidatePairs = [];

        for (let aIndex = 0; aIndex < stackTops.length; aIndex += 1) {
          for (let bIndex = aIndex + 1; bIndex < stackTops.length; bIndex += 1) {
            const first = stackTops[aIndex];
            const second = stackTops[bIndex];
            const distance = Math.hypot(first.visualX - second.visualX, first.visualY - second.visualY);
            const bridgeCoordinates = getMountainBridgeCoordinateCandidatesForColumns(first, second);
            if (bridgeCoordinates.length === 0 || distance > getMountainBridgeMaxDistance()) continue;
            candidatePairs.push({ first, second, bridgeCoordinates, distance, jitter: random() });
          }
        }

        const selected = [];
        const usedColumnIds = new Set();
        const placedBridges = [];
        candidatePairs
          .sort((a, b) => a.distance - b.distance || a.jitter - b.jitter)
          .forEach((pair) => {
            if (selected.length >= MOUNTAIN_MERGED_STACK_COUNT) return;
            if (usedColumnIds.has(pair.first.stackColumnId) || usedColumnIds.has(pair.second.stackColumnId)) return;
            const bridgeCoordinate = pair.bridgeCoordinates.find((coordinate) => (
              !hasMountainBridgeOverlap(coordinate, placedBridges)
            ));
            if (!bridgeCoordinate) return;
            const bridgePosition = { x: bridgeCoordinate.x, y: bridgeCoordinate.y };
            if (hasMountainBridgeOverlap(bridgePosition, placedBridges)) return;
            selected.push({
              id: `${templateId}-bridge-${selected.length + 1}`,
              columns: [pair.first, pair.second],
              bridgeCoordinate,
            });
            placedBridges.push(bridgePosition);
            usedColumnIds.add(pair.first.stackColumnId);
            usedColumnIds.add(pair.second.stackColumnId);
          });

        return selected;
      }

      function getMountainActiveTemplateAnchors(anchors) {
        const activeAnchors = anchors
          .map((anchor, index) => ({ anchor, index }))
          .sort((a, b) => (b.anchor.weight ?? 1) - (a.anchor.weight ?? 1) || a.index - b.index)
          .slice(0, Math.min(MOUNTAIN_ACTIVE_STACK_COUNT, anchors.length))
          .map((item) => item.anchor);
        const centerX = activeAnchors.reduce((sum, anchor) => sum + anchor.x, 0) / activeAnchors.length;
        const centerY = activeAnchors.reduce((sum, anchor) => sum + anchor.y, 0) / activeAnchors.length;
        return activeAnchors.map((anchor) => ({
          ...anchor,
          x: Math.round(centerX + (anchor.x - centerX) * MOUNTAIN_STACK_CLUSTER_PULL),
          y: Math.round(centerY + (anchor.y - centerY) * MOUNTAIN_STACK_CLUSTER_PULL),
        }));
      }

      function getGeneratedStackTopPositions(positions) {
        return positions
          .filter((position) => position.stackColumn && isVisibleGeneratedStackTop(position, positions))
          .map((position) => {
            const visual = getMountainGeneratedVisualPosition(position, positions);
            return {
              ...position,
              visualX: visual.x,
              visualY: visual.y,
            };
          });
      }

      function getMountainGeneratedVisualPosition(position, positions) {
        const tileIndex = positions.findIndex((item) => isSameGeneratedPosition(item, position));
        const layerLiftX = position.stackBridge ? 0 : position.layer * -0.58;
        const layerLiftY = position.stackBridge ? 0 : position.layer * -1.28;
        const stackPreviewOffset = getGeneratedStackPreviewVisualOffset(position, positions);
        const weaveX = position.stackBridge ? 0 : position.stackColumn ? stackPreviewOffset.x : ((tileIndex % 3) - 1) * 0.24;
        const weaveY = position.stackBridge ? 0 : position.stackColumn ? stackPreviewOffset.y : ((tileIndex % 4) - 1.5) * 0.18;

        return {
          x: position.x + (layerLiftX + weaveX) / 100 * MOUNTAIN_COORDINATE_SYSTEM.baseWidth,
          y: position.y + (layerLiftY + weaveY) / 100 * MOUNTAIN_COORDINATE_SYSTEM.baseHeight,
        };
      }

      function getMountainGeneratedVisualTileRect(position, positions) {
        const visual = getMountainGeneratedVisualPosition(position, positions);
        const { width, height } = getMountainRuleTileSize();
        return {
          x: visual.x,
          y: visual.y,
          width,
          height,
        };
      }

      function getMountainGeneratedVisualIntersectionRect(position, other, positions) {
        const rect = getMountainGeneratedVisualTileRect(position, positions);
        const otherRect = getMountainGeneratedVisualTileRect(other, positions);
        const left = Math.max(rect.x, otherRect.x);
        const top = Math.max(rect.y, otherRect.y);
        const right = Math.min(rect.x + rect.width, otherRect.x + otherRect.width);
        const bottom = Math.min(rect.y + rect.height, otherRect.y + otherRect.height);
        if (right <= left || bottom <= top) return null;
        return { left, top, right, bottom };
      }

      function hasGeneratedHigherVisualOverlap(position, positions) {
        return positions.some((other) => {
          if (isSameGeneratedPosition(other, position)) return false;
          if (other.location && other.location !== "board") return false;
          if (getTileStackOrder(other) <= getTileStackOrder(position)) return false;
          return Boolean(getMountainGeneratedVisualIntersectionRect(position, other, positions));
        });
      }

      function hasGeneratedHigherNonBridgeVisualOverlap(position, positions) {
        return positions.some((other) => {
          if (other.stackBridge) return false;
          if (isSameGeneratedPosition(other, position)) return false;
          if (other.location && other.location !== "board") return false;
          if (getTileStackOrder(other) <= getTileStackOrder(position)) return false;
          return Boolean(getMountainGeneratedVisualIntersectionRect(position, other, positions));
        });
      }

      function getGeneratedStackPreviewVisualOffset(position, positions) {
        const previewDepth = Math.min(getGeneratedStackPreviewDepth(position, positions), getStackVisiblePreviewDepth(position));
        if (!position.stackColumn || previewDepth <= 0) return { x: 0, y: 0 };

        const direction = getStackColumnVisualDirection(position);
        const lane = previewDepth % 2 === 0 ? -direction : direction;
        const order = getTileStackOrder(position);
        const overlapRatio = clampNumber(position.stackOverlapRatio ?? 0.5, MOUNTAIN_STACK_OVERLAP_RANGE.min, MOUNTAIN_STACK_OVERLAP_RANGE.max);
        const spread = position.stackPreviewSpread ?? 1;
        const revealScale = 1.18 - overlapRatio;
        return {
          x: lane * (0.16 + previewDepth * 0.42 * revealScale * spread) + Math.sin(order * 0.017) * 0.28,
          y: previewDepth * (0.22 + 1.3 * revealScale * spread) + Math.cos(order * 0.019) * 0.16,
        };
      }

      function getMountainBridgeMaxDistance() {
        const { width, height } = getMountainRuleTileSize();
        return Math.hypot(width * 1.15, height * 1.15);
      }

      function getMountainTemplateAnchors(templateId) {
        const templates = {
          "center-tower": [
            [320, 314, 1.5], [262, 360, 1.2], [354, 362, 1.2], [310, 430, 1.35],
            [146, 224, 0.85], [474, 224, 0.85], [134, 534, 0.85], [486, 534, 0.85],
            [238, 640, 0.8], [386, 640, 0.8],
          ],
          "two-wings": [
            [174, 150, 1.1], [132, 278, 1], [174, 410, 1], [132, 540, 1], [176, 668, 1.05],
            [446, 150, 1.1], [490, 278, 1], [446, 410, 1], [490, 540, 1], [444, 668, 1.05],
          ],
          cross: [
            [310, 166, 1.05], [310, 268, 1.1], [310, 382, 1.35], [310, 494, 1.1], [310, 606, 1.05],
            [116, 386, 0.9], [206, 386, 1], [414, 386, 1], [504, 386, 0.9], [310, 716, 0.7],
          ],
          ring: [
            [310, 116, 1], [430, 164, 1], [504, 286, 1], [506, 432, 1], [430, 562, 1],
            [310, 622, 1], [190, 562, 1], [112, 432, 1], [116, 286, 1], [190, 164, 1],
          ],
          "long-wall": [
            [116, 142, 1], [164, 214, 1], [212, 286, 1], [260, 358, 1], [308, 430, 1.1],
            [356, 502, 1], [404, 574, 1], [452, 646, 1], [500, 718, 1], [548, 790, 0.8],
          ],
          islands: [
            [140, 170, 1.15], [204, 230, 0.9], [430, 172, 1.15], [492, 232, 0.9],
            [294, 392, 1.3], [356, 454, 1.1], [130, 612, 1], [208, 680, 0.85],
            [426, 614, 1], [496, 682, 0.85],
          ],
          canyon: [
            [132, 116, 1.05], [116, 256, 1], [132, 396, 1], [116, 536, 1], [132, 676, 1.05],
            [488, 116, 1.05], [504, 256, 1], [488, 396, 1], [504, 536, 1], [488, 676, 1.05],
          ],
          staircase: [
            [126, 126, 1], [174, 198, 1], [222, 270, 1], [270, 342, 1], [318, 414, 1.1],
            [366, 486, 1], [414, 558, 1], [462, 630, 1], [510, 702, 0.9], [286, 724, 0.9],
          ],
          "suspended-waist": getSuspendedWaistTemplateAnchors(),
        };

        return (templates[templateId] ?? templates["center-tower"]).map(([x, y, weight, templateRegion], index) => ({
          id: `${templateId}-${index + 1}`,
          x: scaleMountainTemplateCoordinate(x, "x"),
          y: scaleMountainTemplateCoordinate(y, "y"),
          weight,
          templateRegion,
          stackBase: index * 700,
          row: index,
          col: index,
        }));
      }

      function getSuspendedWaistTemplateAnchors() {
        return [
          [214, 122, 1.42, "top-platform"],
          [290, 112, 1.5, "top-platform"],
          [366, 120, 1.5, "top-platform"],
          [442, 148, 1.36, "top-platform"],
          [300, 294, 1.38, "waist"],
          [358, 342, 1.3, "waist"],
          [238, 526, 1.28, "support-column"],
          [404, 552, 1.24, "support-column"],
          [128, 382, 1.12, "side-scatter"],
          [502, 684, 1.08, "side-scatter"],
        ];
      }

      function scaleMountainTemplateCoordinate(value, axis) {
        const sourceSize = axis === "x"
          ? MOUNTAIN_TEMPLATE_SOURCE_COORDINATE_SYSTEM.baseWidth
          : MOUNTAIN_TEMPLATE_SOURCE_COORDINATE_SYSTEM.baseHeight;
        const targetSize = axis === "x"
          ? MOUNTAIN_COORDINATE_SYSTEM.baseWidth
          : MOUNTAIN_COORDINATE_SYSTEM.baseHeight;
        return Math.round((value / sourceSize) * targetSize);
      }

      function getMountainStackCounts(targetTileCount, anchors) {
        const sortedAnchorIndexes = anchors
          .map((anchor, index) => ({ index, weight: anchor.weight ?? 1 }))
          .sort((a, b) => b.weight - a.weight || a.index - b.index)
          .slice(0, Math.min(MOUNTAIN_PRIMARY_STACK_COUNT, anchors.length))
          .map((item) => item.index);
        const primaryIndexes = new Set(sortedAnchorIndexes);
        const weightedAnchors = anchors.map((anchor, index) => ({
          index,
          weight: (anchor.weight ?? 1) * (primaryIndexes.has(index) ? MOUNTAIN_PRIMARY_STACK_WEIGHT_MULTIPLIER : 1),
        }));
        const totalWeight = weightedAnchors.reduce((sum, anchor) => sum + anchor.weight, 0);
        const counts = weightedAnchors.map((anchor) => Math.max(1, Math.floor((targetTileCount * anchor.weight) / totalWeight)));
        let remainder = targetTileCount - counts.reduce((sum, count) => sum + count, 0);
        let cursor = 0;

        while (remainder > 0) {
          const index = weightedAnchors[cursor % weightedAnchors.length].index;
          counts[index] += 1;
          remainder -= 1;
          cursor += 1;
        }

        while (remainder < 0) {
          const index = weightedAnchors[(weightedAnchors.length - 1 - cursor % weightedAnchors.length)].index;
          if (counts[index] > 1) {
            counts[index] -= 1;
            remainder += 1;
          }
          cursor += 1;
        }

        return counts;
      }

      function ensureMountainPositionCapacity(positions, random, targetTileCount) {
        let index = 0;
        while (positions.length < targetTileCount) {
          const col = index % 10;
          const row = Math.floor(index / 10) % 14;
          const layer = 4 + Math.floor(index / 140);
          positions.push({
            positionId: `extra-${index + 1}`,
            layer,
            row,
            col,
            x: 92 + col * 48 + (row % 2) * 10 + randomBetween(random, -2, 2),
            y: 108 + row * 48 + randomBetween(random, -2, 2),
            stackOrder: 5000 + index,
          });
          index += 1;
        }
      }

      function addTemplateStackPositions(positions, random, stack, tuning) {
        const phase = randomBetween(random, 0, Math.PI * 2);
        const baseX = stack.x + randomBetween(random, -3, 3);
        const baseY = stack.y + randomBetween(random, -3, 3);
        const layerStep = Math.max(5, tuning.stackDepth + 2);
        const overlapProfile = stack.overlapProfile ?? createMountainStackOverlapProfile(stack.col, random);

        for (let depth = 0; depth < stack.count; depth += 1) {
          const weaveX = Math.sin(depth * 0.43 + phase) * 1.4;
          const weaveY = Math.cos(depth * 0.39 + phase) * 1.1;
          positions.push({
            positionId: `${stack.id}-${depth + 1}`,
            layer: Math.min(9, Math.floor(depth / layerStep)),
            row: stack.row,
            col: stack.col,
            x: baseX + weaveX + randomBetween(random, -0.45, 0.45),
            y: baseY + weaveY + depth * 0.42 + randomBetween(random, -0.35, 0.35),
            stackOrder: depth * 100 + stack.col,
            stackColumn: true,
            stackColumnId: stack.id,
            stackCoverMode: overlapProfile.mode,
            stackOverlapRatio: overlapProfile.overlapRatio,
            stackPreviewLimit: overlapProfile.previewDepth,
            stackPreviewSpread: overlapProfile.previewSpread,
            templateId: stack.templateId,
            templateRegion: stack.templateRegion,
          });
        }
      }

      function createMountainStackOverlapProfile(index, random) {
        const modeIndex = index % 3;
        if (modeIndex === 0) {
          return {
            mode: "full",
            overlapRatio: 1,
            previewDepth: 1 + Math.floor(random() * 2),
            previewSpread: 0.12,
          };
        }
        if (modeIndex === 1) {
          return {
            mode: "partial",
            overlapRatio: randomBetween(random, 0.28, 0.78),
            previewDepth: MOUNTAIN_STACK_PREVIEW_DEPTH,
            previewSpread: randomBetween(random, 0.72, 1.05),
          };
        }
        return {
          mode: "loose",
          overlapRatio: MOUNTAIN_STACK_OVERLAP_RANGE.min,
          previewDepth: MOUNTAIN_STACK_PREVIEW_DEPTH,
          previewSpread: randomBetween(random, 1.08, 1.34),
        };
      }

      function addMountainBridgePositions(positions, random, bridgeGroups, templateId) {
        bridgeGroups.forEach((group, index) => {
          const bridgeCoordinate = group.bridgeCoordinate ?? getMountainBridgeCoordinate(group, random);
          const bridgePosition = {
            layer: 0,
            row: index,
            col: 40 + index,
            x: bridgeCoordinate.x,
            y: bridgeCoordinate.y,
            stackOrder: 90000 + index,
            stackBridge: true,
            stackBridgeId: group.id,
            stackBridgeColumnIds: group.columns.map((column) => column.stackColumnId),
            templateId,
          };
          positions.push(bridgePosition);
        });
      }

      function getMountainBridgeCoordinate(group, random) {
        const coordinate = getMountainBridgeCoordinateCandidatesForColumns(group.columns[0], group.columns[1])[0];
        if (coordinate) return coordinate;

        const { width, height } = getMountainRuleTileSize();
        const first = group.columns[0];
        const second = group.columns[1];
        const minX = Math.max(first.visualX, second.visualX) - width + 4;
        const maxX = Math.min(first.visualX, second.visualX) + width - 4;
        const minY = Math.max(first.visualY, second.visualY) - height + 4;
        const maxY = Math.min(first.visualY, second.visualY) + height - 4;
        const fallbackX = (first.visualX + second.visualX) / 2;
        const fallbackY = (first.visualY + second.visualY) / 2;
        const x = minX <= maxX
          ? randomBetween(random, minX, maxX)
          : fallbackX;
        const y = minY <= maxY
          ? randomBetween(random, minY, maxY)
          : fallbackY;

        return {
          x: clampMountainBridgeCoordinate(x, width, "x"),
          y: clampMountainBridgeCoordinate(y, height, "y"),
        };
      }

      function getMountainBridgeCoordinateCandidatesForColumns(first, second) {
        const { width, height } = getMountainRuleTileSize();
        const minX = Math.max(first.visualX, second.visualX) - width + 4;
        const maxX = Math.min(first.visualX, second.visualX) + width - 4;
        const minY = Math.max(first.visualY, second.visualY) - height + 4;
        const maxY = Math.min(first.visualY, second.visualY) + height - 4;
        if (minX > maxX || minY > maxY) return [];

        const midX = (minX + maxX) / 2;
        const midY = (minY + maxY) / 2;
        const rawCandidates = [
          { x: midX, y: midY },
          { x: minX, y: minY },
          { x: maxX, y: maxY },
          { x: minX, y: maxY },
          { x: maxX, y: minY },
          { x: midX, y: minY },
