          if (group.length === 0) continue;

          const blockedIds = group
            .filter((tile) => isGeneratedTileBlocked(tile, remaining))
            .map((tile) => tile.id);

          if (blockedIds.length > 0) {
            throw new Error(`密集牌山生成失败：解法第 ${step} 步仍被压住 ${blockedIds.join(", ")}`);
          }

          for (const tile of group) {
            virtualSlot.push(tile);
            const index = remaining.findIndex((item) => item.id === tile.id);
            if (index >= 0) remaining.splice(index, 1);
          }

          resolveVirtualSolutionSlot(virtualSlot);

          if (virtualSlot.length > model.levelsConfig.defaults.slotLimit) {
            throw new Error(`密集牌山生成失败：解法第 ${step} 步会塞满卡槽。`);
          }
        }

        if (remaining.length > 0) {
          throw new Error("密集牌山生成失败：解法未清空牌山。");
        }
      }

      function resolveVirtualSolutionSlot(virtualSlot) {
        let changed = true;
        while (changed) {
          changed = false;
          const groups = new Map();
          virtualSlot.forEach((tile) => {
            const key = tile.solutionGroup ?? tile.sourcePackage;
            if (!key) return;
            const group = groups.get(key) ?? [];
            group.push(tile);
            groups.set(key, group);
          });

          for (const group of groups.values()) {
            const comboType = getComboTypeForSolutionGroup(group);
            if (!comboType) continue;
            for (const tile of group) {
              const index = virtualSlot.findIndex((item) => item.id === tile.id);
              if (index >= 0) virtualSlot.splice(index, 1);
            }
            changed = true;
            break;
          }
        }
      }

      function validateBossGoalsFromSolution(tiles, bossGoals) {
        const goals = bossGoals ?? [];
        if (goals.length === 0) return;

        const comboCounts = { chi: 0, peng: 0, gang: 0, hu: 0 };
        const suitComboCounts = createEmptySuitTotals();
        let score = 0;
        const groups = new Map();

        for (const tile of tiles) {
          const groupKey = tile.solutionGroup ?? tile.sourcePackage;
          if (!groupKey) continue;
          const group = groups.get(groupKey) ?? [];
          group.push(tile);
          groups.set(groupKey, group);
        }

        for (const group of groups.values()) {
          const comboType = getComboTypeForSolutionGroup(group);
          if (!comboType) continue;
          comboCounts[comboType] += 1;
          for (const suit of new Set(group.map((tile) => tile.suit))) {
            suitComboCounts[suit] += 1;
          }
          score += BASE_SCORE[comboType];
        }

        for (const goal of goals) {
          if (goal.type === "combo_count" && comboCounts[goal.combo] < goal.target) {
            throw new Error(`密集牌山生成失败：Boss 目标 ${TYPE_LABELS[goal.combo]} 不足。`);
          }

          if (goal.type === "score_target" && score < goal.target) {
            throw new Error(`密集牌山生成失败：Boss 积分目标不足。`);
          }

          if (goal.type === "suit_set") {
            const missingSuit = goal.suits.find((suit) => suitComboCounts[suit] < goal.eachTarget);
            if (missingSuit) {
              throw new Error(`密集牌山生成失败：Boss ${SUIT_LABELS[missingSuit]}目标不足。`);
            }
          }
        }
      }

      function assertFriendDemoOrphanRiskBudget(tiles, levelIndex = model.levelIndex) {
        const summary = getFriendDemoOrphanRiskSummary(tiles, levelIndex);
        if (!Number.isFinite(summary.budget)) return summary;
        if (summary.risk > summary.budget) {
          throw new Error(`密集牌山生成失败：孤张风险 ${summary.risk}/${summary.budget}，未归类组 ${summary.unresolvedGroups.join(", ")}`);
        }
        return summary;
      }

      function getFriendDemoOrphanRiskSummary(tiles, levelIndex = model.levelIndex) {
        const budget = getFriendDemoOrphanRiskBudget(levelIndex);
        const solutionGroups = collectSolutionGroups(tiles);
        const unresolvedGroups = [];
        const pureOrphanGroups = [];
        const pairOnlyGroups = [];

        for (const [groupKey, group] of solutionGroups.entries()) {
          if (getComboTypeForSolutionGroup(group)) continue;
          unresolvedGroups.push(groupKey);
          if (group.length === 1) pureOrphanGroups.push(groupKey);
          if (group.length === 2) pairOnlyGroups.push(groupKey);
        }

        return {
          budget,
          risk: unresolvedGroups.length,
          unresolvedGroups,
          pureOrphanGroups,
          pairOnlyGroups,
        };
      }

      function getFriendDemoOrphanRiskBudget(levelIndex = model.levelIndex) {
        const profile = getFriendDemoDifficultyProfile(levelIndex);
        if (!profile) return Number.POSITIVE_INFINITY;
        if (Number.isFinite(profile.orphanBudget)) return profile.orphanBudget;
        if (levelIndex <= 4) return 1;
        if (levelIndex === 5) return 2;
        if (levelIndex <= 7) return 3;
        return DEFAULT_RIVER_LIMIT + 1;
      }

      function collectSolutionGroups(tiles) {
        const groups = new Map();
        for (const tile of tiles) {
          const groupKey = tile.solutionGroup ?? tile.sourcePackage;
          if (!groupKey) continue;
          const group = groups.get(groupKey) ?? [];
          group.push(tile);
          groups.set(groupKey, group);
        }
        return groups;
      }

      function getComboTypeForSolutionGroup(group) {
        if (group.length >= MAX_SLOT_LIMIT && findHuGroups(group.slice(0, MAX_SLOT_LIMIT))) {
          return "hu";
        }

        if (group.length >= 4 && group.slice(0, 4).every((tile) => isSameTile(tile, group[0]))) {
          return "gang";
        }

        if (group.length >= 3 && group.slice(0, 3).every((tile) => isSameTile(tile, group[0]))) {
          return "peng";
        }

        if (group.length >= 3) {
          const firstThree = group.slice(0, 3).sort((a, b) => a.rank - b.rank);
          const sameSuit = firstThree.every((tile) => tile.suit === firstThree[0].suit);
          const sequential = firstThree[1].rank === firstThree[0].rank + 1 && firstThree[2].rank === firstThree[1].rank + 1;
          if (sameSuit && firstThree[0].suit !== "honor" && sequential) return "chi";
        }

        return null;
      }

      function isSameTile(a, b) {
        return a.suit === b.suit && a.rank === b.rank;
      }

      function isGeneratedTileBlocked(tile, tiles) {
        if (tile.stackColumn && !isVisibleGeneratedStackTop(tile, tiles)) return true;
        return isPositionCoveredByHigherTile(tile, tiles)
          || (tile.blockedBy ?? []).some((blockerId) => (
            tiles.some((other) => other.id === blockerId && other.location === "board")
          ));
      }

      function isVisibleGeneratedStackTop(tile, tiles) {
        if (!tile.stackColumn) return true;
        return getGeneratedStackColumnTiles(tile, tiles).every((other) => (
          isSameGeneratedPosition(other, tile) || getTileStackOrder(other) < getTileStackOrder(tile)
        ));
      }

      function isSameGeneratedPosition(first, second) {
        if (first === second) return true;
        if (first.positionId !== undefined && first.positionId === second.positionId) return true;
        return first.id !== undefined && first.id === second.id;
      }

      function isVisibleGeneratedStackDisplayTile(tile, tiles) {
        if (!tile.stackColumn) return true;
        return getGeneratedStackPreviewDepth(tile, tiles) <= getStackVisiblePreviewDepth(tile);
      }

      function getGeneratedStackPreviewDepth(tile, tiles) {
        if (!tile.stackColumn) return 0;
        return getGeneratedStackColumnTiles(tile, tiles).filter((other) => (
          getTileStackOrder(other) > getTileStackOrder(tile)
        )).length;
      }

      function getGeneratedHiddenStackDepth(tile, tiles) {
        if (!tile.stackColumn || !isVisibleGeneratedStackTop(tile, tiles)) return 0;
        return getGeneratedStackColumnTiles(tile, tiles).filter((other) => (
          getTileStackOrder(other) < getTileStackOrder(tile)
        )).length;
      }

      function getGeneratedStackColumnTiles(tile, tiles) {
        return tiles.filter((other) => (
          other.stackColumn
          && other.stackColumnId === tile.stackColumnId
        ));
      }

      function getStackVisiblePreviewDepth(tile) {
        if (!tile.stackColumn) return 0;
        return Math.min(MOUNTAIN_STACK_PREVIEW_DEPTH, Math.max(1, tile.stackPreviewLimit ?? MOUNTAIN_STACK_PREVIEW_DEPTH));
      }

      function collectComboPatterns(level) {
        const patterns = [];
        const bySuitRank = new Map();
        const ranksBySuit = new Map();

        for (const tile of level.tiles) {
          const key = `${tile.suit}-${tile.rank}`;
          const group = bySuitRank.get(key) ?? [];
          group.push(tile);
          bySuitRank.set(key, group);

          const rankSet = ranksBySuit.get(tile.suit) ?? new Set();
          rankSet.add(tile.rank);
          ranksBySuit.set(tile.suit, rankSet);
        }

        for (const group of bySuitRank.values()) {
          if (group.length >= 4) patterns.push(makePattern("gang", group.slice(0, 4)));
          if (group.length >= 3) patterns.push(makePattern("peng", group.slice(0, 3)));
        }

        for (const suit of NUMBER_SUITS) {
          const rankSet = ranksBySuit.get(suit) ?? new Set();
          for (let rank = 1; rank <= 7; rank += 1) {
            if (rankSet.has(rank) && rankSet.has(rank + 1) && rankSet.has(rank + 2)) {
              patterns.push(makePattern("chi", [
                { suit, rank },
                { suit, rank: rank + 1 },
                { suit, rank: rank + 2 },
              ]));
            }
          }
        }

        const honorRanks = getHonorPatternRanks(level.order);
        const honorPatterns = honorRanks.map((rank) => makePattern("peng", [
          { suit: "honor", rank },
          { suit: "honor", rank },
          { suit: "honor", rank },
        ]));

        if (patterns.length > 0) return [...patterns, ...patterns, ...honorPatterns];

        return [
          makePattern("peng", [{ suit: "wan", rank: 2 }, { suit: "wan", rank: 2 }, { suit: "wan", rank: 2 }]),
          makePattern("chi", [{ suit: "tong", rank: 3 }, { suit: "tong", rank: 4 }, { suit: "tong", rank: 5 }]),
          makePattern("peng", [{ suit: "tiao", rank: 7 }, { suit: "tiao", rank: 7 }, { suit: "tiao", rank: 7 }]),
          ...honorPatterns,
        ];
      }

      function getHonorPatternRanks(order) {
        const start = ((order - 1) * 2) % 7;
        const chapterStep = order % 10;
        const count = chapterStep === 0 ? 4 : order >= 6 ? 3 : 2;
        return Array.from({ length: count }, (_, index) => ((start + index) % 7) + 1);
      }

      function makePattern(type, tiles) {
        return {
          type,
          tiles: tiles.map((tile) => ({ suit: tile.suit, rank: tile.rank })),
        };
      }

      function attachMountainBlockers(tiles) {
        const { width, height } = getMountainRuleTileSize();
        return attachMountainBridgeBlockers(tiles.map((tile) => ({
          ...tile,
          blockedBy: tiles
            .filter((other) => !other.stackBridge && getTileStackOrder(other) > getTileStackOrder(tile) && getOverlapRatio(tile, other, width, height) >= BLOCKED_COVER_RATIO)
            .map((other) => other.id),
        })));
      }

      function attachMountainBridgeBlockers(tiles) {
        const bridgeTiles = tiles.filter((tile) => tile.stackBridge);
        if (bridgeTiles.length === 0) return tiles;

        return tiles.map((tile) => {
          if (!tile.stackColumn) return tile;
          const bridgeBlockers = bridgeTiles
            .filter((bridge) => (
              bridge.stackBridgeColumnIds?.includes(tile.stackColumnId)
              && isVisibleGeneratedStackTop(tile, tiles)
              && getOverlapRatio(tile, bridge, getMountainRuleTileSize().width, getMountainRuleTileSize().height) >= BLOCKED_COVER_RATIO
            ))
            .map((bridge) => bridge.id);
          if (bridgeBlockers.length === 0) return tile;
          return {
            ...tile,
            blockedBy: [...new Set([...tile.blockedBy, ...bridgeBlockers])],
          };
        });
      }

      function getOverlapRatio(tile, other, tileWidth, tileHeight) {
        const rect = getIntersectionRect(tile, other, tileWidth, tileHeight);
        return rect ? getUnionArea([rect]) / (tileWidth * tileHeight) : 0;
      }

      function getIntersectionRect(tile, other, tileWidth, tileHeight) {
        const left = Math.max(tile.x, other.x);
        const top = Math.max(tile.y, other.y);
        const right = Math.min(tile.x + tileWidth, other.x + tileWidth);
        const bottom = Math.min(tile.y + tileHeight, other.y + tileHeight);
        if (right <= left || bottom <= top) return null;
        return { left, top, right, bottom };
      }

      function getUnionArea(rects) {
        if (rects.length === 0) return 0;
        const xPoints = [...new Set(rects.flatMap((rect) => [rect.left, rect.right]))].sort((a, b) => a - b);
        let area = 0;

        for (let index = 0; index < xPoints.length - 1; index += 1) {
          const left = xPoints[index];
          const right = xPoints[index + 1];
          if (right <= left) continue;

          const spans = rects
            .filter((rect) => rect.left < right && rect.right > left)
            .map((rect) => [rect.top, rect.bottom])
            .sort((a, b) => a[0] - b[0]);

          let coveredHeight = 0;
          let spanStart = null;
          let spanEnd = null;

          for (const [top, bottom] of spans) {
            if (spanStart === null) {
              spanStart = top;
              spanEnd = bottom;
            } else if (top <= spanEnd) {
              spanEnd = Math.max(spanEnd, bottom);
            } else {
              coveredHeight += spanEnd - spanStart;
              spanStart = top;
              spanEnd = bottom;
            }
          }

          if (spanStart !== null) coveredHeight += spanEnd - spanStart;
          area += (right - left) * coveredHeight;
        }

        return area;
      }

      function getTileStackOrder(tile, fallbackOrder = 0) {
        return Number.isFinite(tile.stackOrder) ? tile.stackOrder : tile.layer * 1000 + fallbackOrder;
      }

      function createSeededRandom(seed) {
        let value = seed >>> 0;
        return () => {
          value = Math.imul(value, 1664525) + 1013904223;
          return (value >>> 0) / 4294967296;
        };
      }

      function hashText(text) {
        let hash = 2166136261;
        for (let index = 0; index < text.length; index += 1) {
          hash ^= text.charCodeAt(index);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function randomBetween(random, min, max) {
        return min + random() * (max - min);
      }

      function shuffleItems(items, random) {
        const copy = [...items];
        for (let index = copy.length - 1; index > 0; index -= 1) {
          const targetIndex = Math.floor(random() * (index + 1));
          [copy[index], copy[targetIndex]] = [copy[targetIndex], copy[index]];
        }
        return copy;
      }

      function renderHuHint() {
        const hint = getHuWaitHint();
        view.huHint.textContent = hint?.text ?? "";
        view.huHint.dataset.distance = hint ? String(hint.distance) : "";
        view.huHint.classList.toggle("show", Boolean(hint));
      }

      function getHuWaitTargetKeys() {
        return getHuWaitHint()?.targetKeys ?? [];
      }

      function getHuWaitHint() {
        if (!model.state || model.state.phase !== "playing") return null;
        const slotTiles = model.state.slot.map(findTile).filter((tile) => tile?.location === "slot");
        const distance = MAX_SLOT_LIMIT - slotTiles.length;
        if (distance !== 1 && distance !== 2) return null;

        const routes = distance === 1
          ? findOneTileHuWaitRoutes(slotTiles)
          : findTwoTileHuWaitRoutes(slotTiles);
        if (routes.length === 0) return null;

        const activeRoutes = routes.filter((route) => isHuWaitRouteAvailable(route.targets));
        const selectedRoute = activeRoutes[0] ?? routes[0];
        const labels = selectedRoute.targets.map(formatTileIdentityLabel);
        const targetKeys = activeRoutes.length > 0 ? getUniqueHuWaitTargetKeys(selectedRoute.targets) : [];
        const unavailableText = activeRoutes.length > 0 ? "" : "（牌山暂无）";
        const text = distance === 1
          ? `听：${labels.join(" / ")}${unavailableText}`
          : `差：${labels.join(" / ")} 可胡${unavailableText}`;

        return {
          distance,
          text,
          targetKeys,
        };
      }

      function findOneTileHuWaitRoutes(slotTiles) {
        return getHuHintIdentities()
          .filter((identity) => findHuGroups([...slotTiles, makeVirtualHuTile(identity, 0)]))
          .map((identity) => ({ targets: [identity] }));
      }

      function findTwoTileHuWaitRoutes(slotTiles) {
        const identities = getHuHintIdentities();
        const routes = [];
        for (let firstIndex = 0; firstIndex < identities.length; firstIndex += 1) {
          for (let secondIndex = firstIndex; secondIndex < identities.length; secondIndex += 1) {
            const first = identities[firstIndex];
            const second = identities[secondIndex];
            const candidateTiles = [
              ...slotTiles,
              makeVirtualHuTile(first, 0),
              makeVirtualHuTile(second, 1),
            ];
            if (findHuGroups(candidateTiles)) routes.push({ targets: [first, second] });
          }
        }
        return routes;
      }

      function getHuHintIdentities() {
        const tuning = model.mode === "mountain"
          ? getEffectiveMountainTuningForLevel(currentLevel(), model.levelIndex)
          : null;
        return getAllTileIdentities(tuning);
      }

      function makeVirtualHuTile(identity, index) {
        return {
          id: `hu-wait-${identity.key}-${index}`,
          suit: identity.suit,
          rank: identity.rank,
          location: "slot",
        };
      }

      function isHuWaitRouteAvailable(targets) {
        const boardCounts = getBoardTileIdentityCounts();
        const requiredCounts = targets.reduce((counts, target) => {
          counts[target.key] = (counts[target.key] ?? 0) + 1;
          return counts;
        }, {});
        return Object.entries(requiredCounts).every(([key, count]) => (boardCounts[key] ?? 0) >= count);
      }

      function getBoardTileIdentityCounts() {
        return getBoardTiles().reduce((counts, tile) => {
          const key = getTileKey(tile);
          counts[key] = (counts[key] ?? 0) + 1;
          return counts;
        }, {});
      }

      function getUniqueHuWaitTargetKeys(targets) {
        return [...new Set(targets.map((target) => target.key))];
      }

      function formatTileIdentityLabel(identity) {
        return getTileLabel(identity);
      }

      function renderCounts() {

        view.counts.innerHTML = "";
        for (const suit of ALL_SUITS) {
          const row = document.createElement("div");
          row.className = "count-row";
          const label = document.createElement("strong");
          label.textContent = `${SUIT_LABELS[suit]} ${counts[suit].total}`;
          const dots = document.createElement("div");
          dots.className = "rank-dots";
          const maxRank = suit === "honor" ? 7 : 9;
          for (let rank = 1; rank <= maxRank; rank += 1) {
            const dot = document.createElement("span");
            const count = counts[suit].ranks[rank] ?? 0;
            const tileKey = `${suit}-${rank}`;
            dot.className = huWaitTargetKeys.has(tileKey) && count > 0
              ? "rank-dot has hu-wait"
              : `rank-dot${count > 0 ? " has" : ""}`;
            const face = document.createElement("span");
            face.className = "rank-face";
            appendTileMiniFace(face, { suit, rank });
            const countLabel = document.createElement("span");
            countLabel.className = "rank-count";
            countLabel.textContent = String(count);
            dot.append(face, countLabel);
            dots.append(dot);
          }
          row.append(label, dots);
          view.counts.append(row);
        }
      }

        }
      }

      function moveTileToSlot(tileId) {
        if (model.state.phase !== "playing") return;
        const tile = findTile(tileId);
        if (!tile || tile.location !== "board" || isTileBlocked(tileId)) return;

        if (model.state.slot.length >= model.state.slotLimit) {
          view.status.textContent = "主槽已满";
          return;
        }

        pushHistory(`${tileLabel(tile)} 入槽前`);
        tile.location = "slot";
        model.state.slot.push(tileId);
        const dangerMessage = checkDanger();

        if (model.state.phase === "failed") {
          return;
        }

        if (isLevelClear()) {
          resolveLevelClear();
          return;
        }

        renderAll(dangerMessage ?? `${tileLabel(tile)} 入槽`);
      }

      function pushHistory(label) {
        model.state.history.push({
          label,
          tiles: model.state.tiles.map((tile) => ({ ...tile, blockedBy: [...tile.blockedBy] })),
          slot: [...model.state.slot],
          reserve: [...model.state.reserve],
          river: [...(model.state.river ?? [])],
          riverLimit: model.state.riverLimit ?? DEFAULT_RIVER_LIMIT,
          openMelds: (model.state.openMelds ?? []).map((meld) => ({ ...meld, tileIds: [...meld.tileIds] })),
          discardSelecting: model.state.discardSelecting ?? false,
          shields: model.state.shields,
        });

        if (model.state.history.length > 12) model.state.history.shift();
      }

      function executeCombo(candidate) {
        if (model.state.phase !== "playing") return;
        if (!candidate) return;
        if (candidate.type === "bugang") {
          executeSupplementalGang(candidate);
          return;
        }
        const comboSuit = getComboSuit(candidate);
        const candidateIds = new Set(candidate.tileIds);
        for (const tile of model.state.tiles) {
          if (candidateIds.has(tile.id)) tile.location = "removed";
        }
        model.state.slot = model.state.slot.filter((tileId) => !candidateIds.has(tileId));
        model.state.score += (BASE_SCORE[candidate.type] ?? 0) + (model.state.bonuses[candidate.type] ?? 0);
        model.state.coins += (COIN_REWARD[candidate.type] ?? 0);
        model.run.coins = model.state.coins;
        model.state.comboCounts[candidate.type] = (model.state.comboCounts[candidate.type] ?? 0) + 1;
        if (candidate.type === "peng") {
          addOpenMeld("peng", candidate, "slot");
        }
        let actionMessage = `${TYPE_LABELS[candidate.type]} 成功`;
        if (candidate.type === "hu") {
          const suits = new Set(candidate.tileIds.map((tileId) => findTile(tileId)?.suit).filter(Boolean));
          for (const suit of suits) {
            model.state.suitComboCounts[suit] += 1;
          }
          markBossProgress(candidate.type, [...suits]);
          const opened = openMountainByAction(HU_SHAKE_LOOSE_COUNT);
          const riverCleaned = cleanRiverAfterHu();
          actionMessage = `胡后清河：清槽${riverCleaned ? `，清 ${riverCleaned}` : ""}${opened.length ? `，震落 ${opened.length} 张可选牌` : ""}`;
        } else {
          model.state.suitComboCounts[comboSuit] += 1;
          markBossProgress(candidate.type, [comboSuit]);
          if (candidate.type === "gang") {
            addOpenMeld("gang", candidate, "direct");
            const opened = openMountainByAction(KONG_SHAKE_LOOSE_COUNT);
            actionMessage = `杠开山：${opened.length ? `震落 ${opened.length} 张可选牌` : "牌山已无压顶牌"}`;
          }
        }
        model.state.history = [];
        finishComboAction(actionMessage);
      }

      function executeSupplementalGang(candidate) {
        const tile = findTile(candidate.tileIds[0]);
        if (!tile) return;
        const tileKey = getTileKey(tile);
        const meld = findSupplementalGangMeld(tileKey);
        if (!meld) return;
        model.state.slot = model.state.slot.filter((tileId) => tileId !== tile.id);
        tile.location = "meld";
        meld.type = "gang";
        meld.source = "supplemental";
        meld.count = 4;
        meld.tileIds = [...new Set([...meld.tileIds, tile.id])];
        model.state.score += BASE_SCORE.bugang + (model.state.bonuses.bugang ?? 0);
        model.state.coins += COIN_REWARD.bugang;
        model.run.coins = model.state.coins;
        model.state.comboCounts.bugang = (model.state.comboCounts.bugang ?? 0) + 1;
        model.state.history = [];
        finishComboAction(`补杠成功：${meld.label} 已收入明牌`);
      }

      function finishComboAction(message) {
        if (isLevelClear()) {
          resolveLevelClear();
          return;
        }

        renderAll(message);
      }

      function resolveLevelClear(message = `${getCurrentRunLabel()}通关`) {
        if (!canClearCurrentLevel()) {
          renderAll(getCurrentClearRequirementText());
          return false;
        }
        if (!isBossGoalComplete()) {
          failLevel();
          return false;
        }
        if (shouldEnterEndgameSettlement()) {
          enterEndgameSettlement();
          return true;
        }
        completeCurrentLevel(message);
        return true;
      }

      function completeCurrentLevel(message = `${getCurrentRunLabel()}通关`) {
        const rewardMessages = [
          claimAscensionRewardAdjustment(),
          claimActiveLevelModifierReward(),
          claimBossTrialReward(),
        ].filter(Boolean);
        model.state.phase = "won";
        model.state.history = [];
        model.state.discardSelecting = false;
        model.state.endgamePrimerSelecting = false;
        model.state.endgameSettlement = null;
        renderAll(rewardMessages.length ? `${message} · ${rewardMessages.join(" · ")}` : message);
        showLevelClear();
      }

      function claimAscensionRewardAdjustment() {
        if (!isAscensionMode()) return "";
        const ascension = getAscensionConfig();
        const penalty = Math.min(model.state.coins, ascension?.rewardCoinPenalty ?? 0);
        if (!penalty) return "";
        model.state.coins -= penalty;
        model.run.coins = model.state.coins;
        return `${ascension.name} 维持费 -${penalty} 铜钱`;
      }

      function claimActiveLevelModifierReward() {
        const modifier = model.state.activeLevelModifier;
        if (!modifier?.rewardCoins || model.state.modifierRewardClaimed) return "";
        model.state.modifierRewardClaimed = true;
        model.state.coins += modifier.rewardCoins;
        model.run.coins = model.state.coins;
        return `事件奖励 +${modifier.rewardCoins} 铜钱`;
      }

      function claimBossTrialReward() {
        if ((model.state.bossGoals ?? []).length === 0) return "";
        if (!isBossGoalComplete()) return "";
        if (model.state.bossTrialRewardClaimed) return "";
        const bossDeck = getBossTrialDeck(model.levelIndex);
        const rewardCoins = Math.max(0, bossDeck.variant.rewardCoins ?? FRIEND_DEMO_BOSS_TRIAL_REWARD_COINS);
        if (!rewardCoins) return "";
        model.state.bossTrialRewardClaimed = true;
        model.state.coins += rewardCoins;
        model.run.coins = model.state.coins;
        return `Boss 奖励品质：${bossDeck.rewardQuality} · +${rewardCoins} 铜钱`;
      }

      function addOpenMeld(type, candidate, source) {
        if (!model.state.openMelds) model.state.openMelds = [];
        const tile = findTile(candidate.tileIds[0]);
        if (!tile) return;
        model.state.openMelds.push({
          type,
          tileKey: getTileKey(tile),
          label: getTileLabel(tile),
          count: candidate.tileIds.length,
          tileIds: [...candidate.tileIds],
          source,
        });
      }

      function getSupplementalGangCandidates(slotTiles) {
        const candidates = [];
        const openMelds = model.state.openMelds ?? [];
        for (const meld of openMelds) {
          if (meld.type !== "peng") continue;
          const tile = slotTiles.find((slotTile) => getTileKey(slotTile) === meld.tileKey);
          if (tile) candidates.push(makeCandidate("bugang", [tile]));
        }
        return candidates;
      }

      function findSupplementalGangMeld(tileKey) {
        return (model.state.openMelds ?? []).find((meld) => meld.type === "peng" && meld.tileKey === tileKey);
      }

      function openMountainByAction(count) {
        const targets = getOpenMountainTargets().slice(0, count);
        releaseMountainBlockers(targets);
        targets.forEach((tile, index) => shakeLooseMountainTile(tile, index, targets.length));
        return targets.map(tileLabel);
      }

      function releaseMountainBlockers(targets) {
        const targetIds = new Set(targets.map((tile) => tile.id));
        for (const tile of model.state.tiles) {
          tile.blockedBy = (tile.blockedBy ?? []).filter((blockerId) => !targetIds.has(blockerId));
        }
      }

      function shakeLooseMountainTile(tile, index, total) {
        const dropIndex = getNextLooseMountainDropIndex();
        const position = getLooseMountainPosition(dropIndex);
        tile.location = "board";
        tile.blockedBy = [];
        tile.layer = 0;
        tile.stackOrder = LOOSE_MOUNTAIN_STACK_ORDER_BASE + dropIndex;
        tile.stackColumn = false;
        tile.stackColumnId = "";
        tile.stackCoverMode = "";
        tile.stackOverlapRatio = 0;
        tile.stackPreviewLimit = 0;
        tile.stackPreviewSpread = 0;
        tile.stackBridge = false;
        tile.stackBridgeId = "";
        tile.stackBridgeColumnIds = [];
        tile.looseMountainTile = true;
        tile.x = position.x;
        tile.y = position.y;
      }

      function getNextLooseMountainDropIndex() {
        const current = Number.isFinite(model.state.looseMountainDropIndex)
          ? model.state.looseMountainDropIndex
          : model.state.tiles.filter((tile) => tile.location === "board" && tile.looseMountainTile).length;
        model.state.looseMountainDropIndex = current + 1;
        return current;
      }

      function getLooseMountainPosition(index) {
        const coordinateSystem = getActiveCoordinateSystem();
        const { width, height } = getRuleTileSize();
        const gap = model.mode === "mountain" ? 8 : 12;
        const padding = 10;
        const perRow = Math.max(1, Math.floor((coordinateSystem.baseWidth - padding * 2 + gap) / (width + gap)));
        const row = Math.floor(index / perRow);
        const column = index % perRow;
        return {
          x: padding + column * (width + gap),
          y: Math.max(padding, coordinateSystem.baseHeight - height - padding - row * (height + gap)),
        };
      }

      function getOpenMountainTargets() {
        const boardTiles = getBoardTiles();
        return boardTiles
          .filter((tile) => boardTiles.some((target) => (
            target.id !== tile.id
            && (target.blockedBy ?? []).includes(tile.id)
            && isTileBlocked(target.id)
          )))
          .sort((a, b) => {
            const aIndex = model.state.tiles.findIndex((tile) => tile.id === a.id);
            const bIndex = model.state.tiles.findIndex((tile) => tile.id === b.id);
            return getTileStackOrder(b, bIndex) - getTileStackOrder(a, aIndex);
          });
      }

      function cleanRiverAfterHu() {
        const river = model.state.river ?? [];
        if (river.length === 0) return "";
        const tileId = river.shift();
        const tile = findTile(tileId);
        if (tile) tile.location = "removed";
        return tile ? tileLabel(tile) : "";
      }

      function markBossProgress(comboType, suits) {
        model.state.recentBossProgress = [
          `combo:${comboType}`,
          ...suits.map((suit) => `suit:${suit}`),
          "score",
        ];

        clearTimeout(model.bossProgressTimer);
        model.bossProgressTimer = setTimeout(() => {
          if (!model.state) return;
          model.state.recentBossProgress = [];
          renderBossGoal();
        }, 900);
      }

      function useUndoTool() {
        if (model.state.phase !== "playing") return;
        if (model.state.tools.undo <= 0 || model.state.history.length === 0) return;
        const snapshot = model.state.history.pop();
        model.state.tools.undo -= 1;
        model.state.tiles = snapshot.tiles.map((tile) => ({ ...tile, blockedBy: [...tile.blockedBy] }));
        model.state.slot = [...snapshot.slot];
        model.state.reserve = [...snapshot.reserve];
        model.state.river = [...(snapshot.river ?? [])];
        model.state.riverLimit = snapshot.riverLimit ?? DEFAULT_RIVER_LIMIT;
        model.state.openMelds = (snapshot.openMelds ?? []).map((meld) => ({ ...meld, tileIds: [...meld.tileIds] }));
        model.state.discardSelecting = snapshot.discardSelecting ?? false;
        model.state.shields = snapshot.shields;
        renderAll(`撤回：${snapshot.label}`);
      }

      function useDiscardTool() {
        startDiscardSelection();
      }

      function startDiscardSelection() {
        if (model.state.phase !== "playing") return;
        if (model.state.slot.length === 0) {
          renderAll("主槽没有可打出的牌");
          return;
        }
        if (!canUseRiverDiscard()) {
          renderAll("牌河已满，不能继续打牌");
          return;
        }
        model.state.discardSelecting = !model.state.discardSelecting;
        renderAll(model.state.discardSelecting ? "请选择 1 张主槽牌打入牌河" : "已取消打牌选择");
      }

      function discardSlotTile(slotIndex) {
        if (model.state.phase !== "playing") return;
        if (!model.state.discardSelecting) return;
        if (!model.state.river) model.state.river = [];
        if (!model.state.riverLimit) model.state.riverLimit = DEFAULT_RIVER_LIMIT;
        if (!canUseRiverDiscard()) {
          model.state.discardSelecting = false;
          renderAll("牌河已满，不能继续打牌");
          return;
        }
        const discardedId = model.state.slot[slotIndex];
        const discarded = findTile(discardedId);
        if (!discarded) return;
        pushHistory(`${tileLabel(discarded)} 打入牌河前`);
        model.state.slot.splice(slotIndex, 1);
        model.state.river.push(discardedId);
        discarded.location = "river";
        model.state.discardSelecting = false;
        model.state.history = [];
        renderAll(`牌河：${tileLabel(discarded)} 已打出`);
      }

      function canUseRiverDiscard() {
        const river = model.state.river ?? [];
        const riverLimit = model.state.riverLimit ?? DEFAULT_RIVER_LIMIT;
        return river.length < riverLimit;
      }

      function useShuffleTool() {
        if (model.state.phase !== "playing") return;
        if (isToolDisabledByModifier("shuffle")) {
          renderAll("特殊事件：禁洗牌，本关不能使用洗牌");
          return;
        }
        if (model.state.tools.shuffle <= 0 || getBoardTiles().length < 2) return;
        model.state.tools.shuffle -= 1;
        shuffleBoardTileFaces();
        renderAll("洗牌：剩余牌面已重排");
      }

      function shuffleBoardTileFaces() {
        const boardTiles = getBoardTiles();
        const faces = shuffleItems(boardTiles.map((tile) => ({
          suit: tile.suit,
          rank: tile.rank,
          sourcePackage: tile.sourcePackage,
        })), createSeededRandom(hashText(`${currentLevel().id}:shuffle:${Date.now()}:${model.state.tools.shuffle}`)));

        boardTiles.forEach((tile, index) => {
          Object.assign(tile, faces[index]);
        });
      }

      function showLevelClear() {
        if (isEndlessMode()) {
          const chapter = getEndlessChapterProfile();
          view.rewardTitle.textContent = `${chapter ? `${chapter.label} · ` : ""}无尽第 ${getEndlessLayerOrder()} 层通关`;
          view.rewardGrid.innerHTML = "";
          view.rewardGrid.style.display = "none";
          view.runComplete.innerHTML = "";
          view.runComplete.classList.add("show");

          const summary = document.createElement("p");
          summary.textContent = shouldOfferRewardAfterLevel(model.levelIndex)
            ? `${chapter ? `${chapter.label} · ${chapter.theme}。` : ""}${isBossLevel() && chapter ? `${chapter.bossTitle} 已解除压力，` : ""}${chapter?.themeDetail ? `${chapter.themeDetail} ` : ""}下一层前可选择一次奖励。`
            : `${chapter ? `${chapter.label} · ${chapter.theme}。` : ""}${chapter?.themeDetail ? `${chapter.themeDetail} ` : ""}牌山已清空，可以进入下一层。`;
          const next = document.createElement("button");
          next.className = "reward-button";
          next.type = "button";
          next.textContent = shouldOfferRewardAfterLevel(model.levelIndex) ? "选择奖励" : "进入下一层";
          next.addEventListener("click", () => {
            view.rewardOverlay.classList.remove("show");
            advanceAfterClear();
          });
          view.runComplete.append(summary, next);
          view.rewardOverlay.classList.add("show");
          return;
        }

        if (isDailyMode() && isLastLevel()) {
          showRunComplete();
          return;
        }

        if (isLastLevel()) {
          showRunComplete();
          return;
        }

        setRewardOverlayMode("reward");
        view.rewardTitle.textContent = `第 ${currentLevel().order} 关通关`;
        view.rewardGrid.innerHTML = "";
        view.rewardGrid.style.display = "none";
        view.runComplete.innerHTML = "";
        view.runComplete.classList.add("show");

        const summary = document.createElement("p");
        summary.textContent = getClearSummaryText();
        const next = document.createElement("button");
        next.className = "reward-button";
        next.type = "button";
        next.textContent = shouldOfferRewardAfterLevel(model.levelIndex) ? "选择奖励" : "进入下一关";
        next.addEventListener("click", () => {
          view.rewardOverlay.classList.remove("show");
          advanceAfterClear();
        });
        view.runComplete.append(summary, next);
        view.rewardOverlay.classList.add("show");
      }

      function getClearSummaryText() {
        if (isEndlessMode()) {
          const chapter = getEndlessChapterProfile();
          return `${chapter ? `${chapter.label} · ` : ""}无尽第 ${getEndlessLayerOrder()} 层`;
        }
        if (isDailyMode()) {
          return `每日 ${model.run.dailySeed || "today"} · 第 ${currentLevel().order} 关`;
        }
        if (isFriendDemoBossTrialLevel()) return "终局试炼 · 本轮完成";
        if (isFriendDemoFinalBossLevel()) return "胡了卜王 · 本轮完成";
        if (getActiveBossGoals(model.levelIndex).length > 0) return "Boss 关 · 本章完成";
        if (shouldOfferRewardAfterLevel(model.levelIndex)) return "通关 · 可选奖励";
        return "通关 · 下一关";
      }

      function showRewards() {
        setRewardOverlayMode("reward");
        view.rewardTitle.textContent = isAscensionMode() ? "选择高阶奖励" : "选择奖励";
        view.rewardGrid.innerHTML = "";
        view.rewardGrid.style.display = "grid";
        view.runComplete.classList.remove("show");
        view.runComplete.innerHTML = "";
        if (isAscensionMode()) {
          const summary = document.createElement("p");
          summary.textContent = `${model.ascensionName || "高阶周目"} · ${getAscensionPerkPool().length} 项高阶能力`;
          view.runComplete.append(summary);
        }
        for (const rewardId of getRewardPoolForCurrentLevel()) {
          const reward = findReward(rewardId);
          if (!reward) continue;

          const card = document.createElement("article");
          card.className = "reward-card";
          const title = document.createElement("strong");
          title.textContent = reward.name;
          const route = document.createElement("div");
          route.className = "reward-route";
          route.textContent = getRewardRouteLabel(reward);
          const desc = document.createElement("p");
          desc.textContent = isAscensionMode() ? `高阶奖励：${reward.description}` : reward.description;
          const button = document.createElement("button");
          button.className = "reward-button";
          button.type = "button";
          button.textContent = "选择并进入下一关";
          button.addEventListener("click", () => pickReward(reward));
          card.append(title, route, desc, button);
          view.rewardGrid.append(card);
        }
        view.rewardOverlay.classList.add("show");
      }

      function getRewardRouteLabel(reward) {
        return REWARD_ROUTE_LABELS[reward?.category] ?? "路线";
      }

      function showRunComplete() {
        setRewardOverlayMode("reward");
        view.rewardTitle.textContent = "本轮通关";
        view.rewardGrid.innerHTML = "";
        view.rewardGrid.style.display = "none";
        view.runComplete.innerHTML = "";
        view.runComplete.classList.add("show");

        const summary = document.createElement("p");
        const bossText = getActiveBossGoals(model.levelIndex).length > 0
          ? `${getBossGoalTitleText()}已击破。`
          : "";
        summary.textContent = isDailyMode()
          ? `${bossText}每日 ${model.run.dailySeed || "today"} · ${getPlayableLevelCount()} 关 · ${model.run.coins} 铜钱 · ${model.run.pickedRewards.length} 奖励`
          : isAscensionMode()
            ? `${bossText}${model.ascensionName || "高阶周目"} · ${getPlayableLevelCount()} 关 · ${model.run.coins} 铜钱 · ${model.run.pickedRewards.length} 奖励`
            : `${bossText}${getPlayableLevelCount()} 关通关 · ${model.run.coins} 铜钱 · ${model.run.pickedRewards.length} 奖励`;
        const ascensionSummary = document.createElement("p");
        if (isAscensionMode()) {
          const ascensionRewards = model.run.pickedRewards
            .filter((rewardId) => isAscensionRewardId(rewardId))
            .map((rewardId) => findReward(rewardId)?.name ?? rewardId);
          ascensionSummary.textContent = `${getAscensionPerkPool().length} 项高阶能力${ascensionRewards.length > 0 ? ` · ${ascensionRewards.length} 项高阶奖励` : ""}`;
        }
        const restart = document.createElement("button");
        restart.className = "primary-button";
        restart.type = "button";
        restart.textContent = "重开第一关";
        restart.addEventListener("click", () => restartRun());
        view.runComplete.append(summary);
        if (isAscensionMode()) view.runComplete.append(ascensionSummary);
        view.runComplete.append(restart);
        view.rewardOverlay.classList.add("show");
        emitShellEvent("hulebu:run-complete", {
          summary: summary.textContent,
          bossReview: getBossReviewPayload("completed"),
          specialEventSummary: model.run.lastSpecialEventMessage ? `特殊事件：${model.run.lastSpecialEventMessage}` : "",
          specialEventMessage: model.run.lastSpecialEventMessage ?? "",
          routeDirection: isAscensionMode() ? getAscensionBuildProfile()?.name ?? null : getRunArchetypeConfig(model.runArchetype).label,
        });
      }

      function shouldEnterEndgameSettlement() {
        if (model.prototypeView !== "play") return false;
        if (isFriendDemoTutorialLevel()) return false;
        if ((model.state.bossGoals ?? []).length > 0) return false;
        return model.state.slot.length > 0;
      }

      function enterEndgameSettlement() {
        model.state.phase = "endgame";
        model.state.history = [];
        model.state.discardSelecting = false;
        model.state.endgamePrimerSelecting = false;
        model.state.endgameSettlement = {
          residualTileIds: [...model.state.slot],
        };
        renderAll("残局收官：处理主槽残张");
        showEndgameSettlement();
      }

      function showEndgameSettlement() {
        setRewardOverlayMode("reward");
        const residualIds = model.state.endgameSettlement?.residualTileIds ?? [...model.state.slot];
        const labels = residualIds
          .map((tileId) => findTile(tileId))
          .filter(Boolean)
          .map(tileLabel)
          .join(" / ");
        view.rewardTitle.textContent = "残局收官";
        view.rewardGrid.innerHTML = "";
        view.rewardGrid.style.display = "none";
        view.runComplete.innerHTML = "";
        view.runComplete.classList.add("show");

        const summary = document.createElement("p");
        summary.textContent = `牌桌已清空，主槽还有 ${residualIds.length} 张残张${labels ? `：${labels}` : ""}。`;
        const discard = document.createElement("button");
        discard.className = "reward-button";
        discard.type = "button";
        discard.textContent = "弃牌通关";
        discard.addEventListener("click", completeEndgameByDiscard);
        const primer = document.createElement("button");
        primer.className = "reward-button";
        primer.type = "button";
        primer.textContent = "选作牌引";
        primer.addEventListener("click", startEndgamePrimerSelection);
        view.runComplete.append(summary, discard, primer);
        view.rewardOverlay.classList.add("show");
      }

      function completeEndgameByDiscard() {
        clearEndgameResidualTiles(null);
        completeCurrentLevel(`弃牌通关：${getCurrentRunLabel()}通关`);
      }

      function startEndgamePrimerSelection() {
        if (model.state.phase !== "endgame") return;
        model.state.endgamePrimerSelecting = true;
        view.rewardOverlay.classList.remove("show");
        renderAll("请选择 1 张主槽牌作为下一关牌引");
      }

      function pickEndgamePrimerTile(slotIndex) {
        if (model.state.phase !== "endgame" || !model.state.endgamePrimerSelecting) return;
        const tileId = model.state.slot[slotIndex];
        const tile = findTile(tileId);
        if (!tile) return;
        model.run.pendingGuideTile = {
          suit: tile.suit,
          rank: tile.rank,
          label: tileLabel(tile),
        };
        clearEndgameResidualTiles(tileId);
        completeCurrentLevel(`牌引 ${tileLabel(tile)} 已带入下一关`);
      }

      function clearEndgameResidualTiles(guideTileId) {
        const residualIds = model.state.endgameSettlement?.residualTileIds ?? [...model.state.slot];
        for (const tileId of residualIds) {
          const tile = findTile(tileId);
          if (tile) tile.location = "removed";
        }
        model.state.slot = [];
        model.state.endgameSettlement = null;
        model.state.endgamePrimerSelecting = false;
        return guideTileId;
      }

      function applyPendingGuideTileToLevel() {
        const guide = model.run.pendingGuideTile;
        if (!guide) return;
        if (model.state.slot.length >= model.state.slotLimit) return;
        const guideId = `guide-${model.levelIndex + 1}-${model.run.guideSerial + 1}`;
        model.run.guideSerial += 1;
        const guideTile = {
          id: guideId,
          suit: guide.suit,
          rank: guide.rank,
          x: 0,
          y: 0,
          layer: 0,
          blockedBy: [],
          location: "slot",
          sourcePackage: "endgame-guide",
        };
        model.state.tiles.push(guideTile);
        model.state.slot.push(guideId);
        model.state.guideTileApplied = { ...guide };
        model.run.pendingGuideTile = null;
      }

      function failLevel() {
        model.state.phase = "failed";
        model.state.history = [];
        showLevelFailed();
      }

      // Failure handling stays intentionally minimal in the playable prototype.

      function showLevelFailed() {
        setRewardOverlayMode("failure");
        view.status.textContent = "";
        renderAll("");
        view.failureTitle.textContent = "失败";
        view.runComplete.classList.remove("show");
        view.runComplete.innerHTML = "";
        view.rewardGrid.innerHTML = "";
        view.rewardGrid.style.display = "none";
        view.failureActions.innerHTML = "";
        const restart = document.createElement("button");
        restart.className = "primary-button";
        restart.type = "button";
        restart.textContent = "重开";
        restart.addEventListener("click", () => {
          view.rewardOverlay.classList.remove("show");
          loadLevel(model.levelIndex);
        });
        view.failureActions.replaceChildren(restart);
        view.rewardOverlay.classList.add("show");
        emitShellEvent("hulebu:run-failed");
      }

      function pickReward(reward) {
        for (const effect of reward.effects) {
          if (effect.type === "slot_limit_delta") {
            const baseLimit = model.levelsConfig.defaults.slotLimit;
            model.run.slotDelta = clampSlotLimit(baseLimit + model.run.slotDelta + effect.value) - baseLimit;
          }
          if (effect.type === "reserve_limit_delta") model.run.reserveDelta += effect.value;
          if (effect.type === "river_limit_delta" && model.state) model.state.riverLimit = Math.max(1, (model.state.riverLimit ?? DEFAULT_RIVER_LIMIT) + effect.value);
          if (effect.type === "shield_delta") model.run.shieldsDelta += effect.value;
          if (effect.type === "coin_delta") model.run.coins = Math.max(0, model.run.coins + effect.value);
          if (effect.type === "tool_delta") model.run.tools[effect.tool] = Math.max(0, model.run.tools[effect.tool] + effect.value);
          if (effect.type === "combo_score_bonus") model.run.bonuses[effect.combo] += effect.value;
        }
        model.run.pickedRewards.push(reward.id);
        view.rewardOverlay.classList.remove("show");
        if (isEndlessMode()) {
          advanceAfterEndlessClear();
          return;
        }
        loadLevel(getNextLevelIndex(), { resetFixedMountainTemplate: true });
      }

      function advanceAfterClear() {
        if (isEndlessMode()) {
          if (model.state?.phase === "won" && shouldOfferRewardAfterLevel(model.levelIndex)) {
            showRewards();
            return;
          }
          advanceAfterEndlessClear();
          return;
        }

        if (isDailyMode() && model.state?.phase === "won" && shouldOfferRewardAfterLevel(model.levelIndex)) {
          showRewards();
          return;
        }

        if (model.state?.phase === "playing") {
          loadLevel(getNextLevelIndex(), { resetFixedMountainTemplate: true });
          return;
        }

        if (model.state?.phase === "won" && shouldOfferRewardAfterLevel(model.levelIndex)) {
          showRewards();
          return;
        }

        loadLevel(getNextLevelIndex(), { resetFixedMountainTemplate: true });
      }

      function advanceAfterEndlessClear() {
        model.run.endlessLayer = getEndlessLayerOrder() + 1;
        loadLevel(getEndlessLevelIndex(), { resetFixedMountainTemplate: true, forceResetMountainTemplate: true });
      }

      function restartRun() {
        model.run = {
          slotDelta: 0,
          reserveDelta: 0,
          shieldsDelta: 0,
          coins: 0,
          tools: { shuffle: 0, undo: 0, discard: 0, vision: 0 },
          bonuses: { chi: 0, peng: 0, gang: 0, hu: 0 },
          pickedRewards: [],
          pendingGuideTile: null,
          guideSerial: 0,
          specialEventsSeen: [],
          pendingSpecialEvent: null,
          pendingLevelModifier: null,
          lastSpecialEventMessage: "",
          endlessLayer: isEndlessMode() ? getEndlessLayerOrder() : ENDLESS_START_LAYER,
          dailySeed: model.run.dailySeed,
          dailyParticipationStreak: model.run.dailyParticipationStreak,
        };
        model.loadingLevelModifier = null;
        view.rewardOverlay.classList.remove("show");
        loadLevel(isEndlessMode() ? getEndlessLevelIndex() : 0, { resetFixedMountainTemplate: true, forceResetMountainTemplate: true });
      }

      function checkDanger() {
        if (model.state.slot.length < model.state.slotLimit) return null;
        if (getComboCandidates().length > 0) return null;
        if (model.state.reserve.length < model.state.reserveLimit) {
          const movedId = model.state.slot.pop();
          const moved = findTile(movedId);
          moved.location = "reserve";
          model.state.reserve.push(movedId);
          return `${tileLabel(moved)} 移入备用槽`;
        }
        if (model.state.shields > 0) {
          const removedId = model.state.slot.shift();
          const removed = findTile(removedId);
          removed.location = "removed";
          model.state.shields -= 1;
          return `护符救场：${tileLabel(removed)} 已移除`;
        }
        if (canUseRiverDiscard()) {
          return "主槽已满，请先发动组合，或点击丢弃打牌到牌河。";
        }
        failLevel();
        return "";
      }

      function getComboCandidates() {
        const slotTiles = model.state.slot.map(findTile).filter((tile) => tile?.location === "slot");
        const candidates = [];
        const huCandidate = getHuCandidate(slotTiles);
        if (huCandidate) candidates.push(huCandidate);
        candidates.push(...getSupplementalGangCandidates(slotTiles));
        const bySuitRank = new Map();

        for (const tile of slotTiles) {
          const key = `${tile.suit}-${tile.rank}`;
          const group = bySuitRank.get(key) ?? [];
          group.push(tile);
          bySuitRank.set(key, group);
        }

        for (const group of bySuitRank.values()) {
          if (group.length >= 4) candidates.push(makeCandidate("gang", group.slice(0, 4)));
          if (group.length >= 3) candidates.push(makeCandidate("peng", group.slice(0, 3)));
        }

        for (const suit of NUMBER_SUITS) {
          const byRank = new Map();
          for (const tile of slotTiles) {
            if (tile.suit !== suit) continue;
            const group = byRank.get(tile.rank) ?? [];
            group.push(tile);
            byRank.set(tile.rank, group);
          }

          for (let rank = 1; rank <= 7; rank += 1) {
            const first = byRank.get(rank)?.[0];
            const second = byRank.get(rank + 1)?.[0];
            const third = byRank.get(rank + 2)?.[0];
            if (first && second && third) candidates.push(makeCandidate("chi", [first, second, third]));
          }
        }

        const seen = new Set();
        return candidates
          .filter((candidate) => {
            if (seen.has(candidate.key)) return false;
            seen.add(candidate.key);
            return true;
          })
          .filter((candidate) => !isFriendDemoTutorialLevel() || candidate.type === getFriendDemoTutorialRequiredCombo())
          .sort((a, b) => COMBO_ORDER[a.type] - COMBO_ORDER[b.type] || a.key.localeCompare(b.key));
      }

      function getHuCandidate(slotTiles) {
        if (slotTiles.length !== MAX_SLOT_LIMIT) return null;
        const groups = findHuGroups(slotTiles);
        if (!groups) return null;
        const ids = new Set(groups.flat().map((tile) => tile.id));
        return makeCandidate("hu", slotTiles.filter((tile) => ids.has(tile.id)));
      }

      function findHuGroups(tiles) {
        for (let pairStart = 0; pairStart < tiles.length - 1; pairStart += 1) {
          for (let pairEnd = pairStart + 1; pairEnd < tiles.length; pairEnd += 1) {
            if (!isSameTile(tiles[pairStart], tiles[pairEnd])) continue;

            const pairIds = new Set([tiles[pairStart].id, tiles[pairEnd].id]);
            const remaining = tiles.filter((tile) => !pairIds.has(tile.id));
            for (const firstSet of findMelds(remaining)) {
              const firstIds = new Set(firstSet.map((tile) => tile.id));
              const secondRemaining = remaining.filter((tile) => !firstIds.has(tile.id));
              const secondSet = findMelds(secondRemaining)[0];
              if (secondSet && secondSet.length === secondRemaining.length) {
                return [firstSet, secondSet, [tiles[pairStart], tiles[pairEnd]]];
              }
            }
          }
        }

        return null;
      }

      function findMelds(tiles) {
        const melds = [];
        const bySuitRank = new Map();
        for (const tile of tiles) {
          const key = `${tile.suit}-${tile.rank}`;
          const group = bySuitRank.get(key) ?? [];
          group.push(tile);
          bySuitRank.set(key, group);
        }

        for (const group of bySuitRank.values()) {
          if (group.length >= 3) melds.push(group.slice(0, 3));
        }

        for (const suit of NUMBER_SUITS) {
          const byRank = new Map();
          for (const tile of tiles) {
            if (tile.suit !== suit) continue;
            const group = byRank.get(tile.rank) ?? [];
            group.push(tile);
            byRank.set(tile.rank, group);
          }

          for (let rank = 1; rank <= 7; rank += 1) {
            const first = byRank.get(rank)?.[0];
            const second = byRank.get(rank + 1)?.[0];
            const third = byRank.get(rank + 2)?.[0];
            if (first && second && third) melds.push([first, second, third]);
          }
        }

        return melds;
      }

      function makeCandidate(type, tiles) {
        const tileIds = tiles.map((tile) => tile.id);
        return {
          type,
          tileIds,
          suit: tiles[0].suit,
          tileKey: getTileKey(tiles[0]),
          labels: tiles.map(tileLabel),
          key: `${type}:${tileIds.slice().sort().join(",")}`,
        };
      }

      function getComboSuit(candidate) {
        return candidate.suit ?? findTile(candidate.tileIds[0])?.suit ?? "wan";
      }

      function getRemainingTileCounts() {
        const counts = createEmptySuitCounts();
        for (const tile of model.state.tiles) {
          if (tile.location !== "board") continue;
          counts[tile.suit].total += 1;
          counts[tile.suit].ranks[tile.rank] += 1;
        }
        return counts;
      }

      function createEmptySuitCounts() {
        const counts = {};
        for (const suit of ALL_SUITS) {
          counts[suit] = emptySuitCount();
        }
        return counts;
      }

      function createEmptySuitTotals() {
        const counts = {};
        for (const suit of ALL_SUITS) {
          counts[suit] = 0;
        }
        return counts;
      }

      function emptySuitCount() {
        const ranks = {};
        for (let rank = 1; rank <= 9; rank += 1) ranks[rank] = 0;
        return { total: 0, ranks };
      }

      function clampSlotLimit(value) {
        return Math.max(1, Math.min(MAX_SLOT_LIMIT, value));
      }

      function isVisibleStackTop(tile) {
        if (!tile.stackColumn || tile.location !== "board") return true;
        return getStackColumnTiles(tile).every((other) => other.id === tile.id || getTileStackOrder(other) < getTileStackOrder(tile));
      }

      function isVisibleStackDisplayTile(tile) {
        if (!tile.stackColumn || tile.location !== "board") return true;
        return getStackPreviewDepth(tile) <= getStackVisiblePreviewDepth(tile);
      }

      function getStackPreviewDepth(tile) {
        if (!tile.stackColumn || tile.location !== "board") return 0;
        return getStackPreviewDepthForTiles(tile, model.state.tiles);
      }

      function getStackPreviewDepthForTiles(tile, tiles) {
        if (!tile.stackColumn) return 0;
        return tiles.filter((other) => (
          (!other.location || other.location === "board")
          && other.stackColumn
          && other.stackColumnId === tile.stackColumnId
          && getTileStackOrder(other) > getTileStackOrder(tile)
        )).length;
      }

      function getHiddenStackDepth(tile) {
        if (!tile.stackColumn || !isVisibleStackTop(tile)) return 0;
        return getStackColumnTiles(tile).filter((other) => getTileStackOrder(other) < getTileStackOrder(tile)).length;
      }

      function getStackColumnTiles(tile) {
        return model.state.tiles.filter((other) => (
          other.location === "board"
          && other.stackColumn
          && other.stackColumnId === tile.stackColumnId
        ));
      }

      function getBridgeUnlockCount(tile) {
        if (!tile.stackBridge) return 0;
        const tilesWithoutBridge = model.state.tiles.map((other) => (
          other.id === tile.id ? { ...other, location: "slot" } : other
        ));
        return model.state.tiles.filter((other) => {
          if (other.location !== "board" || !other.stackColumn || !isVisibleStackTop(other)) return false;
          if (!(other.blockedBy ?? []).includes(tile.id)) return false;
          if (!getMountainVisualIntersectionRect(other, tile, model.state.tiles)) return false;
          if (!isTileBlocked(other.id)) return false;
          return !isTileBlockedInTiles(other.id, tilesWithoutBridge);
        }).length;
      }

      function isTileBlocked(tileId) {
        return isTileBlockedInTiles(tileId, model.state.tiles);
      }

      function isTileBlockedInTiles(tileId, tiles) {
        const originalTiles = model.state.tiles;
        if (tiles !== originalTiles) model.state.tiles = tiles;
        const result = isTileBlockedForCurrentState(tileId);
        if (tiles !== originalTiles) model.state.tiles = originalTiles;
        return result;
      }

      function isTileBlockedForCurrentState(tileId) {
        const tile = findTile(tileId);
        if (!tile || tile.location !== "board") return false;
        if (tile.looseMountainTile) return false;
        if (tile.stackColumn && !isVisibleStackTop(tile)) return true;
        if (isTileCoveredByHigherTile(tile)) return true;
        return tile.blockedBy.some((blockerId) => {
          const blocker = findTile(blockerId);
          if (!blocker || blocker.location !== "board") return false;
          if (model.mode !== "mountain") return true;
          const rect = getMountainVisualIntersectionRect(tile, blocker, model.state.tiles);
          const { width, height } = getMountainRuleTileSize();
          return Boolean(rect) && getUnionArea([rect]) / (width * height) >= BLOCKED_COVER_RATIO;
        });
      }

      function getCurrentCoverRatio(tile) {
        if (tile.looseMountainTile) return 0;
        const tileIndex = model.state.tiles.findIndex((item) => item.id === tile.id);
        const tileOrder = getTileStackOrder(tile, tileIndex);
        const { width, height } = getRuleTileSize();
        const coverRects = [];

        model.state.tiles.forEach((other, otherIndex) => {
          if (other.id === tile.id || other.location !== "board") return;
          if (getTileStackOrder(other, otherIndex) <= tileOrder) return;

          const rect = model.mode === "mountain"
            ? getMountainVisualIntersectionRect(tile, other, model.state.tiles)
            : getIntersectionRect(tile, other, width, height);
          if (rect) coverRects.push(rect);
        });

        return getUnionArea(coverRects) / (width * height);
      }

      function isTileCoveredByHigherTile(tile) {
        if (tile.looseMountainTile) return false;
        const tileIndex = model.state.tiles.findIndex((item) => item.id === tile.id);
        const tileOrder = getTileStackOrder(tile, tileIndex);

        return model.state.tiles.some((other, otherIndex) => {
          if (other.id === tile.id || other.location !== "board") return false;
          if (getTileStackOrder(other, otherIndex) <= tileOrder) return false;
          const { width, height } = getRuleTileSize();
          if (model.mode === "mountain") {
            const rect = getMountainVisualIntersectionRect(tile, other, model.state.tiles);
            return Boolean(rect) && getUnionArea([rect]) / (width * height) >= BLOCKED_COVER_RATIO;
          }
          return Boolean(getIntersectionRect(tile, other, width, height));
        });
      }

      function getMountainRuleTileSize() {
        return MOUNTAIN_RULE_TILE_SIZE;
      }

      function getRuleTileSize() {
        if (model.mode === "mountain") return getMountainRuleTileSize();
        const { tileWidth, tileHeight } = model.levelsConfig.coordinateSystem;
        return { width: tileWidth, height: tileHeight };
      }

      function syncTileLocations() {
        for (const tileId of model.state.slot) {
          const tile = findTile(tileId);
          if (tile) tile.location = "slot";
        }
        for (const tileId of model.state.reserve) {
          const tile = findTile(tileId);
          if (tile) tile.location = "reserve";
        }
        for (const tileId of model.state.river ?? []) {
          const tile = findTile(tileId);
          if (tile) tile.location = "river";
        }
      }

      function isLevelClear() {
        return model.state.tiles.every((tile) => tile.location !== "board");
      }

      function canClearCurrentLevel() {
        if (isAscensionMode()) return true;
        return hasCompletedFriendDemoTutorialCombo(model.levelIndex);
      }

      function isFriendDemoTutorialLevel(levelIndex = model.levelIndex) {
        return isFriendDemoMode() && !isAscensionMode() && getFriendDemoLevelMode(levelIndex) === "tutorial";
      }

      function getCurrentClearRequirementText() {
        if (isAscensionMode()) return "";
        const requiredCombo = getFriendDemoTutorialRequiredCombo(model.levelIndex);
        if (!requiredCombo) return "";
        return `教学目标：请点击 ${TYPE_LABELS[requiredCombo]} 完成本关。`;
      }

      function isBossGoalComplete() {
        const goals = model.state.bossGoals ?? [];
        if (goals.length === 0) return true;
        return goals.every(isBossGoalItemComplete);
      }

      function getBossGoalProgressKeys(goal) {
        if (goal.type === "combo_count") return [`combo:${goal.combo}`];
        if (goal.type === "suit_set") return goal.suits.map((suit) => `suit:${suit}`);
        if (goal.type === "score_target") return ["score"];
        return [];
      }

      function formatBossGoalProgress(goal) {
        if (goal.type === "suit_set") {
          return `三门齐 ${goal.suits.map((suit) => `${SUIT_LABELS[suit]} ${model.state.suitComboCounts[suit] ?? 0}/${goal.eachTarget}`).join(" · ")}`;
        }

        const current = getBossGoalCurrentValue(goal);
        if (goal.type === "combo_count") {
          return `${TYPE_LABELS[goal.combo]} ${current}/${goal.target}`;
        }
        return `积分 ${current}/${goal.target}`;
      }

      function isBossGoalItemComplete(goal) {
        if (goal.type === "suit_set") {
          return goal.suits.every((suit) => (model.state.suitComboCounts[suit] ?? 0) >= goal.eachTarget);
        }
        return getBossGoalCurrentValue(goal) >= goal.target;
      }

      function getBossGoalCurrentValue(goal) {
        if (goal.type === "combo_count") return model.state.comboCounts[goal.combo] ?? 0;
        if (goal.type === "score_target") return model.state.score;
        return 0;
      }

      function currentLevel() {
        return model.levelsConfig.levels[model.levelIndex];
      }

      function isLastLevel() {
        if (isEndlessMode()) return false;
        return model.levelIndex >= getPlayableLevelCount() - 1;
      }

      function getNextLevelIndex() {
        if (isEndlessMode()) return getEndlessLevelIndex(getEndlessLayerOrder() + 1);
        return Math.min(model.levelIndex + 1, getPlayableLevelCount() - 1);
      }

      function getRewardPoolForCurrentLevel() {
        if (isFriendDemoMode() || isEndlessMode()) {
          return getFriendDemoRewardPool(model.levelIndex);
        }
        return currentLevel().rewardPool;
      }

      function shouldOfferRewardAfterLevel(levelIndex) {
        if (isEndlessMode()) {
          return getEndlessLayerOrder() % 3 === 0;
        }
        if (isFriendDemoMode()) {
          return FRIEND_DEMO_REWARD_LEVEL_INDEXES.includes(levelIndex);
        }
        const order = model.levelsConfig.levels[levelIndex].order;
        const chapterStep = order % 10;
        return chapterStep === 3 || chapterStep === 6 || chapterStep === 9;
      }

      function isBossLevel(levelIndex = model.levelIndex) {
        if (isEndlessMode()) return getEndlessLayerOrder() % 5 === 0;
        return model.levelsConfig.levels[levelIndex].order % 10 === 0;
      }

      function getActiveBossGoals(levelIndex = model.levelIndex) {
        if (isEndlessMode()) return getEndlessBossGoals();
        const friendDemoTrialGoals = getFriendDemoBossTrialGoals(levelIndex);
        if (friendDemoTrialGoals) return friendDemoTrialGoals;
        const friendDemoFinalBossGoals = getFriendDemoFinalBossGoals(levelIndex);
        if (friendDemoFinalBossGoals) return friendDemoFinalBossGoals;
        if (getFriendDemoDifficultyProfile(levelIndex)) return [];
        return getBossGoals(levelIndex) ?? [];
      }

      function getBossGoals(levelIndex) {
        if (!isBossLevel(levelIndex)) return null;
        const level = model.levelsConfig.levels[levelIndex];
        if (isDailyMode()) {
          const mutator = getDailyMutatorProfile();
          const pack = getDailyBossPack(levelIndex);
          const isFinalDailyBoss = level.order >= 20;
          const baseGoals = Array.isArray(level.bossGoals) && level.bossGoals.length > 0
            ? level.bossGoals.map((goal) => (
              goal.type === "score_target"
                ? { ...goal, target: goal.target + pack.scoreDelta }
                : { ...goal }
            ))
            : [
              { type: "combo_count", combo: "gang", target: level.order >= 20 ? 2 : 1 },
              { type: "combo_count", combo: "peng", target: level.order >= 20 ? 2 : 1 },
              { type: "score_target", target: (level.order >= 20 ? 190 : 150) + pack.scoreDelta },
            ];
          const normalizedBaseGoals = baseGoals.map((goal) => {
            if (isFinalDailyBoss && goal.type === "combo_count" && goal.combo === "peng") {
              return { ...goal, target: 1 };
            }
            if (isFinalDailyBoss && goal.type === "score_target") {
              return { ...goal, target: Math.min(goal.target ?? 0, 186) };
            }
            return goal;
          });
          const mutatorFeaturedCombos = isFinalDailyBoss
            ? (mutator?.featuredCombos ?? []).filter((combo) => combo === "hu" || combo === "gang").slice(0, 1)
            : (mutator?.featuredCombos ?? []).slice(0, 2);
          const mutatorComboGoals = mutatorFeaturedCombos.map((combo) => ({
            type: "combo_count",
            combo,
            target: combo === "peng" && level.order >= 20 ? 1 : 1,
          }));
          const normalizedPackBonusGoals = (pack.bonusGoals ?? []).flatMap((goal) => {
            if (!isFinalDailyBoss) return [{ ...goal }];
            if (goal.type === "combo_count" && goal.combo !== "hu" && goal.combo !== "gang") return [];
            if (goal.type === "combo_count" && goal.combo === "gang") {
              return [{ ...goal, target: 1 }];
            }
            return [{ ...goal }];
          });
          return mergeBossGoals([
            ...normalizedBaseGoals,
            ...mutatorComboGoals,
            ...normalizedPackBonusGoals,
          ]);
        }
        if (Array.isArray(level.bossGoals) && level.bossGoals.length > 0) {
          if (!isAscensionMode()) return level.bossGoals;
          const bossPack = getAscensionBossPack(levelIndex);
          const boostedGoals = level.bossGoals.map((goal) => (
            goal.type === "score_target"
              ? { ...goal, target: goal.target + bossPack.scoreDelta }
              : { ...goal }
          ));
          return mergeBossGoals([
            ...boostedGoals,
            ...(getAscensionBuildFocus()?.extraBossGoals ?? []),
            ...(bossPack.bonusGoals ?? []),
          ]);
        }

        const chapter = Math.max(1, Math.ceil(level.order / 10));
        const baseGoals = [
          { type: "combo_count", combo: "gang", target: chapter },
          { type: "combo_count", combo: "peng", target: chapter + 1 },
          { type: "score_target", target: 100 + chapter * 20 },
        ];
        if (!isAscensionMode()) return baseGoals;
        const bossPack = getAscensionBossPack(levelIndex);
        const boostedGoals = baseGoals.map((goal) => (
          goal.type === "score_target"
            ? { ...goal, target: goal.target + bossPack.scoreDelta }
            : { ...goal }
        ));
        return mergeBossGoals([
          ...boostedGoals,
          ...(getAscensionBuildFocus()?.extraBossGoals ?? []),
          ...(bossPack.bonusGoals ?? []),
        ]);
      }

      function getEndlessBossGoals() {
        if (!isBossLevel()) return [];
        const layer = getEndlessLayerOrder();
        const chapterProfile = getEndlessChapterProfile(layer);
        const chapter = chapterProfile?.chapter ?? Math.max(1, Math.floor((layer - ENDLESS_START_LAYER) / 5) + 1);
        const phase = chapterProfile?.phase ?? 1;
        const chapterBossHasGangGoal = (chapterProfile?.bossGoals ?? []).some((goal) => goal.type === "combo_count" && goal.combo === "gang");
        const chapterBossComboGoalCount = (chapterProfile?.bossGoals ?? []).filter((goal) => goal.type === "combo_count").length;
        const shouldAddEndlessPengGoal = phase >= 4 && phase < 6 && chapterBossComboGoalCount < 2;
        const endlessScoreTarget = 164 + chapter * 16;
        const goals = [
          { type: "combo_count", combo: "gang", target: layer % 10 === 0 && !chapterBossHasGangGoal ? 2 : 1 },
          { type: "score_target", target: endlessScoreTarget },
        ];
        if (layer % 10 === 0) goals.splice(1, 0, { type: "combo_count", combo: "hu", target: 1 });
        if (shouldAddEndlessPengGoal) goals.splice(1, 0, { type: "combo_count", combo: "peng", target: 1 });
        if (phase === 7 && chapter < 7) goals.push({ type: "combo_count", combo: "chi", target: 1 });
        if (chapterProfile?.bossGoals?.length) goals.push(...chapterProfile.bossGoals.map((goal) => ({ ...goal })));
        return mergeBossGoals(goals);
      }

      function findTile(tileId) {
        return model.state.tiles.find((tile) => tile.id === tileId);
      }

      function getBoardTiles() {
        return model.state.tiles.filter((tile) => tile.location === "board");
      }

      function findReward(rewardId) {
        if (rewardId === FRIEND_DEMO_FIRST_REWARD_ID) return createFriendDemoFixedReward();
        if (rewardId === FRIEND_DEMO_DISCARD_REWARD_ID) return createFriendDemoDiscardReward();
        if (rewardId.startsWith("ascension_")) return createAscensionReward(rewardId);
        return model.rewardsConfig.rewards.find((reward) => reward.id === rewardId);
      }

      function tileLabel(tile) {
        return getTileLabel(tile);
      }

      function getTileKey(tile) {
        return `${tile.suit}-${tile.rank}`;
      }

      function getTileLabel(tile) {
        if (tile.suit === "honor") return HONOR_LABELS[tile.rank] ?? `字${tile.rank}`;
        return `${tile.rank}${SUIT_LABELS[tile.suit]}`;
      }

      function getTileAssetUrl(tile) {
        if (tile.suit === "honor") {
          const honorName = HONOR_ASSET_NAMES[tile.rank];
          return honorName ? `${UI_SKIN_ASSET_ROOT}/tiles/mahjong/honor/tile_honor_${honorName}.png` : null;
        }
        const suitName = TILE_ASSET_SUITS[tile.suit];
        return suitName ? `${UI_SKIN_ASSET_ROOT}/tiles/mahjong/${suitName}/tile_${suitName}_${String(tile.rank).padStart(2, "0")}.png` : null;
      }

      function appendTileFace(container, tile, options = {}) {
        container.dataset.uiSkin = UI_SKIN_VERSION;
        const assetUrl = getTileAssetUrl(tile);
        const fallback = document.createElement("span");
        fallback.className = "tile-face-fallback";
        fallback.innerHTML = getTileFaceHtml(tile);
        if (!assetUrl) {
          container.dataset.imageMissing = "true";
          container.append(fallback);
          return;
        }
        const image = document.createElement("img");
        image.className = "tile-face-image";
        image.alt = "";
        image.decoding = "async";
        image.loading = options.compact ? "eager" : "lazy";
        image.src = assetUrl;
        image.addEventListener("error", () => {
          container.dataset.imageMissing = "true";
          image.remove();
        }, { once: true });
        container.append(image, fallback);
      }

      function appendTileMiniFace(container, tile) {
        container.classList.add("tile-mini");
        appendTileFace(container, tile, { compact: true });
      }

      function getComboButtonAssetUrl(type, active) {
        const assetName = COMBO_BUTTON_ASSETS[type];
        if (!assetName) return "";
        const stateName = active ? "fire" : "normal";
        return `${UI_SKIN_ASSET_ROOT}/buttons/combo/${assetName}_${stateName}.png`;
      }

      function applyToolButtonSkins() {
        const entries = [
          [view.shuffleButton, TOOL_BUTTON_ASSETS.shuffle],
          [view.undoButton, TOOL_BUTTON_ASSETS.undo],
          [view.discardButton, TOOL_BUTTON_ASSETS.discard],
        ];
        for (const [button, assetName] of entries) {
          if (!button || !assetName) continue;
          button.dataset.uiSkin = UI_SKIN_VERSION;
          button.style.setProperty("--ui-image", `url("${UI_SKIN_ASSET_ROOT}/buttons/tools/${assetName}.png")`);
        }
      }

      function getTileFaceHtml(tile) {
        if (tile.suit === "honor") {
          return `${escapeHtml(getTileLabel(tile))}<span class="suit">字</span>`;
        }
        return `${tile.rank}<span class="suit">${SUIT_LABELS[tile.suit]}</span>`;
      }

      function escapeHtml(text) {
        return text.replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        })[char]);
      }
    </script>
  </body>
</html>
