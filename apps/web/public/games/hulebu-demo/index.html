<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>胡了卜玩家试玩</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f1e5;
        --ink: #221912;
        --muted: #755f4d;
        --panel: #fffaf0;
        --line: #d8b98b;
        --jade: #1f8a70;
        --jade-dark: #12624f;
        --vermilion: #c83d2f;
        --gold: #d59a2f;
        --tile: #fff8e7;
        --tile-edge: #b88245;
        --slot: #4a2d1f;
        --shadow: 0 18px 42px rgba(87, 55, 29, 0.18);
        --tile-w: 12.5806451613%;
        --overlay-z: 1000000;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background:
          radial-gradient(circle at 20% 0%, rgba(31, 138, 112, 0.16), transparent 28rem),
          linear-gradient(135deg, #f7f1e5 0%, #f0ddbf 54%, #ebc887 100%);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      select,
      input {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 500px) 320px;
        justify-content: center;
        gap: 18px;
        padding: 18px;
      }

      body.play-view .app {
        grid-template-columns: minmax(0, 480px) 72px;
        align-items: start;
        gap: 8px;
        padding: 3px;
      }

      .play {
        display: grid;
        grid-template-rows: auto minmax(260px, 1fr) auto;
        gap: 14px;
        min-width: 0;
      }

      body.play-view .play {
        grid-template-rows: auto auto auto auto auto;
        grid-auto-rows: auto;
        align-content: start;
        gap: 3px;
      }

      .topbar,
      .play-hud,
      .side,
      .board-wrap,
      .counter-section,
      .meld-river-panel,
      .slot-area {
        border: 1px solid rgba(90, 54, 22, 0.2);
        background: rgba(255, 250, 240, 0.9);
        box-shadow: var(--shadow);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 16px;
      }

      body.play-view .topbar {
        display: none;
      }

      body.play-view.embed-shell .app {
        padding-top: 12px;
      }

      .brand {
        display: grid;
        gap: 2px;
      }

      .brand strong {
        font-size: clamp(22px, 3vw, 34px);
        line-height: 1;
        letter-spacing: 0;
      }

      body.play-view .brand strong {
        font-size: clamp(16px, 1.9vw, 20px);
      }

      body.play-view .brand span {
        display: none;
      }

      body.play-view .brand span {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .brand span {
        color: var(--muted);
        font-size: 13px;
      }

      body.play-view .brand span {
        font-size: 10px;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .top-controls {
        min-width: 0;
        width: min(680px, 62vw);
        display: grid;
        gap: 8px;
      }

      body.play-view .top-controls,
      body.play-view .tuning-panel,
      body.tuner-view .topbar-actions {
        display: none !important;
      }

      [hidden] {
        display: none !important;
      }

      .mode-switch {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
        padding: 4px;
        border: 1px solid rgba(90, 54, 22, 0.2);
        background: #f7e2b8;
      }

      .mode-button {
        min-height: 34px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
      }

      .mode-button.active {
        background: var(--jade-dark);
        color: white;
      }

      .level-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 0;
        scrollbar-width: thin;
      }

      .level-tab {
        width: 46px;
        height: 38px;
        flex: 0 0 auto;
        border: 1px solid rgba(90, 54, 22, 0.2);
        background: #f7e2b8;
        color: var(--ink);
        font-weight: 800;
      }

      .level-tab.active {
        background: var(--jade);
        color: white;
      }

      .board-wrap {
        min-height: 0;
        padding: 14px;
      }

      body.play-view .board-wrap {
        padding: 4px;
      }

      .board {
        position: relative;
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        aspect-ratio: 620 / 360;
        overflow: hidden;
        border: 1px solid rgba(67, 42, 23, 0.25);
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px),
          linear-gradient(0deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px),
          linear-gradient(145deg, #2f6f5c, #163d35 62%, #402818);
        background-size: 31px 31px, 31px 31px, auto;
      }

      .board::before {
        content: "";
        position: absolute;
        inset: 7% 9% 12%;
        border: 2px solid rgba(255, 255, 255, 0.15);
        background: rgba(0, 0, 0, 0.08);
        transform: skewX(-8deg);
        pointer-events: none;
      }

      .board[data-mode="mountain"] {
        width: min(100%, 560px, 68vh);
        max-width: 560px;
        aspect-ratio: 560 / 640;
        background-size: 18px 18px, 18px 18px, auto;
      }

      body.play-view .board[data-mode="mountain"] {
        width: min(100%, 330px);
        max-width: 330px;
      }

      .play-hud {
        display: none;
      }

      body.play-view .play-hud {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 2px;
        padding: 2px;
      }

      body.play-view .hud-chip {
        min-height: 24px;
        padding: 2px 3px;
      }

      body.play-view .hud-chip span {
        font-size: 8px;
      }

      body.play-view .hud-chip strong {
        font-size: 11px;
      }

      .hud-chip {
        min-width: 0;
        min-height: 42px;
        display: grid;
        align-content: center;
        gap: 2px;
        border: 1px solid rgba(90, 54, 22, 0.18);
        background: rgba(255, 245, 223, 0.86);
        padding: 5px 7px;
      }

      .hud-chip span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        line-height: 1;
      }

      .hud-chip strong {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 15px;
        line-height: 1.2;
      }

      .board.boss {
        border-color: rgba(200, 61, 47, 0.72);
        box-shadow:
          inset 0 0 0 3px rgba(200, 61, 47, 0.28),
          0 0 28px rgba(200, 61, 47, 0.28);
      }

      .board[data-mode="mountain"] .tile {
        width: 11.4285714286%;
        aspect-ratio: 52 / 70;
        border-width: 1px;
        border-bottom-width: 3px;
        font-size: clamp(11px, 1.65vw, 18px);
        box-shadow:
          0 5px 0 rgba(107, 72, 38, 0.34),
          0 9px 12px rgba(23, 15, 9, 0.22);
      }

      .tile {
        position: absolute;
        width: var(--tile-w);
        aspect-ratio: 64 / 86;
        display: grid;
        place-items: center;
        border: 2px solid var(--tile-edge);
        border-bottom-width: 6px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(255, 248, 231, 0.88)),
          var(--tile);
        color: var(--ink);
        font-weight: 900;
        font-size: clamp(14px, 2.7vw, 28px);
        line-height: 1;
        text-shadow: 0 1px 0 white;
        box-shadow:
          0 12px 0 rgba(107, 72, 38, 0.38),
          0 18px 20px rgba(23, 15, 9, 0.3);
        transition: transform 150ms ease, opacity 150ms ease, filter 150ms ease;
      }

      .tile[data-ui-skin="v6"] {
        border: 0;
        border-bottom-width: 0;
        background: transparent;
        color: transparent;
        text-shadow: none;
        box-shadow: none;
        overflow: visible;
      }

      .board[data-mode="mountain"] .tile[data-ui-skin="v6"] {
        border: 0;
        border-bottom-width: 0;
        background: transparent;
        box-shadow: none;
      }

      .tile[data-ui-skin="v6"]::before {
        display: none;
      }

      .tile-face-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        filter: none;
      }

      .tile-face-fallback {
        position: absolute;
        inset: 9% 10% 12%;
        display: grid;
        place-items: center;
        border: 1px solid rgba(184, 130, 69, 0.45);
        color: var(--ink);
        font-weight: 900;
        text-shadow: 0 1px 0 white;
      }

      .tile[data-ui-skin="v6"] .tile-face-fallback {
        opacity: 0;
      }

      [data-ui-skin="v6"] > .tile-face-fallback {
        display: none;
      }

      .tile[data-ui-skin="v6"][data-image-missing="true"] {
        border: 2px solid var(--tile-edge);
        border-bottom-width: 6px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(255, 248, 231, 0.88)),
          var(--tile);
        color: var(--ink);
      }

      .tile[data-ui-skin="v6"][data-image-missing="true"] .tile-face-fallback {
        opacity: 1;
      }

      .tile::before {
        content: "";
        position: absolute;
        inset: 7px;
        border: 1px solid rgba(184, 130, 69, 0.45);
        pointer-events: none;
      }

      .board[data-mode="mountain"] .tile::before {
        inset: 4px;
      }

      .tile.stack-top::after {
        content: "";
        position: absolute;
        top: -8px;
        left: 10%;
        right: 10%;
        height: 5px;
        border: 1px solid rgba(67, 42, 23, 0.42);
        border-bottom: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(64, 42, 24, 0.34) 0 1px,
          rgba(255, 248, 231, 0.96) 1px 2px
        );
        box-shadow: 0 2px 0 rgba(107, 72, 38, 0.2);
        pointer-events: none;
      }

      .board[data-mode="mountain"] .tile.stack-top::after {
        display: none;
      }

      .tile[data-ui-skin="v6"].stack-top::after,
      .tile[data-ui-skin="v6"].stack-preview::after,
      .tile[data-ui-skin="v6"].stack-bridge::after {
        content: none;
        display: none;
      }

      body.tuner-view .board[data-mode="mountain"] .tile.stack-top::after {
        content: attr(data-stack-depth);
        top: -6px;
        right: -5px;
        width: 16px;
        height: 16px;
        border-radius: 5px;
        font-size: 9px;
        background: #ffd46c;
      }

      .tile.available:hover {
        transform: translate(var(--lift-x), calc(var(--lift-y) - 5px));
        filter: brightness(1.08);
      }

      .tile.blocked {
        opacity: 0.44;
        filter: grayscale(0.55);
      }

      .board[data-mode="mountain"] .tile.stack-preview.blocked {
        opacity: 0.64;
        filter: grayscale(0.36) saturate(0.74) brightness(0.86);
      }

      .board[data-mode="mountain"] .tile.stack-preview::after {
        display: none;
      }

      .board[data-mode="mountain"] .tile.stack-bridge {
        border-color: #d59a2f;
        background:
          linear-gradient(180deg, rgba(255, 249, 220, 0.94), rgba(250, 221, 147, 0.9)),
          var(--tile);
        box-shadow:
          0 7px 0 rgba(120, 72, 29, 0.34),
          0 12px 18px rgba(23, 15, 9, 0.25);
      }

      .board[data-mode="mountain"] .tile.stack-bridge::after {
        display: none;
      }

      .board[data-mode="mountain"] .tile.loose-mountain {
        border-color: rgba(213, 154, 47, 0.86);
        background:
          linear-gradient(180deg, rgba(255, 252, 230, 0.96), rgba(255, 235, 177, 0.94)),
          var(--tile);
        box-shadow:
          0 5px 0 rgba(120, 72, 29, 0.32),
          0 10px 20px rgba(213, 154, 47, 0.24);
      }

      .board[data-mode="mountain"] .tile[data-ui-skin="v6"].stack-preview,
      .board[data-mode="mountain"] .tile[data-ui-skin="v6"].stack-bridge,
      .board[data-mode="mountain"] .tile[data-ui-skin="v6"].loose-mountain {
        border: 0;
        background: transparent;
        box-shadow: none;
      }

      .board.vision-on .tile.blocked {
        opacity: 0.72;
        filter: none;
        outline: 2px solid rgba(255, 212, 108, 0.8);
        outline-offset: 2px;
      }

      .board[data-mode="mountain"].vision-on .tile.stack-preview.blocked {
        opacity: 0.9;
      }

      .tile.removed {
        display: none;
      }

      .tile .suit {
        position: absolute;
        right: 8px;
        bottom: 7px;
        font-size: 0.56em;
        color: var(--vermilion);
      }

      .board[data-mode="mountain"] .tile .suit {
        right: 4px;
        bottom: 4px;
        font-size: 0.52em;
      }

      .slot-area {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      body.play-view .slot-area {
        gap: 3px;
        padding: 4px;
      }

      .slot-line {
        display: grid;
        min-width: 0;
      }

      .action-strip {
        min-width: 0;
        display: flex;
        justify-content: center;
      }

      .slot-grid {
        display: grid;
        grid-template-columns: repeat(var(--slot-count), minmax(34px, 1fr));
        gap: 6px;
        min-width: 0;
        padding: 6px;
        border-radius: 10px;
        background:
          linear-gradient(180deg, rgba(74, 45, 27, 0.92), rgba(44, 25, 15, 0.96)),
          #4a2d1f;
      }

      body.play-view .slot-grid {
        grid-template-columns: repeat(var(--slot-count), minmax(26px, 1fr));
        gap: 4px;
      }

      .slot-cell {
        position: relative;
        min-height: 60px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 250, 240, 0.18);
        border-radius: 4px;
        background:
          linear-gradient(180deg, rgba(105, 66, 39, 0.96), rgba(61, 35, 22, 0.98)),
          var(--slot);
        color: #fff7e4;
        overflow: hidden;
      }

      body.play-view .slot-cell {
        min-height: 44px;
      }

      .slot-cell.filled {
        aspect-ratio: 64 / 86;
        border-style: solid;
        background:
          linear-gradient(180deg, rgba(61, 38, 23, 0.66), rgba(31, 20, 14, 0.86)),
          var(--slot);
        color: var(--ink);
        border-color: rgba(213, 154, 47, 0.34);
        font-weight: 900;
      }

      .slot-cell.filled .tile-face-image {
        inset: 3px;
        width: calc(100% - 6px);
        height: calc(100% - 6px);
      }

      .slot-cell.selectable {
        border-color: var(--vermilion);
        background: #fff1df;
        color: #7c241b;
        box-shadow: inset 0 0 0 2px rgba(200, 61, 47, 0.2);
      }

      .combo-actions {
        width: min(100%, 360px);
        display: grid;
        grid-template-columns: repeat(5, minmax(48px, 64px));
        gap: 6px;
        justify-content: center;
      }

      .combo-button,
      .candidate,
      .primary-button,
      .ghost-button,
      .tool-button,
      .reward-button {
        min-height: 36px;
        border: 1px solid rgba(90, 54, 22, 0.24);
        padding: 0 12px;
        background: #efe0c5;
        color: var(--muted);
        font-weight: 800;
      }

      .combo-button.active {
        background: linear-gradient(180deg, #ffd46c, #d86e2f);
        color: #2a1409;
        box-shadow: 0 8px 18px rgba(200, 61, 47, 0.3);
      }

      .combo-button[data-ui-skin="v6"],
      .tool-button[data-ui-skin="v6"] {
        position: relative;
        border-color: transparent;
        background-color: transparent;
        background-image: var(--ui-image);
        background-position: center;
        background-size: contain;
        background-repeat: no-repeat;
        color: transparent;
        text-shadow: none;
        overflow: hidden;
        box-shadow: none;
      }

      .combo-button[data-ui-skin="text"] {
        position: relative;
        border-color: rgba(213, 154, 47, 0.78);
        background: linear-gradient(180deg, #fff0c2, #d59a2f);
        color: #3b210f;
        box-shadow: 0 8px 18px rgba(213, 154, 47, 0.25);
      }

      .combo-button[data-ui-skin="v6"] .button-label,
      .tool-button[data-ui-skin="v6"] strong {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .combo-button[data-ui-skin="v6"] .button-label,
      .tool-button[data-ui-skin="v6"] strong {
        display: none;
      }

      .combo-button[data-ui-skin="v6"] .button-count,
      .combo-button[data-ui-skin="text"] .button-count,
      .tool-button[data-ui-skin="v6"] span {
        position: absolute;
        right: 4px;
        bottom: 2px;
        min-width: 18px;
        min-height: 18px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: rgba(37, 19, 8, 0.84);
        color: #ffe5a8;
        font-size: 11px;
        line-height: 1;
      }

      .combo-button[data-ui-skin="v6"] .button-count,
      .tool-button[data-ui-skin="v6"] span {
        display: none;
      }

      .candidates {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
        gap: 8px;
      }

      .candidate {
        min-height: 52px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 6px;
        border-color: transparent;
        background: transparent;
        color: var(--ink);
        padding: 5px 7px;
      }

      .candidate-combo-type {
        min-width: 22px;
        min-height: 22px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #2f5c43;
        color: #ffe5a8;
        font-size: 12px;
        font-weight: 900;
      }

      .candidate-combo-type {
        display: none;
      }

      .candidate-tiles {
        min-width: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(18px, 1fr));
        gap: 2px;
      }

      .candidate[data-type="gang"] {
        border-color: var(--vermilion);
      }

      .candidate[data-type="peng"] {
        border-color: var(--gold);
      }

      .candidate[data-type="chi"] {
        border-color: var(--jade);
      }

      .candidate[data-type="hu"] {
        border-color: rgba(213, 154, 47, 0.78);
        background: #f7e2b8;
        color: var(--ink);
      }

      .candidate[data-type="bugang"] {
        border-color: rgba(200, 61, 47, 0.58);
        background: #fff1df;
        color: #7c241b;
      }

      .hu-hint {
        display: none;
        min-height: 28px;
        align-items: center;
        border: 1px solid rgba(213, 154, 47, 0.36);
        background: #fff5d8;
        color: #5a3616;
        padding: 4px 8px;
        font-size: 13px;
        font-weight: 900;
        line-height: 1.25;
      }

      .hu-hint.show {
        display: flex;
      }

      .rank-dot.hu-wait {
        border-color: rgba(213, 154, 47, 0.82);
        background: #ffd46c;
        color: #3b210f;
        box-shadow: 0 0 0 2px rgba(213, 154, 47, 0.16);
      }

      .side {
        min-width: 0;
        display: grid;
        align-content: start;
        gap: 14px;
        padding: 16px;
        overflow: auto;
      }

      body.play-view .side {
        align-self: start;
        position: sticky;
        top: 12px;
        gap: 8px;
        max-height: calc(100vh - 24px);
        padding: 0;
        overflow: visible;
        border: 0;
        background: transparent;
        box-shadow: none;
      }

      body.play-view .side > :not(.tools-section) {
        display: none;
      }

      .level-title {
        display: grid;
        gap: 4px;
      }

      .level-title h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.12;
        letter-spacing: 0;
      }

      .level-title span {
        color: var(--muted);
        font-size: 14px;
      }

      .boss-goal {
        display: none;
        border: 1px solid rgba(200, 61, 47, 0.35);
        background: #fff1df;
        color: #7c241b;
        padding: 10px;
        font-weight: 900;
      }

      .boss-goal.show {
        display: block;
      }

      .boss-goal-title {
        display: block;
        margin-bottom: 8px;
      }

      .boss-goal-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .boss-goal-meta {
        margin: -2px 0 8px;
        color: #5f291f;
        font-size: 12px;
        line-height: 1.35;
      }

      .boss-goal-chip {
        min-height: 30px;
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(124, 36, 27, 0.28);
        background: rgba(255, 250, 240, 0.78);
        padding: 4px 8px;
        color: #7c241b;
        font-size: 12px;
        line-height: 1.25;
      }

      .boss-goal-chip.done {
        border-color: rgba(31, 138, 112, 0.42);
        background: #e3f4de;
        color: #12624f;
      }

      .boss-goal-chip.pulse {
        border-color: rgba(213, 154, 47, 0.7);

  <body class="play-view" data-prototype-view="play">
    <main class="app" data-testid="app">
      <section class="play" aria-label="胡了卜牌局">
        <header class="topbar">
          <div class="brand">
            <strong>胡了卜</strong>
            <span id="levelMeta">加载中</span>
          </div>
          <div class="top-controls">
            <div class="mode-switch" id="modeSwitch" aria-label="牌山模式">
              <button class="mode-button active" type="button" data-mode="config">配置关卡</button>
              <button class="mode-button" type="button" data-mode="mountain">密集牌山</button>
            </div>
            <nav class="level-tabs" id="levelTabs" aria-label="关卡"></nav>
          </div>
          <div class="topbar-actions">
            <a class="ghost-button tuner-link" id="tunerLink" href="./tuner.html" target="_blank" rel="noopener">调牌器</a>
          </div>
        </header>

        <section class="play-hud" aria-label="局内状态">
          <div class="hud-chip">
            <span>关卡</span>
            <strong id="hudLevel">--</strong>
          </div>
          <div class="hud-chip hud-goal">
            <span>目标</span>
            <strong id="hudGoal">清空牌山</strong>
          </div>
          <div class="hud-chip">
            <span>余牌</span>
            <strong id="hudRemaining">0</strong>
          </div>
          <div class="hud-chip">
            <span>积分</span>
            <strong id="hudScore">0</strong>
          </div>
          <div class="hud-chip">
            <span>铜钱</span>
            <strong id="hudCoins">0</strong>
          </div>
        </section>

        <div class="play-boss-goal" id="playBossGoal"></div>

        <section class="board-wrap">
          <div class="board" id="board" data-testid="board"></div>
        </section>

        <section class="section counter-section" aria-label="记牌器">
          <h2>记牌器</h2>
          <div class="counts" id="counts"></div>
        </section>

        <section class="meld-river-panel" aria-label="明牌和牌河">
          <section class="section meld-section" aria-label="明牌区">
            <h2>明牌</h2>
            <div class="meld-list" id="openMelds"></div>
          </section>
          <section class="section river-section" aria-label="牌河">
            <h2>牌河 <span class="river-capacity" id="riverCapacity">0/0</span></h2>
            <div class="river-list" id="river"></div>
          </section>
        </section>

        <section class="slot-area">
          <div class="action-strip">
            <div class="combo-actions" id="comboActions" aria-label="组合按钮"></div>
          </div>
          <div class="slot-line">
            <div class="slot-grid" id="slotGrid" data-testid="slot"></div>
          </div>
          <div class="candidates" id="candidateList" aria-label="候选组合"></div>
          <div class="hu-hint" id="huHint" aria-live="polite"></div>
          <div class="status" id="status" data-testid="status"></div>
        </section>
      </section>

      <aside class="side">
        <div class="level-title">
          <h1 id="levelName">配置试玩</h1>
          <span id="levelSubtitle">读取 10 关配置</span>
        </div>
        <div class="featured-combos" id="featuredCombos"></div>
        <div class="boss-goal" id="bossGoal"></div>

        <section class="section tuning-panel" id="mountainTuningPanel" aria-label="密集牌山调参" hidden>
          <h2>牌山调参</h2>
          <div class="tuning-grid">
            <label class="tuning-field">
              <span>种子</span>
              <input id="mountainSeed" type="text" autocomplete="off" />
            </label>
            <label class="tuning-field">
              <span>模板</span>
              <select id="mountainTemplate"></select>
            </label>
            <label class="tuning-field">
              <span>牌量</span>
              <input id="mountainTileCount" type="number" min="120" max="420" step="1" placeholder="240" />
            </label>
            <label class="tuning-field">
              <span>同列</span>
              <input id="mountainStackDepth" type="number" min="2" max="10" step="1" />
            </label>
            <label class="tuning-field">
              <span>胡包</span>
              <input id="mountainHuPacks" type="number" min="0" max="4" step="1" placeholder="自动" />
            </label>
            <label class="tuning-field">
              <span>字牌</span>
              <input id="mountainHonorWeight" type="number" min="0" max="100" step="5" />
            </label>
          </div>
          <button class="primary-button tuning-action" id="mountainRegenerateButton" type="button">重新生成牌山</button>
        </section>

        <div class="metrics" aria-label="牌局状态">
          <div class="metric">

      function applyInitialRouteState() {
        const params = new URLSearchParams(window.location.search);
        const requestedView = params.get("view");
        const requestedMode = params.get("mode");
        const requestedEmbed = params.get("embed");
        const requestedSession = params.get("session");
        const requestedLevel = Number.parseInt(params.get("level") ?? "", 10);
        const requestedStartLayer = Number.parseInt(params.get("startLayer") ?? "", 10);
        const requestedDailySeed = String(params.get("dailySeed") ?? "").trim();
        const requestedAscensionLevel = Number.parseInt(params.get("ascensionLevel") ?? "", 10);
        const requestedAscensionName = String(params.get("ascensionName") ?? "").trim();
        const requestedAscensionPerks = String(params.get("ascensionPerks") ?? "").trim();
        const requestedAscensionPerkSlots = Number.parseInt(params.get("ascensionPerkSlots") ?? "", 10);
        const requestedReserveBonus = Number.parseInt(params.get("reserveBonus") ?? "", 10);
        const requestedShieldBonus = Number.parseInt(params.get("shieldBonus") ?? "", 10);
        const requestedToolBonus = Number.parseInt(params.get("toolBonus") ?? "", 10);
        const requestedRiverBonus = Number.parseInt(params.get("riverBonus") ?? "", 10);
        const requestedCoinBonus = Number.parseInt(params.get("coinBonus") ?? "", 10);
        const requestedVisionBonus = Number.parseInt(params.get("visionBonus") ?? "", 10);
        const requestedRunArchetype = String(params.get("runArchetype") ?? "").trim();
        const requestedPreferredRoute = String(params.get("preferredRoute") ?? "").trim();
        const requestedRouteMasteryLevel = Number.parseInt(params.get("routeMasteryLevel") ?? "", 10);

        model.ascensionLevel = 0;
        model.ascensionName = "";
        model.equippedAscensionPerks = [];
        model.ascensionPerkSlots = 0;

        if (PROTOTYPE_VIEW_MODES.has(requestedView)) {
          model.prototypeView = requestedView;
        }

        if (requestedMode === "endless") {
          model.runMode = "endless";
          model.mode = "mountain";
          model.run.endlessLayer = Number.isNaN(requestedStartLayer)
            ? ENDLESS_START_LAYER
            : Math.max(ENDLESS_START_LAYER, requestedStartLayer);
        } else if (requestedMode === "daily") {
          model.runMode = "daily";
          model.mode = "mountain";
          model.run.dailySeed = requestedDailySeed || new Date().toISOString().slice(0, 10);
        } else if (requestedMode === "ascension") {
          model.runMode = "mainline";
          model.mode = "mountain";
          model.ascensionLevel = Number.isNaN(requestedAscensionLevel) ? 1 : Math.max(1, Math.min(4, requestedAscensionLevel));
          model.ascensionName = requestedAscensionName
            || ({ 1: "东风场", 2: "南风场", 3: "西风场", 4: "北风场" }[model.ascensionLevel] ?? "东风场");
          model.ascensionPerkSlots = Number.isNaN(requestedAscensionPerkSlots)
            ? (ASCENSION_CONFIGS[model.ascensionLevel]?.ascensionPerkSlots ?? 1)
            : Math.max(0, requestedAscensionPerkSlots);
          model.equippedAscensionPerks = requestedAscensionPerks
            ? requestedAscensionPerks.split(",").map((item) => item.trim()).filter((item) => Boolean(ASCENSION_PERK_POOL[item]))
            : [];
        } else if (requestedMode === "mountain" || requestedMode === "config") {
          model.mode = requestedMode;
        }

        model.embedShell = requestedEmbed === "shell";
        model.shellSessionKey = requestedSession ?? "";
        model.shellBonuses.reserve = Number.isNaN(requestedReserveBonus) ? 0 : Math.max(0, requestedReserveBonus);
        model.shellBonuses.shield = Number.isNaN(requestedShieldBonus) ? 0 : Math.max(0, requestedShieldBonus);
        model.shellBonuses.tool = Number.isNaN(requestedToolBonus) ? 0 : Math.max(0, requestedToolBonus);
        model.shellBonuses.river = Number.isNaN(requestedRiverBonus) ? 0 : Math.max(0, requestedRiverBonus);
        model.shellBonuses.coin = Number.isNaN(requestedCoinBonus) ? 0 : Math.max(0, requestedCoinBonus);
        model.shellBonuses.vision = Number.isNaN(requestedVisionBonus) ? 0 : Math.max(0, requestedVisionBonus);
        model.runArchetype = RUN_ARCHETYPE_CONFIGS[requestedRunArchetype] ? requestedRunArchetype : "chi";
        model.preferredRoute = requestedPreferredRoute;
        model.routeMasteryLevel = Number.isFinite(requestedRouteMasteryLevel) ? Math.max(0, Math.min(2, requestedRouteMasteryLevel)) : 0;
        model.run.coins = Math.max(0, model.shellBonuses.coin);

        model.mountainTuning = readMountainTuningFromParams(params, model.mountainTuning);

        if (!Number.isNaN(requestedLevel)) {
          const levelIndex = model.levelsConfig.levels.findIndex((level) => level.order === requestedLevel);
          if (levelIndex >= 0) model.levelIndex = levelIndex;
        }
      }

      function syncPrototypeViewShell() {
        const isTunerView = model.prototypeView === "tuner";
        document.body.dataset.prototypeView = model.prototypeView;
        document.body.classList.toggle("play-view", !isTunerView);

      function canEmitShellEvent() {
        return model.embedShell && window.parent && window.parent !== window;
      }

      function buildShellPayload(type, extra = {}) {
        if (type === "hulebu:run-failed") {
          return {
            sessionKey: model.shellSessionKey,
          };
        }
        const level = model.levelsConfig && model.state ? currentLevel() : null;
        const endlessChapter = isEndlessMode() ? getEndlessChapterProfile() : null;
        const dailyMutator = isDailyMode() ? getDailyMutatorProfile() : null;
        const ascensionBuild = isAscensionMode() ? getAscensionBuildProfile()?.name ?? null : null;
        return {
          sessionKey: model.shellSessionKey,
          levelOrder: level?.order ?? null,
          levelName: level?.name ?? "",
          runMode: model.runMode,
          ascensionLevel: model.ascensionLevel || null,
          ascensionName: model.ascensionName || null,
          dailySeed: isDailyMode() ? model.run.dailySeed : null,
          endlessLayer: isEndlessMode() ? getEndlessLayerOrder() : null,
          endlessChapterLabel: endlessChapter?.label ?? null,
          endlessChapterBoss: endlessChapter?.bossTitle ?? null,
          dailyMutatorLabel: dailyMutator?.label ?? null,
          dailyRewardLabel: dailyMutator?.rewardLabel ?? null,
          dailyStreak: isDailyMode() ? getDailyParticipationStreak() : null,
          coins: model.run.coins,
          score: model.state?.score ?? 0,
          pickedRewards: model.run.pickedRewards.length,
          routeDirection: extra.routeDirection ?? ascensionBuild,
          summary: extra.summary ?? view.status.textContent ?? "",
          specialEventSummary: extra.specialEventSummary ?? model.run.lastSpecialEventMessage ?? "",
          specialEventMessage: extra.specialEventMessage ?? model.run.lastSpecialEventMessage ?? "",
          ...extra,
        };
      }

      function emitShellEvent(type, extra = {}) {
        if (!canEmitShellEvent()) return;
        window.parent.postMessage({
          source: "hulebu-demo-shell",
          type,
          payload: buildShellPayload(type, extra),
        }, window.location.origin);
      }

      function readMountainTuningFromParams(params, fallback) {
        return normalizeMountainTuning({
          seed: params.get("seed") ?? fallback.seed,
          templateId: params.has("template") ? params.get("template") : fallback.templateId,
          tileCount: params.has("tiles") ? params.get("tiles") : fallback.tileCount,
          stackDepth: params.has("stack") ? params.get("stack") : fallback.stackDepth,
          huPacks: params.has("hu") ? params.get("hu") : fallback.huPacks,
          honorWeight: params.has("honor") ? params.get("honor") : fallback.honorWeight,
        });
      }

      function readMountainTuningForm() {
        return normalizeMountainTuning({
          seed: view.mountainSeed.value,
          templateId: view.mountainTemplate.value,
          tileCount: view.mountainTileCount.value,
          stackDepth: view.mountainStackDepth.value,
          huPacks: view.mountainHuPacks.value,
          honorWeight: view.mountainHonorWeight.value,

      }

      function normalizeMountainTuning(raw) {
        return {
          seed: String(raw.seed ?? "").trim(),
          templateId: normalizeMountainTemplateId(raw.templateId ?? DEFAULT_MOUNTAIN_TUNING.templateId),
          tileCount: normalizeOptionalInteger(raw.tileCount, MOUNTAIN_TILE_COUNT_RANGE.min, MOUNTAIN_TILE_COUNT_RANGE.max),
          stackDepth: normalizeInteger(raw.stackDepth, 2, 10, DEFAULT_MOUNTAIN_TUNING.stackDepth),
          huPacks: normalizeOptionalInteger(raw.huPacks, 0, 4),
          honorWeight: normalizeInteger(raw.honorWeight, 0, 100, DEFAULT_MOUNTAIN_TUNING.honorWeight),
        };
      }

      function normalizeMountainTemplateId(value) {
        const templateId = String(value ?? DEFAULT_MOUNTAIN_TUNING.templateId).trim();
        if (templateId === "auto" || MOUNTAIN_TEMPLATE_IDS.includes(templateId)) return templateId;
        return DEFAULT_MOUNTAIN_TUNING.templateId;
      }

      function normalizeOptionalInteger(value, min, max) {
        if (value === null || value === undefined || value === "") return null;
        const parsed = Number.parseInt(value, 10);
        if (Number.isNaN(parsed)) return null;
        return clampNumber(parsed, min, max);
      }

      function normalizeInteger(value, min, max, fallback) {
        const parsed = Number.parseInt(value, 10);
        if (Number.isNaN(parsed)) return fallback;
        return clampNumber(parsed, min, max);
      }

      function clampNumber(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function resetMountainTemplateForLevelTransition(index, options = {}) {
        const shouldReset = options.resetFixedMountainTemplate && (options.forceResetMountainTemplate || index !== model.levelIndex);
        if (!shouldReset || model.mode !== "mountain" || model.mountainTuning.templateId === DEFAULT_MOUNTAIN_TUNING.templateId) return;
        model.mountainTuning = {
          ...model.mountainTuning,
          templateId: DEFAULT_MOUNTAIN_TUNING.templateId,
        };
      }

      function refreshAutoMountainTemplateSeedForLoad(options = {}) {
        if (!shouldUseVolatileAutoMountainTemplateSeed()) return;
        refreshAutoMountainTemplateSeed(`${currentLevel().id}:${options.reason ?? "load"}`);
      }

      function shouldUseVolatileAutoMountainTemplateSeed() {
        return (
          model.mode === "mountain"
          && model.prototypeView === "play"

        model.autoMountainTemplateSeed = `${reason}:${Date.now()}:${Math.random()}`;

        const basePool = [
          ...(ASCENSION_REWARD_POOL[level] ?? []),
          ...(ASCENSION_TIER_REWARD_BONUSES[level] ?? []),
        ];
        const buildProfile = getAscensionBuildProfile();
        const buildVariantName = getAscensionBuildVariantName();
        const perkIds = [...model.equippedAscensionPerks].sort();
        for (const perkId of perkIds) {
          basePool.push(...(ASCENSION_BUILD_REWARD_BONUSES[perkId] ?? []));
        }
        const comboKey = perkIds.join("+");
        if (comboKey) {
          basePool.push(...(ASCENSION_BUILD_REWARD_BONUSES[comboKey] ?? []));
        }
        if (buildProfile?.name) {
          basePool.push(...(ASCENSION_BUILD_REWARD_BONUSES[buildProfile.name] ?? []));
        }
        if (buildVariantName) {
          basePool.push(...(ASCENSION_BUILD_REWARD_BONUSES[buildVariantName] ?? []));

      function getAscensionPerkSummaryText() {
        if (!isAscensionMode()) return "";

      function isAscensionRewardId(rewardId) {
        return rewardId.startsWith("ascension_");
      }

      function getPlayableLevelCount() {
        if (isEndlessMode() || isDailyMode()) return model.levelsConfig.levels.length;
        return isFriendDemoMode()
          ? Math.min(FRIEND_DEMO_LEVEL_COUNT, model.levelsConfig.levels.length)
          : model.levelsConfig.levels.length;
      }

      function getPlayableLevels() {
        if (isEndlessMode() || isDailyMode()) return [currentLevel()].filter(Boolean);
        return model.levelsConfig.levels.slice(0, getPlayableLevelCount());
      }

      function getAscensionTierEvent(levelIndex) {
        const baseLevel = model.ascensionLevel ?? 0;
        if (!baseLevel) return null;
        const advancedLevel = baseLevel + 10;
        const shouldUseAdvancedTierEvent = levelIndex >= 12 || (levelIndex >= 8 && levelIndex % 4 === 0);
        if (shouldUseAdvancedTierEvent) return ASCENSION_TIER_EVENT_POOL[advancedLevel] ?? ASCENSION_TIER_EVENT_POOL[baseLevel] ?? null;
        return ASCENSION_TIER_EVENT_POOL[baseLevel] ?? null;
      }

      function isEndlessSpecialEventTriggerLayer(layer) {
        const chapterStep = (layer - ENDLESS_START_LAYER) % 5;
        const chapterIndex = Math.floor((layer - ENDLESS_START_LAYER) / 5);
        return chapterStep === 2
          || (chapterIndex >= 1 && chapterStep === 4)
          || (chapterIndex >= 3 && chapterStep === 1)
          || (chapterIndex >= 5 && chapterStep === 3);
      }

      function getSpecialEventTriggerPosition(levelIndex) {
        if (isEndlessMode()) {
          let triggerCount = 0;
          const currentLayer = getEndlessLayerOrder();
          for (let layer = ENDLESS_START_LAYER; layer <= currentLayer; layer += 1) {
            if (isEndlessSpecialEventTriggerLayer(layer)) triggerCount += 1;
          }
          return triggerCount - 1;
        }
        if (isDailyMode()) {
          const order = model.levelsConfig?.levels?.[getDailyLevelIndex(levelIndex)]?.order ?? levelIndex + 1;
          return DAILY_SPECIAL_EVENT_TRIGGER_ORDERS.indexOf(order);
        }
        if (isAscensionMode()) {
          return ASCENSION_SPECIAL_EVENT_TRIGGER_LEVELS.indexOf(levelIndex);
        }
        return SPECIAL_EVENT_TRIGGER_LEVELS.indexOf(levelIndex);
      }

      function getSpecialEventForLevel(levelIndex) {
        const triggerIndex = getSpecialEventTriggerPosition(levelIndex);
        if (triggerIndex < 0) return null;
        if (isAscensionMode()) {
          const buildProfile = getAscensionBuildProfile();
          const buildVariantName = getAscensionBuildVariantName("");
          const ascensionEventKeys = getAscensionBuildEventKeys(buildProfile?.name ?? null, buildVariantName);
          const ascensionEvent = ascensionEventKeys.length > 0
            ? ASCENSION_SPECIAL_EVENT_POOL[ascensionEventKeys[Math.max(0, triggerIndex) % ascensionEventKeys.length]]
            : buildVariantName
              ? ASCENSION_SPECIAL_EVENT_POOL[buildVariantName]
              : buildProfile
                ? ASCENSION_SPECIAL_EVENT_POOL[buildProfile.name]
                : null;
          const tierEvent = getAscensionTierEvent(levelIndex);
          if (tierEvent && levelIndex % 2 === 0) return tierEvent;
          if (ascensionEvent) return ascensionEvent;
          if (buildProfile?.name === "河控流") return SPECIAL_EVENT_POOL[1] ?? null;
          if (buildProfile?.name === "护河流") return SPECIAL_EVENT_POOL[1] ?? null;
          if (buildProfile?.name === "稳手流") return SPECIAL_EVENT_POOL[0] ?? null;
          if (buildProfile?.name === "稳压流") return SPECIAL_EVENT_POOL[3] ?? null;
          if (buildProfile?.name === "续押流") return SPECIAL_EVENT_POOL[3] ?? null;
          if (buildProfile?.name === "顺手胡流") return SPECIAL_EVENT_POOL.find((event) => event.id === "route-followup") ?? null;
          if (buildProfile?.name === "收官流") return SPECIAL_EVENT_POOL.find((event) => event.id === "tail-lantern") ?? null;
          if (buildProfile?.name === "试炼流") return SPECIAL_EVENT_POOL.find((event) => event.id === "lantern-peek") ?? null;
        }
        const pool = getSpecialEventPoolForLevel(levelIndex);
        return pool[triggerIndex % pool.length] ?? null;
      }

      function getSpecialEventPoolForLevel(levelIndex) {
        const pool = [...SPECIAL_EVENT_POOL];
        const runArchetype = getRunArchetypeConfig(model.runArchetype);
        const preferredRoute = typeof model.preferredRoute === "string" ? model.preferredRoute : "";
        const routeMasteryLevel = Math.max(0, Math.min(2, Number(model.routeMasteryLevel) || 0));
        const dailyLateEventBiasMap = {
          12: ["east-guard-mouth", "old-tile-box"],
          14: ["route-followup", "risk-double-down"],
          16: ["south-wall-breathe", "seal-delayed"],
          18: ["tail-lantern", "west-tail-lock", "west-throat-seal"],
          20: ["north-tail-break", "west-tail-lock", "north-coal-burn"],
        };
        const ascensionLateEventBiasMap = {
          11: ["east-scout-pressure", "old-tile-box"],
          13: ["route-followup", "risk-double-down"],
          15: ["south-hold-softseal", "seal-delayed"],
          17: ["tail-lantern", "west-tail-lock", "west-throat-seal"],
          19: ["north-tail-break", "west-tail-lock", "north-coal-burn"],
          20: ["north-tail-break", "north-coal-burn", "west-throat-seal"],
        };
        if (isEndlessMode()) {
          const chapterProfile = getEndlessChapterProfile();
          const chapterPhase = chapterProfile?.phase ?? 1;
          const chapter = chapterProfile?.chapter ?? 1;
          const chapterStep = (getEndlessLayerOrder() - ENDLESS_START_LAYER) % 5;
          [...(ENDLESS_SPECIAL_EVENT_PHASE_BIAS[chapterPhase] ?? [])].reverse().forEach((eventId) => {
            pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === eventId));
          });
          ENDLESS_SPECIAL_EVENT_STEP_BIAS.slice().reverse().forEach((rule) => {
            if (chapter < rule.minChapter || chapterStep !== rule.step) return;
            [...rule.eventIds].reverse().forEach((eventId) => {
              pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === eventId));
            });
          });
        }
        if (isDailyMode()) {
          const dailyMutator = getDailyMutatorProfile();
          [...(dailyMutator?.eventBias ?? [])].reverse().forEach((eventId) => {
            pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === eventId));
          });
          const order = model.levelsConfig?.levels?.[getDailyLevelIndex(levelIndex)]?.order ?? levelIndex + 1;
          const dailyLateEventBias = getThresholdBiasChain(dailyLateEventBiasMap, order);
          [...dailyLateEventBias].reverse().forEach((eventId) => {
            pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === eventId));
          });
        }
        [...(runArchetype.eventBias ?? [])].reverse().forEach((eventId) => {
          pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === eventId));
        });
        const preferredRouteEvent = getPreferredRouteEventBias();
        if (preferredRouteEvent) pool.unshift(preferredRouteEvent);
        if (isAscensionMode()) {
          const buildProfile = getAscensionBuildProfile();
          const buildVariantName = getAscensionBuildVariantName("");
          const ascensionOrder = model.levelsConfig?.levels?.[levelIndex]?.order ?? levelIndex + 1;
          const ascensionLateEventBias = getThresholdBiasChain(ascensionLateEventBiasMap, ascensionOrder);
          [...ascensionLateEventBias].reverse().forEach((eventId) => {
            pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === eventId));
          });
          if (buildProfile?.name === "河控流") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "river-old-pledge"));
          if (buildProfile?.name === "护河流" || buildProfile?.name === "护河续押") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "river-old-pledge"));
          if (buildProfile?.name === "稳压流") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "risk-double-down"));
          if (buildProfile?.name === "续押流") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "risk-double-down"));
          if (buildProfile?.name === "封盘流") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "seal-delayed"));
          if (buildProfile?.name === "缓冲流" || buildProfile?.name === "迟尾缓燃") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "seal-delayed"));
          if (buildProfile?.name === "顺手胡流") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "route-followup"));
          if (buildProfile?.name === "收官流") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "tail-lantern"));
          if (buildProfile?.name === "试炼流") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "lantern-peek"));
          if (buildProfile?.name === "东风护路") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "east-guard-mouth"));
          if (buildProfile?.name === "南风挡墙") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "south-wall-breathe"));
          if (buildProfile?.name === "西风收口") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "west-tail-lock"));
          if (buildProfile?.name === "西风定口") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "west-throat-seal"));
          if (buildProfile?.name === "北风封火") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "north-coal-burn"));
          if (buildProfile?.name === "北风封尾") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "north-tail-break"));
          const ascensionEventKeys = getAscensionBuildEventKeys(buildProfile?.name ?? null, buildVariantName);
          [...ascensionEventKeys].reverse().forEach((eventKey) => {
            const event = ASCENSION_SPECIAL_EVENT_POOL[eventKey];
            if (event) pool.unshift(event);
          });
          if (buildProfile?.name === "西风试锋") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["西风试锋"]);
          if (buildProfile?.name === "顺手胡流") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["顺手胡流·扣拍"]);
          if (buildProfile?.name === "收官流") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["收官流·试口"]);
          if (buildProfile?.name === "救场流") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["救场流·回生"]);
          if (buildProfile?.name === "护河续押") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["护河续押·顶库"]);
          if (buildProfile?.name === "河控流") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["河控流·稳河"]);
          if (buildProfile?.name === "杠流") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["杠流·震山"]);
          if (buildProfile?.name === "试炼流") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["试炼流·对卷"]);
          if (buildProfile?.name === "稳压流") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["稳压流·回墙"]);
          if (buildVariantName === "西风试锋·点火") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["西风试锋·点火"]);
          if (buildVariantName === "西风试锋·照线") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["西风试锋·照线"]);
          if (buildProfile?.name === "西风定口") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["西风定口"]);
          if (buildProfile?.name === "西风收口") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["西风收口"]);
          if (buildProfile?.name === "北风封火") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["北风封火"]);
          if (buildVariantName === "西风定口·牌尾") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["西风定口·牌尾"]);
          if (buildVariantName === "西风定口·照听") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["西风定口·照听"]);
          if (buildVariantName === "北风锁火·锁台") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["北风锁火·锁台"]);
          if (buildVariantName === "北风锁火·迟尾") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["北风锁火·迟尾"]);
          if (buildVariantName === "北风封尾·压台") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["北风封尾·压台"]);
          if (buildVariantName === "北风封尾·闭门") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["北风封尾·闭门"]);
          if (buildProfile?.name === "北风锁火") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["北风锁火"]);
          if (buildProfile?.name === "北风封尾") pool.unshift(ASCENSION_SPECIAL_EVENT_POOL["北风封尾"]);
        } else {
          const mainlineLateEventBiasMap = {
            11: ["east-guard-mouth", "old-tile-box"],
            13: ["route-followup", "risk-double-down"],
            15: ["south-wall-breathe", "seal-delayed"],
            17: ["tail-lantern", "west-tail-lock", "west-throat-seal"],
            19: ["north-tail-break", "west-tail-lock", "north-coal-burn"],
          };
          const mainlineOrder = model.levelsConfig?.levels?.[levelIndex]?.order ?? levelIndex + 1;
          const mainlineLateEventBias = getThresholdBiasChain(mainlineLateEventBiasMap, mainlineOrder);
          [...mainlineLateEventBias].reverse().forEach((eventId) => {
            pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === eventId));
          });
          if (levelIndex >= 7) {
            pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "river-old-pledge"));
          }
        }
        return pool.filter(Boolean);
      }

      function getPreferredRouteEventBias() {
        const preferredRoute = typeof model.preferredRoute === "string" ? model.preferredRoute : "";
        const eventId = preferredRoute.includes("胡流")
          ? "route-followup"
          : preferredRoute.includes("信息流")
            ? "lantern-peek"
            : preferredRoute.includes("河控")
              ? "river-old-pledge"
              : preferredRoute.includes("道具流")
                ? "old-sparrow"
                : preferredRoute.includes("救场")
                  ? "south-wall-breathe"
                  : "";
        return eventId ? SPECIAL_EVENT_POOL.find((event) => event.id === eventId) ?? null : null;
      }

      function getSpecialEventRarityLabel(event) {
        return SPECIAL_EVENT_RARITIES[event.rarity] ?? SPECIAL_EVENT_RARITIES.common;
      }

      function getSpecialEventTagText(event) {
        return SPECIAL_EVENT_TAGS[event.tag] ?? event.tag ?? SPECIAL_EVENT_TAGS.economy;
      }

      function getSpecialEventOffer(event, option) {
        const buildLink = EVENT_BUILD_LINKS[option.effect?.modifier?.label] ?? EVENT_BUILD_LINKS[getAscensionBuildProfile()?.name] ?? "";
        const rarity = getSpecialEventRarityLabel(event);
        const tag = getSpecialEventTagText(event);
        const buildProfile = getAscensionBuildProfile();
        const buildName = buildProfile?.name ?? "";
        const buildHint = EVENT_BUILD_HINTS[option.effect?.modifier?.label] ?? EVENT_BUILD_HINTS[buildName] ?? "";
        const buildText = buildLink
          ? buildHint && buildHint !== buildLink
            ? `偏向 ${buildLink} · ${buildHint}`
            : `偏向 ${buildLink}`
          : buildName
            ? buildHint && buildHint !== buildName
              ? `偏向 ${buildName} · ${buildHint}`
              : `偏向 ${buildName}`
            : "";
        return buildText ? `${rarity} · ${tag} · ${buildText}` : `${rarity} · ${tag}`;
      }

      function getSpecialEventTriggerKey(levelIndex) {
        if (isEndlessMode()) {
          const layer = getEndlessLayerOrder();
          return isEndlessSpecialEventTriggerLayer(layer) ? `endless:${layer}` : null;
        }
        if (isDailyMode()) {
          const order = model.levelsConfig?.levels?.[getDailyLevelIndex(levelIndex)]?.order ?? levelIndex + 1;
          return DAILY_SPECIAL_EVENT_TRIGGER_ORDERS.includes(order)
            ? `daily:${model.run.dailySeed || "today"}:${order}`
            : null;
        }
        if (isAscensionMode()) {
          return ASCENSION_SPECIAL_EVENT_TRIGGER_LEVELS.includes(levelIndex)
            ? `ascension:${levelIndex}`
            : null;
        }
        return SPECIAL_EVENT_TRIGGER_LEVELS.includes(levelIndex)
          ? `${isAscensionMode() ? "ascension" : "mainline"}:${levelIndex}`
          : null;
      }

      function maybeShowSpecialEventBeforeLevel(levelIndex) {
        if (!(isFriendDemoMode() || isDailyMode() || isEndlessMode() || isAscensionMode())) return false;
        const triggerKey = getSpecialEventTriggerKey(levelIndex);
        if (!triggerKey) return false;
        if (model.run.specialEventsSeen.includes(triggerKey)) return false;
        const event = getSpecialEventForLevel(levelIndex);
        if (!event) return false;

        model.run.specialEventsSeen.push(triggerKey);
        model.run.pendingSpecialEvent = event;
        if (model.state) {
          model.state.phase = "event";
          model.state.discardSelecting = false;
          model.state.endgamePrimerSelecting = false;
        }
        showSpecialEventOverlay(event);
        return true;
      }

      function showSpecialEventOverlay(event) {
        view.rewardTitle.textContent = event.title;
        view.rewardGrid.innerHTML = "";
        view.rewardGrid.style.display = "grid";
        view.runComplete.innerHTML = "";
        view.runComplete.classList.add("show");

        const summary = document.createElement("p");
        summary.textContent = `${getSpecialEventRarityLabel(event)} · ${getSpecialEventTagText(event)} · ${event.summary}`;
        view.runComplete.append(summary);

        for (const option of event.options) {
          const card = document.createElement("article");
          card.className = "reward-card";
          const title = document.createElement("strong");
          title.textContent = option.label;
          const desc = document.createElement("p");
          desc.textContent = `${describeSpecialEventEffect(option.effect)} · ${getSpecialEventOffer(event, option)}`;
          const button = document.createElement("button");
          button.className = "reward-button";
          button.type = "button";
          button.textContent = "选择并开局";
          button.addEventListener("click", () => chooseSpecialEventOption(event.id, option.id));
          card.append(title, desc, button);
          view.rewardGrid.append(card);
        }

        view.rewardOverlay.classList.add("show");
        emitShellEvent("hulebu:run-progress", {
          summary: `特殊事件：${event.title}`,
          specialEventSummary: `${getSpecialEventRarityLabel(event)} · ${getSpecialEventTagText(event)} · ${event.title}`,
          specialEventMessage: event.summary,
        });
        if (view.status) view.status.textContent = `特殊事件：${event.title}`;
      }

      function chooseSpecialEventOption(eventId, optionId) {
        const event = model.run.pendingSpecialEvent?.id === eventId
          ? model.run.pendingSpecialEvent
          : SPECIAL_EVENT_POOL.find((item) => item.id === eventId)
            ?? Object.values(ASCENSION_SPECIAL_EVENT_POOL).find((item) => item.id === eventId);
        if (!event) return;
        const option = event.options.find((item) => item.id === optionId);
        if (!option) return;

        const effectMessage = applySpecialEventEffect(option.effect, event.title, option.label);
        model.run.pendingSpecialEvent = null;
        model.run.lastSpecialEventMessage = effectMessage;
        view.rewardOverlay.classList.remove("show");
        loadLevel(model.levelIndex, { resetFixedMountainTemplate: true });
      }

      function applySpecialEventEffect(effect, eventTitle, optionLabel) {
        if (effect.type === "coins") {
          model.run.coins = Math.max(0, model.run.coins + effect.amount);
          if (model.state) model.state.coins = model.run.coins;
          const prefix = effect.amount >= 0 ? "+" : "";
          return `${eventTitle}：${optionLabel}（铜钱 ${prefix}${effect.amount}）`;
        }

        if (effect.type === "tool") {
          model.run.tools[effect.tool] = Math.max(0, (model.run.tools[effect.tool] ?? 0) + effect.amount);
          return `${eventTitle}：${optionLabel}`;
        }

        if (effect.type === "comboBonus") {
          model.run.bonuses[effect.combo] = (model.run.bonuses[effect.combo] ?? 0) + effect.amount;
          return `${eventTitle}：${effect.label ?? optionLabel}`;
        }

        if (effect.type === "shield") {
          model.run.shieldsDelta += effect.amount;
          return `${eventTitle}：${optionLabel}`;
        }

        if (effect.type === "reserve") {
          model.run.reserveDelta += effect.amount;
          return `${eventTitle}：${optionLabel}`;
        }

        if (effect.type === "river") {
          model.run.riverDelta = (model.run.riverDelta ?? 0) + effect.amount;
          return `${eventTitle}：${optionLabel}`;
        }

        if (effect.type === "modifier") {
          model.run.pendingLevelModifier = { ...effect.modifier };
          return `${eventTitle}：${effect.modifier.label}（${EVENT_BUILD_LINKS[effect.modifier.label] ?? effect.modifier.label}）`;
        }

        return `${eventTitle}：${optionLabel}`;
      }

      function applyPendingLevelModifier() {
        const modifier = model.run.pendingLevelModifier ? { ...model.run.pendingLevelModifier } : null;
        model.run.pendingLevelModifier = null;
        return modifier;
      }

      function getCurrentLevelModifier() {
        return model.state?.activeLevelModifier ?? model.loadingLevelModifier ?? null;
      }

      function isToolDisabledByModifier(tool) {
        const modifier = getCurrentLevelModifier();
        if (modifier?.type === "disableTool" && modifier.tool === tool) return true;
        const ascension = getAscensionConfig();
        return Boolean(isAscensionMode() && tool === "shuffle" && ascension?.disableShuffle);
      }

      function getActiveLevelModifierText() {
        const modifier = getCurrentLevelModifier();
        return modifier?.label ?? "";
      }

      function describeSpecialEventEffect(effect) {
        if (effect.type === "coins") {
          const prefix = effect.amount >= 0 ? "+" : "";
          return `立即获得 ${prefix}${effect.amount} 铜钱。`;
        }
        if (effect.type === "tool") {
          const toolLabel = FRIEND_DEMO_TOOLS.find((tool) => tool.key === effect.tool)?.label ?? effect.tool;
          return `立即补充 ${effect.amount} 次${toolLabel}。`;
        }
        if (effect.type === "comboBonus") {
          return `下一关 ${TYPE_LABELS[effect.combo]} 额外 +${effect.amount} 分。`;
        }
        if (effect.type === "shield") {
          return `立即补充 ${effect.amount} 次护符。`;
        }
        if (effect.type === "reserve") {
          return `下一关备用位 +${effect.amount}。`;
        }
        if (effect.type === "river") {
          return `下一关牌河上限 +${effect.amount}。`;
        }
        if (effect.type === "modifier") {
          return `下一关带入「${effect.modifier.label}」，通关奖励 +${effect.modifier.rewardCoins ?? 0} 铜钱。`;
        }
        return "立即生效。";
      }

      function getFriendDemoSlotLimit(levelIndex) {
        return levelIndex < 3 ? FRIEND_DEMO_TUTORIAL_SLOT_LIMIT : FRIEND_DEMO_FULL_SLOT_LIMIT;
      }

      function getFriendDemoLevelMode(levelIndex) {
        return levelIndex < FRIEND_DEMO_TUTORIAL_COMBOS.length ? "tutorial" : "mountain";
      }

      function getFriendDemoDifficultyProfile(levelIndex = model.levelIndex) {
        if (!isFriendDemoMode()) return null;
        if (getFriendDemoLevelMode(levelIndex) !== "mountain") return null;
        return FRIEND_DEMO_DIFFICULTY_PROFILES.find((profile) => profile.levelIndex === levelIndex) ?? null;
      }

      function getAscensionDifficultyProfile(levelIndex = model.levelIndex) {
        if (!isAscensionMode()) return null;
        const ascension = getAscensionConfig();
        const ascensionBaseLevelIndex = Math.min(
          FRIEND_DEMO_DIFFICULTY_PROFILES[FRIEND_DEMO_DIFFICULTY_PROFILES.length - 1]?.levelIndex ?? levelIndex,
          levelIndex + 4,
        );
        const baseProfile =
          FRIEND_DEMO_DIFFICULTY_PROFILES.find((profile) => profile.levelIndex === ascensionBaseLevelIndex)
          ?? FRIEND_DEMO_DIFFICULTY_PROFILES[FRIEND_DEMO_DIFFICULTY_PROFILES.length - 1];
        if (!ascension || !baseProfile) return null;
        const ascensionLabels = [
          "压场起手",
          "连压试探",
          "高阶换气",
          "风场上桌",
          "紧局成型",
          "高压接力",
          "风压转折",
          "连战门前",
          "周目决战",
        ];
        return {
          ...baseProfile,
          label: `${ascension.name} · ${ascensionLabels[Math.max(0, Math.min(ascensionLabels.length - 1, levelIndex - 4))] ?? "高阶周目"}`,
          tileCount: Math.min(MOUNTAIN_TILE_COUNT_RANGE.max, (baseProfile.tileCount ?? 240) + ascension.extraTileCount),
          stackDepth: Math.min(6, (baseProfile.stackDepth ?? 5) + (ascension.level >= 2 ? 1 : 0)),
          huPacks: Math.min(3, (baseProfile.huPacks ?? 0) + (ascension.level >= 2 ? 1 : 0)),
          gangPacks: Math.min(3, baseProfile.gangPacks ?? 2),
          orphanBudget: Math.max(baseProfile.orphanBudget ?? 4, (baseProfile.orphanBudget ?? 4) + ascension.level - 1),
          honorWeight: Math.min(100, (baseProfile.honorWeight ?? 60) + ascension.extraHonorWeight),
        };
      }

      function getAscensionLevelModifier(levelIndex = model.levelIndex) {
        if (!isAscensionMode()) return null;
        const ascension = getAscensionConfig();
        if (!ascension?.forcedModifierInterval || !ascension.forcedModifier) return null;
        const levelOrder = model.levelsConfig.levels[levelIndex]?.order ?? levelIndex + 1;
        return levelOrder % ascension.forcedModifierInterval === 0 ? { ...ascension.forcedModifier } : null;
      }

      function getEndlessLayerOrder() {
        return Math.max(ENDLESS_START_LAYER, model.run.endlessLayer ?? ENDLESS_START_LAYER);
      }

      function getEndlessLevelIndex(layer = getEndlessLayerOrder()) {
        const backHalfStart = Math.max(0, FRIEND_DEMO_LEVEL_COUNT - 10);
        const backHalfCount = Math.max(1, Math.min(10, model.levelsConfig.levels.length - backHalfStart));
        return backHalfStart + ((layer - ENDLESS_START_LAYER) % backHalfCount);
      }

      function getEndlessDifficultyProfile(layer = getEndlessLayerOrder()) {
        if (!isEndlessMode()) return null;
        const baseIndex = getEndlessLevelIndex(layer);
        const baseProfile =
          FRIEND_DEMO_DIFFICULTY_PROFILES.find((profile) => profile.levelIndex === baseIndex)
          ?? FRIEND_DEMO_DIFFICULTY_PROFILES[FRIEND_DEMO_DIFFICULTY_PROFILES.length - 1];
        const cycle = Math.max(0, Math.floor((layer - ENDLESS_START_LAYER) / 10));
        return {
          ...baseProfile,
          levelIndex: baseIndex,
          label: `无尽第 ${layer} 层`,
          tileCount: Math.min(MOUNTAIN_TILE_COUNT_RANGE.max, (baseProfile.tileCount ?? 300) + cycle * 18),
          stackDepth: Math.min(6, (baseProfile.stackDepth ?? 6) + (cycle > 0 ? 1 : 0)),
          huPacks: Math.min(3, (baseProfile.huPacks ?? 1) + Math.floor(cycle / 2)),
          gangPacks: Math.min(3, (baseProfile.gangPacks ?? 2) + Math.floor(cycle / 3)),
          orphanBudget: Math.max(baseProfile.orphanBudget ?? 8, 8 + cycle),
          honorWeight: Math.min(100, (baseProfile.honorWeight ?? 60) + cycle * 6),
        };
      }

      function getEndlessChapterProfile(layer = getEndlessLayerOrder()) {
        if (!isEndlessMode()) return null;
        const chapter = Math.max(1, Math.floor((layer - ENDLESS_START_LAYER) / 5) + 1);
        const phase = ((chapter - 1) % 8) + 1;
        const chapterStart = ENDLESS_START_LAYER + (chapter - 1) * 5;
        const chapterEnd = chapterStart + 4;
        const bossLayer = chapterStart + 4;
        const chapterThemes = [

      function mergeBossGoals(goals = []) {
        const merged = new Map();
        goals.forEach((goal) => {
          if (!goal || !goal.type) return;
          const key = goal.type === "combo_count"
            ? `${goal.type}:${goal.combo}`
            : goal.type;
          const current = merged.get(key);
          if (!current) {
            merged.set(key, { ...goal });
            return;
          }
          if (goal.type === "combo_count" || goal.type === "score_target") {
            current.target = Math.max(current.target ?? 0, goal.target ?? 0);
          }
        });
        return Array.from(merged.values());
      }

      function getEffectiveMountainTuningForLevel(level, levelIndex = model.levelIndex) {
        const profile = getDailyDifficultyProfile()
          ?? getEndlessDifficultyProfile()
          ?? getAscensionDifficultyProfile(levelIndex)
          ?? getFriendDemoDifficultyProfile(levelIndex);
        if (!profile) return model.mountainTuning;
        const activeModifier = model.state?.activeLevelModifier ?? model.loadingLevelModifier;
        const highPressureBonus = activeModifier?.type === "highPressure" ? 24 : 0;
        return {
          ...model.mountainTuning,
          tileCount: Math.min(MOUNTAIN_TILE_COUNT_RANGE.max, profile.tileCount + highPressureBonus),
          stackDepth: Math.min(6, profile.stackDepth + (highPressureBonus ? 1 : 0)),
          huPacks: profile.huPacks,
          gangPacks: profile.gangPacks,
          numberSuits: profile.numberSuits,

      function getFriendDemoFeaturedCombos(levelIndex) {
        if (isEndlessMode()) {
          const chapterProfile = getEndlessChapterProfile();
          if (chapterProfile?.featuredCombos?.length) return chapterProfile.featuredCombos;
        }
        if (isDailyMode()) {
          const dailyMutator = getDailyMutatorProfile();
          if (dailyMutator?.featuredCombos?.length) return dailyMutator.featuredCombos;
        }
        if (isAscensionMode()) {
          const buildFocus = getAscensionBuildFocus();
          if (buildFocus?.featuredCombos?.length) return buildFocus.featuredCombos;
        }
        const tutorialCombo = !isAscensionMode() ? FRIEND_DEMO_TUTORIAL_COMBOS[levelIndex] : null;
        if (tutorialCombo) return [tutorialCombo];
        return model.levelsConfig.levels[levelIndex]?.featuredCombos ?? [];
      }

      function getFriendDemoRewardPool(levelIndex) {
        const archetypeRewardPool = getRunArchetypeRewardPool(levelIndex);
        const routeMasteryRewards = getRouteMasteryRewardPool();
        const preferredRoutePool = getPreferredRouteRewardPool();
        if (isEndlessMode()) {
          const chapterProfile = getEndlessChapterProfile();
          const chapterStep = (getEndlessLayerOrder() - ENDLESS_START_LAYER) % 5;
          return [...archetypeRewardPool, ...routeMasteryRewards, ...(chapterProfile?.rewardBias ?? []), ...(ENDLESS_REWARD_PHASE_BIAS[chapterProfile?.phase ?? 1] ?? []), ...(ENDLESS_REWARD_STEP_BIAS[chapterStep] ?? []), ...(preferredRoutePool
            ?? FRIEND_DEMO_ROUTE_REWARD_POOLS[levelIndex]
            ?? FRIEND_DEMO_ROUTE_REWARD_POOLS[18]
            ?? (model.levelsConfig.levels[levelIndex]?.rewardPool ?? []))].filter((rewardId, index, array) => rewardId && array.indexOf(rewardId) === index);
        }
        if (isDailyMode()) {
          const dailyMutator = getDailyMutatorProfile();
          const routeRewardPoolKeys = Object.keys(FRIEND_DEMO_ROUTE_REWARD_POOLS).map(Number).sort((a, b) => a - b);
          const fallbackRouteKey = routeRewardPoolKeys[(hashText(model.run.dailySeed || "daily") + levelIndex) % routeRewardPoolKeys.length];
          const dailyOrder = model.levelsConfig?.levels?.[getDailyLevelIndex(levelIndex)]?.order ?? levelIndex + 1;
          const dailyLateRewardBias = getThresholdBiasChain(DAILY_REWARD_ORDER_BIAS, dailyOrder);
          return [...archetypeRewardPool, ...routeMasteryRewards, ...(dailyMutator?.rewardBias ?? []), ...dailyLateRewardBias, ...(preferredRoutePool
            ?? FRIEND_DEMO_ROUTE_REWARD_POOLS[levelIndex]
            ?? FRIEND_DEMO_ROUTE_REWARD_POOLS[fallbackRouteKey]
            ?? (model.levelsConfig.levels[levelIndex]?.rewardPool ?? []))].filter((rewardId, index, array) => rewardId && array.indexOf(rewardId) === index);
        }
        if (!isAscensionMode() && levelIndex === 2) return [FRIEND_DEMO_FIRST_REWARD_ID];
        const mainlineOrder = model.levelsConfig?.levels?.[levelIndex]?.order ?? levelIndex + 1;
        const mainlineLateRewardBias = !isAscensionMode()
          ? getThresholdBiasChain(MAINLINE_REWARD_ORDER_BIAS, mainlineOrder)
          : [];
        if (preferredRoutePool?.length) {
          return [...archetypeRewardPool, ...routeMasteryRewards, ...mainlineLateRewardBias, ...preferredRoutePool].filter((rewardId, index, array) => rewardId && array.indexOf(rewardId) === index);
        }
        if (FRIEND_DEMO_ROUTE_REWARD_POOLS[levelIndex]) {
          return [...archetypeRewardPool, ...routeMasteryRewards, ...mainlineLateRewardBias, ...FRIEND_DEMO_ROUTE_REWARD_POOLS[levelIndex]].filter((rewardId, index, array) => rewardId && array.indexOf(rewardId) === index);
        }
        const rewardPool = model.levelsConfig.levels[levelIndex]?.rewardPool ?? [];
        const normalized = rewardPool.map((rewardId) => rewardId === "vision_plus_1" ? FRIEND_DEMO_DISCARD_REWARD_ID : rewardId);
        return isAscensionMode()
          ? [...archetypeRewardPool, ...routeMasteryRewards, ...getThresholdBiasChain(ASCENSION_REWARD_LEVEL_BIAS, levelIndex), ...normalized, ...getAscensionRewardPool()].filter((rewardId, index, array) => rewardId && array.indexOf(rewardId) === index)
          : [...archetypeRewardPool, ...routeMasteryRewards, ...mainlineLateRewardBias, ...normalized].filter((rewardId, index, array) => rewardId && array.indexOf(rewardId) === index);
      }

      function getLatestThresholdBias(biasMap, currentValue) {
        const matchedEntry = Object.entries(biasMap)
          .map(([startValue, entries]) => [Number(startValue), entries])
          .filter(([startValue]) => currentValue >= startValue)
          .sort((a, b) => b[0] - a[0])[0];
        return matchedEntry ? [...matchedEntry[1]] : [];
      }

      function getThresholdBiasChain(biasMap, currentValue) {
        return Object.entries(biasMap)
          .map(([startValue, entries]) => [Number(startValue), entries])
          .filter(([startValue]) => currentValue >= startValue)
          .sort((a, b) => a[0] - b[0])
          .flatMap(([, entries]) => entries)
          .filter((entry, index, array) => entry && array.indexOf(entry) === index);
      }

      function getRunArchetypeRewardPool(levelIndex = model.levelIndex) {
        const config = getRunArchetypeConfig(model.runArchetype);
        const lateBias = config.label === "胡流"
          ? getLateRouteBiasForLabel("胡流", levelIndex)
          : config.label === "信息流"
            ? getLateRouteBiasForLabel("信息流", levelIndex)
            : config.label === "道具流"
              ? getLateRouteBiasForLabel("道具流", levelIndex)
              : [];
        return [...(config.rewardBias ?? []), ...lateBias];
      }

      function getPreferredRouteRewardPool(levelIndex = model.levelIndex) {
        const routeMasteryLevel = Math.max(0, Math.min(2, Number(model.routeMasteryLevel) || 0));
        if (routeMasteryLevel <= 0 || !model.preferredRoute) return null;
        if (model.preferredRoute.includes("胡流")) return ["hu_coin_plus_15"];
        if (model.preferredRoute.includes("信息流")) return ["info_vision_plus_1"];
        if (model.preferredRoute.includes("河控")) return ["gang_score_plus_25"];
        if (model.preferredRoute.includes("道具流")) return ["tool_mix_supply"];
        if (model.preferredRoute.includes("救场")) return ["shield_plus_1"];
        return null;
      }

      function getPreferredRouteLateRewardBias(levelIndex = model.levelIndex) {
        if (!model.preferredRoute) return [];
        if (model.preferredRoute.includes("胡流")) return getLateRouteBiasForLabel("胡流", levelIndex);
        if (model.preferredRoute.includes("信息流")) return getLateRouteBiasForLabel("信息流", levelIndex);
        if (model.preferredRoute.includes("河控")) return getLateRouteBiasForLabel("河控流", levelIndex);
        if (model.preferredRoute.includes("道具流")) return getLateRouteBiasForLabel("道具流", levelIndex);
        if (model.preferredRoute.includes("救场")) return getLateRouteBiasForLabel("救场流", levelIndex);
        return [];
      }

      function getLateRouteBiasForLabel(label, levelIndex = model.levelIndex) {
        if (isEndlessMode()) {
          const chapterProfile = getEndlessChapterProfile();
          if ((chapterProfile?.chapter ?? 0) < 4) return [];
          return [...(LATE_ROUTE_REWARD_BIAS.endless[label] ?? [])];
        }
        if (isDailyMode()) {
          const dailyOrder = model.levelsConfig?.levels?.[getDailyLevelIndex(levelIndex)]?.order ?? levelIndex + 1;
          if (dailyOrder < 12) return [];
          return [...(LATE_ROUTE_REWARD_BIAS.daily[label] ?? [])];
        }
        if (isAscensionMode()) {
          if (levelIndex < 10) return [];
          return [...(LATE_ROUTE_REWARD_BIAS.ascension[label] ?? [])];
        }
        const mainlineOrder = model.levelsConfig?.levels?.[levelIndex]?.order ?? levelIndex + 1;
        if (mainlineOrder < 13) return [];
        return [...(LATE_ROUTE_REWARD_BIAS.mainline[label] ?? [])];
      }

      function getRouteMasteryRewardPool() {
        const routeMasteryLevel = Math.max(0, Math.min(2, Number(model.routeMasteryLevel) || 0));
        if (routeMasteryLevel < 2) return [];
        if (model.preferredRoute.includes("胡流")) return ["hu_score_plus_18"];
        if (model.preferredRoute.includes("信息流")) return ["info_shuffle_plus_1"];
        if (model.preferredRoute.includes("河控")) return ["hu_coin_plus_15"];
        if (model.preferredRoute.includes("道具流")) return [FRIEND_DEMO_DISCARD_REWARD_ID];
        if (model.preferredRoute.includes("救场")) return ["reserve_plus_1"];
        return [];
      }

      function getPreferredRouteStartBonus() {
        const runArchetype = getRunArchetypeConfig(model.runArchetype);
        const routeMasteryLevel = Math.max(0, Math.min(2, Number(model.routeMasteryLevel) || 0));
        const masteryTail = routeMasteryLevel >= 2 ? " 局外偏好第二档轻补一刀。" : routeMasteryLevel >= 1 ? " 局外偏好第一档轻补一刀。" : "";
        const runStartBonus = runArchetype.startBonus ?? {};
        if (model.preferredRoute.includes("胡流")) {
          return {
            ...runStartBonus,
            bonuses: { ...(runStartBonus.bonuses ?? {}), hu: (runStartBonus.bonuses?.hu ?? 0) + routeMasteryLevel },
            coins: (runStartBonus.coins ?? 0) + (routeMasteryLevel >= 2 ? 5 : 0),
            summary: `${runStartBonus.summary ?? `${runArchetype.label}开局已生效。`} 局外偏好轻补胡牌收口。${masteryTail}`.trim(),
          };
        }
        if (model.preferredRoute.includes("信息流")) {
          return {
            ...runStartBonus,
            tools: { ...(runStartBonus.tools ?? {}), vision: (runStartBonus.tools?.vision ?? 0) + 1 },
            summary: `${runStartBonus.summary ?? `${runArchetype.label}开局已生效。`} 局外偏好轻补看山。${masteryTail}`.trim(),
          };
        }
        if (model.preferredRoute.includes("河控")) {
          return {
            ...runStartBonus,
            riverLimit: (runStartBonus.riverLimit ?? 0) + (routeMasteryLevel >= 2 ? 1 : 0),
            bonuses: { ...(runStartBonus.bonuses ?? {}), gang: (runStartBonus.bonuses?.gang ?? 0) + routeMasteryLevel },
            summary: `${runStartBonus.summary ?? `${runArchetype.label}开局已生效。`} 局外偏好轻补牌河和杠路。${masteryTail}`.trim(),
          };
        }
        if (model.preferredRoute.includes("道具流")) {
          return {
            ...runStartBonus,
            tools: {
              ...(runStartBonus.tools ?? {}),
              discard: (runStartBonus.tools?.discard ?? 0) + 1,
              undo: (runStartBonus.tools?.undo ?? 0) + (routeMasteryLevel >= 2 ? 1 : 0),
            },
            summary: `${runStartBonus.summary ?? `${runArchetype.label}开局已生效。`} 局外偏好轻补整理工具。${masteryTail}`.trim(),
          };
        }
        if (model.preferredRoute.includes("救场")) {
          return {
            ...runStartBonus,
            shields: (runStartBonus.shields ?? 0) + 1,
            reserve: (runStartBonus.reserve ?? 0) + (routeMasteryLevel >= 2 ? 1 : 0),
            summary: `${runStartBonus.summary ?? `${runArchetype.label}开局已生效。`} 局外偏好轻补容错缓冲。${masteryTail}`.trim(),
          };
        }
        return runStartBonus;
      }

        const layouts = {
          peng: [
            { suit: "tong", rank: 6, x: 176, y: 130 },

            { suit: "tong", rank: 6, x: 288, y: 130 },
