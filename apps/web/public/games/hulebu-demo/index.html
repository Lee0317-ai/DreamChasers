        return candidate.suit ?? findTile(candidate.tileIds[0])?.suit ?? "wan";
      }

      function getRemainingTileCounts() {
        const counts = createEmptySuitCounts();
        for (const tile of model.state.tiles) {
          if (tile.location !== "board") continue;
          counts[tile.suit].total += 1;
          counts[tile.suit].ranks[tile.rank] += 1;
        }
        return counts;
      }

      function createEmptySuitCounts() {
        const counts = {};
        for (const suit of ALL_SUITS) {
          counts[suit] = emptySuitCount();
        }
        return counts;
      }

      function createEmptySuitTotals() {
        const counts = {};
        for (const suit of ALL_SUITS) {
          counts[suit] = 0;
        }
        return counts;
      }

      function emptySuitCount() {
        const ranks = {};
        for (let rank = 1; rank <= 9; rank += 1) ranks[rank] = 0;
        return { total: 0, ranks };
      }

      function clampSlotLimit(value) {
        return Math.max(1, Math.min(MAX_SLOT_LIMIT, value));
      }

      function isVisibleStackTop(tile) {
        if (!tile.stackColumn || tile.location !== "board") return true;
        return getStackColumnTiles(tile).every((other) => other.id === tile.id || getTileStackOrder(other) < getTileStackOrder(tile));
      }

      function isVisibleStackDisplayTile(tile) {
        if (!tile.stackColumn || tile.location !== "board") return true;
        return getStackPreviewDepth(tile) <= getStackVisiblePreviewDepth(tile);
      }

      function getStackPreviewDepth(tile) {
        if (!tile.stackColumn || tile.location !== "board") return 0;
        return getStackPreviewDepthForTiles(tile, model.state.tiles);
      }

      function getStackPreviewDepthForTiles(tile, tiles) {
        if (!tile.stackColumn) return 0;
        return tiles.filter((other) => (
          (!other.location || other.location === "board")
          && other.stackColumn
          && other.stackColumnId === tile.stackColumnId
          && getTileStackOrder(other) > getTileStackOrder(tile)
        )).length;
      }

      function getHiddenStackDepth(tile) {
        if (!tile.stackColumn || !isVisibleStackTop(tile)) return 0;
        return getStackColumnTiles(tile).filter((other) => getTileStackOrder(other) < getTileStackOrder(tile)).length;
      }

      function getStackColumnTiles(tile) {
        return model.state.tiles.filter((other) => (
          other.location === "board"
          && other.stackColumn
          && other.stackColumnId === tile.stackColumnId
        ));
      }

      function getBridgeUnlockCount(tile) {
        if (!tile.stackBridge) return 0;
        const tilesWithoutBridge = model.state.tiles.map((other) => (
          other.id === tile.id ? { ...other, location: "slot" } : other
        ));
        return model.state.tiles.filter((other) => {
          if (other.location !== "board" || !other.stackColumn || !isVisibleStackTop(other)) return false;
          if (!(other.blockedBy ?? []).includes(tile.id)) return false;
          if (!getMountainVisualIntersectionRect(other, tile, model.state.tiles)) return false;
          if (!isTileBlocked(other.id)) return false;
          return !isTileBlockedInTiles(other.id, tilesWithoutBridge);
        }).length;
      }

      function isTileBlocked(tileId) {
        return isTileBlockedInTiles(tileId, model.state.tiles);
      }

      function isTileBlockedInTiles(tileId, tiles) {
        const originalTiles = model.state.tiles;
        if (tiles !== originalTiles) model.state.tiles = tiles;
        const result = isTileBlockedForCurrentState(tileId);
        if (tiles !== originalTiles) model.state.tiles = originalTiles;
        return result;
      }

      function isTileBlockedForCurrentState(tileId) {
        const tile = findTile(tileId);
        if (!tile || tile.location !== "board") return false;
        if (tile.looseMountainTile) return false;
        if (tile.stackColumn && !isVisibleStackTop(tile)) return true;
        if (isTileCoveredByHigherTile(tile)) return true;
        return tile.blockedBy.some((blockerId) => {
          const blocker = findTile(blockerId);
          if (!blocker || blocker.location !== "board") return false;
          if (model.mode !== "mountain") return true;
          const rect = getMountainVisualIntersectionRect(tile, blocker, model.state.tiles);
          const { width, height } = getMountainRuleTileSize();
          return Boolean(rect) && getUnionArea([rect]) / (width * height) >= BLOCKED_COVER_RATIO;
        });
      }

      function getCurrentCoverRatio(tile) {
        if (tile.looseMountainTile) return 0;
        const tileIndex = model.state.tiles.findIndex((item) => item.id === tile.id);
        const tileOrder = getTileStackOrder(tile, tileIndex);
        const { width, height } = getRuleTileSize();
        const coverRects = [];

        model.state.tiles.forEach((other, otherIndex) => {
          if (other.id === tile.id || other.location !== "board") return;
          if (getTileStackOrder(other, otherIndex) <= tileOrder) return;

          const rect = model.mode === "mountain"
            ? getMountainVisualIntersectionRect(tile, other, model.state.tiles)
            : getIntersectionRect(tile, other, width, height);
          if (rect) coverRects.push(rect);
        });

        return getUnionArea(coverRects) / (width * height);
      }

      function isTileCoveredByHigherTile(tile) {
        if (tile.looseMountainTile) return false;
        const tileIndex = model.state.tiles.findIndex((item) => item.id === tile.id);
        const tileOrder = getTileStackOrder(tile, tileIndex);

        return model.state.tiles.some((other, otherIndex) => {
          if (other.id === tile.id || other.location !== "board") return false;
          if (getTileStackOrder(other, otherIndex) <= tileOrder) return false;
          const { width, height } = getRuleTileSize();
          if (model.mode === "mountain") {
            const rect = getMountainVisualIntersectionRect(tile, other, model.state.tiles);
            return Boolean(rect) && getUnionArea([rect]) / (width * height) >= BLOCKED_COVER_RATIO;
          }
          return Boolean(getIntersectionRect(tile, other, width, height));
        });
      }

      function getMountainRuleTileSize() {
        return MOUNTAIN_RULE_TILE_SIZE;
      }

      function getRuleTileSize() {
        if (model.mode === "mountain") return getMountainRuleTileSize();
        const { tileWidth, tileHeight } = model.levelsConfig.coordinateSystem;
        return { width: tileWidth, height: tileHeight };
      }

      function syncTileLocations() {
        for (const tileId of model.state.slot) {
          const tile = findTile(tileId);
          if (tile) tile.location = "slot";
        }
        for (const tileId of model.state.reserve) {
          const tile = findTile(tileId);
          if (tile) tile.location = "reserve";
        }
        for (const tileId of model.state.river ?? []) {
          const tile = findTile(tileId);
          if (tile) tile.location = "river";
        }
      }

      function isLevelClear() {
        return model.state.tiles.every((tile) => tile.location !== "board");
      }

      function canClearCurrentLevel() {
        return hasCompletedFriendDemoTutorialCombo(model.levelIndex);
      }

      function isFriendDemoTutorialLevel(levelIndex = model.levelIndex) {
        return isFriendDemoMode() && getFriendDemoLevelMode(levelIndex) === "tutorial";
      }

      function getCurrentClearRequirementText() {
        const requiredCombo = getFriendDemoTutorialRequiredCombo(model.levelIndex);
        if (!requiredCombo) return "";
        return `教学目标：请点击 ${TYPE_LABELS[requiredCombo]} 完成本关。`;
      }

      function isBossGoalComplete() {
        const goals = model.state.bossGoals ?? [];
        if (goals.length === 0) return true;
        return goals.every(isBossGoalItemComplete);
      }

      function getBossGoalMissingText() {
        const goals = model.state.bossGoals ?? [];
        if (goals.length === 0) return "";
        const missing = goals
          .filter((goal) => !isBossGoalItemComplete(goal))
          .map(formatBossGoalProgress);
        return `牌山已清空，但 Boss 目标未完成：${missing.join("，")}`;
      }

      function getBossGoalProgressKeys(goal) {
        if (goal.type === "combo_count") return [`combo:${goal.combo}`];
        if (goal.type === "suit_set") return goal.suits.map((suit) => `suit:${suit}`);
        if (goal.type === "score_target") return ["score"];
        return [];
      }

      function formatBossGoalProgress(goal) {
        if (goal.type === "suit_set") {
          return `三门齐 ${goal.suits.map((suit) => `${SUIT_LABELS[suit]} ${model.state.suitComboCounts[suit] ?? 0}/${goal.eachTarget}`).join(" · ")}`;
        }

        const current = getBossGoalCurrentValue(goal);
        if (goal.type === "combo_count") {
          return `${TYPE_LABELS[goal.combo]} ${current}/${goal.target}`;
        }
        return `积分 ${current}/${goal.target}`;
      }

      function isBossGoalItemComplete(goal) {
        if (goal.type === "suit_set") {
          return goal.suits.every((suit) => (model.state.suitComboCounts[suit] ?? 0) >= goal.eachTarget);
        }
        return getBossGoalCurrentValue(goal) >= goal.target;
      }

      function getBossGoalCurrentValue(goal) {
        if (goal.type === "combo_count") return model.state.comboCounts[goal.combo] ?? 0;
        if (goal.type === "score_target") return model.state.score;
        return 0;
      }

      function currentLevel() {
        return model.levelsConfig.levels[model.levelIndex];
      }

      function isLastLevel() {
        return model.levelIndex >= getPlayableLevelCount() - 1;
      }

      function getNextLevelIndex() {
        return Math.min(model.levelIndex + 1, getPlayableLevelCount() - 1);
      }

      function getRewardPoolForCurrentLevel() {
        return isFriendDemoMode() ? getFriendDemoRewardPool(model.levelIndex) : currentLevel().rewardPool;
      }

      function shouldOfferRewardAfterLevel(levelIndex) {
        if (isFriendDemoMode()) {
          return [2, 5, 8].includes(levelIndex);
        }
        const order = model.levelsConfig.levels[levelIndex].order;
        const chapterStep = order % 10;
        return chapterStep === 3 || chapterStep === 6 || chapterStep === 9;
      }

      function isBossLevel(levelIndex = model.levelIndex) {
        return model.levelsConfig.levels[levelIndex].order % 10 === 0;
      }

      function getActiveBossGoals(levelIndex = model.levelIndex) {
        if (getFriendDemoDifficultyProfile(levelIndex)) return [];
        return getBossGoals(levelIndex) ?? [];
      }

      function getBossGoals(levelIndex) {
        if (!isBossLevel(levelIndex)) return null;
        const level = model.levelsConfig.levels[levelIndex];
        if (Array.isArray(level.bossGoals) && level.bossGoals.length > 0) {
          return level.bossGoals;
        }

        const chapter = Math.max(1, Math.ceil(level.order / 10));
        return [
          { type: "combo_count", combo: "gang", target: chapter },
          { type: "combo_count", combo: "peng", target: chapter + 1 },
          { type: "score_target", target: 100 + chapter * 20 },
        ];
      }

      function findTile(tileId) {
        return model.state.tiles.find((tile) => tile.id === tileId);
      }

      function getBoardTiles() {
        return model.state.tiles.filter((tile) => tile.location === "board");
      }

      function findReward(rewardId) {
        if (rewardId === FRIEND_DEMO_FIRST_REWARD_ID) return createFriendDemoFixedReward();
        if (rewardId === FRIEND_DEMO_DISCARD_REWARD_ID) return createFriendDemoDiscardReward();
        return model.rewardsConfig.rewards.find((reward) => reward.id === rewardId);
      }

      function tileLabel(tile) {
        return getTileLabel(tile);
      }

      function getTileKey(tile) {
        return `${tile.suit}-${tile.rank}`;
      }

      function getTileLabel(tile) {
        if (tile.suit === "honor") return HONOR_LABELS[tile.rank] ?? `字${tile.rank}`;
        return `${tile.rank}${SUIT_LABELS[tile.suit]}`;
      }

      function getTileFaceHtml(tile) {
        if (tile.suit === "honor") {
          return `${escapeHtml(getTileLabel(tile))}<span class="suit">字</span>`;
        }
        return `${tile.rank}<span class="suit">${SUIT_LABELS[tile.suit]}</span>`;
      }

      function escapeHtml(text) {
        return text.replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        })[char]);
      }
    </script>
  </body>
</html>
