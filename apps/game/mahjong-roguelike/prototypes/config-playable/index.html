        let generatedTiles = attachMountainBlockers(tiles);
        if (shouldRebalanceRuntimeInitialMixedWindow(level, mountainTemplate)) {
          generatedTiles = rebalanceRuntimeInitialMixedWindow(generatedTiles, random);
        }
        validateSolutionPath(generatedTiles);
        validateBossGoalsFromSolution(generatedTiles, bossGoals);
        assertFriendDemoOrphanRiskBudget(generatedTiles, model.levelIndex);
        return generatedTiles;
      }

      function getDefaultMountainTileCount(level) {
        return MOUNTAIN_DEFAULT_TILE_COUNT;
      }

      function shouldRebalanceRuntimeInitialMixedWindow(level, mountainTemplate = null) {
        if (isFriendDemoBossTrialLevel()) return true;
        if (mountainTemplate?.id === "suspended-waist") return true;
        const profile = getFriendDemoDifficultyProfile(model.levelIndex);
        if (profile && (profile.huPacks ?? 0) === 0 && getActiveBossGoals(model.levelIndex).length === 0) return true;
        return !hasFeaturedOrBossMountainGoals(level, getActiveBossGoals(model.levelIndex));
      }

      function getMountainTemplateDefinition(templateId) {
        return {
          id: templateId,
          label: MOUNTAIN_TEMPLATE_LABELS[templateId] ?? templateId,
        };
      }

      function selectMountainTemplate(level, tuning) {
        const configuredTemplateId = normalizeMountainTemplateId(tuning.templateId);
        if (configuredTemplateId !== "auto") return getMountainTemplateDefinition(configuredTemplateId);

        const templateIds = getAutoMountainTemplateIds();
        const templateIndex = model.prototypeView === "tuner"
          ? (level.order - 1) % templateIds.length
          : hashText(getAutoMountainTemplateSeedText(level, tuning)) % templateIds.length;
        return getMountainTemplateDefinition(templateIds[templateIndex]);
      }

      function getAutoMountainTemplateIds() {
        return shouldUseHighPressureMountainAutoPool() || getCurrentLevelModifier()?.type === "highPressure"
          ? MOUNTAIN_HIGH_PRESSURE_AUTO_TEMPLATE_IDS
          : MOUNTAIN_AUTO_TEMPLATE_IDS;
      }

      function shouldUseHighPressureMountainAutoPool(levelIndex = model.levelIndex) {
        if (isEndlessMode()) return true;
        if (!isFriendDemoMode()) return false;
        return levelIndex >= 7 && levelIndex < FRIEND_DEMO_LEVEL_COUNT;
      }

      function getMountainTemplateGenerationCandidates(level, tuning) {
        const selectedTemplate = selectMountainTemplate(level, tuning);
        if (normalizeMountainTemplateId(tuning.templateId) !== "auto") return [selectedTemplate];

        return [
          selectedTemplate,
          ...getAutoMountainTemplateIds()
            .filter((templateId) => templateId !== selectedTemplate.id)
            .map(getMountainTemplateDefinition),
        ];
      }

      function shouldRetryAutoMountainTemplate(level, tuning, generatedTiles) {
        if (normalizeMountainTemplateId(tuning.templateId) !== "auto") return false;
        if (model.prototypeView !== "play") return false;
        return (
          getGeneratedInitialAvailableCount(generatedTiles) > MOUNTAIN_INITIAL_AVAILABLE_TARGET
          || getGeneratedInitialCompleteSolutionGroups(generatedTiles).length > 0
        );
      }

      function getGeneratedInitialAvailableCount(tiles) {
        const originalState = model.state;
        model.state = {
          tiles,
          slot: [],
          reserve: [],
          slotLimit: MAX_SLOT_LIMIT,
          reserveLimit: 0,
          shields: 0,
          firstProtect: false,
          score: 0,
          coins: 0,
          comboCounts: { chi: 0, peng: 0, gang: 0, hu: 0 },
          suitComboCounts: createEmptySuitTotals(),
          bossGoals: [],
          tools: { shuffle: 0, undo: 0, discard: 0, vision: 0 },
          bonuses: {},
          history: [],
          visionActive: false,
          phase: "playing",
          recentBossProgress: [],
        };
        const availableCount = tiles.filter((tile) => !isTileBlocked(tile.id)).length;
        model.state = originalState;
        return availableCount;
      }

      function getGeneratedInitialCompleteSolutionGroups(tiles) {
        const originalState = model.state;
        model.state = {
          tiles,
          slot: [],
          reserve: [],
          slotLimit: MAX_SLOT_LIMIT,
          reserveLimit: 0,
          shields: 0,
          firstProtect: false,
          score: 0,
          coins: 0,
          comboCounts: { chi: 0, peng: 0, gang: 0, hu: 0 },
          suitComboCounts: createEmptySuitTotals(),
          bossGoals: [],
          tools: { shuffle: 0, undo: 0, discard: 0, vision: 0 },
          bonuses: {},
          history: [],
          visionActive: false,
          phase: "playing",
          recentBossProgress: [],
        };
        const initialSolutionGroupCounts = tiles
          .filter((tile) => !isTileBlocked(tile.id))
          .reduce((counts, tile) => {
            const key = tile.solutionGroup ?? tile.sourcePackage ?? tile.id;
            counts.set(key, (counts.get(key) ?? 0) + 1);
            return counts;
          }, new Map());
        model.state = originalState;
        return [...initialSolutionGroupCounts.entries()]
          .filter(([, count]) => count >= 3)
          .map(([group]) => group);
      }

      function getAutoMountainTemplateSeedText(level, tuning) {
        if (isEndlessMode()) return `${level.id}:endless:${getEndlessLayerOrder()}:${tuning.seed || model.autoMountainTemplateSeed || "auto"}`;
        if (isDailyMode()) return `${level.id}:daily:${model.run.dailySeed || "today"}:${tuning.seed || "daily"}`;
        if (tuning.seed) return `${level.id}:${level.order}:${tuning.seed}`;
        if (model.prototypeView === "play") {
          return `${level.id}:${level.order}:${model.autoMountainTemplateSeed || "auto"}`;
        }
        return `${level.id}:${level.order}`;
      }

      function getMountainGenerationSeedText(level, tuning) {
        if (isEndlessMode()) return `${level.id}:endless:${getEndlessLayerOrder()}:${tuning.seed || model.autoMountainTemplateSeed || "auto"}`;
        if (isDailyMode()) return `${level.id}:daily:${model.run.dailySeed || "today"}:${tuning.seed || "daily"}`;
        if (tuning.seed) return tuning.seed;
        if (model.prototypeView === "play" && model.autoMountainTemplateSeed) {
          return `${level.id}:${level.order}:${model.autoMountainTemplateSeed}`;
        }
        return `${level.id}:${level.order}`;
      }

      function createMountainPositions(random, targetTileCount, tuning, mountainTemplate = getMountainTemplateDefinition("center-tower")) {
        const positions = [];
        const anchors = getMountainActiveTemplateAnchors(getMountainTemplateAnchors(mountainTemplate.id));
        const stackCounts = getMountainStackCounts(targetTileCount - MOUNTAIN_MERGED_STACK_COUNT, anchors);

        anchors.forEach((anchor, index) => {
          const overlapProfile = createMountainStackOverlapProfile(index, random);
          addTemplateStackPositions(positions, random, {
            ...anchor,
            count: stackCounts[index],
            templateId: mountainTemplate.id,
            overlapProfile,
          }, tuning);
        });

        const bridgeGroups = createMountainBridgeGroups(random, positions, mountainTemplate.id);
        addMountainBridgePositions(positions, random, bridgeGroups, mountainTemplate.id);
        ensureMountainPositionCapacity(positions, random, targetTileCount);
        return shuffleTailPositions(positions, random, 0);
      }

      function createMountainBridgeGroups(random, positions, templateId) {
        const stackTops = getGeneratedStackTopPositions(positions)
          .filter((position) => !hasGeneratedHigherNonBridgeVisualOverlap(position, positions));
        const candidatePairs = [];

        for (let aIndex = 0; aIndex < stackTops.length; aIndex += 1) {
          for (let bIndex = aIndex + 1; bIndex < stackTops.length; bIndex += 1) {
            const first = stackTops[aIndex];
            const second = stackTops[bIndex];
            const distance = Math.hypot(first.visualX - second.visualX, first.visualY - second.visualY);
            const bridgeCoordinates = getMountainBridgeCoordinateCandidatesForColumns(first, second);
            if (bridgeCoordinates.length === 0 || distance > getMountainBridgeMaxDistance()) continue;
            candidatePairs.push({ first, second, bridgeCoordinates, distance, jitter: random() });
          }
        }

        const selected = [];
        const usedColumnIds = new Set();
        const placedBridges = [];
        candidatePairs
          .sort((a, b) => a.distance - b.distance || a.jitter - b.jitter)
          .forEach((pair) => {
            if (selected.length >= MOUNTAIN_MERGED_STACK_COUNT) return;
            if (usedColumnIds.has(pair.first.stackColumnId) || usedColumnIds.has(pair.second.stackColumnId)) return;
            const bridgeCoordinate = pair.bridgeCoordinates.find((coordinate) => (
              !hasMountainBridgeOverlap(coordinate, placedBridges)
            ));
            if (!bridgeCoordinate) return;
            const bridgePosition = { x: bridgeCoordinate.x, y: bridgeCoordinate.y };
            if (hasMountainBridgeOverlap(bridgePosition, placedBridges)) return;
            selected.push({
              id: `${templateId}-bridge-${selected.length + 1}`,
              columns: [pair.first, pair.second],
              bridgeCoordinate,
            });
            placedBridges.push(bridgePosition);
            usedColumnIds.add(pair.first.stackColumnId);
            usedColumnIds.add(pair.second.stackColumnId);
          });

        return selected;
      }

      function getMountainActiveTemplateAnchors(anchors) {
        const activeAnchors = anchors
          .map((anchor, index) => ({ anchor, index }))
          .sort((a, b) => (b.anchor.weight ?? 1) - (a.anchor.weight ?? 1) || a.index - b.index)
          .slice(0, Math.min(MOUNTAIN_ACTIVE_STACK_COUNT, anchors.length))
          .map((item) => item.anchor);
        const centerX = activeAnchors.reduce((sum, anchor) => sum + anchor.x, 0) / activeAnchors.length;
        const centerY = activeAnchors.reduce((sum, anchor) => sum + anchor.y, 0) / activeAnchors.length;
        return activeAnchors.map((anchor) => ({
          ...anchor,
          x: Math.round(centerX + (anchor.x - centerX) * MOUNTAIN_STACK_CLUSTER_PULL),
          y: Math.round(centerY + (anchor.y - centerY) * MOUNTAIN_STACK_CLUSTER_PULL),
        }));
      }

      function getGeneratedStackTopPositions(positions) {
        return positions
          .filter((position) => position.stackColumn && isVisibleGeneratedStackTop(position, positions))
          .map((position) => {
            const visual = getMountainGeneratedVisualPosition(position, positions);
            return {
              ...position,
              visualX: visual.x,
              visualY: visual.y,
            };
          });
      }

      function getMountainGeneratedVisualPosition(position, positions) {
        const tileIndex = positions.findIndex((item) => isSameGeneratedPosition(item, position));
        const layerLiftX = position.stackBridge ? 0 : position.layer * -0.58;
        const layerLiftY = position.stackBridge ? 0 : position.layer * -1.28;
        const stackPreviewOffset = getGeneratedStackPreviewVisualOffset(position, positions);
        const weaveX = position.stackBridge ? 0 : position.stackColumn ? stackPreviewOffset.x : ((tileIndex % 3) - 1) * 0.24;
        const weaveY = position.stackBridge ? 0 : position.stackColumn ? stackPreviewOffset.y : ((tileIndex % 4) - 1.5) * 0.18;

        return {
          x: position.x + (layerLiftX + weaveX) / 100 * MOUNTAIN_COORDINATE_SYSTEM.baseWidth,
          y: position.y + (layerLiftY + weaveY) / 100 * MOUNTAIN_COORDINATE_SYSTEM.baseHeight,
        };
      }

      function getMountainGeneratedVisualTileRect(position, positions) {
        const visual = getMountainGeneratedVisualPosition(position, positions);
        const { width, height } = getMountainRuleTileSize();
        return {
          x: visual.x,
          y: visual.y,
          width,
          height,
        };
      }

      function getMountainGeneratedVisualIntersectionRect(position, other, positions) {
        const rect = getMountainGeneratedVisualTileRect(position, positions);
        const otherRect = getMountainGeneratedVisualTileRect(other, positions);
        const left = Math.max(rect.x, otherRect.x);
        const top = Math.max(rect.y, otherRect.y);
        const right = Math.min(rect.x + rect.width, otherRect.x + otherRect.width);
        const bottom = Math.min(rect.y + rect.height, otherRect.y + otherRect.height);
        if (right <= left || bottom <= top) return null;
        return { left, top, right, bottom };
      }

      function hasGeneratedHigherVisualOverlap(position, positions) {
        return positions.some((other) => {
          if (isSameGeneratedPosition(other, position)) return false;
          if (other.location && other.location !== "board") return false;
          if (getTileStackOrder(other) <= getTileStackOrder(position)) return false;
          return Boolean(getMountainGeneratedVisualIntersectionRect(position, other, positions));
        });
      }

      function hasGeneratedHigherNonBridgeVisualOverlap(position, positions) {
        return positions.some((other) => {
          if (other.stackBridge) return false;
          if (isSameGeneratedPosition(other, position)) return false;
          if (other.location && other.location !== "board") return false;
          if (getTileStackOrder(other) <= getTileStackOrder(position)) return false;
          return Boolean(getMountainGeneratedVisualIntersectionRect(position, other, positions));
        });
      }

      function getGeneratedStackPreviewVisualOffset(position, positions) {
        const previewDepth = Math.min(getGeneratedStackPreviewDepth(position, positions), getStackVisiblePreviewDepth(position));
        if (!position.stackColumn || previewDepth <= 0) return { x: 0, y: 0 };

        const direction = getStackColumnVisualDirection(position);
        const lane = previewDepth % 2 === 0 ? -direction : direction;
        const order = getTileStackOrder(position);
        const overlapRatio = clampNumber(position.stackOverlapRatio ?? 0.5, MOUNTAIN_STACK_OVERLAP_RANGE.min, MOUNTAIN_STACK_OVERLAP_RANGE.max);
        const spread = position.stackPreviewSpread ?? 1;
        const revealScale = 1.18 - overlapRatio;
        return {
          x: lane * (0.16 + previewDepth * 0.42 * revealScale * spread) + Math.sin(order * 0.017) * 0.28,
          y: previewDepth * (0.22 + 1.3 * revealScale * spread) + Math.cos(order * 0.019) * 0.16,
        };
      }

      function getMountainBridgeMaxDistance() {
        const { width, height } = getMountainRuleTileSize();
        return Math.hypot(width * 1.15, height * 1.15);
      }

      function getMountainTemplateAnchors(templateId) {
        const templates = {
          "center-tower": [
            [320, 314, 1.5], [262, 360, 1.2], [354, 362, 1.2], [310, 430, 1.35],
            [146, 224, 0.85], [474, 224, 0.85], [134, 534, 0.85], [486, 534, 0.85],
            [238, 640, 0.8], [386, 640, 0.8],
          ],
          "two-wings": [
            [174, 150, 1.1], [132, 278, 1], [174, 410, 1], [132, 540, 1], [176, 668, 1.05],
            [446, 150, 1.1], [490, 278, 1], [446, 410, 1], [490, 540, 1], [444, 668, 1.05],
          ],
          cross: [
            [310, 166, 1.05], [310, 268, 1.1], [310, 382, 1.35], [310, 494, 1.1], [310, 606, 1.05],
            [116, 386, 0.9], [206, 386, 1], [414, 386, 1], [504, 386, 0.9], [310, 716, 0.7],
          ],
          ring: [
            [310, 116, 1], [430, 164, 1], [504, 286, 1], [506, 432, 1], [430, 562, 1],
            [310, 622, 1], [190, 562, 1], [112, 432, 1], [116, 286, 1], [190, 164, 1],
          ],
          "long-wall": [
            [116, 142, 1], [164, 214, 1], [212, 286, 1], [260, 358, 1], [308, 430, 1.1],
            [356, 502, 1], [404, 574, 1], [452, 646, 1], [500, 718, 1], [548, 790, 0.8],
          ],
          islands: [
            [140, 170, 1.15], [204, 230, 0.9], [430, 172, 1.15], [492, 232, 0.9],
            [294, 392, 1.3], [356, 454, 1.1], [130, 612, 1], [208, 680, 0.85],
            [426, 614, 1], [496, 682, 0.85],
          ],
          canyon: [
            [132, 116, 1.05], [116, 256, 1], [132, 396, 1], [116, 536, 1], [132, 676, 1.05],
            [488, 116, 1.05], [504, 256, 1], [488, 396, 1], [504, 536, 1], [488, 676, 1.05],
          ],
          staircase: [
            [126, 126, 1], [174, 198, 1], [222, 270, 1], [270, 342, 1], [318, 414, 1.1],
            [366, 486, 1], [414, 558, 1], [462, 630, 1], [510, 702, 0.9], [286, 724, 0.9],
          ],
          "suspended-waist": getSuspendedWaistTemplateAnchors(),
        };

        return (templates[templateId] ?? templates["center-tower"]).map(([x, y, weight, templateRegion], index) => ({
          id: `${templateId}-${index + 1}`,
          x: scaleMountainTemplateCoordinate(x, "x"),
          y: scaleMountainTemplateCoordinate(y, "y"),
          weight,
          templateRegion,
          stackBase: index * 700,
          row: index,
          col: index,
        }));
      }

      function getSuspendedWaistTemplateAnchors() {
        return [
          [214, 122, 1.42, "top-platform"],
          [290, 112, 1.5, "top-platform"],
          [366, 120, 1.5, "top-platform"],
          [442, 148, 1.36, "top-platform"],
          [300, 294, 1.38, "waist"],
          [358, 342, 1.3, "waist"],
          [238, 526, 1.28, "support-column"],
          [404, 552, 1.24, "support-column"],
          [128, 382, 1.12, "side-scatter"],
          [502, 684, 1.08, "side-scatter"],
        ];
      }

      function scaleMountainTemplateCoordinate(value, axis) {
        const sourceSize = axis === "x"
          ? MOUNTAIN_TEMPLATE_SOURCE_COORDINATE_SYSTEM.baseWidth
          : MOUNTAIN_TEMPLATE_SOURCE_COORDINATE_SYSTEM.baseHeight;
        const targetSize = axis === "x"
          ? MOUNTAIN_COORDINATE_SYSTEM.baseWidth
          : MOUNTAIN_COORDINATE_SYSTEM.baseHeight;
        return Math.round((value / sourceSize) * targetSize);
      }

      function getMountainStackCounts(targetTileCount, anchors) {
        const sortedAnchorIndexes = anchors
          .map((anchor, index) => ({ index, weight: anchor.weight ?? 1 }))
          .sort((a, b) => b.weight - a.weight || a.index - b.index)
          .slice(0, Math.min(MOUNTAIN_PRIMARY_STACK_COUNT, anchors.length))
          .map((item) => item.index);
        const primaryIndexes = new Set(sortedAnchorIndexes);
        const weightedAnchors = anchors.map((anchor, index) => ({
          index,
          weight: (anchor.weight ?? 1) * (primaryIndexes.has(index) ? MOUNTAIN_PRIMARY_STACK_WEIGHT_MULTIPLIER : 1),
        }));
        const totalWeight = weightedAnchors.reduce((sum, anchor) => sum + anchor.weight, 0);
        const counts = weightedAnchors.map((anchor) => Math.max(1, Math.floor((targetTileCount * anchor.weight) / totalWeight)));
        let remainder = targetTileCount - counts.reduce((sum, count) => sum + count, 0);
        let cursor = 0;

        while (remainder > 0) {
          const index = weightedAnchors[cursor % weightedAnchors.length].index;
          counts[index] += 1;
          remainder -= 1;
          cursor += 1;
        }

        while (remainder < 0) {
          const index = weightedAnchors[(weightedAnchors.length - 1 - cursor % weightedAnchors.length)].index;
          if (counts[index] > 1) {
            counts[index] -= 1;
            remainder += 1;
          }
          cursor += 1;
        }

        return counts;
      }

      function ensureMountainPositionCapacity(positions, random, targetTileCount) {
        let index = 0;
        while (positions.length < targetTileCount) {
          const col = index % 10;
          const row = Math.floor(index / 10) % 14;
          const layer = 4 + Math.floor(index / 140);
          positions.push({
            positionId: `extra-${index + 1}`,
            layer,
            row,
            col,
            x: 92 + col * 48 + (row % 2) * 10 + randomBetween(random, -2, 2),
            y: 108 + row * 48 + randomBetween(random, -2, 2),
            stackOrder: 5000 + index,
          });
          index += 1;
        }
      }

      function addTemplateStackPositions(positions, random, stack, tuning) {
        const phase = randomBetween(random, 0, Math.PI * 2);
        const baseX = stack.x + randomBetween(random, -3, 3);
        const baseY = stack.y + randomBetween(random, -3, 3);
        const layerStep = Math.max(5, tuning.stackDepth + 2);
        const overlapProfile = stack.overlapProfile ?? createMountainStackOverlapProfile(stack.col, random);

        for (let depth = 0; depth < stack.count; depth += 1) {
          const weaveX = Math.sin(depth * 0.43 + phase) * 1.4;
          const weaveY = Math.cos(depth * 0.39 + phase) * 1.1;
          positions.push({
            positionId: `${stack.id}-${depth + 1}`,
            layer: Math.min(9, Math.floor(depth / layerStep)),
            row: stack.row,
            col: stack.col,
            x: baseX + weaveX + randomBetween(random, -0.45, 0.45),
            y: baseY + weaveY + depth * 0.42 + randomBetween(random, -0.35, 0.35),
            stackOrder: depth * 100 + stack.col,
            stackColumn: true,
            stackColumnId: stack.id,
            stackCoverMode: overlapProfile.mode,
            stackOverlapRatio: overlapProfile.overlapRatio,
            stackPreviewLimit: overlapProfile.previewDepth,
            stackPreviewSpread: overlapProfile.previewSpread,
            templateId: stack.templateId,
            templateRegion: stack.templateRegion,
          });
        }
      }

      function createMountainStackOverlapProfile(index, random) {
        const modeIndex = index % 3;
        if (modeIndex === 0) {
          return {
            mode: "full",
            overlapRatio: 1,
            previewDepth: 1 + Math.floor(random() * 2),
            previewSpread: 0.12,
          };
        }
        if (modeIndex === 1) {
          return {
            mode: "partial",
            overlapRatio: randomBetween(random, 0.28, 0.78),
            previewDepth: MOUNTAIN_STACK_PREVIEW_DEPTH,
            previewSpread: randomBetween(random, 0.72, 1.05),
          };
        }
        return {
          mode: "loose",
          overlapRatio: MOUNTAIN_STACK_OVERLAP_RANGE.min,
          previewDepth: MOUNTAIN_STACK_PREVIEW_DEPTH,
          previewSpread: randomBetween(random, 1.08, 1.34),
        };
      }

      function addMountainBridgePositions(positions, random, bridgeGroups, templateId) {
        bridgeGroups.forEach((group, index) => {
          const bridgeCoordinate = group.bridgeCoordinate ?? getMountainBridgeCoordinate(group, random);
          const bridgePosition = {
            layer: 0,
            row: index,
            col: 40 + index,
            x: bridgeCoordinate.x,
            y: bridgeCoordinate.y,
            stackOrder: 90000 + index,
            stackBridge: true,
            stackBridgeId: group.id,
            stackBridgeColumnIds: group.columns.map((column) => column.stackColumnId),
            templateId,
          };
          positions.push(bridgePosition);
        });
      }

      function getMountainBridgeCoordinate(group, random) {
        const coordinate = getMountainBridgeCoordinateCandidatesForColumns(group.columns[0], group.columns[1])[0];
        if (coordinate) return coordinate;

        const { width, height } = getMountainRuleTileSize();
        const first = group.columns[0];
        const second = group.columns[1];
        const minX = Math.max(first.visualX, second.visualX) - width + 4;
        const maxX = Math.min(first.visualX, second.visualX) + width - 4;
        const minY = Math.max(first.visualY, second.visualY) - height + 4;
        const maxY = Math.min(first.visualY, second.visualY) + height - 4;
        const fallbackX = (first.visualX + second.visualX) / 2;
        const fallbackY = (first.visualY + second.visualY) / 2;
        const x = minX <= maxX
          ? randomBetween(random, minX, maxX)
          : fallbackX;
        const y = minY <= maxY
          ? randomBetween(random, minY, maxY)
          : fallbackY;

        return {
          x: clampMountainBridgeCoordinate(x, width, "x"),
          y: clampMountainBridgeCoordinate(y, height, "y"),
        };
      }

      function getMountainBridgeCoordinateCandidatesForColumns(first, second) {
        const { width, height } = getMountainRuleTileSize();
        const minX = Math.max(first.visualX, second.visualX) - width + 4;
        const maxX = Math.min(first.visualX, second.visualX) + width - 4;
        const minY = Math.max(first.visualY, second.visualY) - height + 4;
        const maxY = Math.min(first.visualY, second.visualY) + height - 4;
        if (minX > maxX || minY > maxY) return [];

        const midX = (minX + maxX) / 2;
        const midY = (minY + maxY) / 2;
        const rawCandidates = [
          { x: midX, y: midY },
          { x: minX, y: minY },
          { x: maxX, y: maxY },
          { x: minX, y: maxY },
          { x: maxX, y: minY },
          { x: midX, y: minY },
          { x: midX, y: maxY },
          { x: minX, y: midY },
          { x: maxX, y: midY },
        ];

        const seen = new Set();
        return rawCandidates
          .map((candidate) => ({
            x: clampMountainBridgeCoordinate(candidate.x, width, "x"),
            y: clampMountainBridgeCoordinate(candidate.y, height, "y"),
          }))
          .filter((candidate) => {
            const key = `${candidate.x.toFixed(2)}:${candidate.y.toFixed(2)}`;
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          });
      }

      function placeMountainBridgeWithoutOverlap(bridgePosition, placedBridges, index) {
        if (!hasMountainBridgeOverlap(bridgePosition, placedBridges)) return bridgePosition;

        const { width, height } = getMountainRuleTileSize();
        const direction = index % 2 === 0 ? -1 : 1;
        const offsets = [
          { x: direction * width * 1.05, y: -height * 0.18 },
          { x: direction * width * 1.05, y: height * 0.18 },
          { x: 0, y: -height * 1.05 },
          { x: 0, y: height * 1.05 },
          { x: -direction * width * 1.05, y: 0 },
          { x: direction * width * 1.55, y: -height * 0.35 },
          { x: direction * width * 1.55, y: height * 0.35 },
        ];

        for (const offset of offsets) {
          const candidate = {
            ...bridgePosition,
            x: clampMountainBridgeCoordinate(bridgePosition.x + offset.x, width, "x"),
            y: clampMountainBridgeCoordinate(bridgePosition.y + offset.y, height, "y"),
          };
          if (!hasMountainBridgeOverlap(candidate, placedBridges)) return candidate;
        }

        return bridgePosition;
      }

      function hasMountainBridgeOverlap(candidate, placedBridges) {
        const { width, height } = getMountainRuleTileSize();
        return placedBridges.some((bridge) => Boolean(getIntersectionRect(candidate, bridge, width, height)));
      }

      function clampMountainBridgeCoordinate(value, tileSize, axis) {
        const boardSize = axis === "x"
          ? MOUNTAIN_COORDINATE_SYSTEM.baseWidth
          : MOUNTAIN_COORDINATE_SYSTEM.baseHeight;
        return clampNumber(value, 8, boardSize - tileSize - 8);
      }

      function shuffleTailPositions(positions, random, fixedCount) {
        return [
          ...positions.slice(0, fixedCount),
          ...shuffleItems(positions.slice(fixedCount), random),
        ];
      }

      function buildComboPackages(level, random, packageCount) {
        const patterns = collectComboPatterns(level);
        const shuffled = shuffleItems(patterns, random);
        const packages = [];

        for (let index = 0; index < packageCount; index += 1) {
          const pattern = shuffled[index % shuffled.length];
          packages.push(pattern.tiles.map((tile) => ({
            suit: tile.suit,
            rank: tile.rank,
            sourcePackage: `generated-${index + 1}-${pattern.type}`,
          })));
        }

        return packages;
      }

      function buildSolvableTileSpecs(level, positions, random, bossGoals, tuning = DEFAULT_MOUNTAIN_TUNING) {
        const comboGoalQueue = buildBossComboGoalQueue(bossGoals);
        const suitGoalQueue = buildBossSuitGoalQueue(bossGoals);
        const featuredCombos = level.featuredCombos ?? [];
        const huPackCount = getHuPackCount(level, tuning);
        const gangPackCount = getFriendDemoGangPackCount(tuning);
        if (huPackCount > 0) {
          const bossHuIndex = comboGoalQueue.indexOf("hu");
          if (bossHuIndex >= 0) comboGoalQueue.splice(bossHuIndex, 1);
        }
        const releaseGroups = buildSolutionGroups(
          positions,
          comboGoalQueue,
          huPackCount,
          getHuPackReleaseDelay(level, tuning),
          gangPackCount,
          getFriendDemoGangPackReleaseDelay(level, tuning),
        );
        const solutionGroups = buildMixedWindowSolutionGroups(releaseGroups, random);
        const reservedGangTileKeys = getFriendDemoGangTileKeys(level, solutionGroups, tuning);
        const requiredTileIdentityQueue = shuffleItems(buildRequiredTileIdentityQueue(tuning, reservedGangTileKeys), random);
        const patterns = buildMountainFillerPatterns(level, random, tuning, reservedGangTileKeys);
        const tileSpecByPositionId = new Map();
        let patternIndex = 0;

        solutionGroups.forEach((group, groupIndex) => {
          const featuredCombo = group.featuredCombo;
          const goalCombo = featuredCombo ? null : comboGoalQueue.shift();
          const goalSuit = featuredCombo ? null : suitGoalQueue.shift();
          const requiredTileIdentity = featuredCombo || goalCombo || goalSuit ? null : requiredTileIdentityQueue.shift();
          let pattern = featuredCombo === "hu"
            ? makeHuPattern(level, random, groupIndex, tuning)
            : featuredCombo === "gang"
            ? makeFriendDemoGangPattern(level, groupIndex, tuning)
            : goalCombo
            ? makeBossGoalPattern(goalCombo, random, groupIndex, goalSuit)
            : requiredTileIdentity
            ? makeTileIdentityCoveragePattern(requiredTileIdentity)
            : patterns[patternIndex % patterns.length];
          if (!goalCombo && !featuredCombo && !requiredTileIdentity && shouldUseHonorFiller(random, tuning)) {
            pattern = makeHonorPengPattern(level.order, groupIndex, tuning);
          }
          if (!goalCombo && !featuredCombo && !requiredTileIdentity) patternIndex += 1;
          const specs = expandPatternToGroup(pattern, group.length, random);

          group.forEach((position, index) => {
            tileSpecByPositionId.set(position.id, {
              ...specs[index],
              sourcePackage: `solution-${groupIndex + 1}-${pattern.type}`,
              solutionStep: position.solutionStep ?? groupIndex + 1,
              solutionGroup: `solution-${groupIndex + 1}`,
              mixedWindowRole: position.mixedWindowRole,
            });
          });
        });

        rebalanceInitialMixedWindow(tileSpecByPositionId, positions, random);
        return tileSpecByPositionId;
      }

      function getFriendDemoGangPackCount(tuning) {
        return Math.max(0, Math.min(4, tuning.gangPacks ?? 0));
      }

      function getFriendDemoGangPackReleaseDelay() {
        return 2;
      }

      function getFriendDemoGangTileKeys(level, solutionGroups, tuning = null) {
        const keys = new Set();
        solutionGroups.forEach((group, groupIndex) => {
          if (group.featuredCombo !== "gang") return;
          const pattern = makeFriendDemoGangPattern(level, groupIndex, tuning);
          pattern.tiles.forEach((tile) => keys.add(getTileKey(tile)));
        });
        return keys;
      }

      function buildMixedWindowSolutionGroups(releaseGroups, random) {
        const groups = [];
        let releaseStep = 1;

        for (let index = 0; index < releaseGroups.length; index += 1) {
          const first = releaseGroups[index];
          const second = releaseGroups[index + 1];

          if (canUseMixedWindowDistribution(first, second)) {
            const firstOrder = shuffleItems([0, 1, 2], random);
            const secondOrder = shuffleItems([0, 1, 2], random);
            groups.push([
              makeMixedWindowMember(first[firstOrder[0]], releaseStep, "hold"),
              makeMixedWindowMember(first[firstOrder[1]], releaseStep, "hold"),
              makeMixedWindowMember(second[secondOrder[0]], releaseStep + 1, "finish"),
            ]);
            groups.push([
              makeMixedWindowMember(first[firstOrder[2]], releaseStep, "lure"),
              makeMixedWindowMember(second[secondOrder[1]], releaseStep + 1, "hold"),
              makeMixedWindowMember(second[secondOrder[2]], releaseStep + 1, "finish"),
            ]);
            index += 1;
            releaseStep += 2;
          } else {
            groups.push(makePassthroughSolutionGroup(first, releaseStep));
            releaseStep += 1;
          }
        }

        return groups;
      }

      function canUseMixedWindowDistribution(first, second) {
        return Boolean(
          first
          && second
          && first.length === 3
          && second.length === 3
          && !first.featuredCombo
          && !second.featuredCombo
        );
      }

      function makeMixedWindowMember(position, solutionStep, mixedWindowRole) {
        return {
          ...position,
          solutionStep,
          mixedWindowRole,
        };
      }

      function makePassthroughSolutionGroup(group, solutionStep) {
        const passthrough = group.map((position) => makeMixedWindowMember(position, solutionStep, "direct"));
        if (group.featuredCombo) passthrough.featuredCombo = group.featuredCombo;
        return passthrough;
      }

      function rebalanceInitialMixedWindow(tileSpecByPositionId, positions, random) {
        const initialAvailableIds = getInitialAvailablePositionIds(positions);
        const deferredIds = shuffleItems(
          positions
            .filter((position) => !initialAvailableIds.has(position.id))
            .map((position) => position.id)
            .filter((id) => {
              const step = tileSpecByPositionId.get(id)?.solutionStep ?? Number.MAX_SAFE_INTEGER;
              return step <= 2;
            }),
          random,
        );
        const usedDeferredIds = new Set();
        let safety = 0;

        while (safety < 20) {
          safety += 1;
          const groupCounts = countInitialSolutionGroups(tileSpecByPositionId, initialAvailableIds);
          const completeGroup = [...groupCounts.entries()].find(([, count]) => count >= 3)?.[0];
          if (!completeGroup) return;

          const visibleSwapId = [...initialAvailableIds].find((id) => (
            tileSpecByPositionId.get(id)?.solutionGroup === completeGroup
          ));
          const deferredSwapId = deferredIds.find((id) => {
            if (usedDeferredIds.has(id)) return false;
            const spec = tileSpecByPositionId.get(id);
            if (!spec || spec.solutionGroup === completeGroup) return false;
            return (groupCounts.get(spec.solutionGroup) ?? 0) <= 1;
          });

          const swapId = deferredSwapId;
          if (!visibleSwapId || !swapId) return;
          swapSolutionIdentity(tileSpecByPositionId.get(visibleSwapId), tileSpecByPositionId.get(swapId));
          if (swapId === deferredSwapId) usedDeferredIds.add(deferredSwapId);
        }
      }

      function getInitialAvailablePositionIds(positions) {
        const initialPositions = positions.map((position) => ({
          ...position,
          location: "board",
        }));
        return new Set(
          initialPositions
            .filter((position) => !isPositionBlocked(position, initialPositions))
            .map((position) => position.id),
        );
      }

      function countInitialSolutionGroups(tileSpecByPositionId, initialAvailableIds) {
        const counts = new Map();
        initialAvailableIds.forEach((id) => {
          const key = tileSpecByPositionId.get(id)?.solutionGroup;
          if (!key) return;
          counts.set(key, (counts.get(key) ?? 0) + 1);
        });
        return counts;
      }

      function swapSolutionIdentity(first, second) {
        const firstIdentity = {
          suit: first.suit,
          rank: first.rank,
          sourcePackage: first.sourcePackage,
          solutionGroup: first.solutionGroup,
          mixedWindowRole: first.mixedWindowRole,
        };
        first.suit = second.suit;
        first.rank = second.rank;
        first.sourcePackage = second.sourcePackage;
        first.solutionGroup = second.solutionGroup;
        first.mixedWindowRole = second.mixedWindowRole;
        second.suit = firstIdentity.suit;
        second.rank = firstIdentity.rank;
        second.sourcePackage = firstIdentity.sourcePackage;
        second.solutionGroup = firstIdentity.solutionGroup;
        second.mixedWindowRole = firstIdentity.mixedWindowRole;
      }

      function rebalanceRuntimeInitialMixedWindow(tiles, random) {
        const nextTiles = tiles.map((tile) => ({ ...tile }));
        const deferredIds = shuffleItems(
          nextTiles
            .filter((tile) => isGeneratedTileBlocked(tile, nextTiles))
            .map((tile) => tile.id),
          random,
        );
        const usedDeferredIds = new Set();
        let safety = 0;

        while (safety < 30) {
          safety += 1;
          const availableTiles = nextTiles.filter((tile) => !isGeneratedTileBlocked(tile, nextTiles));
          const groupCounts = availableTiles.reduce((counts, tile) => {
            const key = tile.solutionGroup;
            if (!key) return counts;
            counts.set(key, (counts.get(key) ?? 0) + 1);
            return counts;
          }, new Map());
          const overexposedGroup = [...groupCounts.entries()]
            .find(([, count]) => count > MOUNTAIN_INITIAL_SOLUTION_GROUP_LIMIT)?.[0];
          if (!overexposedGroup) return nextTiles;

          const visibleSwap = availableTiles.find((tile) => tile.solutionGroup === overexposedGroup);
          const deferredFillerId = findDeferredMixedWindowFillerId(nextTiles, deferredIds, usedDeferredIds, overexposedGroup, visibleSwap);
          const filler = nextTiles.find((tile) => tile.id === deferredFillerId);

          if (!visibleSwap || !filler) return nextTiles;
          swapSolutionIdentity(visibleSwap, filler);
          usedDeferredIds.add(deferredFillerId);
        }

        return nextTiles;
      }

      function findDeferredMixedWindowFillerId(tiles, deferredIds, usedDeferredIds, completeGroup, visibleSwap) {
        const visibleStep = visibleSwap?.solutionStep ?? 0;
        return deferredIds
          .map((id) => tiles.find((tile) => tile.id === id))
          .filter(Boolean)
          .filter((tile) => (
            !usedDeferredIds.has(tile.id)
            && tile.solutionGroup !== completeGroup
          ))
          .sort((a, b) => (
            Math.abs((a.solutionStep ?? 0) - visibleStep) - Math.abs((b.solutionStep ?? 0) - visibleStep)
          ))[0]?.id;
      }

      function getAllTileIdentities(tuning = null) {
        const numberSuits = getAllowedNumberSuits(tuning);
        const honorRanks = getAllowedHonorRanks(tuning);
        return [
          ...numberSuits.flatMap((suit) => (
            Array.from({ length: 9 }, (_, index) => ({
              key: `${suit}-${index + 1}`,
              suit,
              rank: index + 1,
            }))
          )),
          ...honorRanks.map((rank) => ({
            key: `honor-${rank}`,
            suit: "honor",
            rank,
          })),
        ];
      }

      function buildRequiredTileIdentityQueue(tuning, reservedTileKeys = new Set()) {
        return getAllTileIdentities(tuning).filter((identity) => !reservedTileKeys.has(identity.key));
      }

      function buildMountainFillerPatterns(level, random, tuning = null, reservedTileKeys = new Set()) {
        const identityPatterns = getAllTileIdentities(tuning)
          .filter((identity) => !reservedTileKeys.has(identity.key))
          .map(makeTileIdentityCoveragePattern);
        const chiPatterns = getAllowedNumberSuits(tuning).flatMap((suit) => (
          Array.from({ length: 7 }, (_, index) => makePattern("chi", [
            { suit, rank: index + 1 },
            { suit, rank: index + 2 },
            { suit, rank: index + 3 },
          ]))
        )).filter((pattern) => !doesPatternUseReservedTile(pattern, reservedTileKeys));
        const levelPatterns = collectComboPatterns(level)
          .filter((pattern) => isPatternAllowedByTuning(pattern, tuning))
          .filter((pattern) => !doesPatternUseReservedTile(pattern, reservedTileKeys));
        return shuffleItems([
          ...identityPatterns,
          ...chiPatterns,
          ...levelPatterns,
        ], random);
      }

      function doesPatternUseReservedTile(pattern, reservedTileKeys) {
        if (!reservedTileKeys || reservedTileKeys.size === 0) return false;
        return pattern.tiles.some((tile) => reservedTileKeys.has(getTileKey(tile)));
      }

      function getAllowedNumberSuits(tuning = null) {
        const suits = tuning?.numberSuits;
        if (!Array.isArray(suits) || suits.length === 0) return NUMBER_SUITS;
        return suits.filter((suit) => NUMBER_SUITS.includes(suit));
      }

      function getAllowedHonorRanks(tuning = null) {
        const ranks = tuning?.honorRanks;
        if (!Array.isArray(ranks)) return Array.from({ length: 7 }, (_, index) => index + 1);
        return ranks.filter((rank) => Number.isInteger(rank) && rank >= 1 && rank <= 7);
      }

      function isPatternAllowedByTuning(pattern, tuning = null) {
        return pattern.tiles.every((tile) => isTileIdentityAllowedByTuning(tile, tuning));
      }

      function isTileIdentityAllowedByTuning(tile, tuning = null) {
        if (NUMBER_SUITS.includes(tile.suit)) return getAllowedNumberSuits(tuning).includes(tile.suit);
        if (tile.suit === "honor") return getAllowedHonorRanks(tuning).includes(tile.rank);
        return false;
      }

      function buildRequiredSuitQueue() {
        return ALL_SUITS.flatMap((suit) => Array.from({ length: 4 }, () => suit));
      }

      function getHuPackCount(level, tuning) {
        if (tuning.huPacks !== null) return tuning.huPacks;
        return (level.featuredCombos ?? []).includes("hu") ? 1 : 0;
      }

      function hasFeaturedOrBossMountainGoals(level, bossGoals) {
        return (level.featuredCombos ?? []).length > 0 || (bossGoals ?? []).length > 0;
      }

      function shouldUseHonorFiller(random, tuning) {
        if (getAllowedHonorRanks(tuning).length === 0) return false;
        return random() < Math.max(0, Math.min(100, tuning.honorWeight ?? 0)) / 100;
      }

      function makeHonorPengPattern(levelOrder, groupIndex, tuning = null) {
        const honorRanks = getAllowedHonorRanks(tuning);
        const rank = honorRanks.length > 0
          ? honorRanks[(levelOrder + groupIndex) % honorRanks.length]
          : 1;
        return makePattern("peng", [
          { suit: "honor", rank },
          { suit: "honor", rank },
          { suit: "honor", rank },
        ]);
      }

      function makeSuitCoveragePattern(suit, levelOrder, groupIndex) {
        if (suit === "honor") return makeHonorPengPattern(levelOrder, groupIndex);
        const startRank = ((levelOrder + groupIndex) % 7) + 1;
        return makePattern("chi", [
          { suit, rank: startRank },
          { suit, rank: startRank + 1 },
          { suit, rank: startRank + 2 },
        ]);
      }

      function makeTileIdentityCoveragePattern(identity) {
        return makePattern("peng", [
          { suit: identity.suit, rank: identity.rank },
          { suit: identity.suit, rank: identity.rank },
          { suit: identity.suit, rank: identity.rank },
        ]);
      }

      function makeHuPattern(level, random, groupIndex, tuning = null) {
        const numberSuits = getAllowedNumberSuits(tuning);
        const honorRanks = getAllowedHonorRanks(tuning);
        const chiSuit = numberSuits[(level.order + groupIndex) % numberSuits.length];
        const pairSuit = numberSuits[(level.order + groupIndex + 2) % numberSuits.length];
        const tripletSuit = honorRanks.length > 0 && level.order >= 8
          ? "honor"
          : numberSuits[(level.order + groupIndex + 1) % numberSuits.length];
        const startRank = ((level.order + groupIndex) % 7) + 1;
        const tripletRank = tripletSuit === "honor"
          ? honorRanks[(level.order + groupIndex) % honorRanks.length]
          : ((level.order + groupIndex + 4) % 9) + 1;
        const pairRank = ((level.order + groupIndex + 6) % 9) + 1;

        return makePattern("hu", [
          { suit: chiSuit, rank: startRank },
          { suit: chiSuit, rank: startRank + 1 },
          { suit: chiSuit, rank: startRank + 2 },
          { suit: tripletSuit, rank: tripletRank },
          { suit: tripletSuit, rank: tripletRank },
          { suit: tripletSuit, rank: tripletRank },
          { suit: pairSuit, rank: pairRank },
          { suit: pairSuit, rank: pairRank },
        ]);
      }

      function makeBossGoalPattern(combo, random, groupIndex, forcedSuit) {
        if (combo === "hu") return makeHuPattern(currentLevel(), random, groupIndex);

        const suit = forcedSuit ?? ALL_SUITS[Math.floor(random() * ALL_SUITS.length)];
        const rank = ((groupIndex + Math.floor(random() * 5)) % 9) + 1;

        if (combo === "chi") {
          const chiSuit = suit === "honor" ? NUMBER_SUITS[Math.floor(random() * NUMBER_SUITS.length)] : suit;
          const startRank = ((rank - 1) % 7) + 1;
          return makePattern("chi", [
            { suit: chiSuit, rank: startRank },
            { suit: chiSuit, rank: startRank + 1 },
            { suit: chiSuit, rank: startRank + 2 },
          ]);
        }

        const tile = { suit, rank: getPatternRankForSuit(suit, rank) };
        const count = combo === "gang" ? 4 : 3;
        return makePattern(combo, Array.from({ length: count }, () => tile));
      }

      function makeFriendDemoGangPattern(level, groupIndex, tuning = null) {
        const numberSuits = getAllowedNumberSuits(tuning);
        const suit = numberSuits[(level.order + groupIndex) % numberSuits.length];
        const rank = ((level.order * 2 + groupIndex * 2) % 9) + 1;
        const tile = { suit, rank };
        return makePattern("gang", [tile, tile, tile, tile]);
      }

      function getPatternRankForSuit(suit, rank) {
        if (suit === "honor") return ((rank - 1) % 7) + 1;
        return rank;
      }

      function buildSolutionGroups(
        positions,
        comboGoalQueue,
        huPackCount,
        huPackReleaseDelay = 0,
        gangPackCount = 0,
        gangPackReleaseDelay = 0,
      ) {
        const remaining = positions.map((position) => ({ ...position, location: "board" }));
        const groups = [];
        let safety = 0;
        let nextGoalIndex = 0;
        let pendingHuGroups = huPackCount;
        let pendingGangGroups = gangPackCount;
        let nextGangGroupIndex = gangPackReleaseDelay;

        while (remaining.length > 0 && safety < 200) {
          safety += 1;
          const available = remaining
            .filter((position) => !isPositionBlocked(position, remaining))
            .sort((a, b) => getTileStackOrder(b) - getTileStackOrder(a));
          const wantsGangGroup = pendingGangGroups > 0 && groups.length >= nextGangGroupIndex && available.length >= 4;
          const wantsHuGroup = !wantsGangGroup && pendingHuGroups > 0 && groups.length >= huPackReleaseDelay && available.length >= MAX_SLOT_LIMIT;
          const nextGoalCombo = wantsHuGroup || wantsGangGroup ? null : comboGoalQueue[nextGoalIndex];
          const goalTakeCount = nextGoalCombo ? getComboGoalGroupSize(nextGoalCombo) : 0;
          const wantsBossGroup = Boolean(nextGoalCombo);
          if (wantsBossGroup && available.length < goalTakeCount) {
            throw new Error(`密集牌山生成失败：Boss ${TYPE_LABELS[nextGoalCombo]} 目标缺少可用位置。`);
          }
          const takeCount = wantsHuGroup ? MAX_SLOT_LIMIT : wantsGangGroup ? 4 : wantsBossGroup ? goalTakeCount : available.length >= 3 ? 3 : available.length;

          if (takeCount === 0) {
            throw new Error("密集牌山生成失败：没有可解的起手牌。");
          }

          const group = available.slice(0, takeCount);
          if (wantsHuGroup) {
            group.featuredCombo = "hu";
            pendingHuGroups -= 1;
          }
          if (wantsGangGroup) {
            group.featuredCombo = "gang";
            pendingGangGroups -= 1;
            nextGangGroupIndex = groups.length + 3;
          }
          if (wantsBossGroup) nextGoalIndex += 1;
          groups.push(group);

          for (const position of group) {
            const index = remaining.findIndex((item) => item.id === position.id);
            if (index >= 0) remaining.splice(index, 1);
          }
        }

        if (remaining.length > 0) {
          throw new Error("密集牌山生成失败：可解路径未能覆盖全部牌。");
        }

        if (pendingHuGroups > 0) {
          throw new Error("密集牌山生成失败：胡牌重点缺少 8 张可用位置。");
        }

        if (pendingGangGroups > 0) {
          throw new Error("密集牌山生成失败：明杠机会缺少 4 张可用位置。");
        }

        return groups;
      }

      function buildBossComboGoalQueue(bossGoals) {
        return (bossGoals ?? []).flatMap((goal) => {
          if (goal.type !== "combo_count") return [];
          return Array.from({ length: goal.target }, () => goal.combo);
        });
      }

      function buildBossSuitGoalQueue(bossGoals) {
        return (bossGoals ?? []).flatMap((goal) => {
          if (goal.type !== "suit_set") return [];
          return goal.suits.flatMap((suit) => Array.from({ length: goal.eachTarget }, () => suit));
        });
      }

      function getComboGoalGroupSize(combo) {
        if (combo === "hu") return MAX_SLOT_LIMIT;
        return combo === "gang" ? 4 : 3;
      }

      function getHuPackReleaseDelay(level, tuning) {
        if (!getFriendDemoDifficultyProfile(model.levelIndex)) return 0;
        if ((tuning.huPacks ?? 0) <= 0) return 0;
        return isBossLevel(model.levelIndex) ? 3 : 2;
      }

      function isPositionBlocked(position, positions) {
        if (position.stackColumn && !isVisibleGeneratedStackTop(position, positions)) return true;
        return isPositionCoveredByHigherTile(position, positions)
          || isPositionBlockedByBridge(position, positions);
      }

      function getPositionCoverRatio(position, positions) {
        const { width, height } = getMountainRuleTileSize();
        const coverRects = [];

        positions.forEach((other) => {
          if (other.id === position.id) return;
          if (other.location && other.location !== "board") return;
          if (getTileStackOrder(other) <= getTileStackOrder(position)) return;

          const rect = getIntersectionRect(position, other, width, height);
          if (rect) coverRects.push(rect);
        });

        return getUnionArea(coverRects) / (width * height);
      }

      function isPositionCoveredByHigherTile(position, positions) {
        const { width, height } = getMountainRuleTileSize();
        return positions.some((other) => {
          if (other.id === position.id) return false;
          if (other.location && other.location !== "board") return false;
          if (getTileStackOrder(other) <= getTileStackOrder(position)) return false;
          return getOverlapRatio(position, other, width, height) >= BLOCKED_COVER_RATIO;
        });
      }

      function isPositionBlockedByBridge(position, positions) {
        if (!position.stackColumn || !isVisibleGeneratedStackTop(position, positions)) return false;
        const { width, height } = getMountainRuleTileSize();
        return positions.some((other) => (
          other.location === "board"
          && other.stackBridge
          && getTileStackOrder(other) > getTileStackOrder(position)
          && other.stackBridgeColumnIds?.includes(position.stackColumnId)
          && getOverlapRatio(position, other, width, height) >= BLOCKED_COVER_RATIO
        ));
      }

      function expandPatternToGroup(pattern, groupLength, random) {
        if (pattern.type === "hu" && groupLength >= MAX_SLOT_LIMIT) {
          return pattern.tiles.slice(0, MAX_SLOT_LIMIT);
        }

        if (groupLength === 1) {
          return [randomPatternTile(pattern, random)];
        }

        if (groupLength === 2) {
          return [
            randomPatternTile(pattern, random),
            randomPatternTile(pattern, random),
          ];
        }

        if (pattern.type === "gang" && groupLength >= 4) {
          return pattern.tiles.slice(0, 4);
        }

        return pattern.tiles.slice(0, 3);
      }

      function randomPatternTile(pattern, random) {
        return pattern.tiles[Math.floor(random() * pattern.tiles.length)];
      }

      function validateSolutionPath(tiles) {
        const remaining = tiles.map((tile) => ({ ...tile, location: "board" }));
        const maxStep = Math.max(...remaining.map((tile) => tile.solutionStep ?? 0));
        const virtualSlot = [];

        for (let step = 1; step <= maxStep; step += 1) {
          const group = remaining.filter((tile) => tile.solutionStep === step);
          if (group.length === 0) continue;

          const blockedIds = group
            .filter((tile) => isGeneratedTileBlocked(tile, remaining))
            .map((tile) => tile.id);

          if (blockedIds.length > 0) {
            throw new Error(`密集牌山生成失败：解法第 ${step} 步仍被压住 ${blockedIds.join(", ")}`);
          }

          for (const tile of group) {
            virtualSlot.push(tile);
            const index = remaining.findIndex((item) => item.id === tile.id);
            if (index >= 0) remaining.splice(index, 1);
          }

          resolveVirtualSolutionSlot(virtualSlot);

          if (virtualSlot.length > model.levelsConfig.defaults.slotLimit) {
            throw new Error(`密集牌山生成失败：解法第 ${step} 步会塞满卡槽。`);
          }
        }

        if (remaining.length > 0) {
          throw new Error("密集牌山生成失败：解法未清空牌山。");
        }
      }

      function resolveVirtualSolutionSlot(virtualSlot) {
        let changed = true;
        while (changed) {
          changed = false;
          const groups = new Map();
          virtualSlot.forEach((tile) => {
            const key = tile.solutionGroup ?? tile.sourcePackage;
            if (!key) return;
            const group = groups.get(key) ?? [];
            group.push(tile);
            groups.set(key, group);
          });

          for (const group of groups.values()) {
            const comboType = getComboTypeForSolutionGroup(group);
            if (!comboType) continue;
            for (const tile of group) {
              const index = virtualSlot.findIndex((item) => item.id === tile.id);
              if (index >= 0) virtualSlot.splice(index, 1);
            }
            changed = true;
            break;
          }
        }
      }

      function validateBossGoalsFromSolution(tiles, bossGoals) {
        const goals = bossGoals ?? [];
        if (goals.length === 0) return;

        const comboCounts = { chi: 0, peng: 0, gang: 0, hu: 0 };
        const suitComboCounts = createEmptySuitTotals();
        let score = 0;
        const groups = new Map();

        for (const tile of tiles) {
          const groupKey = tile.solutionGroup ?? tile.sourcePackage;
          if (!groupKey) continue;
          const group = groups.get(groupKey) ?? [];
          group.push(tile);
          groups.set(groupKey, group);
        }

        for (const group of groups.values()) {
          const comboType = getComboTypeForSolutionGroup(group);
          if (!comboType) continue;
          comboCounts[comboType] += 1;
          for (const suit of new Set(group.map((tile) => tile.suit))) {
            suitComboCounts[suit] += 1;
          }
          score += BASE_SCORE[comboType];
        }

        for (const goal of goals) {
          if (goal.type === "combo_count" && comboCounts[goal.combo] < goal.target) {
            throw new Error(`密集牌山生成失败：Boss 目标 ${TYPE_LABELS[goal.combo]} 不足。`);
          }

          if (goal.type === "score_target" && score < goal.target) {
            throw new Error(`密集牌山生成失败：Boss 积分目标不足。`);
          }

          if (goal.type === "suit_set") {
            const missingSuit = goal.suits.find((suit) => suitComboCounts[suit] < goal.eachTarget);
            if (missingSuit) {
              throw new Error(`密集牌山生成失败：Boss ${SUIT_LABELS[missingSuit]}目标不足。`);
            }
          }
        }
      }

      function assertFriendDemoOrphanRiskBudget(tiles, levelIndex = model.levelIndex) {
        const summary = getFriendDemoOrphanRiskSummary(tiles, levelIndex);
        if (!Number.isFinite(summary.budget)) return summary;
        if (summary.risk > summary.budget) {
          throw new Error(`密集牌山生成失败：孤张风险 ${summary.risk}/${summary.budget}，未归类组 ${summary.unresolvedGroups.join(", ")}`);
        }
        return summary;
      }

      function getFriendDemoOrphanRiskSummary(tiles, levelIndex = model.levelIndex) {
        const budget = getFriendDemoOrphanRiskBudget(levelIndex);
        const solutionGroups = collectSolutionGroups(tiles);
        const unresolvedGroups = [];
        const pureOrphanGroups = [];
        const pairOnlyGroups = [];

        for (const [groupKey, group] of solutionGroups.entries()) {
          if (getComboTypeForSolutionGroup(group)) continue;
          unresolvedGroups.push(groupKey);
          if (group.length === 1) pureOrphanGroups.push(groupKey);
          if (group.length === 2) pairOnlyGroups.push(groupKey);
        }

        return {
          budget,
          risk: unresolvedGroups.length,
          unresolvedGroups,
          pureOrphanGroups,
          pairOnlyGroups,
        };
      }

      function getFriendDemoOrphanRiskBudget(levelIndex = model.levelIndex) {
        const profile = getFriendDemoDifficultyProfile(levelIndex);
        if (!profile) return Number.POSITIVE_INFINITY;
        if (Number.isFinite(profile.orphanBudget)) return profile.orphanBudget;
        if (levelIndex <= 4) return 1;
        if (levelIndex === 5) return 2;
        if (levelIndex <= 7) return 3;
        return DEFAULT_RIVER_LIMIT + 1;
      }

      function collectSolutionGroups(tiles) {
        const groups = new Map();
        for (const tile of tiles) {
          const groupKey = tile.solutionGroup ?? tile.sourcePackage;
          if (!groupKey) continue;
          const group = groups.get(groupKey) ?? [];
          group.push(tile);
          groups.set(groupKey, group);
        }
        return groups;
      }

      function getComboTypeForSolutionGroup(group) {
        if (group.length >= MAX_SLOT_LIMIT && findHuGroups(group.slice(0, MAX_SLOT_LIMIT))) {
          return "hu";
        }

        if (group.length >= 4 && group.slice(0, 4).every((tile) => isSameTile(tile, group[0]))) {
          return "gang";
        }

        if (group.length >= 3 && group.slice(0, 3).every((tile) => isSameTile(tile, group[0]))) {
          return "peng";
        }

        if (group.length >= 3) {
          const firstThree = group.slice(0, 3).sort((a, b) => a.rank - b.rank);
          const sameSuit = firstThree.every((tile) => tile.suit === firstThree[0].suit);
          const sequential = firstThree[1].rank === firstThree[0].rank + 1 && firstThree[2].rank === firstThree[1].rank + 1;
          if (sameSuit && firstThree[0].suit !== "honor" && sequential) return "chi";
        }

        return null;
      }

      function isSameTile(a, b) {
        return a.suit === b.suit && a.rank === b.rank;
      }

      function isGeneratedTileBlocked(tile, tiles) {
        if (tile.stackColumn && !isVisibleGeneratedStackTop(tile, tiles)) return true;
        return isPositionCoveredByHigherTile(tile, tiles)
          || (tile.blockedBy ?? []).some((blockerId) => (
            tiles.some((other) => other.id === blockerId && other.location === "board")
          ));
      }

      function isVisibleGeneratedStackTop(tile, tiles) {
        if (!tile.stackColumn) return true;
        return getGeneratedStackColumnTiles(tile, tiles).every((other) => (
          isSameGeneratedPosition(other, tile) || getTileStackOrder(other) < getTileStackOrder(tile)
        ));
      }

      function isSameGeneratedPosition(first, second) {
        if (first === second) return true;
        if (first.positionId !== undefined && first.positionId === second.positionId) return true;
        return first.id !== undefined && first.id === second.id;
      }

      function isVisibleGeneratedStackDisplayTile(tile, tiles) {
        if (!tile.stackColumn) return true;
        return getGeneratedStackPreviewDepth(tile, tiles) <= getStackVisiblePreviewDepth(tile);
      }

      function getGeneratedStackPreviewDepth(tile, tiles) {
        if (!tile.stackColumn) return 0;
        return getGeneratedStackColumnTiles(tile, tiles).filter((other) => (
          getTileStackOrder(other) > getTileStackOrder(tile)
        )).length;
      }

      function getGeneratedHiddenStackDepth(tile, tiles) {
        if (!tile.stackColumn || !isVisibleGeneratedStackTop(tile, tiles)) return 0;
        return getGeneratedStackColumnTiles(tile, tiles).filter((other) => (
          getTileStackOrder(other) < getTileStackOrder(tile)
        )).length;
      }

      function getGeneratedStackColumnTiles(tile, tiles) {
        return tiles.filter((other) => (
          other.stackColumn
          && other.stackColumnId === tile.stackColumnId
        ));
      }

      function getStackVisiblePreviewDepth(tile) {
        if (!tile.stackColumn) return 0;
        return Math.min(MOUNTAIN_STACK_PREVIEW_DEPTH, Math.max(1, tile.stackPreviewLimit ?? MOUNTAIN_STACK_PREVIEW_DEPTH));
      }

      function collectComboPatterns(level) {
        const patterns = [];
        const bySuitRank = new Map();
        const ranksBySuit = new Map();

        for (const tile of level.tiles) {
          const key = `${tile.suit}-${tile.rank}`;
          const group = bySuitRank.get(key) ?? [];
          group.push(tile);
          bySuitRank.set(key, group);

          const rankSet = ranksBySuit.get(tile.suit) ?? new Set();
          rankSet.add(tile.rank);
          ranksBySuit.set(tile.suit, rankSet);
        }

        for (const group of bySuitRank.values()) {
          if (group.length >= 4) patterns.push(makePattern("gang", group.slice(0, 4)));
          if (group.length >= 3) patterns.push(makePattern("peng", group.slice(0, 3)));
        }

        for (const suit of NUMBER_SUITS) {
          const rankSet = ranksBySuit.get(suit) ?? new Set();
          for (let rank = 1; rank <= 7; rank += 1) {
            if (rankSet.has(rank) && rankSet.has(rank + 1) && rankSet.has(rank + 2)) {
              patterns.push(makePattern("chi", [
                { suit, rank },
                { suit, rank: rank + 1 },
                { suit, rank: rank + 2 },
              ]));
            }
          }
        }

        const honorRanks = getHonorPatternRanks(level.order);
        const honorPatterns = honorRanks.map((rank) => makePattern("peng", [
          { suit: "honor", rank },
          { suit: "honor", rank },
          { suit: "honor", rank },
        ]));

        if (patterns.length > 0) return [...patterns, ...patterns, ...honorPatterns];

        return [
          makePattern("peng", [{ suit: "wan", rank: 2 }, { suit: "wan", rank: 2 }, { suit: "wan", rank: 2 }]),
          makePattern("chi", [{ suit: "tong", rank: 3 }, { suit: "tong", rank: 4 }, { suit: "tong", rank: 5 }]),
          makePattern("peng", [{ suit: "tiao", rank: 7 }, { suit: "tiao", rank: 7 }, { suit: "tiao", rank: 7 }]),
          ...honorPatterns,
        ];
      }

      function getHonorPatternRanks(order) {
        const start = ((order - 1) * 2) % 7;
        const chapterStep = order % 10;
        const count = chapterStep === 0 ? 4 : order >= 6 ? 3 : 2;
        return Array.from({ length: count }, (_, index) => ((start + index) % 7) + 1);
      }

      function makePattern(type, tiles) {
        return {
          type,
          tiles: tiles.map((tile) => ({ suit: tile.suit, rank: tile.rank })),
        };
      }

      function attachMountainBlockers(tiles) {
        const { width, height } = getMountainRuleTileSize();
        return attachMountainBridgeBlockers(tiles.map((tile) => ({
          ...tile,
          blockedBy: tiles
            .filter((other) => !other.stackBridge && getTileStackOrder(other) > getTileStackOrder(tile) && getOverlapRatio(tile, other, width, height) >= BLOCKED_COVER_RATIO)
            .map((other) => other.id),
        })));
      }

      function attachMountainBridgeBlockers(tiles) {
        const bridgeTiles = tiles.filter((tile) => tile.stackBridge);
        if (bridgeTiles.length === 0) return tiles;

        return tiles.map((tile) => {
          if (!tile.stackColumn) return tile;
          const bridgeBlockers = bridgeTiles
            .filter((bridge) => (
              bridge.stackBridgeColumnIds?.includes(tile.stackColumnId)
              && isVisibleGeneratedStackTop(tile, tiles)
              && getOverlapRatio(tile, bridge, getMountainRuleTileSize().width, getMountainRuleTileSize().height) >= BLOCKED_COVER_RATIO
            ))
            .map((bridge) => bridge.id);
          if (bridgeBlockers.length === 0) return tile;
          return {
            ...tile,
            blockedBy: [...new Set([...tile.blockedBy, ...bridgeBlockers])],
          };
        });
      }

      function getOverlapRatio(tile, other, tileWidth, tileHeight) {
        const rect = getIntersectionRect(tile, other, tileWidth, tileHeight);
        return rect ? getUnionArea([rect]) / (tileWidth * tileHeight) : 0;
      }

      function getIntersectionRect(tile, other, tileWidth, tileHeight) {
        const left = Math.max(tile.x, other.x);
        const top = Math.max(tile.y, other.y);
        const right = Math.min(tile.x + tileWidth, other.x + tileWidth);
        const bottom = Math.min(tile.y + tileHeight, other.y + tileHeight);
        if (right <= left || bottom <= top) return null;
        return { left, top, right, bottom };
      }

      function getUnionArea(rects) {
        if (rects.length === 0) return 0;
        const xPoints = [...new Set(rects.flatMap((rect) => [rect.left, rect.right]))].sort((a, b) => a - b);
        let area = 0;

        for (let index = 0; index < xPoints.length - 1; index += 1) {
          const left = xPoints[index];
          const right = xPoints[index + 1];
          if (right <= left) continue;

          const spans = rects
            .filter((rect) => rect.left < right && rect.right > left)
            .map((rect) => [rect.top, rect.bottom])
            .sort((a, b) => a[0] - b[0]);

          let coveredHeight = 0;
          let spanStart = null;
          let spanEnd = null;

          for (const [top, bottom] of spans) {
            if (spanStart === null) {
              spanStart = top;
              spanEnd = bottom;
            } else if (top <= spanEnd) {
              spanEnd = Math.max(spanEnd, bottom);
            } else {
              coveredHeight += spanEnd - spanStart;
              spanStart = top;
              spanEnd = bottom;
            }
          }

          if (spanStart !== null) coveredHeight += spanEnd - spanStart;
          area += (right - left) * coveredHeight;
        }

        return area;
      }

      function getTileStackOrder(tile, fallbackOrder = 0) {
        return Number.isFinite(tile.stackOrder) ? tile.stackOrder : tile.layer * 1000 + fallbackOrder;
      }

      function createSeededRandom(seed) {
        let value = seed >>> 0;
        return () => {
          value = Math.imul(value, 1664525) + 1013904223;
          return (value >>> 0) / 4294967296;
        };
      }

      function hashText(text) {
        let hash = 2166136261;
        for (let index = 0; index < text.length; index += 1) {
          hash ^= text.charCodeAt(index);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function randomBetween(random, min, max) {
        return min + random() * (max - min);
      }

      function shuffleItems(items, random) {
        const copy = [...items];
        for (let index = copy.length - 1; index > 0; index -= 1) {
          const targetIndex = Math.floor(random() * (index + 1));
          [copy[index], copy[targetIndex]] = [copy[targetIndex], copy[index]];
        }
        return copy;
      }

      function renderSlot() {
        view.slotGrid.style.setProperty("--slot-count", model.state.slotLimit);

        for (let index = 0; index < model.state.slotLimit; index += 1) {

      function renderCombos() {

      function renderHuHint() {
        const hint = getHuWaitHint();
        view.huHint.textContent = hint?.text ?? "";
        view.huHint.dataset.distance = hint ? String(hint.distance) : "";
        view.huHint.classList.toggle("show", Boolean(hint));
      }

      function getHuWaitTargetKeys() {
        return getHuWaitHint()?.targetKeys ?? [];
      }

      function getHuWaitHint() {
        if (!model.state || model.state.phase !== "playing") return null;
        const slotTiles = model.state.slot.map(findTile).filter((tile) => tile?.location === "slot");
        const distance = MAX_SLOT_LIMIT - slotTiles.length;
        if (distance !== 1 && distance !== 2) return null;

        const routes = distance === 1
          ? findOneTileHuWaitRoutes(slotTiles)
          : findTwoTileHuWaitRoutes(slotTiles);
        if (routes.length === 0) return null;

        const activeRoutes = routes.filter((route) => isHuWaitRouteAvailable(route.targets));
        const selectedRoute = activeRoutes[0] ?? routes[0];
        const labels = selectedRoute.targets.map(formatTileIdentityLabel);
        const targetKeys = activeRoutes.length > 0 ? getUniqueHuWaitTargetKeys(selectedRoute.targets) : [];
        const unavailableText = activeRoutes.length > 0 ? "" : "（牌山暂无）";
        const text = distance === 1
          ? `听：${labels.join(" / ")}${unavailableText}`
          : `差：${labels.join(" / ")} 可胡${unavailableText}`;

        return {
          distance,
          text,
          targetKeys,
        };
      }

      function findOneTileHuWaitRoutes(slotTiles) {
        return getHuHintIdentities()
          .filter((identity) => findHuGroups([...slotTiles, makeVirtualHuTile(identity, 0)]))
          .map((identity) => ({ targets: [identity] }));
      }

      function findTwoTileHuWaitRoutes(slotTiles) {
        const identities = getHuHintIdentities();
        const routes = [];
        for (let firstIndex = 0; firstIndex < identities.length; firstIndex += 1) {
          for (let secondIndex = firstIndex; secondIndex < identities.length; secondIndex += 1) {
            const first = identities[firstIndex];
            const second = identities[secondIndex];
            const candidateTiles = [
              ...slotTiles,
              makeVirtualHuTile(first, 0),
              makeVirtualHuTile(second, 1),
            ];
            if (findHuGroups(candidateTiles)) routes.push({ targets: [first, second] });
          }
        }
        return routes;
      }

      function getHuHintIdentities() {
        const tuning = model.mode === "mountain"
          ? getEffectiveMountainTuningForLevel(currentLevel(), model.levelIndex)
          : null;
        return getAllTileIdentities(tuning);
      }

      function makeVirtualHuTile(identity, index) {
        return {
          id: `hu-wait-${identity.key}-${index}`,
          suit: identity.suit,
          rank: identity.rank,
          location: "slot",
        };
      }

      function isHuWaitRouteAvailable(targets) {
        const boardCounts = getBoardTileIdentityCounts();
        const requiredCounts = targets.reduce((counts, target) => {
          counts[target.key] = (counts[target.key] ?? 0) + 1;
          return counts;
        }, {});
        return Object.entries(requiredCounts).every(([key, count]) => (boardCounts[key] ?? 0) >= count);
      }

      function getBoardTileIdentityCounts() {
        return getBoardTiles().reduce((counts, tile) => {
          const key = getTileKey(tile);
          counts[key] = (counts[key] ?? 0) + 1;
          return counts;
        }, {});
      }

      function getUniqueHuWaitTargetKeys(targets) {
        return [...new Set(targets.map((target) => target.key))];
      }

      function formatTileIdentityLabel(identity) {
        return getTileLabel(identity);
      }

      function renderCounts() {

        view.counts.innerHTML = "";
        for (const suit of ALL_SUITS) {

          const label = document.createElement("strong");
          label.textContent = `${SUIT_LABELS[suit]} ${counts[suit].total}`;
          const dots = document.createElement("div");
          dots.className = "rank-dots";
          const maxRank = suit === "honor" ? 7 : 9;
          for (let rank = 1; rank <= maxRank; rank += 1) {
            const dot = document.createElement("span");
            const count = counts[suit].ranks[rank] ?? 0;
            const tileKey = `${suit}-${rank}`;
            dot.className = huWaitTargetKeys.has(tileKey) && count > 0
              ? "rank-dot has hu-wait"
              : `rank-dot${count > 0 ? " has" : ""}`;
            const rankLabel = suit === "honor" ? HONOR_LABELS[rank] : String(rank);
            const face = document.createElement("span");
            face.className = "rank-face";
            face.textContent = rankLabel;
            const countLabel = document.createElement("span");
            countLabel.className = "rank-count";
            countLabel.textContent = String(count);
            dot.append(face, countLabel);
            dots.append(dot);

          row.append(label, dots);

        view.shuffleButton.title = shuffleDisabledByModifier

          : "";
