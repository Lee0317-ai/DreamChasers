<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>胡了卜玩家试玩</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f1e5;
        --ink: #221912;
        --muted: #755f4d;
        --panel: #fffaf0;
        --line: #d8b98b;
        --jade: #1f8a70;
        --jade-dark: #12624f;
        --vermilion: #c83d2f;
        --gold: #d59a2f;
        --tile: #fff8e7;
        --tile-edge: #b88245;
        --slot: #4a2d1f;
        --shadow: 0 18px 42px rgba(87, 55, 29, 0.18);
        --tile-w: 12.5806451613%;
        --overlay-z: 1000000;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background:
          radial-gradient(circle at 20% 0%, rgba(31, 138, 112, 0.16), transparent 28rem),
          linear-gradient(135deg, #f7f1e5 0%, #f0ddbf 54%, #ebc887 100%);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      select,
      input {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 500px) 320px;
        justify-content: center;
        gap: 18px;
        padding: 18px;
      }

      body.play-view .app {
        grid-template-columns: minmax(0, 480px) 72px;
        align-items: start;
        gap: 8px;
        padding: 3px;
      }

      .play {
        display: grid;
        grid-template-rows: auto minmax(260px, 1fr) auto;
        gap: 14px;
        min-width: 0;
      }

      body.play-view .play {
        grid-template-rows: auto auto auto auto auto;
        grid-auto-rows: auto;
        align-content: start;
        gap: 3px;
      }

      .topbar,
      .play-hud,
      .side,
      .board-wrap,
      .counter-section,
      .meld-river-panel,
      .slot-area {
        border: 1px solid rgba(90, 54, 22, 0.2);
        background: rgba(255, 250, 240, 0.9);
        box-shadow: var(--shadow);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 16px;
      }

      body.play-view .topbar {
        display: none;
      }

      body.play-view.embed-shell .app {
        padding-top: 12px;
      }

      .brand {
        display: grid;
        gap: 2px;
      }

      .brand strong {
        font-size: clamp(22px, 3vw, 34px);
        line-height: 1;
        letter-spacing: 0;
      }

      body.play-view .brand strong {
        font-size: clamp(16px, 1.9vw, 20px);
      }

      body.play-view .brand span {
        display: none;
      }

      body.play-view .brand span {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .brand span {
        color: var(--muted);
        font-size: 13px;
      }

      body.play-view .brand span {
        font-size: 10px;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .top-controls {
        min-width: 0;
        width: min(680px, 62vw);
        display: grid;
        gap: 8px;
      }

      body.play-view .top-controls,
      body.play-view .tuning-panel,
      body.tuner-view .topbar-actions {
        display: none !important;
      }

      [hidden] {
        display: none !important;
      }

      .mode-switch {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
        padding: 4px;
        border: 1px solid rgba(90, 54, 22, 0.2);
        background: #f7e2b8;
      }

      .mode-button {
        min-height: 34px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
      }

      .mode-button.active {
        background: var(--jade-dark);
        color: white;
      }

      .level-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 0;
        scrollbar-width: thin;
      }

      .level-tab {
        width: 46px;
        height: 38px;
        flex: 0 0 auto;
        border: 1px solid rgba(90, 54, 22, 0.2);
        background: #f7e2b8;
        color: var(--ink);
        font-weight: 800;
      }

      .level-tab.active {
        background: var(--jade);
        color: white;
      }

      .board-wrap {
        min-height: 0;
        padding: 14px;
      }

      body.play-view .board-wrap {
        padding: 4px;
      }

      .board {
        position: relative;
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        aspect-ratio: 620 / 360;
        overflow: hidden;
        border: 1px solid rgba(67, 42, 23, 0.25);
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px),
          linear-gradient(0deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px),
          linear-gradient(145deg, #2f6f5c, #163d35 62%, #402818);
        background-size: 31px 31px, 31px 31px, auto;
      }

      .board::before {
        content: "";
        position: absolute;
        inset: 7% 9% 12%;
        border: 2px solid rgba(255, 255, 255, 0.15);
        background: rgba(0, 0, 0, 0.08);
        transform: skewX(-8deg);
        pointer-events: none;
      }

      .board[data-mode="mountain"] {
        width: min(100%, 560px, 68vh);
        max-width: 560px;
        aspect-ratio: 560 / 640;
        background-size: 18px 18px, 18px 18px, auto;
      }

      body.play-view .board[data-mode="mountain"] {
        width: min(100%, 330px);
        max-width: 330px;
      }

      .play-hud {
        display: none;
      }

      body.play-view .play-hud {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 2px;
        padding: 2px;
      }

      body.play-view .hud-chip {
        min-height: 24px;
        padding: 2px 3px;
      }

      body.play-view .hud-chip span {
        font-size: 8px;
      }

      body.play-view .hud-chip strong {
        font-size: 11px;
      }

      .hud-chip {
        min-width: 0;
        min-height: 42px;
        display: grid;
        align-content: center;
        gap: 2px;
        border: 1px solid rgba(90, 54, 22, 0.18);
        background: rgba(255, 245, 223, 0.86);
        padding: 5px 7px;
      }

      .hud-chip span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        line-height: 1;
      }

      .hud-chip strong {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 15px;
        line-height: 1.2;
      }

      .board.boss {
        border-color: rgba(200, 61, 47, 0.72);
        box-shadow:
          inset 0 0 0 3px rgba(200, 61, 47, 0.28),
          0 0 28px rgba(200, 61, 47, 0.28);
      }

      .board[data-mode="mountain"] .tile {
        width: 11.4285714286%;
        aspect-ratio: 52 / 70;
        border-width: 1px;
        border-bottom-width: 3px;
        font-size: clamp(11px, 1.65vw, 18px);
        box-shadow:
          0 5px 0 rgba(107, 72, 38, 0.34),
          0 9px 12px rgba(23, 15, 9, 0.22);
      }

      .tile {
        position: absolute;
        width: var(--tile-w);
        aspect-ratio: 64 / 86;
        display: grid;
        place-items: center;
        border: 2px solid var(--tile-edge);
        border-bottom-width: 6px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(255, 248, 231, 0.88)),
          var(--tile);
        color: var(--ink);
        font-weight: 900;
        font-size: clamp(14px, 2.7vw, 28px);
        line-height: 1;
        text-shadow: 0 1px 0 white;
        box-shadow:
          0 12px 0 rgba(107, 72, 38, 0.38),
          0 18px 20px rgba(23, 15, 9, 0.3);
        transition: transform 150ms ease, opacity 150ms ease, filter 150ms ease;
      }

      .tile::before {
        content: "";
        position: absolute;
        inset: 7px;
        border: 1px solid rgba(184, 130, 69, 0.45);
        pointer-events: none;
      }

      .board[data-mode="mountain"] .tile::before {
        inset: 4px;
      }

      .tile.stack-top::after {
        content: "";
        position: absolute;
        top: -8px;
        left: 10%;
        right: 10%;
        height: 5px;
        border: 1px solid rgba(67, 42, 23, 0.42);
        border-bottom: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(64, 42, 24, 0.34) 0 1px,
          rgba(255, 248, 231, 0.96) 1px 2px
        );
        box-shadow: 0 2px 0 rgba(107, 72, 38, 0.2);
        pointer-events: none;
      }

      .board[data-mode="mountain"] .tile.stack-top::after {
        content: "";
        top: -4px;
        left: auto;
        right: -3px;
        width: 9px;
        height: 9px;
        border: 1px solid rgba(67, 42, 23, 0.42);
        border-radius: 999px;
        background: rgba(255, 212, 108, 0.84);
        color: #3b210f;
        display: grid;
        place-items: center;
        font-size: 0;
        line-height: 1;
        text-shadow: none;
        box-shadow: 0 1px 3px rgba(23, 15, 9, 0.2);
      }

      body.tuner-view .board[data-mode="mountain"] .tile.stack-top::after {
        content: attr(data-stack-depth);
        top: -6px;
        right: -5px;
        width: 16px;
        height: 16px;
        border-radius: 5px;
        font-size: 9px;
        background: #ffd46c;
      }

      .tile.available:hover {
        transform: translate(var(--lift-x), calc(var(--lift-y) - 5px));
        filter: brightness(1.08);
      }

      .tile.blocked {
        opacity: 0.44;
        filter: grayscale(0.55);
      }

      .board[data-mode="mountain"] .tile.stack-preview.blocked {
        opacity: 0.64;
        filter: grayscale(0.36) saturate(0.74) brightness(0.86);
      }

      .board[data-mode="mountain"] .tile.stack-preview::after {
        content: "";
        position: absolute;
        inset: 5px 5px auto;
        height: 2px;
        background: rgba(67, 42, 23, 0.18);
        pointer-events: none;
      }

      .board[data-mode="mountain"] .tile.stack-bridge {
        border-color: #d59a2f;
        background:
          linear-gradient(180deg, rgba(255, 249, 220, 0.94), rgba(250, 221, 147, 0.9)),
          var(--tile);
        box-shadow:
          0 7px 0 rgba(120, 72, 29, 0.34),
          0 12px 18px rgba(23, 15, 9, 0.25);
      }

      .board[data-mode="mountain"] .tile.stack-bridge::after {
        content: attr(data-bridge-unlocks);
        position: absolute;
        top: -7px;
        right: -6px;
        width: 16px;
        height: 16px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(67, 42, 23, 0.42);
        border-radius: 999px;
        background: #ffd46c;
        color: #3b210f;
        font-size: 9px;
        line-height: 1;
        text-shadow: none;
        pointer-events: none;
      }

      .board[data-mode="mountain"] .tile.loose-mountain {
        border-color: rgba(213, 154, 47, 0.86);
        background:
          linear-gradient(180deg, rgba(255, 252, 230, 0.96), rgba(255, 235, 177, 0.94)),
          var(--tile);
        box-shadow:
          0 5px 0 rgba(120, 72, 29, 0.32),
          0 10px 20px rgba(213, 154, 47, 0.24);
      }

      .board.vision-on .tile.blocked {
        opacity: 0.72;
        filter: none;
        outline: 2px solid rgba(255, 212, 108, 0.8);
        outline-offset: 2px;
      }

      .board[data-mode="mountain"].vision-on .tile.stack-preview.blocked {
        opacity: 0.9;
      }

      .tile.removed {
        display: none;
      }

      .tile .suit {
        position: absolute;
        right: 8px;
        bottom: 7px;
        font-size: 0.56em;
        color: var(--vermilion);
      }

      .board[data-mode="mountain"] .tile .suit {
        right: 4px;
        bottom: 4px;
        font-size: 0.52em;
      }

      .slot-area {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      body.play-view .slot-area {
        gap: 3px;
        padding: 4px;
      }

      .slot-line {
        display: grid;
        min-width: 0;
      }

      .action-strip {
        min-width: 0;
        display: flex;
        justify-content: center;
      }

      .slot-grid {
        display: grid;
        grid-template-columns: repeat(var(--slot-count), minmax(34px, 1fr));
        gap: 6px;
        min-width: 0;
      }

      body.play-view .slot-grid {
        grid-template-columns: repeat(var(--slot-count), minmax(26px, 1fr));
        gap: 4px;
      }

      .slot-cell {
        min-height: 60px;
        display: grid;
        place-items: center;
        border: 1px dashed rgba(255, 250, 240, 0.5);
        background: linear-gradient(180deg, #68412c, var(--slot));
        color: #fff7e4;
      }

      body.play-view .slot-cell {
        min-height: 44px;
      }

      .slot-cell.filled {
        border-style: solid;
        background: #fff8e7;
        color: var(--ink);
        border-color: var(--tile-edge);
        font-weight: 900;
      }

      .slot-cell.selectable {
        border-color: var(--vermilion);
        background: #fff1df;
        color: #7c241b;
        box-shadow: inset 0 0 0 2px rgba(200, 61, 47, 0.2);
      }

      .combo-actions {
        width: min(100%, 360px);
        display: grid;
        grid-template-columns: repeat(5, minmax(48px, 64px));
        gap: 6px;
        justify-content: center;
      }

      .combo-button,
      .candidate,
      .primary-button,
      .ghost-button,
      .tool-button,
      .reward-button {
        min-height: 36px;
        border: 1px solid rgba(90, 54, 22, 0.24);
        padding: 0 12px;
        background: #efe0c5;
        color: var(--muted);
        font-weight: 800;
      }

      .combo-button.active {
        background: linear-gradient(180deg, #ffd46c, #d86e2f);
        color: #2a1409;
        box-shadow: 0 8px 18px rgba(200, 61, 47, 0.3);
      }

      .candidates {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .candidate {
        background: white;
        color: var(--ink);
      }

      .candidate[data-type="gang"] {
        border-color: var(--vermilion);
      }

      .candidate[data-type="peng"] {
        border-color: var(--gold);
      }

      .candidate[data-type="chi"] {
        border-color: var(--jade);
      }

      .candidate[data-type="hu"] {
        border-color: rgba(213, 154, 47, 0.78);
        background: #f7e2b8;
        color: var(--ink);
      }

      .candidate[data-type="bugang"] {
        border-color: rgba(200, 61, 47, 0.58);
        background: #fff1df;
        color: #7c241b;
      }

      .hu-hint {
        display: none;
        min-height: 28px;
        align-items: center;
        border: 1px solid rgba(213, 154, 47, 0.36);
        background: #fff5d8;
        color: #5a3616;
        padding: 4px 8px;
        font-size: 13px;
        font-weight: 900;
        line-height: 1.25;
      }

      .hu-hint.show {
        display: flex;
      }

      .rank-dot.hu-wait {
        border-color: rgba(213, 154, 47, 0.82);
        background: #ffd46c;
        color: #3b210f;
        box-shadow: 0 0 0 2px rgba(213, 154, 47, 0.16);
      }

      .side {
        min-width: 0;
        display: grid;
        align-content: start;
        gap: 14px;
        padding: 16px;
        overflow: auto;
      }

      body.play-view .side {
        align-self: start;
        position: sticky;
        top: 12px;
        gap: 8px;
        max-height: calc(100vh - 24px);
        padding: 0;
        overflow: visible;
        border: 0;
        background: transparent;
        box-shadow: none;
      }

      body.play-view .side > :not(.tools-section) {
        display: none;
      }

      .level-title {
        display: grid;
        gap: 4px;
      }

      .level-title h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.12;
        letter-spacing: 0;
      }

      .level-title span {
        color: var(--muted);
        font-size: 14px;
      }

      .boss-goal {
        display: none;
        border: 1px solid rgba(200, 61, 47, 0.35);
        background: #fff1df;
        color: #7c241b;
        padding: 10px;
        font-weight: 900;
      }

      .boss-goal.show {
        display: block;
      }

      .boss-goal-title {
        display: block;
        margin-bottom: 8px;
      }

      .boss-goal-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .boss-goal-meta {
        margin: -2px 0 8px;
        color: #5f291f;
        font-size: 12px;
        line-height: 1.35;
      }

      .boss-goal-chip {
        min-height: 30px;
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(124, 36, 27, 0.28);
        background: rgba(255, 250, 240, 0.78);
        padding: 4px 8px;
        color: #7c241b;
        font-size: 12px;
        line-height: 1.25;
      }

      .boss-goal-chip.done {
        border-color: rgba(31, 138, 112, 0.42);
        background: #e3f4de;
        color: #12624f;
      }

      .boss-goal-chip.pulse {
        border-color: rgba(213, 154, 47, 0.7);
        background: #ffe1a8;
        box-shadow: 0 0 0 3px rgba(213, 154, 47, 0.18);
      }

      .featured-combos {
        display: none;
        border: 1px solid rgba(31, 143, 118, 0.3);
        background: #edf9f2;
        color: #125f50;
        padding: 10px;
        font-weight: 900;
      }

      .featured-combos.show {
        display: block;
      }

      .play-boss-goal {
        display: none;
      }

      body.play-view .play-boss-goal.show {
        display: block;
        padding: 4px;
        border: 1px solid rgba(200, 61, 47, 0.35);
        background: #fff1df;
        color: #7c241b;
      }

      body.play-view .play-boss-goal .boss-goal-title {
        margin-bottom: 3px;
        font-size: 11px;
        line-height: 1.1;
      }

      body.play-view .play-boss-goal .boss-goal-list {
        gap: 3px;
      }

      body.play-view .play-boss-goal .boss-goal-meta {
        margin: -1px 0 4px;
        font-size: 9px;
        line-height: 1.2;
      }

      body.play-view .play-boss-goal .boss-goal-chip {
        min-height: 22px;
        padding: 2px 5px;
        font-size: 10px;
        line-height: 1.1;
      }

      .tuning-panel {
        border: 1px solid rgba(31, 138, 112, 0.24);
        background: rgba(237, 249, 242, 0.72);
        padding: 10px;
      }

      .tuning-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .tuning-field {
        display: grid;
        gap: 4px;
      }

      .tuning-field span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .tuning-field input,
      .tuning-field select {
        min-width: 0;
        height: 36px;
        border: 1px solid rgba(90, 54, 22, 0.22);
        background: #fffaf0;
        color: var(--ink);
        padding: 0 8px;
        font-weight: 800;
      }

      .tuning-action {
        width: 100%;
        margin-top: 8px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .metric {
        border: 1px solid rgba(90, 54, 22, 0.18);
        background: #fff5df;
        padding: 10px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .metric strong {
        display: block;
        margin-top: 3px;
        font-size: 20px;
      }

      .section {
        display: grid;
        gap: 8px;
      }

      .meld-river-panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 6px;
        padding: 6px;
      }

      .meld-river-panel .section {
        min-width: 0;
        padding: 6px;
        border: 1px solid rgba(90, 54, 22, 0.16);
        background: rgba(255, 245, 223, 0.76);
      }

      .meld-list,
      .river-list {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
      }

      .meld-chip,
      .river-cell {
        min-height: 30px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(90, 54, 22, 0.2);
        background: #fff8e7;
        color: var(--ink);
        font-size: 12px;
        font-weight: 900;
        text-align: center;
      }

      .meld-chip.gang {
        border-color: rgba(200, 61, 47, 0.45);
        background: #fff1df;
        color: #7c241b;
      }

      .river-cell.empty {
        border-style: dashed;
        background: #f3ddaf;
        color: var(--muted);
      }

      .river-capacity {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }

      .counter-section {
        padding: 10px 12px;
      }

      body.play-view .meld-river-panel {
        gap: 2px;
        padding: 3px;
      }

      body.play-view .meld-river-panel .section {
        gap: 2px;
        padding: 2px;
      }

      body.play-view .counter-section {

      function applyInitialRouteState() {
        const params = new URLSearchParams(window.location.search);
        const requestedView = params.get("view");
        const requestedMode = params.get("mode");
        const requestedEmbed = params.get("embed");
        const requestedSession = params.get("session");
        const requestedLevel = Number.parseInt(params.get("level") ?? "", 10);
        const requestedStartLayer = Number.parseInt(params.get("startLayer") ?? "", 10);
        const requestedDailySeed = String(params.get("dailySeed") ?? "").trim();
        const requestedAscensionLevel = Number.parseInt(params.get("ascensionLevel") ?? "", 10);
        const requestedAscensionName = String(params.get("ascensionName") ?? "").trim();
        const requestedAscensionPerks = String(params.get("ascensionPerks") ?? "").trim();
        const requestedAscensionPerkSlots = Number.parseInt(params.get("ascensionPerkSlots") ?? "", 10);
        const requestedReserveBonus = Number.parseInt(params.get("reserveBonus") ?? "", 10);
        const requestedShieldBonus = Number.parseInt(params.get("shieldBonus") ?? "", 10);
        const requestedToolBonus = Number.parseInt(params.get("toolBonus") ?? "", 10);

        model.ascensionLevel = 0;
        model.ascensionName = "";
        model.equippedAscensionPerks = [];
        model.ascensionPerkSlots = 0;

        if (PROTOTYPE_VIEW_MODES.has(requestedView)) {
          model.prototypeView = requestedView;
        }

        if (requestedMode === "endless") {
          model.runMode = "endless";
          model.mode = "mountain";
          model.run.endlessLayer = Number.isNaN(requestedStartLayer)
            ? ENDLESS_START_LAYER
            : Math.max(ENDLESS_START_LAYER, requestedStartLayer);
        } else if (requestedMode === "daily") {
          model.runMode = "daily";
          model.mode = "mountain";
          model.run.dailySeed = requestedDailySeed || new Date().toISOString().slice(0, 10);
        } else if (requestedMode === "ascension") {
          model.runMode = "mainline";
          model.mode = "mountain";
          model.ascensionLevel = Number.isNaN(requestedAscensionLevel) ? 1 : Math.max(1, Math.min(4, requestedAscensionLevel));
          model.ascensionName = requestedAscensionName
            || ({ 1: "东风场", 2: "南风场", 3: "西风场", 4: "北风场" }[model.ascensionLevel] ?? "东风场");
          model.ascensionPerkSlots = Number.isNaN(requestedAscensionPerkSlots)
            ? (ASCENSION_CONFIGS[model.ascensionLevel]?.ascensionPerkSlots ?? 1)
            : Math.max(0, requestedAscensionPerkSlots);
          model.equippedAscensionPerks = requestedAscensionPerks
            ? requestedAscensionPerks.split(",").map((item) => item.trim()).filter((item) => Boolean(ASCENSION_PERK_POOL[item]))
            : [];
        } else if (requestedMode === "mountain" || requestedMode === "config") {
          model.mode = requestedMode;
        }

        model.embedShell = requestedEmbed === "shell";
        model.shellSessionKey = requestedSession ?? "";
        model.shellBonuses.reserve = Number.isNaN(requestedReserveBonus) ? 0 : Math.max(0, requestedReserveBonus);
        model.shellBonuses.shield = Number.isNaN(requestedShieldBonus) ? 0 : Math.max(0, requestedShieldBonus);
        model.shellBonuses.tool = Number.isNaN(requestedToolBonus) ? 0 : Math.max(0, requestedToolBonus);

        model.mountainTuning = readMountainTuningFromParams(params, model.mountainTuning);

        if (!Number.isNaN(requestedLevel)) {
          const levelIndex = model.levelsConfig.levels.findIndex((level) => level.order === requestedLevel);
          if (levelIndex >= 0) model.levelIndex = levelIndex;
        }
      }

      function syncPrototypeViewShell() {
        const isTunerView = model.prototypeView === "tuner";
        document.body.dataset.prototypeView = model.prototypeView;
        document.body.classList.toggle("play-view", !isTunerView);
        document.body.classList.toggle("tuner-view", isTunerView);
        document.body.classList.toggle("embed-shell", model.embedShell && !isTunerView);
        document.title = isTunerView ? "胡了卜调牌器" : "胡了卜玩家试玩";
        view.topControls.hidden = !isTunerView;
        view.tunerLink.hidden = isTunerView;

        if (!isTunerView) {
          const tunerParams = new URLSearchParams();
          tunerParams.set("level", String(currentLevel().order));
          tunerParams.set("mode", model.mode);
          tunerParams.set("template", model.mountainTuning.templateId);
          view.tunerLink.href = `./tuner.html?${tunerParams.toString()}`;
        }
      }

      function canEmitShellEvent() {
        return model.embedShell && window.parent && window.parent !== window;
      }

      function buildShellPayload(extra = {}) {
        const level = model.levelsConfig && model.state ? currentLevel() : null;
        const endlessChapter = isEndlessMode() ? getEndlessChapterProfile() : null;
        const dailyMutator = isDailyMode() ? getDailyMutatorProfile() : null;
        return {
          sessionKey: model.shellSessionKey,
          levelOrder: level?.order ?? null,
          levelName: level?.name ?? "",
          runMode: model.runMode,
          ascensionLevel: model.ascensionLevel || null,
          ascensionName: model.ascensionName || null,
          dailySeed: isDailyMode() ? model.run.dailySeed : null,
          endlessLayer: isEndlessMode() ? getEndlessLayerOrder() : null,
          endlessChapterLabel: endlessChapter?.label ?? null,
          endlessChapterBoss: endlessChapter?.bossTitle ?? null,
          dailyMutatorLabel: dailyMutator?.label ?? null,
          dailyRewardLabel: dailyMutator?.rewardLabel ?? null,
          dailyStreak: isDailyMode() ? getDailyParticipationStreak() : null,
          coins: model.run.coins,
          score: model.state?.score ?? 0,
          pickedRewards: model.run.pickedRewards.length,
          summary: extra.summary ?? view.status.textContent ?? "",
          specialEventSummary: extra.specialEventSummary ?? model.run.lastSpecialEventMessage ?? "",
          specialEventMessage: extra.specialEventMessage ?? model.run.lastSpecialEventMessage ?? "",
          ...extra,
        };
      }

      function emitShellEvent(type, extra = {}) {
        if (!canEmitShellEvent()) return;
        window.parent.postMessage({
          source: "hulebu-demo-shell",
          type,
          payload: buildShellPayload(extra),
        }, window.location.origin);
      }

      function readMountainTuningFromParams(params, fallback) {
        return normalizeMountainTuning({
          seed: params.get("seed") ?? fallback.seed,
          templateId: params.has("template") ? params.get("template") : fallback.templateId,
          tileCount: params.has("tiles") ? params.get("tiles") : fallback.tileCount,
          stackDepth: params.has("stack") ? params.get("stack") : fallback.stackDepth,
          huPacks: params.has("hu") ? params.get("hu") : fallback.huPacks,
          honorWeight: params.has("honor") ? params.get("honor") : fallback.honorWeight,
        });
      }

      function readMountainTuningForm() {
        return normalizeMountainTuning({
          seed: view.mountainSeed.value,
          templateId: view.mountainTemplate.value,
          tileCount: view.mountainTileCount.value,
          stackDepth: view.mountainStackDepth.value,
          huPacks: view.mountainHuPacks.value,
          honorWeight: view.mountainHonorWeight.value,
        });
      }

      function normalizeMountainTuning(raw) {
        return {
          seed: String(raw.seed ?? "").trim(),
          templateId: normalizeMountainTemplateId(raw.templateId ?? DEFAULT_MOUNTAIN_TUNING.templateId),
          tileCount: normalizeOptionalInteger(raw.tileCount, MOUNTAIN_TILE_COUNT_RANGE.min, MOUNTAIN_TILE_COUNT_RANGE.max),
          stackDepth: normalizeInteger(raw.stackDepth, 2, 10, DEFAULT_MOUNTAIN_TUNING.stackDepth),
          huPacks: normalizeOptionalInteger(raw.huPacks, 0, 4),
          honorWeight: normalizeInteger(raw.honorWeight, 0, 100, DEFAULT_MOUNTAIN_TUNING.honorWeight),
        };
      }

      function normalizeMountainTemplateId(value) {
        const templateId = String(value ?? DEFAULT_MOUNTAIN_TUNING.templateId).trim();
        if (templateId === "auto" || MOUNTAIN_TEMPLATE_IDS.includes(templateId)) return templateId;
        return DEFAULT_MOUNTAIN_TUNING.templateId;
      }

      function normalizeOptionalInteger(value, min, max) {
        if (value === null || value === undefined || value === "") return null;
        const parsed = Number.parseInt(value, 10);
        if (Number.isNaN(parsed)) return null;
        return clampNumber(parsed, min, max);
      }

      function normalizeInteger(value, min, max, fallback) {
        const parsed = Number.parseInt(value, 10);
        if (Number.isNaN(parsed)) return fallback;
        return clampNumber(parsed, min, max);
      }

      function clampNumber(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function resetMountainTemplateForLevelTransition(index, options = {}) {
        const shouldReset = options.resetFixedMountainTemplate && (options.forceResetMountainTemplate || index !== model.levelIndex);
        if (!shouldReset || model.mode !== "mountain" || model.mountainTuning.templateId === DEFAULT_MOUNTAIN_TUNING.templateId) return;
        model.mountainTuning = {
          ...model.mountainTuning,
          templateId: DEFAULT_MOUNTAIN_TUNING.templateId,
        };
      }

      function refreshAutoMountainTemplateSeedForLoad(options = {}) {
        if (!shouldUseVolatileAutoMountainTemplateSeed()) return;
        refreshAutoMountainTemplateSeed(`${currentLevel().id}:${options.reason ?? "load"}`);
      }

      function shouldUseVolatileAutoMountainTemplateSeed() {
        return (
          model.mode === "mountain"
          && model.prototypeView === "play"
          && model.mountainTuning.templateId === "auto"
          && !model.mountainTuning.seed
          && !isDailyMode()
        );
      }

      function refreshAutoMountainTemplateSeed(reason = "") {
        model.autoMountainTemplateSeed = `${reason}:${Date.now()}:${Math.random()}`;
      }

      function isFriendDemoMode() {
        return model.prototypeView === "play" && !isEndlessMode() && !isDailyMode();
      }

      function isEndlessMode() {
        return model.runMode === "endless";
      }

      function isDailyMode() {
        return model.runMode === "daily";
      }

      function isAscensionMode() {
        return model.ascensionLevel > 0;
      }

      function getAscensionConfig(level = model.ascensionLevel) {
        return ASCENSION_CONFIGS[level] ?? null;
      }

      function getAscensionPerkPool() {
        return model.equippedAscensionPerks
          .map((perkId) => ASCENSION_PERK_POOL[perkId])
          .filter(Boolean);
      }

      function getAscensionRewardPool(level = model.ascensionLevel) {
        const basePool = [
          ...(ASCENSION_REWARD_POOL[level] ?? []),
          ...(ASCENSION_TIER_REWARD_BONUSES[level] ?? []),
        ];
        const perkIds = [...model.equippedAscensionPerks].sort();
        for (const perkId of perkIds) {
          basePool.push(...(ASCENSION_BUILD_REWARD_BONUSES[perkId] ?? []));
        }
        const comboKey = perkIds.join("+");
        if (comboKey) {
          basePool.push(...(ASCENSION_BUILD_REWARD_BONUSES[comboKey] ?? []));
        }
        return [...new Set(basePool)];
      }

      function getAscensionSettlementHighlights() {
        if (!isAscensionMode()) return [];

        const buildFocus = getAscensionBuildFocus();

          .filter((rewardId) => isAscensionRewardId(rewardId))
          .map((rewardId) => findReward(rewardId)?.name ?? rewardId);
        const highlightMap = {
          "河杠流": ["高阶构筑：河杠连锁", "杠河双响"],

        };
        const rewardNames = highlightMap[buildProfile?.name] ?? [];
        const combined = [...rewardNames, ...ascensionRewards];
        return [...new Set(combined)].slice(0, 3);
      }

      function getAscensionRewardDepthText() {
        if (!isAscensionMode()) return "";
        const ascensionRewards = (model.run.pickedRewards ?? [])
          .filter((rewardId) => isAscensionRewardId(rewardId))
          .map((rewardId) => findReward(rewardId)?.name ?? rewardId);
        if (ascensionRewards.length === 0) return "这轮几乎没有吃到高阶专属奖励。";
        if (ascensionRewards.length === 1) return `这轮只接到 1 个高阶奖励：${ascensionRewards[0]}。`;
        return `这轮已经接到 ${ascensionRewards.length} 个高阶奖励：${ascensionRewards.slice(0, 3).join(" / ")}${ascensionRewards.length > 3 ? " ..." : ""}。`;
      }

      function getAscensionBossMismatchText(failureAnalysis, buildProfile, buildFocus) {
        if (!failureAnalysis || failureAnalysis.type !== "目标完成度") return "";
        const buildName = buildProfile?.name ?? "当前构筑";
        const focusText = buildFocus?.summary ?? buildProfile?.detail ?? "当前路线";
        if (failureAnalysis.bossMismatchLevel === "hard") {
          return `Boss 目标不匹配：${buildName} 当前更偏 ${focusText}，但本关缺口落在另一条目标线上。`;
        }
        return `Boss 目标不匹配：${buildName} 已经接近目标线，只差最后一口完成度。`;
      }

      function getAscensionPerkSummaryText() {
        if (!isAscensionMode()) return "";
        if (model.equippedAscensionPerks.length === 0) return "高阶能力：未装备";
        const labels = getAscensionPerkPool().map((perk) => perk.label);
        const buildProfile = getAscensionBuildProfile();
        return `高阶能力：${labels.join(" / ")}${buildProfile ? ` · 构筑 ${buildProfile.name}` : ""}`;
      }

      function isAscensionRewardId(rewardId) {
        return rewardId.startsWith("ascension_");
      }

      function getPlayableLevelCount() {
        if (isEndlessMode() || isDailyMode()) return model.levelsConfig.levels.length;
        return isFriendDemoMode()
          ? Math.min(FRIEND_DEMO_LEVEL_COUNT, model.levelsConfig.levels.length)
          : model.levelsConfig.levels.length;
      }

      function getPlayableLevels() {
        if (isEndlessMode() || isDailyMode()) return [currentLevel()].filter(Boolean);
        return model.levelsConfig.levels.slice(0, getPlayableLevelCount());
      }

      function getAscensionTierEvent(levelIndex) {
        const baseLevel = model.ascensionLevel ?? 0;
        if (!baseLevel) return null;
        const advancedLevel = baseLevel + 10;
        const shouldUseAdvancedTierEvent = levelIndex >= 12 || (levelIndex >= 8 && levelIndex % 4 === 0);
        if (shouldUseAdvancedTierEvent) return ASCENSION_TIER_EVENT_POOL[advancedLevel] ?? ASCENSION_TIER_EVENT_POOL[baseLevel] ?? null;
        return ASCENSION_TIER_EVENT_POOL[baseLevel] ?? null;
      }

      function getSpecialEventForLevel(levelIndex) {
        if (isAscensionMode()) {
          const buildProfile = getAscensionBuildProfile();
          const ascensionEvent = buildProfile ? ASCENSION_SPECIAL_EVENT_POOL[buildProfile.name] : null;
          const tierEvent = getAscensionTierEvent(levelIndex);
          if (tierEvent && levelIndex % 2 === 0) return tierEvent;
          if (ascensionEvent) return ascensionEvent;
          if (buildProfile?.name === "河控流") return SPECIAL_EVENT_POOL[1] ?? null;
          if (buildProfile?.name === "稳手流") return SPECIAL_EVENT_POOL[0] ?? null;
          if (buildProfile?.name === "稳压流") return SPECIAL_EVENT_POOL[3] ?? null;
        }
        const triggerIndex = SPECIAL_EVENT_TRIGGER_LEVELS.indexOf(levelIndex);
        if (triggerIndex < 0) return null;
        const pool = getSpecialEventPoolForLevel(levelIndex);
        return pool[triggerIndex % pool.length] ?? null;
      }

      function getSpecialEventPoolForLevel(levelIndex) {
        const pool = [...SPECIAL_EVENT_POOL];
        if (isAscensionMode()) {
          const buildProfile = getAscensionBuildProfile();
          if (buildProfile?.name === "河控流") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "river-old-pledge"));
          if (buildProfile?.name === "稳压流") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "risk-double-down"));
          if (buildProfile?.name === "封盘流") pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "seal-delayed"));
        } else if (levelIndex >= 7) {
          pool.unshift(SPECIAL_EVENT_POOL.find((event) => event.id === "river-old-pledge"));
        }
        return pool.filter(Boolean);
      }

      function getSpecialEventRarityLabel(event) {
        return SPECIAL_EVENT_RARITIES[event.rarity] ?? SPECIAL_EVENT_RARITIES.common;
      }

      function getSpecialEventTagText(event) {
        return SPECIAL_EVENT_TAGS[event.tag] ?? event.tag ?? SPECIAL_EVENT_TAGS.economy;
      }

      function getSpecialEventOffer(event, option) {
        const buildLink = EVENT_BUILD_LINKS[option.effect?.modifier?.label] ?? EVENT_BUILD_LINKS[getAscensionBuildProfile()?.name] ?? "";
        const rarity = getSpecialEventRarityLabel(event);
        const tag = getSpecialEventTagText(event);
        return buildLink ? `${rarity} · ${tag} · ${buildLink}` : `${rarity} · ${tag}`;
      }

      function maybeShowSpecialEventBeforeLevel(levelIndex) {
        if (!isFriendDemoMode()) return false;
        if (!SPECIAL_EVENT_TRIGGER_LEVELS.includes(levelIndex)) return false;
        if (model.run.specialEventsSeen.includes(levelIndex)) return false;
        const event = getSpecialEventForLevel(levelIndex);
        if (!event) return false;

        model.run.specialEventsSeen.push(levelIndex);
        model.run.pendingSpecialEvent = event;
        if (model.state) {
          model.state.phase = "event";
          model.state.discardSelecting = false;
          model.state.endgamePrimerSelecting = false;
        }
        showSpecialEventOverlay(event);
        return true;
      }

      function showSpecialEventOverlay(event) {
        view.rewardTitle.textContent = event.title;
        view.rewardGrid.innerHTML = "";
        view.rewardGrid.style.display = "grid";
        view.runComplete.innerHTML = "";
        view.runComplete.classList.add("show");

        const summary = document.createElement("p");
        summary.textContent = `${getSpecialEventRarityLabel(event)} · ${getSpecialEventTagText(event)} · ${event.summary}`;
        view.runComplete.append(summary);

        for (const option of event.options) {
          const card = document.createElement("article");
          card.className = "reward-card";
          const title = document.createElement("strong");
          title.textContent = option.label;
          const desc = document.createElement("p");
          desc.textContent = `${describeSpecialEventEffect(option.effect)} · ${getSpecialEventOffer(event, option)}`;
          const button = document.createElement("button");
          button.className = "reward-button";
          button.type = "button";
          button.textContent = "选择并开局";
          button.addEventListener("click", () => chooseSpecialEventOption(event.id, option.id));
          card.append(title, desc, button);
          view.rewardGrid.append(card);
        }

        view.rewardOverlay.classList.add("show");
        emitShellEvent("hulebu:run-progress", {
          summary: `特殊事件：${event.title}`,
          specialEventSummary: `${getSpecialEventRarityLabel(event)} · ${getSpecialEventTagText(event)} · ${event.title}`,
          specialEventMessage: event.summary,
        });
        if (view.status) view.status.textContent = `特殊事件：${event.title}`;
      }

      function chooseSpecialEventOption(eventId, optionId) {
        const event = model.run.pendingSpecialEvent?.id === eventId
          ? model.run.pendingSpecialEvent
          : SPECIAL_EVENT_POOL.find((item) => item.id === eventId)
            ?? Object.values(ASCENSION_SPECIAL_EVENT_POOL).find((item) => item.id === eventId);
        if (!event) return;
        const option = event.options.find((item) => item.id === optionId);
        if (!option) return;

        const effectMessage = applySpecialEventEffect(option.effect, event.title, option.label);
        model.run.pendingSpecialEvent = null;
        model.run.lastSpecialEventMessage = effectMessage;
        view.rewardOverlay.classList.remove("show");
        loadLevel(model.levelIndex, { resetFixedMountainTemplate: true });
      }

      function applySpecialEventEffect(effect, eventTitle, optionLabel) {
        if (effect.type === "coins") {
          model.run.coins = Math.max(0, model.run.coins + effect.amount);
          if (model.state) model.state.coins = model.run.coins;
          const prefix = effect.amount >= 0 ? "+" : "";
          return `${eventTitle}：${optionLabel}（铜钱 ${prefix}${effect.amount}）`;
        }

        if (effect.type === "tool") {
          model.run.tools[effect.tool] = Math.max(0, (model.run.tools[effect.tool] ?? 0) + effect.amount);
          return `${eventTitle}：${optionLabel}`;
        }

        if (effect.type === "comboBonus") {
          model.run.bonuses[effect.combo] = (model.run.bonuses[effect.combo] ?? 0) + effect.amount;
          return `${eventTitle}：${effect.label ?? optionLabel}`;
        }

        if (effect.type === "shield") {
          model.run.shieldsDelta += effect.amount;
          return `${eventTitle}：${optionLabel}`;
        }

        if (effect.type === "reserve") {
          model.run.reserveDelta += effect.amount;
          return `${eventTitle}：${optionLabel}`;
        }

        if (effect.type === "river") {
          model.run.riverDelta = (model.run.riverDelta ?? 0) + effect.amount;
          return `${eventTitle}：${optionLabel}`;
        }

        if (effect.type === "modifier") {
          model.run.pendingLevelModifier = { ...effect.modifier };
          return `${eventTitle}：${effect.modifier.label}（${EVENT_BUILD_LINKS[effect.modifier.label] ?? effect.modifier.label}）`;
        }

        return `${eventTitle}：${optionLabel}`;
      }

      function applyPendingLevelModifier() {
        const modifier = model.run.pendingLevelModifier ? { ...model.run.pendingLevelModifier } : null;
        model.run.pendingLevelModifier = null;
        return modifier;
      }

      function getCurrentLevelModifier() {
        return model.state?.activeLevelModifier ?? model.loadingLevelModifier ?? null;
      }

      function isToolDisabledByModifier(tool) {
        const modifier = getCurrentLevelModifier();
        if (modifier?.type === "disableTool" && modifier.tool === tool) return true;
        const ascension = getAscensionConfig();
        return Boolean(isAscensionMode() && tool === "shuffle" && ascension?.disableShuffle);
      }

      function getActiveLevelModifierText() {
        const modifier = getCurrentLevelModifier();
        return modifier?.label ?? "";
      }

      function describeSpecialEventEffect(effect) {
        if (effect.type === "coins") {
          const prefix = effect.amount >= 0 ? "+" : "";
          return `立即获得 ${prefix}${effect.amount} 铜钱。`;
        }
        if (effect.type === "tool") {
          const toolLabel = FRIEND_DEMO_TOOLS.find((tool) => tool.key === effect.tool)?.label ?? effect.tool;
          return `立即补充 ${effect.amount} 次${toolLabel}。`;
        }
        if (effect.type === "comboBonus") {
          return `下一关 ${TYPE_LABELS[effect.combo]} 额外 +${effect.amount} 分。`;
        }
        if (effect.type === "shield") {
          return `立即补充 ${effect.amount} 次护符。`;
        }
        if (effect.type === "reserve") {
          return `下一关备用位 +${effect.amount}。`;
        }
        if (effect.type === "river") {
          return `下一关牌河上限 +${effect.amount}。`;
        }
        if (effect.type === "modifier") {
          return `下一关带入「${effect.modifier.label}」，通关奖励 +${effect.modifier.rewardCoins ?? 0} 铜钱。`;
        }
        return "立即生效。";
      }

      function getFriendDemoSlotLimit(levelIndex) {
        return levelIndex < 3 ? FRIEND_DEMO_TUTORIAL_SLOT_LIMIT : FRIEND_DEMO_FULL_SLOT_LIMIT;
      }

      function getFriendDemoLevelMode(levelIndex) {
        return levelIndex < FRIEND_DEMO_TUTORIAL_COMBOS.length ? "tutorial" : "mountain";
      }

      function getFriendDemoDifficultyProfile(levelIndex = model.levelIndex) {
        if (!isFriendDemoMode()) return null;
        if (getFriendDemoLevelMode(levelIndex) !== "mountain") return null;
        return FRIEND_DEMO_DIFFICULTY_PROFILES.find((profile) => profile.levelIndex === levelIndex) ?? null;
      }

      function getAscensionDifficultyProfile(levelIndex = model.levelIndex) {
        if (!isAscensionMode()) return null;
        const ascension = getAscensionConfig();
        const ascensionBaseLevelIndex = Math.min(
          FRIEND_DEMO_DIFFICULTY_PROFILES[FRIEND_DEMO_DIFFICULTY_PROFILES.length - 1]?.levelIndex ?? levelIndex,
          levelIndex + 4,
        );
        const baseProfile =
          FRIEND_DEMO_DIFFICULTY_PROFILES.find((profile) => profile.levelIndex === ascensionBaseLevelIndex)
          ?? FRIEND_DEMO_DIFFICULTY_PROFILES[FRIEND_DEMO_DIFFICULTY_PROFILES.length - 1];
        if (!ascension || !baseProfile) return null;
        const ascensionLabels = [
          "压场起手",
          "连压试探",
          "高阶换气",
          "风场上桌",
          "紧局成型",
          "高压接力",
          "风压转折",
          "连战门前",
          "周目决战",
        ];
        return {
          ...baseProfile,
          label: `${ascension.name} · ${ascensionLabels[Math.max(0, Math.min(ascensionLabels.length - 1, levelIndex - 4))] ?? "高阶周目"}`,
          tileCount: Math.min(MOUNTAIN_TILE_COUNT_RANGE.max, (baseProfile.tileCount ?? 240) + ascension.extraTileCount),
          stackDepth: Math.min(6, (baseProfile.stackDepth ?? 5) + (ascension.level >= 2 ? 1 : 0)),
          huPacks: Math.min(3, (baseProfile.huPacks ?? 0) + (ascension.level >= 2 ? 1 : 0)),
          gangPacks: Math.min(3, baseProfile.gangPacks ?? 2),
          orphanBudget: Math.max(baseProfile.orphanBudget ?? 4, (baseProfile.orphanBudget ?? 4) + ascension.level - 1),
          honorWeight: Math.min(100, (baseProfile.honorWeight ?? 60) + ascension.extraHonorWeight),
        };
      }

      function getAscensionLevelModifier(levelIndex = model.levelIndex) {
        if (!isAscensionMode()) return null;
        const ascension = getAscensionConfig();
        if (!ascension?.forcedModifierInterval || !ascension.forcedModifier) return null;
        const levelOrder = model.levelsConfig.levels[levelIndex]?.order ?? levelIndex + 1;
        return levelOrder % ascension.forcedModifierInterval === 0 ? { ...ascension.forcedModifier } : null;
      }

      function getEndlessLayerOrder() {
        return Math.max(ENDLESS_START_LAYER, model.run.endlessLayer ?? ENDLESS_START_LAYER);
      }

      function getEndlessLevelIndex(layer = getEndlessLayerOrder()) {
        const backHalfStart = Math.max(0, FRIEND_DEMO_LEVEL_COUNT - 10);
        const backHalfCount = Math.max(1, Math.min(10, model.levelsConfig.levels.length - backHalfStart));
        return backHalfStart + ((layer - ENDLESS_START_LAYER) % backHalfCount);
      }

      function getEndlessDifficultyProfile(layer = getEndlessLayerOrder()) {
        if (!isEndlessMode()) return null;
        const baseIndex = getEndlessLevelIndex(layer);
        const baseProfile =
          FRIEND_DEMO_DIFFICULTY_PROFILES.find((profile) => profile.levelIndex === baseIndex)
          ?? FRIEND_DEMO_DIFFICULTY_PROFILES[FRIEND_DEMO_DIFFICULTY_PROFILES.length - 1];
        const cycle = Math.max(0, Math.floor((layer - ENDLESS_START_LAYER) / 10));
        return {
          ...baseProfile,
          levelIndex: baseIndex,
          label: `无尽第 ${layer} 层`,
          tileCount: Math.min(MOUNTAIN_TILE_COUNT_RANGE.max, (baseProfile.tileCount ?? 300) + cycle * 18),
          stackDepth: Math.min(6, (baseProfile.stackDepth ?? 6) + (cycle > 0 ? 1 : 0)),
          huPacks: Math.min(3, (baseProfile.huPacks ?? 1) + Math.floor(cycle / 2)),
          gangPacks: Math.min(3, (baseProfile.gangPacks ?? 2) + Math.floor(cycle / 3)),
          orphanBudget: Math.max(baseProfile.orphanBudget ?? 8, 8 + cycle),
          honorWeight: Math.min(100, (baseProfile.honorWeight ?? 60) + cycle * 6),
        };
      }

      function getEndlessChapterProfile(layer = getEndlessLayerOrder()) {
        if (!isEndlessMode()) return null;
        const chapter = Math.max(1, Math.floor((layer - ENDLESS_START_LAYER) / 5) + 1);
        const phase = ((chapter - 1) % 4) + 1;
        const chapterStart = ENDLESS_START_LAYER + (chapter - 1) * 5;
        const chapterEnd = chapterStart + 4;
        const bossLayer = chapterStart + 4;
        return {
          chapter,
          phase,
          label: `第 ${chapter} 章`,
          detail: `无尽第 ${chapterStart}-${chapterEnd} 层`,
          bossTitle: `章节 Boss · ${phase === 1 ? "河灯守门人" : phase === 2 ? "封盘押局者" : phase === 3 ? "险招翻倍客" : "断幺巡山将"}`,
          bossLayer,
        };
      }

      function getDailyLevelIndex(levelIndex = model.levelIndex) {
        if (!isDailyMode()) return levelIndex;
        return Math.max(0, Math.min(model.levelsConfig.levels.length - 1, levelIndex));
      }

      function getDailyDifficultyProfile(levelIndex = model.levelIndex) {
        if (!isDailyMode()) return null;
        const baseIndex = getDailyLevelIndex(levelIndex);
        const baseProfile = FRIEND_DEMO_DIFFICULTY_PROFILES.find((profile) => profile.levelIndex === baseIndex);
        if (baseProfile) {
          return {
            ...baseProfile,
            label: `今日牌局 ${model.run.dailySeed || "today"}`,
          };
        }

        return {
          levelIndex: baseIndex,
          label: `今日牌局 ${model.run.dailySeed || "today"}`,
          tileCount: Math.min(MOUNTAIN_TILE_COUNT_RANGE.max, 180 + baseIndex * 10),
          stackDepth: Math.min(6, 4 + Math.floor(baseIndex / 4)),
          huPacks: baseIndex >= 6 ? 1 : 0,
          gangPacks: baseIndex >= 4 ? 2 : 1,
          orphanBudget: Math.min(10, 2 + Math.floor(baseIndex / 2)),
          numberSuits: ["wan", "tiao", "tong"],
          honorRanks: baseIndex >= 5 ? [1, 3, 5, 7] : [],
          honorWeight: Math.min(72, baseIndex * 4),
        };
      }

      function getDailyMutatorProfile(seed = model.run.dailySeed || "today") {
        if (!isDailyMode()) return null;
        const profiles = [
          {
            key: "river-pressure",
            label: "今日词缀：牌河压顶",
            detail: "前中段更容易遇到弃牌与河控压力，适合走稳手或河控路线。",
            rewardLabel: "今日奖励：河灯筹码",
          },
          {
            key: "late-sprint",
            label: "今日词缀：牌尾追击",
            detail: "残局节奏更紧，牌尾流和胡流更容易打出完整收官。",
            rewardLabel: "今日奖励：尾巡印记",
          },
          {
            key: "kong-engine",
            label: "今日词缀：杠响回巡",
            detail: "杠相关机会更密集，适合拿路线奖励去追爆发。",
            rewardLabel: "今日奖励：杠响铜契",
          },
        ];
        let hash = 0;
        for (const char of String(seed)) hash = (hash * 33 + char.charCodeAt(0)) % 2147483647;
        return profiles[hash % profiles.length];
      }

      function getDailyParticipationStreak() {
        return Math.max(1, model.run.dailyParticipationStreak || 1);
      }

      function isFriendDemoBossTrialLevel(levelIndex = model.levelIndex) {
        return isFriendDemoMode() && levelIndex === FRIEND_DEMO_BOSS_TRIAL_LEVEL_INDEX;
      }

      function isFriendDemoFinalBossLevel(levelIndex = model.levelIndex) {
        return isFriendDemoMode() && levelIndex === FRIEND_DEMO_FINAL_BOSS_LEVEL_INDEX;
      }

      function getFriendDemoBossTrialGoals(levelIndex = model.levelIndex) {
        if (!isFriendDemoBossTrialLevel(levelIndex)) return null;
        return FRIEND_DEMO_BOSS_TRIAL_GOALS.map((goal) => ({ ...goal }));
      }

      function getBossTrialVariant(levelIndex = model.levelIndex) {
        if (isEndlessMode()) return BOSS_TRIAL_VARIANTS["endless-keeper"];
        if (isAscensionMode() && isBossLevel(levelIndex)) return BOSS_TRIAL_VARIANTS["ascension-warden"];
        if (isFriendDemoBossTrialLevel(levelIndex)) return BOSS_TRIAL_VARIANTS["trial-gate"];
        if (isFriendDemoFinalBossLevel(levelIndex)) return BOSS_TRIAL_VARIANTS["hulebu-king"];
        return BOSS_TRIAL_VARIANTS["trial-gate"];
      }

      function getBossTrialDeck(levelIndex = model.levelIndex) {
        const variant = getBossTrialVariant(levelIndex);
        const phaseCount = isFriendDemoBossTrialLevel(levelIndex)
          || isFriendDemoFinalBossLevel(levelIndex)
          || isAscensionMode()
          || isEndlessMode()
          ? BOSS_TRIAL_PHASES.length
          : 0;
        const phases = phaseCount > 0
          ? BOSS_TRIAL_PHASES.map((phase, index) => ({
            ...phase,
            label: `${index + 1}. ${phase.label}`,
          }))
          : [];
        return {
          variant,
          phases,
          rewardQuality: variant.rewardQuality,
          title: variant.title,
          label: variant.label,
          focus: variant.focus,
        };
      }

      function getBossGoalTitleText() {
        if (isEndlessMode()) return getBossTrialDeck().title;
        if (isFriendDemoBossTrialLevel()) return getBossTrialDeck().title;
        if (isFriendDemoFinalBossLevel()) return getBossTrialDeck().title;
        if (isAscensionMode() && getActiveBossGoals(model.levelIndex).length > 0) return getBossTrialDeck().title;
        return "Boss 目标";
      }

      function getBossHudLabelText() {
        if (isEndlessMode()) return "无尽";
        if (isFriendDemoBossTrialLevel()) return "试炼";
        if (isFriendDemoFinalBossLevel()) return "终局";
        if (isAscensionMode() && getActiveBossGoals(model.levelIndex).length > 0) return "高阶";
        return "Boss";
      }

      function getBossReviewPayload(result, reason = "") {
        const deck = getBossTrialDeck(model.levelIndex);
        const goals = getActiveBossGoals(model.levelIndex);
        if (goals.length === 0) return null;
        const phase = deck.phases[0] ?? BOSS_TRIAL_PHASES[0];
        const missing = goals.filter((goal) => !isBossGoalItemComplete(goal)).map(formatBossGoalProgress);
        const build = isAscensionMode()
          ? `${model.ascensionName || "高阶周目"} · ${getAscensionPerkSummaryText()}`
          : deck.label;
        return {
          result,
          bossVariant: deck.variant.id,
          bossTitle: deck.title,
          phase: phase.label,
          phaseTarget: phase.target,
          rewardQuality: deck.rewardQuality,
          keyGoal: goals.length > 0 ? formatBossGoalProgress(goals[0]) : "",
          keyMiss: missing.length > 0 ? missing.join("，") : "",
          build,
          summary: result === "completed"
            ? `${deck.title} 已击破，${deck.rewardQuality} 奖励已记下。`
            : `${deck.title} 未击破，当前卡在 ${missing.join("，") || reason || "目标未完成"}。`,
          detail: phase.advice,
          nextAdvice: result === "completed"
            ? `下一轮继续围绕 ${deck.focus} 追构筑。`
            : `下一轮先补 ${missing.join("，") || "Boss 目标"}，再接 ${deck.focus}。`,
          mismatch: isAscensionMode() ? "高阶 Boss 变体" : "",
        };
      }

      function getEffectiveMountainTuningForLevel(level, levelIndex = model.levelIndex) {
        const profile = getDailyDifficultyProfile()
          ?? getEndlessDifficultyProfile()
          ?? getAscensionDifficultyProfile(levelIndex)
          ?? getFriendDemoDifficultyProfile(levelIndex);
        if (!profile) return model.mountainTuning;
        const activeModifier = model.state?.activeLevelModifier ?? model.loadingLevelModifier;
        const highPressureBonus = activeModifier?.type === "highPressure" ? 24 : 0;
        return {
          ...model.mountainTuning,
          tileCount: Math.min(MOUNTAIN_TILE_COUNT_RANGE.max, profile.tileCount + highPressureBonus),
          stackDepth: Math.min(6, profile.stackDepth + (highPressureBonus ? 1 : 0)),
          huPacks: profile.huPacks,
          gangPacks: profile.gangPacks,
          numberSuits: profile.numberSuits,
          honorRanks: profile.honorRanks,
          honorWeight: profile.honorWeight,
        };
      }

      function getFriendDemoTutorialRequiredCombo(levelIndex = model.levelIndex) {
        return isFriendDemoTutorialLevel(levelIndex)
          ? FRIEND_DEMO_TUTORIAL_COMBOS[levelIndex] ?? null
          : null;
      }

      function hasCompletedFriendDemoTutorialCombo(levelIndex = model.levelIndex) {
        const requiredCombo = getFriendDemoTutorialRequiredCombo(levelIndex);
        if (!requiredCombo) return true;
        return (model.state?.comboCounts?.[requiredCombo] ?? 0) > 0;
      }

      function getFriendDemoFeaturedCombos(levelIndex) {
        if (isEndlessMode()) {
          const layer = getEndlessLayerOrder();
          if (layer % 6 === 0) return ["hu"];
          if (layer % 4 === 0) return ["gang"];
        }
        if (isDailyMode()) {
          const dayNumber = hashText(model.run.dailySeed || "daily") % 6;
          if (dayNumber === 0) return ["hu"];
          if (dayNumber <= 2) return ["gang"];
          if (dayNumber <= 4) return ["peng"];
          return ["chi"];
        }
        if (isAscensionMode()) {
          const buildFocus = getAscensionBuildFocus();
          if (buildFocus?.featuredCombos?.length) return buildFocus.featuredCombos;
        }
        const tutorialCombo = !isAscensionMode() ? FRIEND_DEMO_TUTORIAL_COMBOS[levelIndex] : null;
        if (tutorialCombo) return [tutorialCombo];
        return model.levelsConfig.levels[levelIndex]?.featuredCombos ?? [];
      }

      function getFriendDemoRewardPool(levelIndex) {
        if (isEndlessMode()) {
          return FRIEND_DEMO_ROUTE_REWARD_POOLS[levelIndex]
            ?? FRIEND_DEMO_ROUTE_REWARD_POOLS[18]
            ?? (model.levelsConfig.levels[levelIndex]?.rewardPool ?? []);
        }
        if (isDailyMode()) {
          return FRIEND_DEMO_ROUTE_REWARD_POOLS[levelIndex]
            ?? FRIEND_DEMO_ROUTE_REWARD_POOLS[(hashText(model.run.dailySeed || "daily") + levelIndex) % FRIEND_DEMO_ROUTE_REWARD_POOLS.length]
            ?? (model.levelsConfig.levels[levelIndex]?.rewardPool ?? []);
        }
        if (!isAscensionMode() && levelIndex === 2) return [FRIEND_DEMO_FIRST_REWARD_ID];
        if (FRIEND_DEMO_ROUTE_REWARD_POOLS[levelIndex]) return FRIEND_DEMO_ROUTE_REWARD_POOLS[levelIndex];
        const rewardPool = model.levelsConfig.levels[levelIndex]?.rewardPool ?? [];
        const normalized = rewardPool.map((rewardId) => rewardId === "vision_plus_1" ? FRIEND_DEMO_DISCARD_REWARD_ID : rewardId);
        return isAscensionMode() ? [...normalized, ...getAscensionRewardPool()] : normalized;
      }

      function createFriendDemoFixedReward() {
        return {
          id: FRIEND_DEMO_FIRST_REWARD_ID,
          name: "卡槽 +2",
          category: "slot",
          description: "主卡槽从 6 格扩到 8 格，后续关卡进入完整容量。",
          effects: [{ type: "slot_limit_delta", value: 2 }],
        };
      }

      function createFriendDemoDiscardReward() {
        return {
          id: FRIEND_DEMO_DISCARD_REWARD_ID,
          name: "丢弃 +1",
          category: "tool",
          description: "获得 1 次丢弃卡槽末尾牌的机会。",
          effects: [{ type: "tool_delta", tool: "discard", value: 1 }],
        };
      }

      function createAscensionReward(rewardId) {

          ascension_undo_plus_1: {

      function createFriendDemoTutorialTiles(level) {
        const layouts = {
          peng: [
            { suit: "tong", rank: 6, x: 176, y: 130 },
            { suit: "tong", rank: 6, x: 232, y: 130 },
            { suit: "tong", rank: 6, x: 288, y: 130 },
          ],
          chi: [
            { suit: "tiao", rank: 2, x: 176, y: 130 },
            { suit: "tiao", rank: 3, x: 232, y: 130 },
            { suit: "tiao", rank: 4, x: 288, y: 130 },
          ],
          gang: [
            { suit: "tong", rank: 9, x: 150, y: 124 },
            { suit: "tong", rank: 9, x: 206, y: 124 },
            { suit: "tong", rank: 9, x: 262, y: 124 },
            { suit: "tong", rank: 9, x: 318, y: 124 },
          ],
          hu: [
            { suit: "wan", rank: 1, x: 132, y: 130 },
            { suit: "wan", rank: 2, x: 188, y: 130 },
            { suit: "wan", rank: 3, x: 244, y: 130 },
            { suit: "tong", rank: 5, x: 300, y: 130 },
            { suit: "tong", rank: 5, x: 356, y: 130 },
            { suit: "tong", rank: 5, x: 412, y: 130 },
            { suit: "honor", rank: 6, x: 216, y: 270 },
            { suit: "honor", rank: 6, x: 272, y: 270 },
          ],
        };
        const combo = FRIEND_DEMO_TUTORIAL_COMBOS[(level?.order ?? 1) - 1] ?? "peng";
        return layouts[combo].map((tile, index) => ({
          id: `friend-demo-${combo}-${index + 1}`,
          suit: tile.suit,
          rank: tile.rank,
          x: tile.x,
          y: tile.y,
          layer: 0,
          stackOrder: index,
          blockedBy: [],
          location: "board",
          sourcePackage: `friend-demo-${combo}`,
          solutionGroup: `friend-demo-${combo}`,
          solutionStep: Math.floor(index / 3) + 1,
        }));
      }

      function getPlayableTilesForLevel(level, index) {
        if (isFriendDemoTutorialLevel(index)) {
          return createFriendDemoTutorialTiles(level);
        }

        return model.mode === "mountain" ? generateMountainTiles(level) : level.tiles;
      }

      function getInitialSlotOrderForLevel(level, index) {
        if (isFriendDemoTutorialLevel(index)) return [];
        return model.mode === "mountain" ? [] : level.initialSlotOrder;
      }

      function getInitialReserveOrderForLevel(level, index) {
        if (isFriendDemoTutorialLevel(index)) return [];
        return model.mode === "mountain" ? [] : level.initialReserveOrder;
      }

      function getToolsForLevel(defaults) {
        const baseTools = isFriendDemoMode() ? FRIEND_DEMO_DEFAULT_TOOLS : defaults.tools;
        const ascension = getAscensionConfig();
        const startToolPenalty = isAscensionMode() ? (ascension?.startToolPenalty ?? 0) : 0;
        const ascensionPerkTools = getAscensionPerkPool().reduce(
          (acc, perk) => {
            if (perk.effect.type === "tool_delta") acc[perk.effect.tool] = (acc[perk.effect.tool] ?? 0) + perk.effect.value;
            return acc;
          },
          { shuffle: 0, undo: 0, discard: 0, vision: 0 },
        );
        return {
          shuffle: Math.max(0, (baseTools.shuffle ?? 0) + (model.run.tools.shuffle ?? 0) + model.shellBonuses.tool + (ascensionPerkTools.shuffle ?? 0) - startToolPenalty),
          undo: Math.max(0, (baseTools.undo ?? 0) + (model.run.tools.undo ?? 0) + model.shellBonuses.tool + (ascensionPerkTools.undo ?? 0) - startToolPenalty),
          discard: Math.max(0, (baseTools.discard ?? 0) + (model.run.tools.discard ?? 0) + model.shellBonuses.tool + (ascensionPerkTools.discard ?? 0) - startToolPenalty),
          vision: (baseTools.vision ?? 0) + (model.run.tools.vision ?? 0),
        };
      }

      function loadLevel(index, options = {}) {
        const targetIndex = isEndlessMode()
          ? getEndlessLevelIndex()
          : isDailyMode()
            ? getDailyLevelIndex(index)
          : Math.min(index, getPlayableLevelCount() - 1);
        resetMountainTemplateForLevelTransition(targetIndex, options);
        model.levelIndex = targetIndex;
        if (!isEndlessMode() && maybeShowSpecialEventBeforeLevel(model.levelIndex)) return;
        refreshAutoMountainTemplateSeedForLoad(options);
        const level = currentLevel();
        const defaults = model.levelsConfig.defaults;
        const activeLevelModifier = applyPendingLevelModifier() ?? getAscensionLevelModifier(targetIndex);
        if (model.state) model.state.activeLevelModifier = activeLevelModifier;
        model.loadingLevelModifier = activeLevelModifier;
        const playableTiles = getPlayableTilesForLevel(level, model.levelIndex);
        model.loadingLevelModifier = null;
        const initialSlotOrder = getInitialSlotOrderForLevel(level, model.levelIndex);
        const initialReserveOrder = getInitialReserveOrderForLevel(level, model.levelIndex);
        model.state = {
          tiles: playableTiles.map((tile) => ({ ...tile, blockedBy: [...tile.blockedBy] })),
          slot: [...initialSlotOrder],
          reserve: [...initialReserveOrder],
          river: [],
          riverLimit:
            DEFAULT_RIVER_LIMIT
            + (model.run.riverDelta ?? 0)
            + getAscensionPerkPool().reduce((sum, perk) => sum + (perk.effect.type === "river_limit_delta" ? perk.effect.value : 0), 0),
          discardSelecting: false,
          endgameSettlement: null,
          endgamePrimerSelecting: false,
          activeLevelModifier,
          specialEventMessage: model.run.lastSpecialEventMessage ?? "",
          modifierRewardClaimed: false,
          bossTrialRewardClaimed: false,
          openMelds: [],
          slotLimit: isFriendDemoMode()
            ? (isAscensionMode() ? FRIEND_DEMO_FULL_SLOT_LIMIT : getFriendDemoSlotLimit(model.levelIndex))
            : clampSlotLimit(
              defaults.slotLimit
              + model.run.slotDelta
              + getAscensionPerkPool().reduce((sum, perk) => sum + (perk.effect.type === "slot_limit_delta" ? perk.effect.value : 0), 0),
            ),
          reserveLimit:
            (isFriendDemoMode() ? 0 : defaults.reserveLimit + model.run.reserveDelta)
            + model.shellBonuses.reserve
            + getAscensionPerkPool().reduce((sum, perk) => sum + (perk.effect.type === "reserve_limit_delta" ? perk.effect.value : 0), 0),
          shields:
            defaults.shields
            + model.run.shieldsDelta
            + model.shellBonuses.shield
            + getAscensionPerkPool().reduce((sum, perk) => sum + (perk.effect.type === "shield_delta" ? perk.effect.value : 0), 0),
          firstProtect: defaults.firstProtect,
          score: 0,
          coins: model.run.coins,
          comboCounts: { chi: 0, peng: 0, gang: 0, hu: 0, bugang: 0 },
          suitComboCounts: createEmptySuitTotals(),
          bossGoals: getActiveBossGoals(model.levelIndex),
          tools: getToolsForLevel(defaults),
          bonuses: {
            ...model.run.bonuses,
            hu: (model.run.bonuses.hu ?? 0)
              + getAscensionPerkPool().reduce((sum, perk) => sum + (perk.effect.type === "combo_score_bonus" && perk.effect.combo === "hu" ? perk.effect.value : 0), 0),
          },
          history: [],
          looseMountainDropIndex: 0,
          visionActive: false,
          recentBossProgress: [],
          phase: "playing",
        };
        model.loadingLevelModifier = null;
        applyPendingGuideTileToLevel();
        syncTileLocations();
        const guideText = model.state.guideTileApplied ? ` · 牌引 ${model.state.guideTileApplied.label}` : "";
        const modifierText = getActiveLevelModifierText();
        const modifierMessage = modifierText ? ` · 事件 ${modifierText}` : "";
        const eventMessage = model.run.lastSpecialEventMessage ? ` · ${model.run.lastSpecialEventMessage}` : "";
        const specialEventSummary = model.run.lastSpecialEventMessage ? ` · 特殊事件 ${model.run.lastSpecialEventMessage}` : "";
        renderAll(`${getCurrentRunLabel()}${guideText}${modifierMessage}${eventMessage}`);
        if (specialEventSummary) emitShellEvent("hulebu:run-progress", { summary: `${getCurrentRunLabel()}${guideText}${modifierMessage}${specialEventSummary}` });
        model.run.lastSpecialEventMessage = "";
      }

      function getCurrentRunLabel() {
        if (isEndlessMode()) return `无尽第 ${getEndlessLayerOrder()} 层`;
        if (isDailyMode()) return `每日第 ${currentLevel().order} 关`;
        if (isAscensionMode()) return `${model.ascensionName || "高阶周目"} 第 ${currentLevel().order} 关`;
        return `第 ${currentLevel().order} 关`;

      function renderBossGoalPanel(container, goals) {

      function renderBoard() {
        const coordinateSystem = getActiveCoordinateSystem();
        view.board.innerHTML = "";
        view.board.dataset.mode = model.mode;
        view.board.classList.toggle("vision-on", Boolean(model.state.visionActive));
        view.board.classList.toggle("boss", getActiveBossGoals(model.levelIndex).length > 0);

        for (const tile of model.state.tiles) {
          if (tile.location !== "board") continue;
          if (tile.stackColumn && !isVisibleStackDisplayTile(tile)) continue;

          const button = document.createElement("button");
          const blocked = isTileBlocked(tile.id);
          const stackPreviewDepth = getStackPreviewDepth(tile);
          const hiddenStackDepth = getHiddenStackDepth(tile);
          const hasHiddenStack = hiddenStackDepth > 0;
          const isPreviewTile = tile.stackColumn && stackPreviewDepth > 0;
          const isBridgeTile = Boolean(tile.stackBridge);
          const isLooseTile = Boolean(tile.looseMountainTile);
          const bridgeUnlockCount = getBridgeUnlockCount(tile);
          button.className = `tile ${blocked ? "blocked" : "available"}${hasHiddenStack ? " stack-top" : ""}${isPreviewTile ? " stack-preview" : ""}${isBridgeTile ? " stack-bridge" : ""}${isLooseTile ? " loose-mountain" : ""}`;
          button.type = "button";
          const visual = getVisualPosition(tile, coordinateSystem, model.state.tiles);
          button.style.left = `${visual.left}%`;
          button.style.top = `${visual.top}%`;
          button.style.zIndex = String(TILE_Z_INDEX_BASE + visual.order);
          button.style.setProperty("--lift-x", `${visual.liftX}%`);
          button.style.setProperty("--lift-y", `${visual.liftY}%`);
          button.disabled = blocked || model.state.phase !== "playing";
          button.dataset.tileId = tile.id;
          if (tile.sourcePackage) button.dataset.sourcePackage = tile.sourcePackage;
          if (tile.solutionGroup) button.dataset.solutionGroup = tile.solutionGroup;
          if (tile.solutionStep) button.dataset.solutionStep = String(tile.solutionStep);
          if (tile.mixedWindowRole) button.dataset.mixedWindowRole = tile.mixedWindowRole;
          if (hasHiddenStack) button.dataset.stackDepth = String(hiddenStackDepth);
          if (tile.stackColumn) button.dataset.stackPreviewDepth = String(stackPreviewDepth);
          if (tile.stackCoverMode) button.dataset.stackCoverMode = tile.stackCoverMode;
          if (tile.stackOverlapRatio) button.dataset.stackOverlapRatio = tile.stackOverlapRatio.toFixed(2);
          if (isBridgeTile) button.dataset.bridgeUnlocks = String(bridgeUnlockCount);
          if (isLooseTile) button.dataset.looseMountainTile = "true";
          const stackHint = hasHiddenStack
            ? `，下方 ${hiddenStackDepth} 张`
            : (isPreviewTile ? `，上方 ${stackPreviewDepth} 张` : (isBridgeTile ? `，压住 ${bridgeUnlockCount} 个入口` : ""));
          button.setAttribute("aria-label", `${tileLabel(tile)} ${blocked ? "被压住" : "可点击"}${stackHint}`);
          button.innerHTML = getTileFaceHtml(tile);
          button.addEventListener("click", () => moveTileToSlot(tile.id));
          view.board.append(button);
        }
      }

      function getVisualPosition(tile, coordinateSystem, tiles = model.state.tiles) {
        const left = (tile.x / coordinateSystem.baseWidth) * 100;
        const top = (tile.y / coordinateSystem.baseHeight) * 100;
        const tileIndex = tiles.findIndex((item) => item.id === tile.id);
        const layerLiftX = tile.stackBridge ? 0 : tile.layer * (model.mode === "mountain" ? -0.58 : -0.85);
        const layerLiftY = tile.stackBridge ? 0 : tile.layer * (model.mode === "mountain" ? -1.28 : -1.85);
        const stackPreviewOffset = getStackPreviewVisualOffset(tile, tiles);
        const weaveX = tile.stackBridge ? 0 : tile.stackColumn ? stackPreviewOffset.x : ((tileIndex % 3) - 1) * (model.mode === "mountain" ? 0.24 : 0.42);
        const weaveY = tile.stackBridge ? 0 : tile.stackColumn ? stackPreviewOffset.y : ((tileIndex % 4) - 1.5) * (model.mode === "mountain" ? 0.18 : 0.28);

        return {
          left: left + layerLiftX + weaveX,
          top: top + layerLiftY + weaveY,
          liftX: layerLiftX + weaveX,
          liftY: layerLiftY + weaveY,
          order: getTileStackOrder(tile, tileIndex),
        };
      }

      function getStackPreviewVisualOffset(tile, tiles = model.state.tiles) {
        const previewDepth = Math.min(getStackPreviewDepthForTiles(tile, tiles), getStackVisiblePreviewDepth(tile));
        if (!tile.stackColumn || previewDepth <= 0) return { x: 0, y: 0 };

        const direction = getStackColumnVisualDirection(tile);
        const lane = previewDepth % 2 === 0 ? -direction : direction;
        const order = getTileStackOrder(tile);
        const overlapRatio = clampNumber(tile.stackOverlapRatio ?? 0.5, MOUNTAIN_STACK_OVERLAP_RANGE.min, MOUNTAIN_STACK_OVERLAP_RANGE.max);
        const spread = tile.stackPreviewSpread ?? 1;
        const revealScale = 1.18 - overlapRatio;
        return {
          x: lane * (0.16 + previewDepth * 0.42 * revealScale * spread) + Math.sin(order * 0.017) * 0.28,
          y: previewDepth * (0.22 + 1.3 * revealScale * spread) + Math.cos(order * 0.019) * 0.16,
        };
      }

      function getStackColumnVisualDirection(tile) {
        const source = String(tile.stackColumnId ?? tile.id);
        let hash = 0;
        for (let index = 0; index < source.length; index += 1) {
          hash = (hash * 31 + source.charCodeAt(index)) >>> 0;
        }
        return hash % 2 === 0 ? 1 : -1;
      }

      function getMountainVisualTileRect(tile, tiles) {
        const coordinateSystem = getActiveCoordinateSystem();
        const visual = getVisualPosition(tile, coordinateSystem, tiles);
        const { width, height } = getMountainRuleTileSize();
        return {
          x: (visual.left / 100) * coordinateSystem.baseWidth,
          y: (visual.top / 100) * coordinateSystem.baseHeight,
          width,
          height,
        };
      }

      function getMountainVisualIntersectionRect(tile, other, tiles) {
        const rect = getMountainVisualTileRect(tile, tiles);
        const otherRect = getMountainVisualTileRect(other, tiles);
        const left = Math.max(rect.x, otherRect.x);
        const top = Math.max(rect.y, otherRect.y);
        const right = Math.min(rect.x + rect.width, otherRect.x + otherRect.width);
        const bottom = Math.min(rect.y + rect.height, otherRect.y + otherRect.height);
        if (right <= left || bottom <= top) return null;
        return { left, top, right, bottom };
      }

      function getMountainVisualOverlapRatio(tile, other, tiles) {
        const rect = getMountainVisualIntersectionRect(tile, other, tiles);
        const { width, height } = getMountainRuleTileSize();
        return rect ? getUnionArea([rect]) / (width * height) : 0;
      }

      function getActiveCoordinateSystem() {
        return model.mode === "mountain" ? MOUNTAIN_COORDINATE_SYSTEM : model.levelsConfig.coordinateSystem;
      }

      function generateMountainTiles(level) {
        const tuning = getEffectiveMountainTuningForLevel(level, model.levelIndex);
        const seedTexts = getMountainGenerationSeedAttempts(level, tuning);
        const templateCandidates = getMountainTemplateGenerationCandidates(level, tuning);
        let lastError = null;

        for (const seedText of seedTexts) {
          for (const mountainTemplate of templateCandidates) {
            const random = createSeededRandom(hashText(`${seedText}:${mountainTemplate.id}`));
            try {
              const generatedTiles = generateMountainTilesForTemplate(level, tuning, mountainTemplate, random);
              if (shouldRetryAutoMountainTemplate(level, tuning, generatedTiles)) {
                lastError = new Error(`密集牌山生成重试：${mountainTemplate.label} 起手开放过多。`);
                continue;
              }
              model.activeMountainTemplate = mountainTemplate;
              return generatedTiles;
            } catch (error) {
              lastError = error;
            }
          }
        }

        throw lastError ?? new Error("密集牌山生成失败：没有可用模板。");
      }

      function getMountainGenerationSeedAttempts(level, tuning) {
        const seedText = getMountainGenerationSeedText(level, tuning);
        if (
          tuning.seed
          || model.prototypeView !== "play"
          || normalizeMountainTemplateId(tuning.templateId) !== "auto"
        ) {
          return [seedText];
        }

        return Array.from({ length: MOUNTAIN_PLAY_AUTO_SEED_RETRY_COUNT }, (_, index) => (
          index === 0 ? seedText : `${seedText}:retry-${index}`
        ));
      }

      function generateMountainTilesForTemplate(level, tuning, mountainTemplate, random) {
        const targetTileCount = tuning.tileCount ?? getDefaultMountainTileCount(level);
        const positions = createMountainPositions(random, targetTileCount, tuning, mountainTemplate);
        const selectedPositions = positions.slice(0, targetTileCount).map((position, index) => ({
          ...position,
          id: `m-${level.order}-${String(index + 1).padStart(2, "0")}`,
        }));
        const bossGoals = getActiveBossGoals(model.levelIndex);
        const tileSpecByPositionId = buildSolvableTileSpecs(level, selectedPositions, random, bossGoals, tuning);

        const tiles = selectedPositions.map((position) => {
          const spec = tileSpecByPositionId.get(position.id);
          return {
            id: position.id,
            suit: spec.suit,
            rank: spec.rank,
            x: position.x,
            y: position.y,
            layer: position.layer,
            stackOrder: position.stackOrder,
            stackColumn: position.stackColumn,
            stackColumnId: position.stackColumnId,
            stackCoverMode: position.stackCoverMode,
            stackOverlapRatio: position.stackOverlapRatio,
            stackPreviewLimit: position.stackPreviewLimit,
            stackPreviewSpread: position.stackPreviewSpread,
            stackBridge: position.stackBridge,
            stackBridgeId: position.stackBridgeId,
            stackBridgeColumnIds: position.stackBridgeColumnIds,
            blockedBy: [],
            location: "board",
            templateRegion: position.templateRegion,
            sourcePackage: spec.sourcePackage,
            solutionStep: spec.solutionStep,
            solutionGroup: spec.solutionGroup,
            mixedWindowRole: spec.mixedWindowRole,
          };
        });
