<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>胡了卜配置试玩</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f1e5;
        --ink: #221912;
        --muted: #755f4d;
        --panel: #fffaf0;
        --line: #d8b98b;
        --jade: #1f8a70;
        --jade-dark: #12624f;
        --vermilion: #c83d2f;
        --gold: #d59a2f;
        --tile: #fff8e7;
        --tile-edge: #b88245;
        --slot: #4a2d1f;
        --shadow: 0 18px 42px rgba(87, 55, 29, 0.18);
        --tile-w: 12.5806451613%;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background:
          radial-gradient(circle at 20% 0%, rgba(31, 138, 112, 0.16), transparent 28rem),
          linear-gradient(135deg, #f7f1e5 0%, #f0ddbf 54%, #ebc887 100%);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      select,
      input {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 18px;
        padding: 18px;
      }

      .play {
        display: grid;
        grid-template-rows: auto minmax(260px, 1fr) auto;
        gap: 14px;
        min-width: 0;
      }

      .topbar,
      .side,
      .board-wrap,
      .slot-area {
        border: 1px solid rgba(90, 54, 22, 0.2);
        background: rgba(255, 250, 240, 0.9);
        box-shadow: var(--shadow);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 16px;
      }

      .brand {
        display: grid;
        gap: 2px;
      }

      .brand strong {
        font-size: clamp(22px, 3vw, 34px);
        line-height: 1;
        letter-spacing: 0;
      }

      .brand span {
        color: var(--muted);
        font-size: 13px;
      }

      .top-controls {
        min-width: 0;
        width: min(680px, 62vw);
        display: grid;
        gap: 8px;
      }

      .mode-switch {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
        padding: 4px;
        border: 1px solid rgba(90, 54, 22, 0.2);
        background: #f7e2b8;
      }

      .mode-button {
        min-height: 34px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
      }

      .mode-button.active {
        background: var(--jade-dark);
        color: white;
      }

      .level-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 0;
        scrollbar-width: thin;
      }

      .level-tab {
        width: 46px;
        height: 38px;
        flex: 0 0 auto;
        border: 1px solid rgba(90, 54, 22, 0.2);
        background: #f7e2b8;
        color: var(--ink);
        font-weight: 800;
      }

      .level-tab.active {
        background: var(--jade);
        color: white;
      }

      .board-wrap {
        min-height: 0;
        padding: 14px;
      }

      .board {
        position: relative;
        width: 100%;
        max-width: 980px;
        margin: 0 auto;
        aspect-ratio: 620 / 360;
        overflow: hidden;
        border: 1px solid rgba(67, 42, 23, 0.25);
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px),
          linear-gradient(0deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px),
          linear-gradient(145deg, #2f6f5c, #163d35 62%, #402818);
        background-size: 31px 31px, 31px 31px, auto;
      }

      .board::before {
        content: "";
        position: absolute;
        inset: 7% 9% 12%;
        border: 2px solid rgba(255, 255, 255, 0.15);
        background: rgba(0, 0, 0, 0.08);
        transform: skewX(-8deg);
        pointer-events: none;
      }

      .board[data-mode="mountain"] {
        background-size: 24px 24px, 24px 24px, auto;
      }

      .board.boss {
        border-color: rgba(200, 61, 47, 0.72);
        box-shadow:
          inset 0 0 0 3px rgba(200, 61, 47, 0.28),
          0 0 28px rgba(200, 61, 47, 0.28);
      }

      .board[data-mode="mountain"] .tile {
        width: 11.6%;
        font-size: clamp(13px, 2.35vw, 24px);
      }

      .tile {
        position: absolute;
        width: var(--tile-w);
        aspect-ratio: 64 / 86;
        display: grid;
        place-items: center;
        border: 2px solid var(--tile-edge);
        border-bottom-width: 6px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(255, 248, 231, 0.88)),
          var(--tile);
        color: var(--ink);
        font-weight: 900;
        font-size: clamp(14px, 2.7vw, 28px);
        line-height: 1;
        text-shadow: 0 1px 0 white;
        box-shadow:
          0 12px 0 rgba(107, 72, 38, 0.38),
          0 18px 20px rgba(23, 15, 9, 0.3);
        transition: transform 150ms ease, opacity 150ms ease, filter 150ms ease;
      }

      .tile::before {
        content: "";
        position: absolute;
        inset: 7px;
        border: 1px solid rgba(184, 130, 69, 0.45);
        pointer-events: none;
      }

      .tile.stack-top::after {
        content: "";
        position: absolute;
        top: -8px;
        left: 10%;
        right: 10%;
        height: 5px;
        border: 1px solid rgba(67, 42, 23, 0.42);
        border-bottom: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(64, 42, 24, 0.34) 0 1px,
          rgba(255, 248, 231, 0.96) 1px 2px
        );
        box-shadow: 0 2px 0 rgba(107, 72, 38, 0.2);
        pointer-events: none;
      }

      .tile.available:hover {
        transform: translate(var(--lift-x), calc(var(--lift-y) - 5px));
        filter: brightness(1.08);
      }

      .tile.blocked {
        opacity: 0.44;
        filter: grayscale(0.55);
      }

      .board.vision-on .tile.blocked {
        opacity: 0.72;
        filter: none;
        outline: 2px solid rgba(255, 212, 108, 0.8);
        outline-offset: 2px;
      }

      .tile.removed {
        display: none;
      }

      .tile .suit {
        position: absolute;
        right: 8px;
        bottom: 7px;
        font-size: 0.56em;
        color: var(--vermilion);
      }

      .slot-area {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      .slot-line {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: end;
      }

      .slot-grid {
        display: grid;
        grid-template-columns: repeat(var(--slot-count), minmax(38px, 1fr));
        gap: 8px;
        min-width: 0;
      }

      .slot-cell {
        min-height: 72px;
        display: grid;
        place-items: center;
        border: 1px dashed rgba(255, 250, 240, 0.5);
        background: linear-gradient(180deg, #68412c, var(--slot));
        color: #fff7e4;
      }

      .slot-cell.filled {
        border-style: solid;
        background: #fff8e7;
        color: var(--ink);
        border-color: var(--tile-edge);
        font-weight: 900;
      }

      .combo-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      .combo-button,
      .candidate,
      .primary-button,
      .ghost-button,
      .tool-button,
      .reward-button {
        min-height: 40px;
        border: 1px solid rgba(90, 54, 22, 0.24);
        padding: 0 14px;
        background: #efe0c5;
        color: var(--muted);
        font-weight: 800;
      }

      .combo-button.active {
        background: linear-gradient(180deg, #ffd46c, #d86e2f);
        color: #2a1409;
        box-shadow: 0 8px 18px rgba(200, 61, 47, 0.3);
      }

      .candidates {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .candidate {
        background: white;
        color: var(--ink);
      }

      .candidate[data-type="gang"] {
        border-color: var(--vermilion);
      }

      .candidate[data-type="peng"] {
        border-color: var(--gold);
      }

      .candidate[data-type="chi"] {
        border-color: var(--jade);
      }

      .candidate[data-type="hu"] {
        border-color: rgba(213, 154, 47, 0.78);
        background: #f7e2b8;
        color: var(--ink);
      }

      .side {
        min-width: 0;
        display: grid;
        align-content: start;
        gap: 14px;
        padding: 16px;
        overflow: auto;
      }

      .level-title {
        display: grid;
        gap: 4px;
      }

      .level-title h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.12;
        letter-spacing: 0;
      }

      .level-title span {
        color: var(--muted);
        font-size: 14px;
      }

      .boss-goal {
        display: none;
        border: 1px solid rgba(200, 61, 47, 0.35);
        background: #fff1df;
        color: #7c241b;
        padding: 10px;
        font-weight: 900;
      }

      .boss-goal.show {
        display: block;
      }

      .boss-goal-title {
        display: block;
        margin-bottom: 8px;
      }

      .boss-goal-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .boss-goal-chip {
        min-height: 30px;
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(124, 36, 27, 0.28);
        background: rgba(255, 250, 240, 0.78);
        padding: 4px 8px;
        color: #7c241b;
        font-size: 12px;
        line-height: 1.25;
      }

      .boss-goal-chip.done {
        border-color: rgba(31, 138, 112, 0.42);
        background: #e3f4de;
        color: #12624f;
      }

      .boss-goal-chip.pulse {
        border-color: rgba(213, 154, 47, 0.7);
        background: #ffe1a8;
        box-shadow: 0 0 0 3px rgba(213, 154, 47, 0.18);
      }

      .featured-combos {
        display: none;
        border: 1px solid rgba(31, 143, 118, 0.3);
        background: #edf9f2;
        color: #125f50;
        padding: 10px;
        font-weight: 900;
      }

      .featured-combos.show {
        display: block;
      }

      .tuning-panel {
        border: 1px solid rgba(31, 138, 112, 0.24);
        background: rgba(237, 249, 242, 0.72);
        padding: 10px;
      }

      .tuning-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .tuning-field {
        display: grid;
        gap: 4px;
      }

      .tuning-field span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .tuning-field input {
        min-width: 0;
        height: 36px;
        border: 1px solid rgba(90, 54, 22, 0.22);
        background: #fffaf0;
        color: var(--ink);
        padding: 0 8px;
        font-weight: 800;
      }

      .tuning-action {
        width: 100%;
        margin-top: 8px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .metric {
        border: 1px solid rgba(90, 54, 22, 0.18);
        background: #fff5df;
        padding: 10px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .metric strong {
        display: block;
        margin-top: 3px;
        font-size: 20px;
      }

      .section {
        display: grid;
        gap: 8px;
      }

      .section h2 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0;
      }

      .counts {
        display: grid;
        gap: 8px;
      }

      .count-row {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
      }

      .rank-dots {
        display: grid;
        grid-template-columns: repeat(9, minmax(0, 1fr));
        gap: 3px;
      }

      .rank-dot {
        min-height: 26px;
        display: grid;
        place-items: center;
        background: #f3ddaf;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }

      .rank-dot.has {
        background: var(--jade);
        color: white;
      }

      .reward-list {
        display: grid;
        gap: 8px;
      }

      .reward-pill {
        border: 1px solid rgba(90, 54, 22, 0.18);
        background: white;
        padding: 9px 10px;
        font-size: 13px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tool-actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .tool-button {
        min-height: 48px;
        display: grid;
        gap: 2px;
        place-items: center;
        padding: 6px 8px;
        background: #fff5df;
        color: var(--ink);
      }

      .tool-button strong {
        font-size: 14px;
      }

      .tool-button span {
        color: var(--muted);
        font-size: 12px;
      }

      .primary-button {
        background: var(--jade);
        color: white;
      }

      .ghost-button {
        background: white;
        color: var(--ink);
      }

      .status {
        min-height: 24px;
        color: var(--muted);
        font-size: 14px;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: rgba(24, 16, 10, 0.58);
        z-index: 100;
      }

      .overlay.show {
        display: flex;
      }

      .reward-panel {
        width: min(920px, 100%);
        border: 1px solid rgba(255, 250, 240, 0.44);
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.26);
        padding: 18px;
      }

      .reward-panel h2 {
        margin: 0 0 12px;
        font-size: 22px;
      }

      .reward-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .reward-summary {
        display: none;
        gap: 12px;
        color: var(--muted);
        line-height: 1.5;
      }

      .reward-summary.show {
        display: grid;
      }

      .reward-card {
        display: grid;
        align-content: space-between;
        gap: 12px;
        min-height: 180px;
        border: 1px solid rgba(90, 54, 22, 0.22);
        background: linear-gradient(180deg, #fffaf0, #f4dfb5);
        padding: 14px;
      }

      .reward-card strong {
        font-size: 19px;
      }

      .reward-card p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .reward-button {
        background: var(--vermilion);
        color: white;
      }

      .reward-summary .reward-button {
        justify-self: start;
      }

      .error {
        max-width: 720px;
        margin: 16vh auto;
        padding: 20px;
        border: 1px solid rgba(200, 61, 47, 0.4);
        background: #fff5f1;
        color: #7c241b;
      }

      @media (max-width: 960px) {
        .app {
          grid-template-columns: 1fr;
        }

        .side {
          order: -1;
          max-height: none;
        }

        .metrics {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .app {
          padding: 10px;
          gap: 10px;
        }

        .topbar,
        .slot-line {
          grid-template-columns: 1fr;
          flex-direction: column;
          align-items: stretch;
        }

        .topbar {
          display: grid;
        }

        .top-controls {
          width: 100%;
        }

        .board-wrap,
        .slot-area,
        .side {
          padding: 10px;
        }

        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .slot-grid {
          gap: 5px;
        }

        .slot-cell {
          min-height: 52px;
          font-size: 13px;
        }

        .combo-actions {
          justify-content: stretch;
        }

        .combo-button {
          flex: 1 1 30%;
          padding: 0 8px;
        }

        .tuning-grid {
          grid-template-columns: 1fr;
        }

        .reward-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app" data-testid="app">
      <section class="play" aria-label="胡了卜牌局">
        <header class="topbar">
          <div class="brand">
            <strong>胡了卜</strong>
            <span id="levelMeta">加载中</span>
          </div>
          <div class="top-controls">
            <div class="mode-switch" id="modeSwitch" aria-label="牌山模式">
              <button class="mode-button active" type="button" data-mode="config">配置关卡</button>
              <button class="mode-button" type="button" data-mode="mountain">密集牌山</button>
            </div>
            <nav class="level-tabs" id="levelTabs" aria-label="关卡"></nav>
          </div>
        </header>

        <section class="board-wrap">
          <div class="board" id="board" data-testid="board"></div>
        </section>

        <section class="slot-area">
          <div class="slot-line">
            <div class="slot-grid" id="slotGrid" data-testid="slot"></div>
            <div class="combo-actions" id="comboActions" aria-label="组合按钮"></div>
          </div>
          <div class="candidates" id="candidateList" aria-label="候选组合"></div>
          <div class="status" id="status" data-testid="status"></div>
        </section>
      </section>

      <aside class="side">
        <div class="level-title">
          <h1 id="levelName">配置试玩</h1>
          <span id="levelSubtitle">读取 10 关配置</span>
        </div>
        <div class="featured-combos" id="featuredCombos"></div>
        <div class="boss-goal" id="bossGoal"></div>

        <section class="section tuning-panel" id="mountainTuningPanel" aria-label="密集牌山调参">
          <h2>牌山调参</h2>
          <div class="tuning-grid">
            <label class="tuning-field">
              <span>种子</span>
              <input id="mountainSeed" type="text" autocomplete="off" />
            </label>
            <label class="tuning-field">
              <span>牌量</span>
              <input id="mountainTileCount" type="number" min="36" max="72" step="1" placeholder="自动" />
            </label>
            <label class="tuning-field">
              <span>同列</span>
              <input id="mountainStackDepth" type="number" min="2" max="8" step="1" />
            </label>
            <label class="tuning-field">
              <span>胡包</span>
              <input id="mountainHuPacks" type="number" min="0" max="4" step="1" placeholder="自动" />
            </label>
            <label class="tuning-field">
              <span>字牌</span>
              <input id="mountainHonorWeight" type="number" min="0" max="100" step="5" />
            </label>
          </div>
          <button class="primary-button tuning-action" id="mountainRegenerateButton" type="button">重新生成牌山</button>
        </section>

        <div class="metrics" aria-label="牌局状态">
          <div class="metric">
            <span>局内积分</span>
            <strong id="score">0</strong>
          </div>
          <div class="metric">
            <span>铜钱</span>
            <strong id="coins">0</strong>
          </div>
          <div class="metric">
            <span>护符</span>
            <strong id="shields">0</strong>
          </div>
          <div class="metric">
            <span>备用槽</span>
            <strong id="reserve">0/0</strong>
          </div>
        </div>

        <section class="section">
          <h2>余牌</h2>
          <div class="counts" id="counts"></div>
        </section>

        <section class="section">
          <h2>已选奖励</h2>
          <div class="reward-list" id="pickedRewards"></div>
        </section>

        <section class="section">
          <h2>工具</h2>
          <div class="tool-actions" aria-label="工具">
            <button class="tool-button" id="shuffleButton" type="button">
              <strong>洗山</strong>
              <span id="shuffleCount">0</span>
            </button>
            <button class="tool-button" id="undoButton" type="button">
              <strong>回手</strong>
              <span id="undoCount">0</span>
            </button>
            <button class="tool-button" id="visionButton" type="button">
              <strong>看山</strong>
              <span id="visionCount">0</span>
            </button>
          </div>
          <div class="metrics">
            <div class="metric">
              <span>主槽</span>
              <strong id="slotLimit">0</strong>
            </div>
          </div>
        </section>

        <div class="controls">
          <button class="primary-button" id="restartButton" type="button">重开本关</button>
          <button class="ghost-button" id="nextButton" type="button">下一关</button>
        </div>
      </aside>
    </main>

    <div class="overlay" id="rewardOverlay" role="dialog" aria-modal="true" aria-labelledby="rewardTitle">
      <section class="reward-panel">
        <h2 id="rewardTitle">选择奖励</h2>
        <div class="reward-summary" id="runComplete"></div>
        <div class="reward-grid" id="rewardGrid"></div>
      </section>
    </div>

    <script>
      const SUIT_LABELS = {
        wan: "万",
        tiao: "条",
        tong: "筒",
        honor: "字",
      };
      const NUMBER_SUITS = ["wan", "tiao", "tong"];
      const ALL_SUITS = ["wan", "tiao", "tong", "honor"];
      const HONOR_LABELS = {
        1: "东",
        2: "南",
        3: "西",

      const DEFAULT_MOUNTAIN_TUNING = {

      const view = {

      const model = {
        levelsConfig: null,
        rewardsConfig: null,
        levelIndex: 0,
        mode: "config",
        mountainTuning: { ...DEFAULT_MOUNTAIN_TUNING },
        state: null,
        run: {
          slotDelta: 0,

          coins: 0,
          tools: { shuffle: 0, undo: 0, vision: 0 },
          bonuses: { chi: 0, peng: 0, gang: 0, hu: 0 },
