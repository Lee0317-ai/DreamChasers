<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>胡了卜 UI 草图 - 手游 HUD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f1513;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      color: #fff7df;
    }
    .phone {
      width: min(390px, 100vw);
      height: min(844px, 100vh);
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(24, 55, 44, .96), rgba(10, 18, 16, .98)),
        #101816;
      border: 1px solid rgba(255,255,255,.12);
    }
    .status {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      display: grid;
      grid-template-columns: 78px 1fr 78px;
      gap: 8px;
      z-index: 10;
    }
    .pill, .boss {
      min-height: 44px;
      border-radius: 8px;
      background: #1d2c28;
      border: 1px solid rgba(234, 200, 127, .42);
      box-shadow: 0 3px 0 #07100d;
      padding: 6px 8px;
    }
    .pill small, .boss small { display: block; font-size: 10px; color: #d5bf8b; line-height: 1.1; }
    .pill b { display: block; font-size: 17px; line-height: 1.15; }
    .boss {
      display: grid;
      gap: 4px;
      align-content: center;
    }
    .boss .bar {
      height: 8px;
      border-radius: 999px;
      background: #0a1411;
      overflow: hidden;
    }
    .boss .bar span { display: block; width: 66%; height: 100%; background: linear-gradient(90deg, #f7cf65, #f46b36); }
    .target-row {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 66px;
      height: 42px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      z-index: 10;
    }
    .target {
      border-radius: 8px;
      background: rgba(253, 232, 179, .1);
      border: 1px solid rgba(253, 232, 179, .28);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 13px;
    }
    .target.done { background: rgba(56, 164, 113, .24); color: #c9ffe1; }
    .playfield {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 118px;
      height: 458px;
      border-radius: 12px;
      background:
        radial-gradient(circle at 50% 42%, rgba(53, 167, 116, .38), transparent 50%),
        linear-gradient(180deg, #18372d, #0e211c);
      border: 1px solid rgba(242, 204, 136, .28);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 16px 42px rgba(0,0,0,.38);
    }
    .playfield-header {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      color: #d8c393;
      font-size: 12px;
      font-weight: 700;
    }
    .board {
      position: absolute;
      left: 50%;
      top: 53%;
      width: 310px;
      height: 350px;
      transform: translate(-50%, -50%);
    }
    .tile {
      position: absolute;
      width: 36px;
      height: 48px;
      border-radius: 6px;
      background: linear-gradient(180deg, #fff9ea 0 72%, #16835e 73%);
      border: 2px solid #a66d35;
      box-shadow: 0 5px 0 #0b4c38, 0 8px 14px rgba(0,0,0,.32);
      color: #241c13;
      display: grid;
      place-items: center;
      font: 900 15px/1 "PingFang SC", sans-serif;
    }
    .tile.dim { opacity: .45; filter: grayscale(.4); }
    .tile.choice { outline: 3px solid #ffcf57; box-shadow: 0 5px 0 #0b4c38, 0 0 22px rgba(255,207,87,.72); }
    .hint-card {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 10px;
      height: 48px;
      border-radius: 8px;
      background: rgba(6, 14, 12, .82);
      border: 1px solid rgba(243, 203, 124, .3);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      font-size: 12px;
      color: #f3dfb2;
    }
    .hint-card b { color: #ffcf57; }
    .actions {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 218px;
      height: 58px;
      display: grid;
      grid-template-columns: 1.12fr repeat(4, 1fr);
      gap: 7px;
      z-index: 20;
    }
    .action {
      border: 0;
      border-radius: 10px;
      color: #f1dec1;
      background: #26302d;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 5px 0 #080d0c;
      font-weight: 900;
      font-size: 15px;
    }
    .action.primary {
      background: linear-gradient(180deg, #ffca58, #d9572d);
      color: #311509;
      box-shadow: 0 0 18px rgba(255,111,48,.42), 0 5px 0 #6d2114;
    }
    .lower {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      height: 194px;
      display: grid;
      grid-template-rows: 54px 1fr;
      gap: 8px;
      z-index: 25;
    }
    .tool-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .tool {
      border-radius: 10px;
      background: #19241f;
      border: 1px solid rgba(242, 204, 136, .34);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 900;
      box-shadow: 0 4px 0 #07100d;
    }
    .tool span {
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      background: #d54429;
      display: grid;
      place-items: center;
      font-size: 11px;
    }
    .hand-panel {
      border-radius: 14px;
      background: linear-gradient(180deg, #493018, #21130c);
      border: 1px solid rgba(244, 200, 124, .5);
      padding: 12px 10px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      box-shadow: 0 -8px 34px rgba(0,0,0,.34);
    }
    .slot {
      border-radius: 8px;
      border: 1px solid rgba(252, 221, 153, .32);
      background: rgba(9, 8, 7, .45);
      display: grid;
      place-items: center;
    }
    .mini {
      width: 31px;
      height: 42px;
      border-radius: 6px;
      background: linear-gradient(180deg, #fff7e8 0 74%, #14785a 75%);
      border: 1px solid #9f6835;
      display: grid;
      place-items: center;
      color: #2a1e13;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <main class="phone">
    <section class="status">
      <div class="pill"><small>当前</small><b>第 08</b></div>
      <div class="boss"><small>南风挡墙 · Boss 压力</small><div class="bar"><span></span></div></div>
      <div class="pill"><small>余牌</small><b>126</b></div>
    </section>
    <section class="target-row"><div class="target done">碰 1/1</div><div class="target">杠 0/1</div><div class="target">胡 0/1</div></section>
    <section class="playfield">
      <div class="playfield-header"><span>牌山</span><span>首轮可点 6 张</span></div>
      <div class="board" id="board"></div>
      <div class="hint-card"><b>听口</b><span>槽内差一张八万成胡，牌山仍有 2 张。</span></div>
    </section>
    <section class="actions"><button class="action primary">胡</button><button class="action">杠</button><button class="action primary">碰</button><button class="action">吃</button><button class="action">补杠</button></section>
    <section class="lower">
      <div class="tool-row"><div class="tool">洗牌 <span>2</span></div><div class="tool">撤回 <span>1</span></div><div class="tool">打牌 <span>3</span></div></div>
      <div class="hand-panel">
        <div class="slot"><span class="mini">八</span></div><div class="slot"><span class="mini">八</span></div><div class="slot"><span class="mini">八</span></div><div class="slot"><span class="mini">中</span></div>
        <div class="slot"><span class="mini">二</span></div><div class="slot"><span class="mini">三</span></div><div class="slot"></div><div class="slot"></div>
      </div>
    </section>
  </main>
  <script>
    const board = document.querySelector('#board');
    const chars = ['一','二','三','四','五','六','七','八','九','东','南','中','发'];
    const pts = [[126,276,0],[166,272,0],[86,258,0],[206,250,0],[124,232,1],[164,226,1],[96,208,1],[194,200,1],[135,178,2],[170,170,2],[112,154,2],[150,128,3],[184,120,3],[124,95,4],[158,88,4],[70,182,0],[230,178,0],[78,118,1],[224,118,1],[102,72,2],[204,72,2]];
    pts.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'tile' + (p[2] < 2 ? ' dim' : '') + (i === 13 || i === 14 ? ' choice' : '');
      el.textContent = chars[i % chars.length];
      el.style.left = p[0] + 'px';
      el.style.top = p[1] + 'px';
      el.style.zIndex = p[2] + 1;
      board.appendChild(el);
    });
  </script>
</body>
</html>
